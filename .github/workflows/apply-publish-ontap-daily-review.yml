name: Apply and publish Ontap daily review

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type PUBLISH after review, or AUTOMATIC_FALLBACK for the unattended safety net
        required: true
        type: string
  schedule:
    - cron: "45 11 * * *"
      timezone: "Europe/London"

concurrency:
  group: ontap-review-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  apply-and-publish:
    name: Fan out reviewed decisions and run guarded source publishers
    runs-on: ubuntu-latest

    steps:
      - name: Check explicit approval
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVAL: ${{ inputs.approval }}
        run: |
          if [ "$APPROVAL" != "PUBLISH" ] && [ "$APPROVAL" != "AUTOMATIC_FALLBACK" ]; then
            echo "::error::Approval must be exactly PUBLISH or AUTOMATIC_FALLBACK."
            exit 1
          fi

      - name: Determine manual or automatic publication mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPROVAL: ${{ inputs.approval }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$APPROVAL" = "PUBLISH" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "unresolved_policy=quarantine" >> "$GITHUB_OUTPUT"
            echo "Manual PUBLISH mode selected."
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Authenticated automatic-fallback mode selected."
          fi

          runs_json="$(gh run list \
            --workflow apply-publish-ontap-daily-review.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 50 \
            --json databaseId,createdAt,status,conclusion,url)"
          successful_run="$(RUNS_JSON="$runs_json" python - <<'PY'
          import datetime as dt
          import json
          import os
          from zoneinfo import ZoneInfo

          london = ZoneInfo("Europe/London")
          today = dt.datetime.now(dt.timezone.utc).astimezone(london).date()
          matches = []
          for row in json.loads(os.environ["RUNS_JSON"]):
              created = dt.datetime.fromisoformat(
                  row["createdAt"].replace("Z", "+00:00")
              ).astimezone(london)
              if created.date() == today and row.get("conclusion") == "success":
                  matches.append((created, row))
          if matches:
              print(max(matches, key=lambda item: item[0])[1]["url"])
          PY
          )"

          echo "unresolved_policy=withhold" >> "$GITHUB_OUTPUT"
          if [ -n "$successful_run" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "manual_run_url=$successful_run" >> "$GITHUB_OUTPUT"
            echo "A successful publication dispatch already completed today: $successful_run"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No successful publication dispatch found today; starting the automatic safety-net publish."
          fi

      - name: Check out main
        if: steps.mode.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        if: steps.mode.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile master review with latest source state
        if: steps.mode.outputs.skip != 'true'
        working-directory: pipeline
        run: |
          python -m review_hub.master_review build

      - name: Commit reconciled master review
        if: steps.mode.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/reviews/daily/ontap-daily-review.md
          if git diff --cached --quiet; then
            echo "Master review already matches current source state"
            exit 0
          fi
          git commit -m "Reconcile Ontap daily review before publish"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Reconciled master review committed"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "::error::Could not safely push reconciled master review after 3 attempts."
          exit 1

      - name: Validate review with job-level isolation and fan out decisions
        if: steps.mode.outputs.skip != 'true'
        working-directory: pipeline
        run: |
          python -m review_hub.master_review apply \
            --require-complete \
            --write \
            --unresolved-policy "${{ steps.mode.outputs.unresolved_policy }}" \
            --plan "$RUNNER_TEMP/ontap-review-publish-plan.json"
          cat "$RUNNER_TEMP/ontap-review-publish-plan.json"
          python - "$RUNNER_TEMP/ontap-review-publish-plan.json" <<'PY'
          import json
          import os
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          quarantined = plan.get("quarantined_jobs", [])
          withheld = plan.get("withheld_jobs", [])
          isolated = plan.get("isolated_sources", [])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              if quarantined:
                  handle.write("\n### Job-level quarantine\n\n")
                  handle.write(
                      f"{len(quarantined)} unresolved or malformed review job(s) were withheld fail-closed; clean jobs continue.\n\n"
                  )
                  for row in quarantined[:15]:
                      handle.write(
                          f"- {row['source']}/{row['source_job_id']}: {row['title']}\n"
                      )
              if withheld:
                  handle.write("\n### Automatic no-edit withholding\n\n")
                  handle.write(
                      f"{len(withheld)} unresolved review job(s) were withheld for this publication without recording exclusions; clean and automatic inventory continues.\n"
                  )
              if isolated:
                  handle.write("\n### Source isolation\n\n")
                  handle.write(
                      "More than 15 unresolved/problem jobs or a source-integrity mismatch isolated: "
                      + ", ".join(isolated)
                      + ". Other clean sources continue.\n"
                  )
          PY

      - name: Verify fanout changed only source review surfaces
        if: steps.mode.outputs.skip != 'true'
        run: |
          set -euo pipefail
          unexpected="$({ git diff --name-only | awk '
            $0 != "pipeline/reviews/jobg8/service-admin-review.md" &&
            $0 != "pipeline/reviews/jobg8/support-worker-review.md" &&
            $0 != "pipeline/reviews/external/northeast-jobs-summary.md" &&
            $0 != "pipeline/reviews/external/vonne-summary.md" &&
            $0 != "pipeline/reviews/external/teaching-vacancies/england-wide-admin-service-summary.md" &&
            $0 != "pipeline/reviews/external/nhs-jobs-summary.md"'; } || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Review Hub fanout changed unexpected files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit fanned-out review decisions
        if: steps.mode.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            pipeline/reviews/jobg8/service-admin-review.md \
            pipeline/reviews/jobg8/support-worker-review.md \
            pipeline/reviews/external/northeast-jobs-summary.md \
            pipeline/reviews/external/vonne-summary.md \
            pipeline/reviews/external/teaching-vacancies/england-wide-admin-service-summary.md \
            pipeline/reviews/external/nhs-jobs-summary.md
          if git diff --cached --quiet; then
            echo "No manual action fanout changes to commit"
            exit 0
          fi
          git commit -m "Apply Ontap daily review decisions"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Review decisions committed"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "::error::Could not safely push review decisions after 3 attempts."
          exit 1

      - name: Dispatch current source publishers sequentially
        if: steps.mode.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLAN: ${{ runner.temp }}/ontap-review-publish-plan.json
        run: |
          set -euo pipefail

          LAST_RUN_ID=""

          recent_dispatched_run_id() {
            workflow="$1"
            started_epoch="$2"
            runs_json=""
            if ! runs_json="$(gh run list \
              --workflow "$workflow" \
              --branch main \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,createdAt,status,conclusion)"; then
              return 1
            fi
            RUNS_JSON="$runs_json" STARTED_EPOCH="$started_epoch" python - <<'PY'
          import datetime as dt
          import json
          import os

          started = int(os.environ["STARTED_EPOCH"])
          rows = json.loads(os.environ["RUNS_JSON"])
          candidates = []
          for row in rows:
              created = dt.datetime.fromisoformat(row["createdAt"].replace("Z", "+00:00"))
              if int(created.timestamp()) >= started - 3:
                  candidates.append((created, row["databaseId"]))
          if candidates:
              print(max(candidates)[1])
          PY
          }

          wait_for_dispatched_run() {
            workflow="$1"
            started_epoch="$2"
            run_id=""
            for attempt in $(seq 1 30); do
              run_id="$(recent_dispatched_run_id "$workflow" "$started_epoch" || true)"
              if [ -n "$run_id" ]; then
                LAST_RUN_ID="$run_id"
                echo "Found $workflow run $run_id"
                if gh run watch "$run_id" --exit-status; then
                  return 0
                fi
                return 1
              fi
              sleep 2
            done
            echo "::error::Could not locate dispatched run for $workflow"
            return 1
          }

          dispatch_one() {
            source="$1"
            workflow="$2"
            approval="$3"
            echo "Dispatching $source via $workflow"
            started_epoch="$(date -u +%s)"
            LAST_RUN_ID=""

            for attempt in $(seq 1 10); do
              echo "Dispatch attempt $attempt/10 for $source"
              dispatched=false
              if [ "$approval" = "true" ]; then
                if gh workflow run "$workflow" --ref main -f approval=PUBLISH; then
                  dispatched=true
                fi
              else
                if gh workflow run "$workflow" --ref main; then
                  dispatched=true
                fi
              fi

              if [ "$dispatched" = "true" ]; then
                if wait_for_dispatched_run "$workflow" "$started_epoch"; then
                  return 0
                fi
                return 1
              fi

              run_id="$(recent_dispatched_run_id "$workflow" "$started_epoch" || true)"
              if [ -n "$run_id" ]; then
                LAST_RUN_ID="$run_id"
                echo "Dispatch command failed, but GitHub created run $run_id; watching that run instead of retrying."
                if gh run watch "$run_id" --exit-status; then
                  return 0
                fi
                return 1
              fi

              if [ "$attempt" -lt 10 ]; then
                echo "::warning::GitHub dispatch failed for $source; retrying in 30 seconds."
                sleep 30
              fi
            done

            echo "::error::GitHub could not dispatch $source after 10 attempts."
            return 1
          }

          python - "$PLAN" > "$RUNNER_TEMP/publish-queue.tsv" <<'PY'
          import json
          import sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          for row in plan["publish"]:
              print(f"{row['source']}\t{row['workflow']}\t{str(row['approval']).lower()}")
          PY

          shared_publish=false
          while IFS=$'\t' read -r source workflow approval; do
            [ -n "$workflow" ] || continue

            if dispatch_one "$source" "$workflow" "$approval"; then
              if python - "$PLAN" "$source" <<'PY'
          import json
          import sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          source = sys.argv[2]
          row = next(item for item in plan["publish"] if item["source"] == source)
          raise SystemExit(0 if row["shared_publish_after"] else 1)
          PY
              then
                shared_publish=true
              fi
              continue
            fi

            label="$source"
            case "$source" in
              jobg8) label="JobG8" ;;
              nejobs) label="NEJobs" ;;
              vonne) label="VONNE" ;;
              teaching_vacancies) label="Teaching Vacancies" ;;
              nhs) label="NHS Jobs" ;;
            esac
            echo "::warning::$label publisher failed. Keeping its last approved state and continuing with other clean sources."
            {
              echo
              echo "- $label publisher failed and was isolated from the wider Ontap publish."
              echo "- Its last approved state remains in place; other clean sources continue publishing."
              if [ -n "$LAST_RUN_ID" ]; then
                echo "- Failed $label workflow run: $LAST_RUN_ID."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/publish-queue.tsv"

          if [ "$shared_publish" = "true" ]; then
            dispatch_one "shared verified pages" "publish-verified-pages.yml" "false"
          fi

      - name: Publish summary
        if: ${{ always() && steps.mode.outputs.skip != 'true' }}
        run: |
          {
            echo "## Ontap Review Hub apply/publish"
            echo
            echo "The master review was reconciled against the latest committed source state before validation."
            if [ "${{ steps.mode.outputs.unresolved_policy }}" = "withhold" ]; then
              echo "The 11:45 safety net ran because no successful manual publication was found today. Blank review jobs were withheld without becoming remembered exclusions; clean and automatic inventory continued."
            else
              echo "Up to 15 unresolved or malformed review actions per source were withheld fail-closed at job level and flagged; more than 15 isolates that source under the normal manual policy."
            fi
            echo "Unchanged manual decisions were retained; jobs no longer requiring review were removed."
            echo "A source-level integrity mismatch isolates that source rather than blocking unrelated inventory."
            echo "Manual actions were fanned out to the owning source review files."
            echo "Current source publishers were dispatched sequentially, with transient GitHub dispatch failures retried automatically."
            echo "Any source publisher failure is fail-soft at the master boundary: its last approved state remains in place and other clean sources continue."
            echo "The final shared verified-page publisher remains a system-level integrity gate and is still blocking if it fails."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Already published today summary
        if: steps.mode.outputs.skip == 'true'
        run: |
          {
            echo "## Ontap 11:45 publication safety net"
            echo
            echo "No automatic publication was needed because a successful manual Apply and publish run already completed today."
            echo "Manual run: ${{ steps.mode.outputs.manual_run_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
