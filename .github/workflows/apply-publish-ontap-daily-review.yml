name: Apply and publish Ontap daily review

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type PUBLISH after completing the one Ontap daily review file
        required: true
        type: string

concurrency:
  group: ontap-review-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  apply-and-publish:
    name: Fan out reviewed decisions and run guarded source publishers
    runs-on: ubuntu-latest

    steps:
      - name: Check explicit approval
        env:
          APPROVAL: ${{ inputs.approval }}
        run: |
          if [ "$APPROVAL" != "PUBLISH" ]; then
            echo "::error::Approval must be exactly PUBLISH."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile master review with latest source state
        working-directory: pipeline
        run: |
          python -m review_hub.master_review build

      - name: Commit reconciled master review
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/reviews/daily/ontap-daily-review.md
          if git diff --cached --quiet; then
            echo "Master review already matches current source state"
            exit 0
          fi
          git commit -m "Reconcile Ontap daily review before publish"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Reconciled master review committed"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "::error::Could not safely push reconciled master review after 3 attempts."
          exit 1

      - name: Validate complete master review and fan out decisions
        working-directory: pipeline
        run: |
          python -m review_hub.master_review apply \
            --require-complete \
            --write \
            --plan "$RUNNER_TEMP/ontap-review-publish-plan.json"
          cat "$RUNNER_TEMP/ontap-review-publish-plan.json"

      - name: Verify fanout changed only source review surfaces
        run: |
          set -euo pipefail
          unexpected="$({ git diff --name-only | awk '
            $0 != "pipeline/reviews/jobg8/service-admin-review.md" &&
            $0 != "pipeline/reviews/jobg8/support-worker-review.md" &&
            $0 != "pipeline/reviews/external/northeast-jobs-summary.md" &&
            $0 != "pipeline/reviews/external/vonne-summary.md" &&
            $0 != "pipeline/reviews/external/teaching-vacancies/england-wide-admin-service-summary.md"'; } || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Review Hub fanout changed unexpected files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit fanned-out review decisions
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            pipeline/reviews/jobg8/service-admin-review.md \
            pipeline/reviews/jobg8/support-worker-review.md \
            pipeline/reviews/external/northeast-jobs-summary.md \
            pipeline/reviews/external/vonne-summary.md \
            pipeline/reviews/external/teaching-vacancies/england-wide-admin-service-summary.md
          if git diff --cached --quiet; then
            echo "No manual action fanout changes to commit"
            exit 0
          fi
          git commit -m "Apply Ontap daily review decisions"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Review decisions committed"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "::error::Could not safely push review decisions after 3 attempts."
          exit 1

      - name: Dispatch current source publishers sequentially
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLAN: ${{ runner.temp }}/ontap-review-publish-plan.json
        run: |
          set -euo pipefail

          LAST_RUN_ID=""

          recent_dispatched_run_id() {
            workflow="$1"
            started_epoch="$2"
            runs_json=""
            if ! runs_json="$(gh run list \
              --workflow "$workflow" \
              --branch main \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,createdAt,status,conclusion)"; then
              return 1
            fi
            RUNS_JSON="$runs_json" STARTED_EPOCH="$started_epoch" python - <<'PY'
          import datetime as dt
          import json
          import os

          started = int(os.environ["STARTED_EPOCH"])
          rows = json.loads(os.environ["RUNS_JSON"])
          candidates = []
          for row in rows:
              created = dt.datetime.fromisoformat(row["createdAt"].replace("Z", "+00:00"))
              if int(created.timestamp()) >= started - 3:
                  candidates.append((created, row["databaseId"]))
          if candidates:
              print(max(candidates)[1])
          PY
          }

          wait_for_dispatched_run() {
            workflow="$1"
            started_epoch="$2"
            run_id=""
            for attempt in $(seq 1 30); do
              run_id="$(recent_dispatched_run_id "$workflow" "$started_epoch" || true)"
              if [ -n "$run_id" ]; then
                LAST_RUN_ID="$run_id"
                echo "Found $workflow run $run_id"
                if gh run watch "$run_id" --exit-status; then
                  return 0
                fi
                return 1
              fi
              sleep 2
            done
            echo "::error::Could not locate dispatched run for $workflow"
            return 1
          }

          dispatch_one() {
            source="$1"
            workflow="$2"
            approval="$3"
            echo "Dispatching $source via $workflow"
            started_epoch="$(date -u +%s)"
            LAST_RUN_ID=""

            for attempt in $(seq 1 10); do
              echo "Dispatch attempt $attempt/10 for $source"
              dispatched=false
              if [ "$approval" = "true" ]; then
                if gh workflow run "$workflow" --ref main -f approval=PUBLISH; then
                  dispatched=true
                fi
              else
                if gh workflow run "$workflow" --ref main; then
                  dispatched=true
                fi
              fi

              if [ "$dispatched" = "true" ]; then
                if wait_for_dispatched_run "$workflow" "$started_epoch"; then
                  return 0
                fi
                return 1
              fi

              # A failed HTTP response can occasionally be ambiguous. Before retrying,
              # check whether GitHub nevertheless created the workflow run so that we
              # never deliberately dispatch a duplicate publisher.
              run_id="$(recent_dispatched_run_id "$workflow" "$started_epoch" || true)"
              if [ -n "$run_id" ]; then
                LAST_RUN_ID="$run_id"
                echo "Dispatch command failed, but GitHub created run $run_id; watching that run instead of retrying."
                if gh run watch "$run_id" --exit-status; then
                  return 0
                fi
                return 1
              fi

              if [ "$attempt" -lt 10 ]; then
                echo "::warning::GitHub dispatch failed for $source; retrying in 30 seconds."
                sleep 30
              fi
            done

            echo "::error::GitHub could not dispatch $source after 10 attempts."
            return 1
          }

          is_nonmaterial_external_drift() {
            source="$1"
            run_id="$2"
            [ -n "$run_id" ] || return 1

            case "$source" in
              nejobs)
                expected_drift="the live reviewable vacancy set differs from the reviewed set"
                ;;
              vonne)
                expected_drift="the live reviewable VONNE set differs from the reviewed set"
                ;;
              *)
                return 1
                ;;
            esac

            run_logs="$(gh run view "$run_id" --log 2>/dev/null || true)"
            RUN_LOGS="$run_logs" EXPECTED_DRIFT="$expected_drift" SOURCE_KEY="$source" python - <<'PY'
          import os
          import re

          text = os.environ.get("RUN_LOGS", "")
          expected = os.environ["EXPECTED_DRIFT"]
          source = os.environ["SOURCE_KEY"]
          drift_lines = [line for line in text.splitlines() if expected in line]
          if not drift_lines:
              raise SystemExit(1)
          if "detail page(s) failed" in text:
              raise SystemExit(1)

          line = drift_lines[-1]

          def ids_after(label: str) -> list[str]:
              match = re.search(rf"{re.escape(label)}:\s*([^;|)]+)", line)
              if not match:
                  return []
              return [value.strip() for value in match.group(1).split(",") if value.strip()]

          new_ids = ids_after("new IDs")
          missing_ids = ids_after("missing IDs")
          total_drift = len(new_ids) + len(missing_ids)

          # Operational materiality boundary for small live-refetch sources:
          # keep that source on its last approved snapshot and let the rest of
          # Ontap publish when at most two newly reviewable jobs and four total
          # added/removed IDs have changed. Larger drift remains blocking.
          if total_drift and len(new_ids) <= 2 and total_drift <= 4:
              print(
                  f"Non-material {source} drift: "
                  f"{len(new_ids)} new, {len(missing_ids)} missing; source can be isolated."
              )
              raise SystemExit(0)
          raise SystemExit(1)
          PY
          }

          python - "$PLAN" > "$RUNNER_TEMP/publish-queue.tsv" <<'PY'
          import json
          import sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          for row in plan["publish"]:
              print(f"{row['source']}\t{row['workflow']}\t{str(row['approval']).lower()}")
          PY

          shared_publish=false
          while IFS=$'\t' read -r source workflow approval; do
            [ -n "$workflow" ] || continue

            if dispatch_one "$source" "$workflow" "$approval"; then
              if python - "$PLAN" "$source" <<'PY'
          import json
          import sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          source = sys.argv[2]
          row = next(item for item in plan["publish"] if item["source"] == source)
          raise SystemExit(0 if row["shared_publish_after"] else 1)
          PY
              then
                shared_publish=true
              fi
              continue
            fi

            if is_nonmaterial_external_drift "$source" "$LAST_RUN_ID"; then
              echo "::warning::$source changed only slightly after review. Keeping its last approved snapshot and continuing with the other clean sources."
              {
                echo
                echo "- $source was skipped because live review drift was non-material (maximum 2 new review items / 4 total added-or-removed IDs)."
                echo "- Its previously approved snapshot remains in place; other clean sources continue publishing."
              } >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            echo "::error::$source publisher failed and was not eligible for the non-material-drift exception."
            exit 1
          done < "$RUNNER_TEMP/publish-queue.tsv"

          if [ "$shared_publish" = "true" ]; then
            dispatch_one "shared verified pages" "publish-verified-pages.yml" "false"
          fi

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Ontap Review Hub apply/publish"
            echo
            echo "The master review was reconciled against the latest committed source state before validation."
            echo "Unchanged manual decisions were retained; jobs no longer requiring review were removed."
            echo "If genuinely new or changed jobs appeared before validation, publishing stopped until those new blank actions were reviewed."
            echo "Manual actions were fanned out to the owning source review files."
            echo "Current source publishers were dispatched sequentially, with transient GitHub dispatch failures retried automatically."
            echo "Small live drift in NEJobs or VONNE can be isolated without blocking JobG8, the other clean external sources, or the final verified-page publish; material drift still blocks."
          } >> "$GITHUB_STEP_SUMMARY"
