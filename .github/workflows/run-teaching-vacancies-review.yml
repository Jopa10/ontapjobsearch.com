name: Run Teaching Vacancies review

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-teaching-vacancies-review:
    name: Refresh West Yorkshire Teaching Vacancies review only
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test package
        run: python -m pip install --upgrade pip pytest

      - name: Test Teaching Vacancies proof of concept
        working-directory: pipeline
        run: python -m pytest tests/test_teaching_vacancies_poc.py -q

      - name: Refresh West Yorkshire Teaching Vacancies review
        working-directory: pipeline
        run: |
          python -m external_sources.teaching_vacancies_poc \
            --fetch-live \
            --max-pages 2 \
            --report-csv reviews/external/west-yorkshire-teaching-vacancies-review.csv \
            --summary-md reviews/external/west-yorkshire-teaching-vacancies-summary.md

      - name: Verify review outputs and live-site isolation
        run: |
          test -s pipeline/reviews/external/west-yorkshire-teaching-vacancies-review.csv
          test -s pipeline/reviews/external/west-yorkshire-teaching-vacancies-summary.md
          git diff --exit-code -- \
            pipeline/output-external \
            pipeline/output-admin-service \
            app

      - name: Commit review only
        run: |
          set -euo pipefail
          review_paths=(
            "pipeline/reviews/external/west-yorkshire-teaching-vacancies-review.csv"
            "pipeline/reviews/external/west-yorkshire-teaching-vacancies-summary.md"
          )

          git add -- "${review_paths[@]}"
          staged_files="$(git diff --cached --name-only)"
          if [ -z "$staged_files" ]; then
            echo "No West Yorkshire Teaching Vacancies review changes to commit"
            exit 0
          fi

          unexpected_files="$({ printf '%s\n' "$staged_files" | awk '$0 != "pipeline/reviews/external/west-yorkshire-teaching-vacancies-review.csv" && $0 != "pipeline/reviews/external/west-yorkshire-teaching-vacancies-summary.md"'; } || true)"
          if [ -n "$unexpected_files" ]; then
            echo "::error::Refusing to commit files outside the West Yorkshire Teaching Vacancies review:"
            printf '%s\n' "$unexpected_files"
            git reset --mixed
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh West Yorkshire Teaching Vacancies review"
          git push origin main
