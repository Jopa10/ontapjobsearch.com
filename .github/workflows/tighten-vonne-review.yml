name: Tighten VONNE review rules

on:
  pull_request:
    paths:
      - ".github/workflows/tighten-vonne-review.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/vonne-review-only-poc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply final review-rule corrections
        env:
          SIGNATURE_B64: "ZGVmIGxvYWRfbmVqb2JzX2NhbmRpZGF0ZXMoCiAgICBwYXRoOiBQYXRoLAogICAgKiwKICAgIG5vdzogZGF0ZXRpbWUgfCBOb25lID0gTm9uZSwKKSAtPiBsaXN0W2RpY3Rbc3RyLCBzdHJdXToK"
          CURRENT_B64: "ICAgIGN1cnJlbnQgPSBub3cgb3IgZGF0ZXRpbWUubm93KFpvbmVJbmZvKCJFdXJvcGUvTG9uZG9uIikpCiAgICBpZiBjdXJyZW50LnR6aW5mbyBpcyBOb25lOgogICAgICAgIGN1cnJlbnQgPSBjdXJyZW50LnJlcGxhY2UodHppbmZvPVpvbmVJbmZvKCJFdXJvcGUvTG9uZG9uIikpCg=="
          ROW_B64: ""
          TESTS_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          def decoded(name: str) -> str:
              return base64.b64decode(os.environ[name]).decode("utf-8")

          module = Path("pipeline/external_sources/vonne_poc.py")
          text = module.read_text(encoding="utf-8")
          text = text.replace(
              "    normalise_title,\n    similarity,\n",
              "    normalise_title,\n    parse_source_datetime,\n    similarity,\n",
              1,
          )
          text = text.replace(
              '    "project worker",\n',
              '    "worker",\n    "project worker",\n',
              1,
          )

          function_start = text.index("def load_nejobs_candidates(")
          prefix = text[:function_start]
          rest = text[function_start:]
          old_signature = (
              "def load_nejobs_candidates(path: Path) "
              "-> list[dict[str, str]]:\n"
          )
          if old_signature not in rest:
              raise SystemExit("NEJobs loader signature not found")
          rest = rest.replace(old_signature, decoded("SIGNATURE_B64"), 1)
          candidates_marker = "    candidates: list[dict[str, str]] = []\n"
          if candidates_marker not in rest:
              raise SystemExit("NEJobs candidates marker not found")
          rest = rest.replace(
              candidates_marker,
              candidates_marker + decoded("CURRENT_B64"),
              1,
          )
          row_marker = (
              "    for row in data:\n"
              "        if not isinstance(row, dict):\n"
              "            continue\n"
              "        candidates.append(\n"
          )
          if row_marker not in rest:
              raise SystemExit("NEJobs row marker not found")
          rest = rest.replace(
              row_marker,
              (
                  "    for row in data:\n"
                  "        if not isinstance(row, dict):\n"
                  "            continue\n"
                  + decoded("ROW_B64")
                  + "        candidates.append(\n"
              ),
              1,
          )
          module.write_text(prefix + rest, encoding="utf-8")

          tests = Path("pipeline/tests/test_vonne_poc.py")
          test_text = tests.read_text(encoding="utf-8")
          test_text = test_text.replace(
              "from pathlib import Path\n",
              (
                  "from datetime import datetime\n"
                  "from pathlib import Path\n"
                  "from zoneinfo import ZoneInfo\n"
              ),
              1,
          )
          test_text = test_text.replace(
              "    geography_for_item,\n",
              "    geography_for_item,\n    load_nejobs_candidates,\n",
              1,
          )
          marker = "\ndef test_cli_has_no_publishing_option():\n"
          if marker not in test_text:
              raise SystemExit("test insertion marker not found")
          if "test_expired_nejobs_candidates_are_ignored" not in test_text:
              test_text = test_text.replace(
                  marker,
                  decoded("TESTS_B64") + marker,
                  1,
              )
          tests.write_text(test_text, encoding="utf-8")
          PY

      - name: Install and test
        run: |
          python -m pip install --upgrade pip pandas openpyxl pytest
          cd pipeline
          python -m py_compile external_sources/vonne_poc.py
          python -m pytest tests/test_vonne_poc.py -q

      - name: Remove one-off workflow and push corrections
        run: |
          rm .github/workflows/tighten-vonne-review.yml
          git add pipeline/external_sources/vonne_poc.py pipeline/tests/test_vonne_poc.py .github/workflows/tighten-vonne-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Tighten VONNE review rules"
          git push origin agent/vonne-review-only-poc
