name: Run Legal boundary review evidence once

on:
  push:
    paths:
      - '.github/workflows/run-legal-boundary-review-once.yml'

permissions:
  contents: write
  id-token: write

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl boto3

      - name: Configure AWS credentials for JobG8 archive
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::179402568934:role/OntapJobG8ArchiveGitHubRole
          aws-region: eu-west-2

      - name: Materialize current August JobG8 archive
        env:
          JOBG8_ARCHIVE_BUCKET: ontap-jobg8-archive-179402568934-eu-west-2-an
          JOBG8_ARCHIVE_REGION: eu-west-2
        run: |
          set -euo pipefail
          staging_dir="$RUNNER_TEMP/jobg8-legal-boundary/2026-08"
          python pipeline/scripts/materialize_jobg8_archive_month.py \
            --month '2026-08' \
            --bucket "$JOBG8_ARCHIVE_BUCKET" \
            --region "$JOBG8_ARCHIVE_REGION" \
            --prefix 'jobg8/raw' \
            --s3-start-date '2026-08-14' \
            --legacy-dir 'pipeline/input-jobg8-archive/2026-08' \
            --output-dir "$staging_dir"
          echo "JOBG8_AUDIT_INPUT_DIR=$staging_dir" >> "$GITHUB_ENV"

      - name: Build Legal boundary evidence
        run: |
          set -euo pipefail
          python pipeline/scripts/jobg8_family_boundary_review.py \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --diagnostic-csv pipeline/reports-discovery-audit/jobg8-legal-assistant-paralegal-discovery-current.csv \
            --output-csv pipeline/reports-discovery-audit/jobg8-legal-assistant-paralegal-boundary-review-current.csv \
            --summary-md pipeline/reports-discovery-audit/jobg8-legal-assistant-paralegal-boundary-review-current.md \
            --family-name 'Legal Assistant / Paralegal' \
            --keywords 'paralegal,legal assistant,legal administrator,legal secretary,casework,case handler,claims handler,conveyancing,litigation,probate,solicitor,fee earner,legal executive,legal cashier' \
            --hard-salary-max 50000
          cat pipeline/reports-discovery-audit/jobg8-legal-assistant-paralegal-boundary-review-current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit evidence and remove one-time workflow
        run: |
          set -euo pipefail
          git add pipeline/reports-discovery-audit/jobg8-legal-assistant-paralegal-boundary-review-current.csv \
                  pipeline/reports-discovery-audit/jobg8-legal-assistant-paralegal-boundary-review-current.md
          git rm .github/workflows/run-legal-boundary-review-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build Legal family boundary evidence'
          git pull --rebase origin main
          git push origin HEAD:main
