name: Refresh JobG8 exclusion list

on:
  workflow_run:
    workflows:
      - Run full JobG8 daily process
    types:
      - completed

concurrency:
  group: jobg8-exclusion-list
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-jobg8-exclusion-list:
    name: Refresh JobG8 exclusion list
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Test persistent review and exclusion behavior
        working-directory: pipeline
        run: python -m unittest discover -s tests -p 'test_persistent_jobg8_review.py' -v

      - name: Refresh combined exclusion list
        working-directory: pipeline
        run: python -m scripts.persistent_jobg8_review --refresh-exclusion-report

      - name: Commit exclusion list if changed
        run: |
          set -euo pipefail
          report="pipeline/reviews/jobg8/jobg8-exclusion-list.md"

          if [ -z "$(git status --porcelain -- "$report")" ]; then
            echo "No JobG8 exclusion-list changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$report"

          staged_files="$(git diff --cached --name-only)"
          if [ "$staged_files" != "$report" ]; then
            echo "::error::Refusing to commit anything except the JobG8 exclusion list."
            printf '%s\n' "$staged_files"
            git reset --mixed
            exit 1
          fi

          git commit -m "Refresh JobG8 exclusion list"

          for attempt in 1 2 3; do
            echo "Exclusion-list push attempt $attempt of 3"
            if ! git pull --rebase origin main; then
              echo "::error::Could not safely rebase exclusion-list commit onto latest main."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "JobG8 exclusion list pushed successfully"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "::error::Exclusion-list push was rejected after 3 attempts."
          exit 1
