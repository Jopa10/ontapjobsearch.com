name: Fix ambiguous City discovery geo once

on:
  push:
    paths:
      - '.github/workflows/fix-discovery-city-geo-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Treat generic City as non-authoritative
        run: |
          python - <<'PY'
          from pathlib import Path
          script = Path('pipeline/scripts/jobg8_family_discovery.py')
          text = script.read_text(encoding='utf-8')
          old = 'AREA_UNUSABLE_VALUES = {"", "not specified", "unknown"}'
          new = 'AREA_UNUSABLE_VALUES = {"", "not specified", "unknown", "city"}'
          if old not in text and new not in text:
              raise SystemExit('Expected AREA_UNUSABLE_VALUES declaration not found')
          text = text.replace(old, new)
          script.write_text(text, encoding='utf-8')

          additions = {
            'SYSTEM_MAP.md': '- 23 August 2026 — **Discovery geo safeguard for generic `City`:** JobG8 `Area=City` is treated as non-authoritative by reusable family discovery because current feed evidence showed named Sheffield, Leeds, Manchester, Birmingham and Belfast vacancies being falsely inherited into the lookup `City → London` route. Discovery now prefers the specific Location fallback for these rows; when no safe fallback exists it remains unresolved rather than being forced to London. The canonical `geo_lookup.xlsx` remains the factual lookup authority and is not globally rewritten by this diagnostic safeguard.\n',
            'SYSTEM_OVERVIEW.md': '- 23 August 2026 — New-family regional evidence no longer treats generic JobG8 **`Area=City`** as proof of London when the advert has a specific named location elsewhere; the specific location is used where safely mapped, otherwise the row stays unresolved.\n',
          }
          for filename, bullet in additions.items():
              p = Path(filename)
              body = p.read_text(encoding='utf-8')
              marker = '**Discovery geo safeguard for generic `City`:**' if filename == 'SYSTEM_MAP.md' else '**`Area=City`**'
              if marker not in body:
                  body = body.replace('## Recent canonical changes\n\n', '## Recent canonical changes\n\n' + bullet, 1)
                  p.write_text(body, encoding='utf-8')
          PY
      - name: Commit fix and remove helper
        run: |
          set -euo pipefail
          git add pipeline/scripts/jobg8_family_discovery.py SYSTEM_MAP.md SYSTEM_OVERVIEW.md
          git rm .github/workflows/fix-discovery-city-geo-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Treat generic City as weak discovery geography'
          git pull --rebase origin main
          git push origin HEAD:main
