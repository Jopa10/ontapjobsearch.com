name: Run Workable London POC

on:
  workflow_dispatch:
  push:
    branches:
      - "poc/workable-london-review"
    paths:
      - "pipeline/external_sources/workable_london_poc.py"

permissions:
  contents: write

jobs:
  workable-london-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime packages
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Compile Workable POC
        working-directory: pipeline
        run: python -m py_compile external_sources/workable_london_poc.py

      - name: Run review-only Workable London POC
        id: run_poc
        continue-on-error: true
        working-directory: pipeline
        run: |
          python -m external_sources.workable_london_poc \
            --review-csv /tmp/london-workable-review.csv \
            --review-md /tmp/london-workable-summary.md

      - name: Verify review output and field-audit safeguards
        id: verify_poc
        if: steps.run_poc.outcome == 'success'
        continue-on-error: true
        run: |
          test -s /tmp/london-workable-review.csv
          test -s /tmp/london-workable-summary.md
          python - <<'PY'
          import csv
          from pathlib import Path

          csv_path = Path('/tmp/london-workable-review.csv')
          with csv_path.open(newline='', encoding='utf-8-sig') as handle:
              reader = csv.DictReader(handle)
              assert reader.fieldnames and reader.fieldnames[0] == 'final_decision', reader.fieldnames
              assert 'closing_status' in reader.fieldnames, reader.fieldnames
              assert 'closing_evidence' in reader.fieldnames, reader.fieldnames
              rows = list(reader)

          assert rows, 'Workable POC returned no London review rows'
          salary = [r for r in rows if r['salary_status'] == 'USABLE_REVIEW']
          reviewable = [r for r in rows if r['final_decision'] in {'SELECTED', 'POSS'}]
          additional_salary = [
              r for r in reviewable
              if r['salary_status'] == 'USABLE_REVIEW' and r['duplicate_status'] == 'ADDITIONAL'
          ]
          explicit_closing = [r for r in rows if r['closing_status'] == 'VISIBLE_EXTRACTED']
          assert explicit_closing, 'Field audit expected at least one explicit closing date in current London feed'
          assert all(r['closing_date'] and r['closing_evidence'] for r in explicit_closing)

          print(f'Workable London review rows: {len(rows)}')
          print(f'Salary-bearing London rows: {len(salary)}')
          print(f'Explicit closing dates extracted: {len(explicit_closing)}')
          print(f'Likely additional reviewable with salary: {len(additional_salary)}')

          summary = Path('/tmp/london-workable-summary.md').read_text(encoding='utf-8')
          assert '## SELECTED' in summary
          assert '## POSS — choose SELECT or EXCLUDE' in summary
          assert '## EXCLUDED BY REVIEW' in summary
          assert '## HARD_PASS' in summary
          assert 'not stated by source' in summary
          assert summary.rstrip().endswith('safety: review-only POC; no approved-output or publishing path')
          PY
          git diff --exit-code -- app pipeline/output-admin-service pipeline/output-support-worker pipeline/output-external

      - name: Store only canonical review files on POC branch
        if: steps.run_poc.outcome == 'success' && steps.verify_poc.outcome == 'success'
        run: |
          mkdir -p pipeline/reviews/external
          cp /tmp/london-workable-review.csv pipeline/reviews/external/london-workable-review.csv
          cp /tmp/london-workable-summary.md pipeline/reviews/external/london-workable-summary.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pipeline/reviews/external/london-workable-review.csv \
            pipeline/reviews/external/london-workable-summary.md
          python - <<'PY'
          import subprocess

          allowed = {
              'pipeline/reviews/external/london-workable-review.csv',
              'pipeline/reviews/external/london-workable-summary.md',
          }
          staged = set(
              subprocess.check_output(
                  ['git', 'diff', '--cached', '--name-only'],
                  text=True,
              ).splitlines()
          )
          unexpected = staged - allowed
          assert not unexpected, f'unexpected staged review paths: {sorted(unexpected)}'
          PY
          if ! git diff --cached --quiet; then
            git commit -m "Store Workable London field-audit review"
            git push
          fi

      - name: Show summary in workflow log
        if: steps.run_poc.outcome == 'success'
        run: cat /tmp/london-workable-summary.md

      - name: Upload Workable London POC review
        if: steps.run_poc.outcome == 'success' && steps.verify_poc.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: workable-london-poc-review
          path: |
            /tmp/london-workable-review.csv
            /tmp/london-workable-summary.md
          if-no-files-found: error
          retention-days: 7

      - name: Fail if POC did not complete cleanly
        if: steps.run_poc.outcome != 'success' || steps.verify_poc.outcome != 'success'
        run: exit 1
