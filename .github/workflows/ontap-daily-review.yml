name: Ontap daily review

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Run full JobG8 daily process
    types:
      - completed

concurrency:
  group: ontap-daily-review
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build-review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    name: Build one daily review file and email it
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Identify the completed JobG8 cycle
        id: cycle
        if: github.event_name == 'workflow_run'
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path("pipeline/reports-daily/jobg8-daily-cycle-state.json").read_text(encoding="utf-8"))
          run_id = os.environ["SOURCE_RUN_ID"]
          matches = [
              (cycle_date, cycle)
              for cycle_date, cycles in state.get("completed_cycles", {}).items()
              for cycle, details in cycles.items()
              if str(details.get("run_id")) == run_id
          ]
          if len(matches) > 1:
              raise SystemExit(f"JobG8 run ID {run_id} appears in multiple completed cycles")
          cycle = matches[0][1] if matches else "unknown"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"cycle={cycle}\n")
          print(f"Source JobG8 run {run_id} maps to cycle {cycle}")
          PY

      - name: Build unified review
        working-directory: pipeline
        run: python -m review_hub.master_review build

      - name: Verify review-only isolation
        run: |
          set -euo pipefail
          test -s pipeline/reviews/daily/ontap-daily-review.md
          unexpected="$(git diff --name-only | awk '$0 != "pipeline/reviews/daily/ontap-daily-review.md"')"
          if [ -n "$unexpected" ]; then
            echo "::error::Daily review builder changed unexpected files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit one daily review file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/reviews/daily/ontap-daily-review.md
          if git diff --cached --quiet; then
            echo "No daily review change to commit"
            exit 0
          fi
          git commit -m "Refresh Ontap daily review"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Daily review committed"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "::error::Could not safely push daily review after 3 attempts."
          exit 1

      - name: Email daily review
        working-directory: pipeline
        env:
          ONTAP_REVIEW_EMAIL_TO: ${{ secrets.ONTAP_REVIEW_EMAIL_TO }}
          ONTAP_REVIEW_EMAIL_FROM: ${{ secrets.ONTAP_REVIEW_EMAIL_FROM }}
          ONTAP_SMTP_HOST: ${{ secrets.ONTAP_SMTP_HOST }}
          ONTAP_SMTP_PORT: ${{ secrets.ONTAP_SMTP_PORT }}
          ONTAP_SMTP_USERNAME: ${{ secrets.ONTAP_SMTP_USERNAME }}
          ONTAP_SMTP_PASSWORD: ${{ secrets.ONTAP_SMTP_PASSWORD }}
          ONTAP_SMTP_SSL: ${{ secrets.ONTAP_SMTP_SSL }}
          ONTAP_REVIEW_URL: https://github.com/Jopa10/ontapjobsearch.com/blob/main/pipeline/reviews/daily/ontap-daily-review.md
        run: python -m review_hub.email_review

      - name: Start automatic publish after morning review is saved
        if: >-
          github.event_name == 'workflow_run' &&
          steps.cycle.outputs.cycle == 'morning'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh workflow run apply-publish-ontap-daily-review.yml --ref main -f approval=AUTOMATIC_FALLBACK; then
            echo "Dispatched automatic publication after the morning review was committed and emailed."
          else
            echo "::warning::Could not dispatch automatic publication; the scheduled 11:45 safety net remains available."
          fi

      - name: Workflow summary
        run: |
          {
            echo "## Ontap daily review ready"
            echo
            sed -n '1,35p' pipeline/reviews/daily/ontap-daily-review.md
          } >> "$GITHUB_STEP_SUMMARY"
