name: Complete Teaching Vacancies regional review from artifact

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/complete-teaching-vacancies-review-from-artifact.yml"

permissions:
  actions: read
  contents: write

jobs:
  complete-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: Run review regression tests
        working-directory: pipeline
        run: |
          python -m pytest \
            tests/test_teaching_vacancies_regional_review.py \
            tests/test_teaching_vacancies_regional_approved.py \
            -q

      - name: Download verified discovery and routing evidence
        uses: actions/download-artifact@v4
        with:
          name: teaching-vacancies-regional-review
          path: pipeline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Jopa10/ontapjobsearch.com
          run-id: 31114481436

      - name: Verify downloaded evidence
        run: |
          test -s pipeline/manifests/external/teaching-vacancies/teaching-vacancies-discovery-2026-08-06.csv
          test -s pipeline/manifests/external/teaching-vacancies/teaching-vacancies-discovery-2026-08-06-summary.json
          test -s pipeline/manifests/external/teaching-vacancies/teaching-vacancies-routed-2026-08-06.csv
          test -s pipeline/manifests/external/teaching-vacancies/teaching-vacancies-unresolved-2026-08-06.csv
          test -s pipeline/manifests/external/teaching-vacancies/teaching-vacancies-routing-2026-08-06-summary.json

      - name: Generate separate regional reviews
        working-directory: pipeline
        run: |
          python -m external_sources.teaching_vacancies_regional_review \
            --routed-csv manifests/external/teaching-vacancies/teaching-vacancies-routed-2026-08-06.csv \
            --routing-summary-json manifests/external/teaching-vacancies/teaching-vacancies-routing-2026-08-06-summary.json \
            --write-reviews

      - name: Verify review-only isolation
        run: |
          test -d pipeline/reviews/external/teaching-vacancies
          find pipeline/reviews/external/teaching-vacancies -name '*-summary.md' -type f -size +0c | grep -q .
          git diff --exit-code -- \
            pipeline/output-external \
            pipeline/output-admin-service \
            app

      - name: Commit manifests and regional reviews only
        run: |
          set -euo pipefail
          allowed_paths=(
            "pipeline/manifests/external/teaching-vacancies"
            "pipeline/reviews/external/teaching-vacancies"
          )
          git add -- "${allowed_paths[@]}"
          staged_files="$(git diff --cached --name-only)"
          if [ -z "$staged_files" ]; then
            echo "No Teaching Vacancies regional review changes to commit"
            exit 0
          fi
          unexpected_files="$({ printf '%s\n' "$staged_files" | awk '$0 !~ /^pipeline\/manifests\/external\/teaching-vacancies\// && $0 !~ /^pipeline\/reviews\/external\/teaching-vacancies\//'; } || true)"
          if [ -n "$unexpected_files" ]; then
            echo "::error::Refusing to commit files outside regional review evidence:"
            printf '%s\n' "$unexpected_files"
            git reset --mixed
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Teaching Vacancies regional reviews"
          git push origin main

      - name: Upload completed regional review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teaching-vacancies-completed-regional-review
          path: |
            pipeline/manifests/external/teaching-vacancies/
            pipeline/reviews/external/teaching-vacancies/
          if-no-files-found: error
          retention-days: 14
