name: One-time Neon Production Saturday write
on:
  push:
    branches:
      - feat/neon-shadow-database
    paths:
      - .github/workflows/one-time-neon-production-saturday-write.yml
  workflow_dispatch:
    inputs:
      confirm:
        description: Type write-saturday-2026-11-21 to run the pinned Production write
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: ontap-neon-production-one-time-saturday-write
  cancel-in-progress: false
jobs:
  write-saturday:
    if: >-
      github.ref == 'refs/heads/feat/neon-shadow-database' &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'write-saturday-2026-11-21') ||
        (github.event_name == 'push' && github.event.before == '141674f81257e01968cd4de5bc7a0ef97c3c2895' && github.event.head_commit.message == 'ONETIME_PROD_NEON_SAT_2026-11-21')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: neon-prod-one-time-write
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      ONTAP_NEON_PROD_ONCE_WRITE_URL: ${{ secrets.ONTAP_NEON_PROD_ONCE_WRITE_URL }}
    steps:
      - name: Check out the guarded feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install pinned selected-payload dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Configure saved-feed read role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::179402568934:role/OntapNeonPreviewFeedReadRole
          aws-region: eu-west-2
          role-session-name: ontap-neon-production-one-time-feed-read
          role-duration-seconds: 900

      - name: Verify AWS account and download the pinned saved archive
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "179402568934"
          mkdir -p "$RUNNER_TEMP/ontap-daily-input"
          aws s3 cp s3://ontap-jobg8-archive-179402568934-eu-west-2-an/jobg8/raw/2026-11-21.zip "$RUNNER_TEMP/ontap-daily-input/feed.zip" --only-show-errors
          echo "84f2a54938e448f86e760f7d3117b836a4dd9217b9236a375077689e8b082852  $RUNNER_TEMP/ontap-daily-input/feed.zip" | sha256sum --check

      - name: Download Saturday's saved Preview receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14708793531
          run-id: 44908662586
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ontap-preview-receipt

      - name: Verify and stage saved source receipt
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root=Path("${{ runner.temp }}/ontap-preview-receipt")
          matches=list(root.rglob("daily-source.json"))
          assert len(matches)==1, "Expected exactly one saved source receipt"
          source_path=matches[0]
          source=json.loads(source_path.read_text())
          assert source["archiveDate"]=="2026-11-21"
          assert source["archiveKey"]=="jobg8/raw/2026-11-21.zip"
          assert source["archiveSha256"]=="84f2a54938e448f86e760f7d3117b836a4dd9217b9236a375077689e8b082852"
          assert source["productionOutputRunId"]==44880614175
          assert source["productionAppCommitSha"]=="9b1fb4dcc2681c593eea677e58be0f79e151f650"
          assert source["productionRunCommitSha"]=="c60a6f749670b34d48e8ef85a9ea2cc86b5ee911"
          assert [item["id"] for item in source["publishedOutputArtifacts"]]==[14700308219,14700288271]
          assert source["dateProvidedByRequest"] is False
          out=Path("${{ runner.temp }}/ontap-prod-source")
          out.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(source_path,out/"daily-source.json")
          shutil.copyfile(source_path.parent/"daily-scopes.json",out/"saved-daily-scopes.json")
          PY

      - name: Download the two pinned Production output artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14700308219,14700288271
          run-id: 44880614175
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ontap-production-output
          merge-multiple: true

      - name: Check out the exact Production app revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9b1fb4dcc2681c593eea677e58be0f79e151f650
          path: production-final
          persist-credentials: false

      - name: Rebuild and compare the 256 saved publication scopes
        env:
          PRODUCTION_OUTPUT_DIR: ${{ runner.temp }}/ontap-production-output
          SAVED_SCOPE_FILE: ${{ runner.temp }}/ontap-prod-source/saved-daily-scopes.json
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,str(Path("production-final/pipeline").resolve()))
          from scripts import publish_verified_pages_live_config as p
          rebuilt=[]
          output=Path(os.environ["PRODUCTION_OUTPUT_DIR"])
          for mapping in p.core.MAPPINGS:
              original=json.loads((output/mapping.source.name).read_text(encoding="utf-8-sig"))
              final=json.loads((Path("production-final")/mapping.source).read_text(encoding="utf-8-sig"))
              def ids(rows): return [str(r["job_id"]) for r in rows if r.get("source")=="JobG8"]
              assert ids(original)==ids(final), "Saved output IDs differ from exact Production app revision: "+mapping.source.name
              rebuilt.append({"scope":mapping.category+":"+mapping.region,"jobg8Ids":ids(final)})
          saved=json.loads(Path(os.environ["SAVED_SCOPE_FILE"]).read_text())
          assert rebuilt==saved, "Rebuilt scopes or their job order differ from Saturday's saved receipt"
          assert len(rebuilt)==256
          print("Saturday publication source verified:",len(rebuilt),"ordered scopes")
          PY

      - name: Build selected payloads from saved input without rerunning selection
        run: |
          python database/shadow/prepare_selected_review_payloads.py \
            --archive "$RUNNER_TEMP/ontap-daily-input/feed.zip" \
            --outputs "$RUNNER_TEMP/ontap-production-output" \
            --reviews production-final/pipeline/reviews/jobg8 \
            --date 2026-11-21 \
            --production-run-id 44880614175 \
            --production-run-commit c60a6f749670b34d48e8ef85a9ea2cc86b5ee911 \
            --app-commit 9b1fb4dcc2681c593eea677e58be0f79e151f650 \
            --output "$RUNNER_TEMP/ontap-prod-source/selected-review-payloads.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["ONTAP_PROD_SOURCE_DIR"])
          source=json.loads((root/"daily-source.json").read_text())
          payload=(root/"selected-review-payloads.json").read_bytes()
          source["payloadPackageSha256"]=hashlib.sha256(payload).hexdigest()
          (root/"daily-source.json").write_text(json.dumps(source,separators=(",",":"))+"\n")
          (root/"daily-scopes.json").write_bytes((root/"saved-daily-scopes.json").read_bytes())
          PY

      - name: Install pinned Postgres client
        run: npm ci --prefix database/shadow/harness --ignore-scripts --no-audit --no-fund

      - name: Apply schema once, write Saturday publication and compare full readback
        env:
          ONTAP_PROD_SOURCE_DIR: ${{ runner.temp }}/ontap-prod-source
          ONTAP_PROD_REPORT_PATH: ${{ runner.temp }}/ontap-prod-report.json
        run: node database/shadow/harness/production-one-time-write.mjs

      - name: Save sanitized Production write report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neon-production-one-time-saturday-write
          path: ${{ runner.temp }}/ontap-prod-report.json
          if-no-files-found: ignore
          retention-days: 30
