name: Finish family discovery governance cleanup

on:
  push:
    paths:
      - '.github/workflows/patch-family-discovery-governance-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch reusable discovery governance
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('pipeline/scripts/jobg8_family_discovery.py')
          body = script.read_text(encoding='utf-8')
          replacements = {
              'ordinary workplace IT support title signal': 'family title is a strong inclusion signal',
              'support title needs advert-context review': 'title needs advert-context review',
              'description-led IT support signal needs advert review': 'description-led family signal needs advert review',
              'before any 73-market UK recurrence/slice assessment.': 'before any 78-market UK recurrence/slice assessment.',
          }
          for old, new in replacements.items():
              body = body.replace(old, new)
          script.write_text(body, encoding='utf-8')

          wf = Path('.github/workflows/run-jobg8-discovery-coverage-audit.yml')
          wbody = wf.read_text(encoding='utf-8')
          needle = "      - 'pipeline/config/uk_assessable_regions.json'\n"
          add = needle + "      - 'pipeline/geo/geo_lookup.xlsx'\n"
          if "      - 'pipeline/geo/geo_lookup.xlsx'\n" not in wbody:
              if needle not in wbody:
                  raise SystemExit('Could not find discovery trigger insertion point')
              wbody = wbody.replace(needle, add, 1)
          wf.write_text(wbody, encoding='utf-8')

          map_marker = '**Reusable family-discovery boundary refinement:**'
          map_bullet = (
              '- 23 August 2026 — **Reusable family-discovery boundary refinement:** '
              '`pipeline/scripts/jobg8_family_discovery.py` now uses family-neutral decision reasons and the canonical 78-market wording; '
              'the discovery workflow also re-runs when `pipeline/geo/geo_lookup.xlsx` changes. '
              '`jobg8_family_boundary_review.py` supports both legacy Claims diagnostics and reusable family-discovery outputs. '
              'For Legal Assistant / Paralegal, the first evidence-led refinement removes generic claims/caseworker/case-handler discovery noise and weak law-firm-only description matches, while adding observed genuine Legal PA/support, probate and conveyancing support title variants.\n'
          )
          overview_bullet = (
              '- 23 August 2026 — **New-family discovery was tightened and made more reusable.** '
              'The shared discovery audit now re-runs after canonical geo-lookup changes as well as family-rule changes, and its output wording is family-neutral and 78-market aware. '
              'Legal Assistant / Paralegal passed the scale gate and has moved into evidence-led boundary refinement; generic insurance claims/casework noise is no longer treated as part of the Legal seam merely because it was useful during broad discovery.\n'
          )
          for filename, bullet in [('SYSTEM_MAP.md', map_bullet), ('SYSTEM_OVERVIEW.md', overview_bullet)]:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if map_marker not in text and '**New-family discovery was tightened and made more reusable.**' not in text:
                  heading = '## Recent canonical changes\n\n'
                  if heading not in text:
                      raise SystemExit(f'Recent canonical changes heading missing in {filename}')
                  text = text.replace(heading, heading + bullet, 1)
                  p.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup and remove one-time workflow
        run: |
          set -euo pipefail
          git add pipeline/scripts/jobg8_family_discovery.py \
                  .github/workflows/run-jobg8-discovery-coverage-audit.yml \
                  SYSTEM_MAP.md SYSTEM_OVERVIEW.md
          git rm .github/workflows/patch-family-discovery-governance-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Govern reusable family discovery refinement'
          git pull --rebase origin main
          git push origin HEAD:main
