name: One-time geography governance sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-geo-governance-once.yml'

permissions:
  contents: write

concurrency:
  group: geography-governance-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync canonical geography governance
        run: |
          python - <<'PY'
          from pathlib import Path

          map_path = Path('SYSTEM_MAP.md')
          audit_path = Path('SYSTEM_AUDIT.md')

          sm = map_path.read_text(encoding='utf-8')
          audit = audit_path.read_text(encoding='utf-8')

          new_map_bullet = (
              "- 22 August 2026 — **Service Admin standing launch rule:** a governed same-feed Service Admin count "
              "**over 8** is immediate owner approval for LIVE. A count of 8 or below remains NOT LIVE and stays "
              "on the normal 55-market rolling evidence. Applying that rule to the recovered geography launched 11 "
              "additional Service Admin markets: Cheshire - East, Cheshire - Warrington & Halton, Cornwall, Derbyshire, "
              "Greater Manchester - Wigan & Bolton, Leicestershire, Lincolnshire, Merseyside - Liverpool, Shropshire, "
              "Suffolk and West Midlands - Black Country. The launch used the existing catalog/register/configured-slice "
              "and verified-publish mechanisms; no previously live public URL was removed or renamed.\n"
          )
          anchor = "## Recent canonical changes\n\n"
          if new_map_bullet not in sm:
              if anchor not in sm:
                  raise SystemExit('SYSTEM_MAP recent changes anchor missing')
              sm = sm.replace(anchor, anchor + new_map_bullet, 1)

          old = "Numeric NOT LIVE counts are therefore current expansion evidence only; they never auto-activate a region."
          new = (
              "Numeric NOT LIVE counts are current expansion evidence. They do not auto-activate Support Worker or "
              "Customer Sales; Service Admin is the standing exception, where a governed same-feed count over 8 is "
              "immediate owner approval for LIVE."
          )
          if old in sm:
              sm = sm.replace(old, new, 1)
          elif new not in sm:
              raise SystemExit('SYSTEM_MAP diagnostic activation wording not found')

          old = "Coverage and history are evidence only and never activate slices."
          new = (
              "Coverage and history are evidence only for Support Worker and Customer Sales. For Service Admin, a "
              "governed same-feed count over 8 is the standing owner-approved LIVE trigger; 8 or below remains on "
              "rolling evidence."
          )
          if old in sm:
              sm = sm.replace(old, new, 1)
          elif new not in sm:
              raise SystemExit('SYSTEM_MAP coverage wording not found')

          old = (
              "The Service Admin LIVE set includes the six 19 August evidence-led regional activations: Buckinghamshire, "
              "Greater Manchester - South, Hertfordshire, Somerset, West Midlands - Birmingham & Solihull, and Yorkshire - East."
          )
          new = (
              "The Service Admin LIVE set is now **41 / 55 assessable England markets**. In addition to the six 19 August "
              "evidence-led activations, the 22 August >8 standing rule added 11 recovered markets: Cheshire - East, "
              "Cheshire - Warrington & Halton, Cornwall, Derbyshire, Greater Manchester - Wigan & Bolton, Leicestershire, "
              "Lincolnshire, Merseyside - Liverpool, Shropshire, Suffolk and West Midlands - Black Country."
          )
          if old in sm:
              sm = sm.replace(old, new, 1)
          elif new not in sm:
              raise SystemExit('SYSTEM_MAP Service Admin LIVE-set wording not found')

          audit_status_old = (
              "**Status:** First architecture audit complete; agreed cleanup 1–5 merged into `main` via PR #211. "
              "Teaching Vacancies review writeback resilience verified 22 August 2026."
          )
          audit_status_new = (
              "**Status:** First architecture audit complete; agreed cleanup 1–5 merged into `main` via PR #211. "
              "Teaching Vacancies writeback resilience, 55-market geography reconciliation and 11-market Service Admin "
              "expansion verified 22 August 2026."
          )
          if audit_status_old in audit:
              audit = audit.replace(audit_status_old, audit_status_new, 1)
          elif audit_status_new not in audit:
              raise SystemExit('SYSTEM_AUDIT status wording not found')

          geo_section = """
## Geography / regional expansion follow-up — 22 August 2026

The geography audit proved that the former **33-region England footprint was a configured operational subset, not complete national coverage**. The recurring assessable England universe is now explicitly stored in `pipeline/config/england_assessable_regions.json` as **55 markets**. `pipeline/geo/geo_lookup.xlsx` remains the factual location-routing authority; `pipeline/config/job_slice_catalog.json` is configured/public market metadata; and `pipeline/registers/region_category_slice_register.csv` remains the LIVE-state gate.

The full JobG8 daily process now assesses Service Admin, Support Worker and Customer Sales / Sales Advisor across all 55 markets and stores **165 market/family rows** plus rolling 14-feed history. The North East remains one public/assessment roll-up over its three underlying lookup regions, including Tees Valley.

The owner set a Service Admin-specific standing launch rule on 22 August: **a governed same-feed Service Admin count over 8 is immediate approval for LIVE; 8 or below remains NOT LIVE and is tracked**. Applying that rule to the recovered geography launched 11 additional Service Admin markets: Cheshire - East, Cheshire - Warrington & Halton, Cornwall, Derbyshire, Greater Manchester - Wigan & Bolton, Leicestershire, Lincolnshire, Merseyside - Liverpool, Shropshire, Suffolk and West Midlands - Black Country.

The launch reused the existing central catalog, slice register, production selector, configured-slice routes and verified publisher. It did not remove or rename any previously live URL. After the launch, the daily regional overview reconciled to **41 / 55 LIVE Service Admin markets** and numeric live counts for all 11 newly activated markets. Support Worker and Customer Sales retain their existing explicit-approval rules unless the owner changes them separately.

"""
          audit_anchor = "## Website / UX\n"
          if "## Geography / regional expansion follow-up — 22 August 2026" not in audit:
              if audit_anchor not in audit:
                  raise SystemExit('SYSTEM_AUDIT Website / UX anchor missing')
              audit = audit.replace(audit_anchor, geo_section + audit_anchor, 1)

          current_old = (
              "The cleanup changes are now part of `main`. The merged PR was deliberately scoped away from website/public-route changes, "
              "live job JSON changes, selection-rule rewrites and Google Indexing API changes."
          )
          current_new = (
              "The cleanup changes are part of `main`. Subsequent governed production changes now also include the complete 55-market "
              "England diagnostic geography and the 11 additional Service Admin LIVE markets approved under the 22 August >8 standing rule. "
              "No previously live public URL was removed or renamed by that expansion."
          )
          if current_old in audit:
              audit = audit.replace(current_old, current_new, 1)
          elif current_new not in audit:
              raise SystemExit('SYSTEM_AUDIT current-state wording not found')

          map_path.write_text(sm, encoding='utf-8')
          audit_path.write_text(audit, encoding='utf-8')
          PY

      - name: Commit docs and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-geo-governance-once.yml
          git add SYSTEM_MAP.md SYSTEM_AUDIT.md
          git commit -m "Sync geography governance after Service Admin expansion"
          git pull --rebase origin main
          git push origin HEAD:main

# trigger 2
