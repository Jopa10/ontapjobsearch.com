name: Recover 19 Aug Ontap review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-2026-08-19-review.yml'

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: python -m pip install --upgrade pip openpyxl boto3

      - name: Run archive restore date regression test
        run: PYTHONPATH=pipeline python -m unittest discover -s pipeline/tests -p 'test_jobg8_xml_adapter_feed_date.py' -v

      - name: Configure AWS credentials for archive proof
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::179402568934:role/OntapJobG8ArchiveGitHubRole
          aws-region: eu-west-2

      - name: Prove yesterday archive still resolves as yesterday
        run: |
          set -euo pipefail
          python - <<'PY'
          import boto3
          boto3.client('s3', region_name='eu-west-2').download_file(
              'ontap-jobg8-archive-179402568934-eu-west-2-an',
              'jobg8/raw/2026-08-18.zip',
              '/tmp/jobg8-2026-08-18.zip',
          )
          PY
          python pipeline/scripts/jobg8_xml_adapter.py \
            --zip /tmp/jobg8-2026-08-18.zip \
            --output /tmp/jobg8-2026-08-18.xlsx \
            --expected-min 5000 \
            --expected-max 20000
          PYTHONPATH=pipeline python - <<'PY'
          from pathlib import Path
          from scripts.pipeline_refinement import resolve_feed_date
          resolved = resolve_feed_date(Path('/tmp/jobg8-2026-08-18.xlsx'))
          print(f'Restored 18 Aug archive resolves to: {resolved}')
          if resolved != '2026-08-18':
              raise SystemExit(f'Archive replay date is still wrong: {resolved}')
          PY

      - name: Record archive proof
        run: |
          set -euo pipefail
          mkdir -p pipeline/reports-daily
          printf 'archive_restore_date_proof=success\narchive=jobg8/raw/2026-08-18.zip\nresolved_feed_date=2026-08-18\n' > pipeline/reports-daily/recovery-2026-08-19-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline/reports-daily/recovery-2026-08-19-status.txt
          git commit -m 'Confirm JobG8 archive replay date fix'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Refresh JobG8, Teaching Vacancies and master review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            workflow="$1"
            label="$2"
            started="$(date -u +%s)"
            echo "Dispatching $label ($workflow)"
            gh workflow run "$workflow" --ref main

            run_id=""
            for attempt in $(seq 1 40); do
              runs_json="$(gh run list --workflow "$workflow" --branch main --event workflow_dispatch --limit 10 --json databaseId,createdAt)"
              run_id="$(RUNS_JSON="$runs_json" STARTED="$started" python - <<'PY'
          import datetime as dt
          import json
          import os
          started = int(os.environ['STARTED'])
          rows = json.loads(os.environ['RUNS_JSON'])
          candidates = []
          for row in rows:
              created = dt.datetime.fromisoformat(row['createdAt'].replace('Z', '+00:00'))
              if int(created.timestamp()) >= started - 3:
                  candidates.append((created, row['databaseId']))
          if candidates:
              print(max(candidates)[1])
          PY
              )"
              if [ -n "$run_id" ]; then
                echo "Watching $label run $run_id"
                gh run watch "$run_id" --exit-status
                return 0
              fi
              sleep 3
            done
            echo "::error::Could not locate dispatched $label run"
            return 1
          }

          dispatch_and_wait run-full-jobg8-daily-process.yml 'JobG8 daily refresh'
          dispatch_and_wait run-teaching-vacancies-regional-review.yml 'Teaching Vacancies regional review'
          dispatch_and_wait ontap-daily-review.yml 'Ontap daily review'
