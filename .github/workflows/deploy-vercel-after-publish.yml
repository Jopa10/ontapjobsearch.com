name: Deploy Ontap production after publish

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  publish-from-neon:
    name: Publish from Neon with GitHub-file fallback
    uses: ./.github/workflows/publish-production-from-neon.yml
    with:
      confirm_production_publish: PUBLISH_FROM_NEON
    secrets: inherit

  report-production-health:
    name: Preserve publish receipt and update production health
    if: always()
    needs: publish-from-neon
    runs-on: ubuntu-latest
    steps:
      - name: Prepare the verified Production SHA artifact
        id: sha
        if: \${{ needs.publish-from-neon.result == 'success' }}
        env:
          VERIFIED_SHA: \${{ needs.publish-from-neon.outputs.verified_sha }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$VERIFIED_SHA" > "$RUNNER_TEMP/verified-production-sha.txt"

      - name: Upload verified Production SHA for downstream jobs
        id: upload_sha
        if: \${{ steps.sha.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: verified-production-sha
          path: \${{ runner.temp }}/verified-production-sha.txt
          retention-days: 7

      - name: Open or update stale-production issue
        if: \${{ always() && (needs.publish-from-neon.result != 'success' || steps.upload_sha.outcome != 'success') }}
        env:
          GH_TOKEN: \${{ github.token }}
          RUN_RESULT: \${{ needs.publish-from-neon.result }}
        run: |
          set -euo pipefail
          title="Ontap production deployment is stale"
          body="Production Neon publishing and its GitHub-file fallback did not complete successfully. Reusable workflow result: \${RUN_RESULT}. Workflow: \${GITHUB_SERVER_URL}/\${GITHUB_REPOSITORY}/actions/runs/\${GITHUB_RUN_ID}"

          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number,title \
            --jq '.[] | select(.title == "Ontap production deployment is stale") | .number' \
            | head -n 1)"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close stale-production issue after healthy deploy
        if: \${{ always() && needs.publish-from-neon.result == 'success' && steps.upload_sha.outcome == 'success' }}
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          title="Ontap production deployment is stale"

          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number,title \
            --jq '.[] | select(.title == "Ontap production deployment is stale") | .number' \
            | head -n 1)"

          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Production deployment verified healthy by run \${GITHUB_RUN_ID}."
          fi
