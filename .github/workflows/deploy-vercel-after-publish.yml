name: Deploy Ontap production after publish

on:
  workflow_run:
    workflows:
      - Publish verified pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  VERCEL_PROJECT_ID: prj_sLI0SohbF03NrRFj6yZyuN8mOOZB

jobs:
  deploy-production:
    name: Deploy and verify production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Capture expected production commit
        id: expected
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          expected_sha="$(git rev-parse origin/main)"
          echo "sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "Expected production commit: $expected_sha" >> "$GITHUB_STEP_SUMMARY"

      # NORMAL ROUTE:
      # Give Vercel's standard Git integration three minutes to deploy main.
      - name: Wait for normal Git deployment
        id: gitdeploy
        if: github.event_name != 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
        run: |
          set -euo pipefail

          production_url="https://www.ontapjobsearch.com/api/deployment-version"

          for attempt in $(seq 1 18); do
            body="$(curl --silent --show-error --fail \
              --header 'Cache-Control: no-cache' \
              "${production_url}?gitcheck=${GITHUB_RUN_ID}-${attempt}" || true)"

            deployed_sha="$(printf '%s' "$body" | python -c '
          import json, sys
          data = sys.stdin.read()
          print((json.loads(data).get("version") or "").strip() if data else "")
          ' 2>/dev/null || true)"

            if [ -n "$deployed_sha" ]; then
              git fetch origin main --quiet

              if [ "$deployed_sha" = "$EXPECTED_SHA" ]; then
                echo "caught_up=true" >> "$GITHUB_OUTPUT"
                echo "Normal Git deployment reached expected commit: $deployed_sha" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              if git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null && \
                 git merge-base --is-ancestor "$EXPECTED_SHA" "$deployed_sha"; then
                echo "caught_up=true" >> "$GITHUB_OUTPUT"
                echo "Normal Git deployment reached newer main commit: $deployed_sha" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi

            echo "Attempt $attempt/18: production ${deployed_sha:-unavailable}; waiting for Git deployment of $EXPECTED_SHA"
            sleep 10
          done

          echo "caught_up=false" >> "$GITHUB_OUTPUT"
          echo "Normal Git deployment did not catch up within 3 minutes." >> "$GITHUB_STEP_SUMMARY"

      # AUTOMATIC RUNS STOP HERE IF NORMAL GIT DEPLOYMENT FAILED.
      # They DO NOT perform a second Vercel deployment.
      - name: Flag stale automatic Git deployment
        if: >-
          github.event_name != 'workflow_dispatch' &&
          steps.gitdeploy.outputs.caught_up != 'true'
        run: |
          echo "::error::Normal Vercel Git deployment did not reach current main within 3 minutes."
          echo "Run this workflow manually if a Vercel CLI recovery deployment is required." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # MANUAL RECOVERY ROUTE ONLY:
      # Uses VERCEL_TOKEN to deploy current main directly.
      - name: Validate Vercel token for manual recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is missing."
            exit 1
          fi

      - name: Manual Vercel CLI recovery deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf .vercel
          output_file="$(mktemp)"

          if ! npx --yes vercel@latest deploy \
            --prod \
            --yes \
            --project="$VERCEL_PROJECT_ID" \
            --token="$VERCEL_TOKEN" \
            2>&1 | tee "$output_file"; then

            if grep -q 'api-deployments-free-per-day' "$output_file"; then
              echo "::error::Vercel Hobby deployment quota is exhausted (100 deployments in a rolling 24-hour window)."
            fi

            exit 1
          fi

      - name: Verify production after manual recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
        run: |
          set -euo pipefail

          production_url="https://www.ontapjobsearch.com/api/deployment-version"
          deployed_sha=""

          for attempt in $(seq 1 36); do
            body="$(curl --silent --show-error --fail \
              --header 'Cache-Control: no-cache' \
              "${production_url}?verify=${GITHUB_RUN_ID}-${attempt}" || true)"

            deployed_sha="$(printf '%s' "$body" | python -c '
          import json, sys
          data = sys.stdin.read()
          print((json.loads(data).get("version") or "").strip() if data else "")
          ' 2>/dev/null || true)"

            if [ -n "$deployed_sha" ]; then
              git fetch origin main --quiet

              if [ "$deployed_sha" = "$EXPECTED_SHA" ]; then
                echo "Production reached expected commit $deployed_sha." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              if git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null && \
                 git merge-base --is-ancestor "$EXPECTED_SHA" "$deployed_sha"; then
                echo "Production reached newer main commit $deployed_sha." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi

            echo "Attempt $attempt/36: production ${deployed_sha:-unavailable}; waiting for $EXPECTED_SHA"
            sleep 10
          done

          echo "::error::Production did not reach expected commit $EXPECTED_SHA within 6 minutes. Last reported version: ${deployed_sha:-unavailable}."
          exit 1

      - name: Open or update stale-production issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
        run: |
          set -euo pipefail

          title="Ontap production deployment is stale"
          body="Production deployment/verification failed. Expected production to contain commit ${EXPECTED_SHA:-unknown}. Automatic runs use normal Vercel Git deployment only; Vercel CLI recovery is manual-only. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number,title \
            --jq '.[] | select(.title == "Ontap production deployment is stale") | .number' \
            | head -n 1)"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body"
          fi

      - name: Close stale-production issue after healthy deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          title="Ontap production deployment is stale"

          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number,title \
            --jq '.[] | select(.title == "Ontap production deployment is stale") | .number' \
            | head -n 1)"

          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Production deployment verified healthy by run ${GITHUB_RUN_ID}."
          fi
