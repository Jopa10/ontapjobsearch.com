name: Build daily regional overview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pipeline/registers/region_category_slice_register.csv
      - pipeline/reports-daily/live-job-source-count-*.csv
      - pipeline/reports-daily/daily-family-coverage.csv
      - app/_city-pages/configured-slices/**/customer-sales-jobs.json
      - app/_city-pages/configured-slices/**/paralegal-jobs.json
      - app/_city-pages/configured-slices/**/marketing-jobs.json
      - app/_city-pages/configured-slices/**/hr-recruitment-jobs.json
      - pipeline/scripts/build_daily_region_overview.py
      - pipeline/scripts/assess_daily_family_coverage.py
      - pipeline/scripts/daily_family_coverage_history.py
      - pipeline/tests/test_build_daily_region_overview.py
      - .github/workflows/build-daily-region-overview.yml
  workflow_run:
    workflows:
      - Run full JobG8 daily process
      - Apply and publish Ontap daily review
    types:
      - completed

permissions:
  contents: write

jobs:
  build-overview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install overview dependencies
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Test canonical LIVE region rollups
        working-directory: pipeline
        run: python -m unittest tests.test_build_daily_region_overview -v

      - name: Build daily regional overview
        run: python pipeline/scripts/build_daily_region_overview.py

      - name: Apply same-feed 78-market family coverage
        working-directory: pipeline
        run: python -m scripts.assess_daily_family_coverage --apply-existing

      - name: Verify overview isolation
        run: |
          set -euo pipefail
          test -s pipeline/reports-daily/daily-region-overview.md
          test -s pipeline/reports-daily/daily-family-coverage.csv
          unexpected="$(git diff --name-only | grep -v '^pipeline/reports-daily/daily-region-overview.md$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Overview builder changed unexpected files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit overview to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/reports-daily/daily-region-overview.md
          if git diff --cached --quiet; then
            echo "No overview change to commit"
            exit 0
          fi
          git commit -m "Refresh daily regional overview"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Workflow summary
        run: |
          {
            echo "## Daily regional overview"
            echo
            sed -n '1,120p' pipeline/reports-daily/daily-region-overview.md
          } >> "$GITHUB_STEP_SUMMARY"
