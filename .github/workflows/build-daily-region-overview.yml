name: Build daily regional overview

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-daily-region-overview.yml'
      - 'pipeline/tests/test_build_daily_region_overview.py'
      - 'pipeline/scripts/verify_overview_production.py'
      - 'pipeline/scripts/build_verified_region_overview.py'
  workflow_dispatch:
    inputs:
      deployment_run_id:
        description: Successful Deploy Ontap production after publish run ID
        required: false
        type: string

concurrency:
  group: build-daily-regional-overview
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  build-overview:
    runs-on: ubuntu-latest

    steps:
      - name: Verify the referenced production deployment succeeded
        if: inputs.deployment_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view "$DEPLOYMENT_RUN_ID" --repo "$GH_REPO" --json name,headBranch,conclusion > "$RUNNER_TEMP/deployment-run.json"
          python - "$RUNNER_TEMP/deployment-run.json" <<'PY'
          import json
          import sys

          run = json.load(open(sys.argv[1], encoding="utf-8"))
          if run.get("name") != "Deploy Ontap production after publish":
              raise SystemExit("The supplied run is not Deploy Ontap production after publish.")
          if run.get("headBranch") != "main" or run.get("conclusion") != "success":
              raise SystemExit("The supplied production deployment did not succeed on main.")
          PY

      - name: Check out main to retrieve the deployment receipt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified production SHA
        if: inputs.deployment_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: verified-production-sha
          run-id: ${{ inputs.deployment_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/deployment

      - name: Test report controls on current main
        working-directory: pipeline
        run: |
          python -m pip install pandas openpyxl
          python -m unittest tests.test_verify_overview_production tests.test_build_daily_region_overview tests.test_export_daily_region_overview_xlsx -v

      - name: Verify live production and detect a missing overview
        id: deployed
        env:
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
        run: |
          set -euo pipefail
          cp pipeline/scripts/verify_overview_production.py "$RUNNER_TEMP/verify-overview-production.py"
          cp pipeline/scripts/build_verified_region_overview.py "$RUNNER_TEMP/build-verified-region-overview.py"
          args=()
          if [ -n "$DEPLOYMENT_RUN_ID" ]; then
            args+=(--receipt "$RUNNER_TEMP/deployment/verified-production-sha.txt")
          fi
          python "$RUNNER_TEMP/verify-overview-production.py" "${args[@]}" --output "$GITHUB_OUTPUT"

      - name: Check out the exact deployed source commit
        if: steps.deployed.outputs.rebuild == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deployed.outputs.sha }}
          fetch-depth: 0

      - name: Preserve latest saved report history
        if: steps.deployed.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          for path in pipeline/reports-daily/jobg8-feed-history.csv pipeline/reports-daily/daily-family-coverage-history.json; do
            git show "origin/main:$path" > "$path"
          done

      - name: Set up Python
        if: steps.deployed.outputs.rebuild == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install overview dependencies
        if: steps.deployed.outputs.rebuild == 'true'
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Set up Node for the public inventory generator
        if: steps.deployed.outputs.rebuild == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate the exact website inventory from the deployed source
        if: steps.deployed.outputs.rebuild == 'true'
        run: npm exec --yes --package=tsx -- tsx scripts/generate-search-index.ts

      - name: Build daily regional overview and record JobG8 history
        if: steps.deployed.outputs.rebuild == 'true'
        run: python "$RUNNER_TEMP/build-verified-region-overview.py"

      - name: Apply same-feed 78-market family coverage
        if: steps.deployed.outputs.rebuild == 'true'
        working-directory: pipeline
        run: python -m scripts.assess_daily_family_coverage --apply-existing

      - name: Record verified production provenance
        if: steps.deployed.outputs.rebuild == 'true'
        env:
          VERIFIED_SHA: ${{ steps.deployed.outputs.sha }}
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          report = Path("pipeline/reports-daily/daily-region-overview.md")
          text = report.read_text(encoding="utf-8")
          text = text.replace("# Ontap daily regional overview\n", "# Ontap daily regional overview\n\nProduction source commit: `" + os.environ["VERIFIED_SHA"] + "`\n", 1)
          report.write_text(text, encoding="utf-8")
          PYCODE

      - name: Export final daily regional overview workbook
        if: steps.deployed.outputs.rebuild == 'true'
        run: |
          python pipeline/scripts/export_daily_region_overview_xlsx.py \
            --markdown pipeline/reports-daily/daily-region-overview.md \
            --output pipeline/reports-daily/daily-region-overview.xlsx

      - name: Verify overview isolation and reconciliation
        if: steps.deployed.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          test -s pipeline/reports-daily/daily-region-overview.md
          test -s pipeline/reports-daily/daily-region-overview.xlsx
          test -s pipeline/reports-daily/daily-family-coverage.csv
          test -s pipeline/reports-daily/jobg8-feed-history.csv
          grep -Eq 'JobG8 feed reconciliation: (PASS|FAIL)' pipeline/reports-daily/daily-region-overview.md
          git restore -- generated/published-jobs-search.json
          unexpected="$(git diff --name-only | grep -Ev '^pipeline/reports-daily/(daily-region-overview\.(md|xlsx)|jobg8-feed-history\.csv|daily-family-coverage-history\.json|daily-family-coverage\.csv)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Overview builder changed unexpected files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit overview to main
        if: steps.deployed.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          python "$RUNNER_TEMP/verify-overview-production.py" --check-sha "${{ steps.deployed.outputs.sha }}"
          # Put only generated outputs onto current main; never rebase old website data.
          mkdir -p "$RUNNER_TEMP/overview-output"
          for path in pipeline/reports-daily/daily-region-overview.md pipeline/reports-daily/daily-region-overview.xlsx pipeline/reports-daily/jobg8-feed-history.csv pipeline/reports-daily/daily-family-coverage.csv pipeline/reports-daily/daily-family-coverage-history.json; do
            cp "$path" "$RUNNER_TEMP/overview-output/$(basename "$path")"
          done
          git reset --hard origin/main
          cp "$RUNNER_TEMP/overview-output/"* pipeline/reports-daily/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pipeline/reports-daily/daily-region-overview.md \
            pipeline/reports-daily/daily-region-overview.xlsx \
            pipeline/reports-daily/jobg8-feed-history.csv \
            pipeline/reports-daily/daily-family-coverage.csv \
            pipeline/reports-daily/daily-family-coverage-history.json
          if git diff --cached --quiet; then
            echo "No overview change to commit"
            exit 0
          fi
          git commit -m "Refresh daily regional overview"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail the run if the JobG8 feed did not reconcile
        if: steps.deployed.outputs.rebuild == 'true'
        run: |
          if grep -q 'JobG8 feed reconciliation: FAIL' pipeline/reports-daily/daily-region-overview.md; then
            echo "::error::JobG8 XML total does not match the summed Jobs received categories."
            exit 1
          fi

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Daily regional overview"
            echo
            sed -n '1,150p' pipeline/reports-daily/daily-region-overview.md
          } >> "$GITHUB_STEP_SUMMARY"
