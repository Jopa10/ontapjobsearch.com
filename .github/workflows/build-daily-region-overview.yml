name: Build daily regional overview

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish verified pages
    types:
      - completed

permissions:
  contents: write

jobs:
  build-overview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install family assessment packages
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Materialize current JobG8 feed
        env:
          JOBG8_FEED_URL: ${{ secrets.JOBG8_FEED_URL }}
        run: |
          set -euo pipefail
          : "${JOBG8_FEED_URL:?JOBG8_FEED_URL secret is not configured}"
          python pipeline/scripts/materialize_current_jobg8.py \
            --feed-url "$JOBG8_FEED_URL" \
            --zip "$RUNNER_TEMP/jobg8-overview.zip" \
            --output pipeline/input/jobg8.xlsx \
            --expected-min 5000 \
            --expected-max 20000

      - name: Build daily regional overview
        run: python pipeline/scripts/build_daily_region_overview.py

      - name: Assess Service Admin and Support Worker across all 33 regions
        working-directory: pipeline
        run: python -m scripts.assess_daily_family_coverage

      - name: Verify overview isolation
        run: |
          set -euo pipefail
          test -s pipeline/reports-daily/daily-region-overview.md
          test -s pipeline/reports-daily/daily-family-coverage.csv
          unexpected="$(git diff --name-only | awk '$0 != "pipeline/reports-daily/daily-region-overview.md" && $0 != "pipeline/reports-daily/daily-family-coverage.csv"')"
          if [ -n "$unexpected" ]; then
            echo "::error::Overview assessment changed unexpected files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit overview to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pipeline/reports-daily/daily-region-overview.md \
            pipeline/reports-daily/daily-family-coverage.csv
          if git diff --cached --quiet; then
            echo "No overview change to commit"
            exit 0
          fi
          git commit -m "Refresh daily regional overview"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Workflow summary
        run: |
          {
            echo "## Daily regional overview"
            echo
            sed -n '1,120p' pipeline/reports-daily/daily-region-overview.md
          } >> "$GITHUB_STEP_SUMMARY"
