name: Build daily regional overview

on:
  workflow_run:
    workflows:
      - Deploy Ontap production after publish
    types:
      - completed
    branches:
      - main

concurrency:
  group: build-daily-regional-overview
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  build-overview:
    if: >-
      github.event.workflow_run.name == 'Deploy Ontap production after publish' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main to retrieve the deployment receipt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified production SHA
        uses: actions/download-artifact@v4
        with:
          name: verified-production-sha
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/deployment

      - name: Read deployed source commit
        id: deployed
        run: |
          set -euo pipefail
          sha="$(cat "$RUNNER_TEMP/deployment/verified-production-sha.txt")"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deployment receipt does not contain a valid commit SHA."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Report source commit: $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the exact deployed source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deployed.outputs.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install overview dependencies
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Test regional overview and history exports
        working-directory: pipeline
        run: python -m unittest tests.test_build_daily_region_overview tests.test_export_daily_region_overview_xlsx -v

      - name: Build daily regional overview and record JobG8 history
        run: python pipeline/scripts/build_daily_region_overview.py

      - name: Apply same-feed 78-market family coverage
        working-directory: pipeline
        run: python -m scripts.assess_daily_family_coverage --apply-existing

      - name: Export final daily regional overview workbook
        run: |
          python pipeline/scripts/export_daily_region_overview_xlsx.py \
            --markdown pipeline/reports-daily/daily-region-overview.md \
            --output pipeline/reports-daily/daily-region-overview.xlsx

      - name: Verify overview isolation and reconciliation
        run: |
          set -euo pipefail
          test -s pipeline/reports-daily/daily-region-overview.md
          test -s pipeline/reports-daily/daily-region-overview.xlsx
          test -s pipeline/reports-daily/daily-family-coverage.csv
          test -s pipeline/reports-daily/jobg8-feed-history.csv
          grep -Eq 'JobG8 feed reconciliation: (PASS|FAIL)' pipeline/reports-daily/daily-region-overview.md
          unexpected="$(git diff --name-only | grep -Ev '^pipeline/reports-daily/(daily-region-overview\.(md|xlsx)|jobg8-feed-history\.csv|daily-family-coverage-history\.json|daily-family-coverage\.csv)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Overview builder changed unexpected files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit overview to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pipeline/reports-daily/daily-region-overview.md \
            pipeline/reports-daily/daily-region-overview.xlsx \
            pipeline/reports-daily/jobg8-feed-history.csv \
            pipeline/reports-daily/daily-family-coverage.csv \
            pipeline/reports-daily/daily-family-coverage-history.json
          if git diff --cached --quiet; then
            echo "No overview change to commit"
            exit 0
          fi
          git commit -m "Refresh daily regional overview"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail the run if the JobG8 feed did not reconcile
        run: |
          if grep -q 'JobG8 feed reconciliation: FAIL' pipeline/reports-daily/daily-region-overview.md; then
            echo "::error::JobG8 XML total does not match the summed Jobs received categories."
            exit 1
          fi

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Daily regional overview"
            echo
            sed -n '1,150p' pipeline/reports-daily/daily-region-overview.md
          } >> "$GITHUB_STEP_SUMMARY"
