name: Sync family discovery governance once

on:
  push:
    paths:
      - '.github/workflows/sync-family-discovery-governance-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update canonical governance
        run: |
          python - <<'PY'
          from pathlib import Path

          additions = {
              'SYSTEM_MAP.md': (
                  '- 23 August 2026 — **Reusable family discovery and Legal boundary refinement:** '
                  '`jobg8_family_discovery.py` is now family-neutral and 78-market aware; the shared discovery workflow auto-runs on governed family config, canonical UK geography and `geo_lookup.xlsx` changes. '
                  'It now also runs `jobg8_family_recurrence.py`, producing a complete 78-market LIKELY_IN/BORDERLINE spread report with descriptive 3+/6+/9+ evidence that never auto-activates a slice. '
                  '`jobg8_family_boundary_review.py` supports both legacy Claims diagnostics and reusable family-discovery outputs. '
                  'Legal Assistant / Paralegal passed the national scale gate and its first evidence-led boundary refinement removed generic claims/caseworker/case-handler noise, legal cashier/finance contamination and qualified-lawyer/specialist titles; observed Legal PA/support, conveyancing, probate and exact `Legal Asistant` source-typo variants are covered.\n'
                  '- 23 August 2026 — **Claims recurrence geography correction:** `jobg8_claims_slice_viability.py` now uses the canonical 78-market `uk_assessable_regions.json` universe and its exact detail roll-ups instead of the obsolete 33-region assumption. Claims remains discovery/diagnostic evidence only and is not LIVE.\n'
              ),
              'SYSTEM_OVERVIEW.md': (
                  '- 23 August 2026 — **New-family discovery is now reusable end-to-end through regional evidence.** Family config or canonical geo changes automatically rerun the shared discovery audit, which now follows national scale with a 78-market spread report. The 3+/6+/9+ figures are evidence only and never launch a slice. Legal Assistant / Paralegal clearly passed the scale gate; its boundary has been tightened to remove insurance claims, legal cashier/finance and qualified-lawyer noise while retaining genuine legal support/paralegal work.\n'
                  '- 23 August 2026 — Claims recurrence diagnostics now use the same canonical **78 UK markets** as other new-family assessment rather than the former 33-region assumption; Claims remains non-LIVE.\n'
              ),
          }
          for filename, bullets in additions.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              marker = bullets.split('\n', 1)[0]
              if marker not in text:
                  heading = '## Recent canonical changes\n\n'
                  if heading not in text:
                      raise SystemExit(f'Missing Recent canonical changes heading in {filename}')
                  path.write_text(text.replace(heading, heading + bullets, 1), encoding='utf-8')
          PY

      - name: Commit governance and remove helper
        run: |
          set -euo pipefail
          git add SYSTEM_MAP.md SYSTEM_OVERVIEW.md
          git rm .github/workflows/sync-family-discovery-governance-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Document reusable family discovery and Legal refinement'
          git pull --rebase origin main
          git push origin HEAD:main
