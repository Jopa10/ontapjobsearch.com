name: Trigger JobG8 recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-jobg8-recovery.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full JobG8 daily process
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-full-jobg8-daily-process.yml/dispatches" \
            --data '{"ref":"main"}'
