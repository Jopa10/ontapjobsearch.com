# One-shot owner-approved Legal launch materialization.
name: Materialize approved Legal live slices once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-legal-live-once.yml'
      - 'pipeline/scripts/legal_assistant_pipeline.py'
      - 'pipeline/config/job_slice_catalog.json'
      - 'pipeline/registers/region_category_slice_register.csv'

permissions:
  contents: write

concurrency:
  group: materialize-legal-live-once
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas openpyxl
      - name: Download current JobG8 feed
        env:
          JOBG8_FEED_URL: ${{ secrets.JOBG8_FEED_URL }}
        run: |
          set -euo pipefail
          : "${JOBG8_FEED_URL:?JOBG8_FEED_URL secret is not configured}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            --connect-timeout 30 --max-time 180 \
            "$JOBG8_FEED_URL" \
            --output "$RUNNER_TEMP/jobg8.zip"
          test -s "$RUNNER_TEMP/jobg8.zip"
      - name: Materialize current JobG8 input
        run: |
          set -euo pipefail
          rm -f pipeline/input/*.xlsx pipeline/input/*.xls pipeline/input/*.xlsm pipeline/input/*.csv
          python pipeline/scripts/jobg8_xml_adapter.py \
            --zip "$RUNNER_TEMP/jobg8.zip" \
            --output pipeline/input/jobg8.xlsx \
            --expected-min 5000 \
            --expected-max 20000
          test -s pipeline/input/jobg8.xlsx
      - name: Generate approved Legal slices
        working-directory: pipeline
        run: python -m scripts.legal_assistant_pipeline
      - name: Verify generated Legal slices
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          expected = ['london-paralegal.json','suffolk-paralegal.json','essex-paralegal.json','norfolk-paralegal.json']
          root = Path('pipeline/output-admin-service')
          for name in expected:
              path = root / name
              jobs = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(jobs, list) or not jobs:
                  raise SystemExit(f'Legal output empty/invalid: {path}')
              print(f'{name}: {len(jobs)}')
          PY
      - name: Update canonical governance for Legal launch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('pipeline/output-admin-service')
          counts = {
              'London': len(json.loads((root / 'london-paralegal.json').read_text(encoding='utf-8'))),
              'Suffolk': len(json.loads((root / 'suffolk-paralegal.json').read_text(encoding='utf-8'))),
              'Essex': len(json.loads((root / 'essex-paralegal.json').read_text(encoding='utf-8'))),
              'Norfolk': len(json.loads((root / 'norfolk-paralegal.json').read_text(encoding='utf-8'))),
          }
          count_text = ', '.join(f'{region} {count}' for region, count in counts.items())
          bullet = (
              '- 24 August 2026 — **Legal Assistant / Paralegal production launch:** after national discovery, boundary review, '
              'proof-region review and 78-market assessment, the owner explicitly approved **London, Suffolk, Essex and Norfolk** '
              f'as the first LIVE markets. Fresh launch counts are **{count_text}**. The registered route slug is `paralegal-jobs`; '
              '`pipeline/scripts/legal_assistant_pipeline.py` reuses the frozen >£50k/specialist/standalone-fee-earner boundary, '
              'content dedupe and canonical geography, and output is published through the existing configured-slice/verified-page '
              'mechanism. All other Legal markets remain non-LIVE until separately approved.\n'
          )

          for filename in ('SYSTEM_MAP.md', 'SYSTEM_OVERVIEW.md'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              marker = '## Recent canonical changes\n\n'
              if bullet not in text:
                  if marker not in text:
                      raise SystemExit(f'Missing recent-changes marker in {filename}')
                  text = text.replace(marker, marker + bullet, 1)
              if filename == 'SYSTEM_MAP.md':
                  text = text.replace(
                      'Customer Sales production launch, 78-market UK geography governance',
                      'Customer Sales and Legal Assistant / Paralegal production launches, 78-market UK geography governance',
                      1,
                  )
              else:
                  text = text.replace(
                      'Customer Sales production launch, 78-market UK geography governance',
                      'Customer Sales and Legal Assistant / Paralegal production launches, 78-market UK geography governance',
                      1,
                  )
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit generated Legal outputs and governance
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline/output-admin-service/*-paralegal.json SYSTEM_MAP.md SYSTEM_OVERVIEW.md
          if ! git diff --cached --quiet; then
            git commit -m 'Generate approved Legal slices and update governance'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish through configured verified-page mechanism
        run: python -m pipeline.scripts.publish_verified_pages_live_config
      - name: Commit Legal public data
        run: |
          set -euo pipefail
          git add \
            app/_city-pages/configured-slices/london/paralegal-jobs.json \
            app/_city-pages/configured-slices/suffolk/paralegal-jobs.json \
            app/_city-pages/configured-slices/essex/paralegal-jobs.json \
            app/_city-pages/configured-slices/norfolk/paralegal-jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish four approved Legal Assistant Paralegal slices'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
