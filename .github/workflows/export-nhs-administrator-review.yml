name: Export NHS three-family review

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nhs-inventory-poc
    paths:
      - .github/workflows/export-nhs-administrator-review.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Build deep review CSVs
        run: |
          python - <<'PY'
          import csv
          import re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          src = Path('pipeline/reviews/external/nhs-jobs-admin-clerical-review.csv')
          with src.open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))

          def norm(v):
              return re.sub(r'[^a-z0-9]+', ' ', (v or '').casefold()).strip()

          def family(title):
              t = norm(title)
              if 'medical secretary' in t:
                  return 'Medical Secretary'
              if 'receptionist' in t or 'reception assistant' in t:
                  return 'Reception'
              if 'administrator' in t:
                  earlier = (
                      'medical secretary','ward clerk','patient pathway','booking clerk',
                      'appointments clerk','appointment clerk','medical records','records clerk',
                      'receptionist','reception assistant','business support','team secretary',
                      'personal assistant','clerical officer','clerical assistant','support officer',
                      'data administrator','office administrator','office assistant',
                      'administrative assistant','admin assistant','administration assistant'
                  )
                  if not any(term in t for term in earlier):
                      return 'Administrator'
              return None

          selected = [(r, family(r.get('title',''))) for r in rows if r.get('final_decision') == 'HC']
          selected = [(r,f) for r,f in selected if f]
          counts = {}
          for _,f in selected:
              counts[f] = counts.get(f,0)+1
          assert counts == {'Administrator':185,'Reception':136,'Medical Secretary':94}, counts

          HEADERS = {'User-Agent': 'Mozilla/5.0 (compatible; OntapJobSearchReview/1.0)'}

          def clean_text(s):
              return re.sub(r'\s+', ' ', s or '').strip()

          def fetch_person_spec(row):
              url = row.get('source_url','')
              try:
                  resp = requests.get(url, headers=HEADERS, timeout=25)
                  resp.raise_for_status()
                  soup = BeautifulSoup(resp.text, 'html.parser')
                  main = soup.find('main') or soup
                  headings = main.find_all(['h2','h3','h4','h5'])
                  ps_start = next((h for h in headings if 'person specification' in norm(h.get_text(' ', strip=True))), None)
                  if not ps_start:
                      return {'fetch_status':'NO_PERSON_SPEC_HEADING','essential':'','desirable':''}
                  essential, desirable = [], []
                  mode = None
                  node = ps_start.find_next()
                  steps = 0
                  while node and steps < 700:
                      steps += 1
                      if getattr(node, 'name', None) == 'h2' and node is not ps_start:
                          txt = norm(node.get_text(' ', strip=True))
                          if txt and 'person specification' not in txt:
                              break
                      if getattr(node, 'name', None) in ['h3','h4','h5']:
                          txt = norm(node.get_text(' ', strip=True))
                          if txt == 'essential': mode = 'essential'
                          elif txt == 'desirable': mode = 'desirable'
                      elif getattr(node, 'name', None) == 'li' and mode:
                          txt = clean_text(node.get_text(' ', strip=True))
                          if txt:
                              (essential if mode == 'essential' else desirable).append(txt)
                      node = node.find_next()
                  def dedupe(items):
                      seen, result = set(), []
                      for x in items:
                          k = norm(x)
                          if k and k not in seen:
                              seen.add(k); result.append(x)
                      return result
                  return {'fetch_status':'OK','essential':' | '.join(dedupe(essential)),'desirable':' | '.join(dedupe(desirable))}
              except Exception as e:
                  return {'fetch_status':f'ERROR: {type(e).__name__}','essential':'','desirable':''}

          results = [None] * len(selected)
          with ThreadPoolExecutor(max_workers=10) as ex:
              futures = {ex.submit(fetch_person_spec, r): i for i,(r,_) in enumerate(selected)}
              for fut in as_completed(futures):
                  results[futures[fut]] = fut.result()

          sector_terms = (
              'nhs experience','experience within the nhs','experience in the nhs','experience working in the nhs',
              'working in the nhs','nhs environment','previous nhs','nhs administrative experience',
              'healthcare experience','health care experience','experience in healthcare','experience within healthcare',
              'healthcare setting','health care setting','clinical environment','clinical setting',
              'general practice experience','gp practice experience','primary care experience','primary care setting',
              'hospital experience','acute trust experience','previous healthcare','working within healthcare','working in healthcare'
          )
          system_terms = (
              'emis','systmone','system one','rio','cerner','epic','epr','electronic patient record',
              'patient administration system','pas system','nhs spine','choose and book','e referral','e referral service'
          )
          specialist_terms = (
              'medical terminology','clinical terminology','audio typing','medical transcription',
              'amspar','medical secretary qualification'
          )
          medsec_experience_terms = (
              'medical secretary experience','experience as a medical secretary','previous medical secretary',
              'medical secretarial experience','experience in a medical secretarial role','medical secretary role'
          )

          def hits(text, terms):
              padded = f' {norm(text)} '
              found = []
              for term in terms:
                  phrase = f' {norm(term)} '
                  if phrase in padded:
                      found.append(term)
              return found

          def classify(row, fam, ps):
              t = norm(row.get('title',''))
              ess = ps.get('essential','')
              des = ps.get('desirable','')
              if any(x in t for x in (' manager','manager ','head of','director','team leader','supervisor')) or t.startswith('manager'):
                  return 'HARD_PASS', 'Managerial/senior wording in title despite family match'
              if ps.get('fetch_status') != 'OK':
                  return 'POSS | MANUAL_CHECK', 'Person specification could not be reliably extracted'

              ess_sector = hits(ess, sector_terms)
              ess_system = hits(ess, system_terms)
              ess_special = hits(ess, specialist_terms)
              des_sector = hits(des, sector_terms)
              des_system = hits(des, system_terms)
              des_special = hits(des, specialist_terms)
              ess_medsec = hits(ess, medsec_experience_terms) if fam == 'Medical Secretary' else []
              des_medsec = hits(des, medsec_experience_terms) if fam == 'Medical Secretary' else []

              if ess_sector or ess_system or ess_medsec:
                  evidence = ', '.join((ess_sector + ess_system + ess_medsec)[:4])
                  return 'POSS | SECTOR_EXPERIENCED', f'Essential sector/prior-role/system requirement detected: {evidence}'
              if ess_special:
                  evidence = ', '.join(ess_special[:4])
                  return 'POSS | BRIDGEABLE', f'Essential specialist skill but not prior NHS/healthcare experience: {evidence}'
              if des_sector or des_system or des_special or des_medsec:
                  evidence = ', '.join((des_sector + des_system + des_special + des_medsec)[:4])
                  return 'HC | OPEN_SWITCH', f'NHS/healthcare/specialist experience appears desirable rather than essential: {evidence}'
              return 'HC | OPEN_SWITCH', 'No explicit essential NHS/healthcare/prior-role/system barrier found in extracted person specification'

          fields = [
              'review_no','family','title','employer','locations','salary_text','employment_type',
              'deep_classification','deep_reason','fetch_status','essential_requirements','desirable_requirements',
              'current_decision','job_reference','closing_date','source_url','manual_review'
          ]

          by_family = {'Administrator':[], 'Reception':[], 'Medical Secretary':[]}
          family_counts = {k:{} for k in by_family}
          for (r,fam),ps in zip(selected,results):
              label, reason = classify(r,fam,ps)
              family_counts[fam][label] = family_counts[fam].get(label,0)+1
              by_family[fam].append((r,ps,label,reason))

          files = {
              'Administrator':'nhs-administrator-review-deep.csv',
              'Reception':'nhs-reception-review-deep.csv',
              'Medical Secretary':'nhs-medical-secretary-review-deep.csv',
          }
          for fam, items in by_family.items():
              with Path(files[fam]).open('w', encoding='utf-8-sig', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  for i,(r,ps,label,reason) in enumerate(items,1):
                      w.writerow({
                          'review_no':i,'family':fam,'title':r.get('title',''),'employer':r.get('employer',''),
                          'locations':r.get('locations',''),'salary_text':r.get('salary_text',''),'employment_type':r.get('employment_type',''),
                          'deep_classification':label,'deep_reason':reason,'fetch_status':ps.get('fetch_status',''),
                          'essential_requirements':ps.get('essential',''),'desirable_requirements':ps.get('desirable',''),
                          'current_decision':r.get('final_decision',''),'job_reference':r.get('job_reference',''),
                          'closing_date':r.get('closing_date',''),'source_url':r.get('source_url',''),'manual_review':'PENDING'
                      })
              print(f'{fam}: {len(items)} rows')
              for k,v in sorted(family_counts[fam].items(), key=lambda kv:(-kv[1],kv[0])):
                  print(f'  {v}\t{k}')
          print('Fetch statuses:')
          fs={}
          for ps in results:
              fs[ps.get('fetch_status','')] = fs.get(ps.get('fetch_status',''),0)+1
          for k,v in sorted(fs.items(), key=lambda kv:(-kv[1],kv[0])):
              print(f'  {v}\t{k}')
          PY

      - name: Upload three-family review
        uses: actions/upload-artifact@v4
        with:
          name: nhs-three-family-deep-review
          path: |
            nhs-administrator-review-deep.csv
            nhs-reception-review-deep.csv
            nhs-medical-secretary-review-deep.csv
          if-no-files-found: error
