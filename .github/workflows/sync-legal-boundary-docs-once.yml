name: Sync Legal family boundary governance once

on:
  push:
    paths:
      - '.github/workflows/sync-legal-boundary-docs-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync canonical docs
        run: |
          python - <<'PY'
          from pathlib import Path

          inserts = {
            'SYSTEM_MAP.md': '- 23 August 2026 — **Legal Assistant / Paralegal boundary refinement:** owner-confirmed standalone conveyancing fee-earner roles are OUT of the family; explicit Team Leader titles are also OUT as management. Genuine paralegal roles remain eligible even where they manage files or a caseload, and mixed `Paralegal/Fee Earner` titles remain under advert-level review rather than being automatically rejected. Current content-unique evidence after the standalone fee-earner rule is 226 LIKELY_IN + 2 BORDERLINE (~227 genuine nationally); 120 active jobs are paralegal-titled, including 20 mixed Paralegal/Fee Earner titles.\n',
            'SYSTEM_OVERVIEW.md': '- 23 August 2026 — **Legal Assistant / Paralegal boundary is now materially cleaner:** standalone conveyancing fee-earners and Team Leader management roles are OUT; genuine paralegals remain eligible even when they manage files/caseloads, while mixed `Paralegal/Fee Earner` adverts stay under review. Current same-feed evidence remains comfortably viable at about 227 genuine jobs nationally, including 120 paralegal-titled roles.\n',
          }
          for name, bullet in inserts.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              marker = bullet.split('**')[1]
              if marker in text:
                  continue
              heading = '## Recent canonical changes\n\n'
              if heading not in text:
                  raise SystemExit(f'Missing Recent canonical changes heading in {name}')
              p.write_text(text.replace(heading, heading + bullet, 1), encoding='utf-8')
          PY
      - name: Commit docs and remove helper
        run: |
          set -euo pipefail
          git add SYSTEM_MAP.md SYSTEM_OVERVIEW.md
          git rm .github/workflows/sync-legal-boundary-docs-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Document Legal family boundary refinement'
          git pull --rebase origin main
          git push origin HEAD:main
