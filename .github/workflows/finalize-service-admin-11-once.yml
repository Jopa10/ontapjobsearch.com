# explicit trigger after workflow exists on main
name: Finalize 11-region Service Admin launch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-service-admin-11-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install overview dependencies
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Record Service Admin immediate-LIVE rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('SYSTEM_OVERVIEW.md')
          text = p.read_text(encoding='utf-8')
          marker = '- 22 August 2026 — The regional geography audit found that the old **33 regions were the configured operational footprint, not complete England coverage**.'
          new_bullet = ('- 22 August 2026 — **Service Admin standing launch rule:** a governed same-feed Service Admin count **over 8** is immediate owner approval to make that market LIVE. A count of 8 or below remains NOT LIVE and is tracked through the normal 55-market rolling family history; Module 2 may be used as historical/backfill evidence. This rule is Service Admin-specific unless the owner explicitly extends it to another family. Applying the rule to the recovered geography launched 11 markets: Cheshire - East, Cheshire - Warrington & Halton, Cornwall, Derbyshire, Greater Manchester - Wigan & Bolton, Leicestershire, Lincolnshire, Merseyside - Liverpool, Shropshire, Suffolk and West Midlands - Black Country.\n')
          if 'Service Admin standing launch rule' not in text:
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit('Could not locate geography audit bullet in SYSTEM_OVERVIEW.md')
              end = text.find('\n', pos)
              text = text[:end+1] + new_bullet + text[end+1:]
          old = 'Broad discovery regex/title buckets are evidence only; they are not publication rules. A positive regional count also does not activate a slice automatically.'
          new = ('Broad discovery regex/title buckets are evidence only; they are not publication rules. Positive counts do not generally activate a slice automatically. **Service Admin is the standing exception from 22 August 2026: a governed same-feed count over 8 is immediate owner approval for LIVE; 8 or below stays NOT LIVE and remains on rolling evidence.** Other families still require separate explicit approval unless the owner changes their rule.')
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild owner regional overview
        run: python pipeline/scripts/build_daily_region_overview.py

      - name: Apply current 55-market rolling evidence
        working-directory: pipeline
        run: python -m scripts.assess_daily_family_coverage --apply-existing

      - name: Verify 11 launch counts are resolved
        run: |
          set -euo pipefail
          for region in \
            'Cheshire - East' \
            'Cheshire - Warrington & Halton' \
            'Cornwall' \
            'Derbyshire' \
            'Greater Manchester - Wigan & Bolton' \
            'Leicestershire' \
            'Lincolnshire' \
            'Merseyside - Liverpool' \
            'Shropshire' \
            'Suffolk' \
            'West Midlands - Black Country'; do
            line="$(grep -F "| $region |" pipeline/reports-daily/daily-region-overview.md | head -1)"
            test -n "$line"
            if printf '%s' "$line" | grep -q 'CHECK'; then
              echo "::error::$region still shows CHECK"
              exit 1
            fi
          done
          grep -F '| Worcestershire | 8 / 8.0 / 1/1 |' pipeline/reports-daily/daily-region-overview.md

      - name: Remove this one-time workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-service-admin-11-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SYSTEM_OVERVIEW.md pipeline/reports-daily/daily-region-overview.md
          git commit -m 'Finalize 11-region Service Admin launch'
          git pull --rebase origin main
          git push origin HEAD:main
