name: Isolated Service Admin selection comparison — 29 October 50k
on:
  push:
    branches: [test/service-admin-selection-20261029]
    paths: ['pipeline/**', 'tests/**', '.github/workflows/test-jobg8-day2-50000.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-service-admin-selection-20261029
  cancel-in-progress: false
jobs:
  technical-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate captured input before dependency installation
        run: |
          python - <<'PYCODE'
          import json, pathlib, base64, lzma, hashlib, xml.etree.ElementTree as ET
          p=pathlib.Path('pipeline/second-day-50k'); i=json.loads((p/'feed-info.json').read_text())
          parts=sorted((p/'feed').glob('part-*'))
          assert len(parts)==i['chunks'] and i['account']==825072
          assert i['date_time'][:3]==[2026,10,29]
          raw=lzma.decompress(base64.b64decode(''.join(x.read_text() for x in parts)))
          assert hashlib.sha256(raw).hexdigest()==i['xml_sha256']
          assert len(ET.fromstring(raw).findall('Job'))==50000
          print('PREFLIGHT PASS: fresh 29 October test feed, hash and 50,000 rows verified')
          PYCODE
      - name: Install dependencies
        run: |
          python -m pip install pandas openpyxl boto3 pytest
          npm ci
      - name: Check final-code regression tests
        run: |
          PYTHONPATH=pipeline python -m pytest pipeline/tests/test_materialize_current_jobg8.py pipeline/tests/test_materialize_jobg8_archive_month.py pipeline/tests/test_jobg8_xml_adapter_feed_date.py tests/test_enrich_job_metadata.py pipeline/tests/test_north_east_review_routing.py pipeline/tests/test_review_hub.py -q
      - name: Download immutable successful baseline
        uses: actions/download-artifact@v4
        with:
          name: jobg8-fresh-50k-2026-10-29-results
          run-id: 40848659957
          github-token: ${{ github.token }}
          path: .selection-baseline
      - name: Verify agreed selector changes
        run: PYTHONPATH=.:pipeline python -m pytest pipeline/tests/test_service_admin_audit_changes.py pipeline/tests/test_review_queue_missing_pay.py pipeline/tests/test_service_admin_owner_selection_rules.py pipeline/tests/test_salary_description_fallback.py tests/test_service_admin_geography_guard.py -q
      - name: Fresh feed processing, isolated publication, regional overview and full build
        run: python -u pipeline/second-day-50k/run.py
      - name: Compare the exact same feed against the saved baseline
        run: python pipeline/second-day-50k/compare_selection.py
      - name: Save persistent results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-admin-selection-50k-2026-10-29-results
          path: |
            test-results/*.json
            test-results/*.log
            test-results/selection-*
            test-results/verified.zip
            test-results/fresh-jobg8.xlsx
            test-results/reviewed-plan.json
            test-results/daily-region-overview-50k-2026-10-29.*
            test-results/preview-snapshot.tar.gz
            pipeline/reviews/daily/ontap-daily-review.md
          retention-days: 14
      - name: Record status
        if: always()
        run: |
          echo '## Isolated fresh 50k test — production unchanged' >> "$GITHUB_STEP_SUMMARY"
          echo 'No deployment, main write, feed switch or email. See retained artifact and receipt.' >> "$GITHUB_STEP_SUMMARY"
          if test -f test-results/receipt.json; then cat test-results/receipt.json >> "$GITHUB_STEP_SUMMARY"; fi
