name: Isolated Neon JobG8 shadow tests
on:
  push:
    branches: [feat/neon-shadow-database]
    paths: [database/shadow/stage-request.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ontap-neon-shadow-staged-test
  cancel-in-progress: false
jobs:
  staged-test:
    if: github.ref == 'refs/heads/feat/neon-shadow-database'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            database/shadow
            pipeline/scripts
            pipeline/config
            pipeline/geo
            pipeline/lookup
            pipeline/registers
            pipeline/reviews
            pipeline/module3
            pipeline/city_pages
            pipeline/manifests
            pipeline/external_sources
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve isolated request mode
        id: request
        run: |
          python - <<'PYMODE'
          import json, os, re
          from pathlib import Path
          request=json.loads(Path('database/shadow/stage-request.json').read_text())
          mode=request.get('mode','source')
          if mode not in {'source','selection_parity','fresh_selection_parity','published_snapshot'}:
              raise SystemExit('Unknown shadow test mode')
          archive_date=request.get('archiveDate','')
          reuse_run=request.get('reuseEvidenceRunId')
          reuse_artifact=request.get('reuseEvidenceArtifactId')
          if mode == 'fresh_selection_parity' and not re.fullmatch(r'20[0-9]{2}-[0-9]{2}-[0-9]{2}', archive_date):
              raise SystemExit('Fresh selector mode requires a valid archiveDate')
          if (reuse_run is None) != (reuse_artifact is None):
              raise SystemExit('Evidence reuse requires both a run ID and artifact ID')
          if reuse_run is not None and (not isinstance(reuse_run,int) or not isinstance(reuse_artifact,int)):
              raise SystemExit('Evidence reuse IDs must be integers')
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write('mode='+mode+chr(10))
              if mode in {'fresh_selection_parity','published_snapshot'}:
                  handle.write('archive_date='+archive_date+chr(10))
              if mode == 'published_snapshot':
                  date=request.get('archiveDate','')
                  artifacts=request.get('publishedOutputArtifacts')
                  values={
                    'published_run_id':request.get('publishedOutputRunId'),
                    'expected_json_files':request.get('expectedOutputJsonFiles'),
                    'expected_jobg8_rows':request.get('expectedJobG8Rows'),
                    'expected_unique_ids':request.get('expectedUniqueJobG8Ids'),
                    'production_app_commit_sha':request.get('productionAppCommitSha'),
                    'production_app_snapshot_at':request.get('productionAppSnapshotAt'),
                  }
                  if not re.fullmatch(r'20\d\d-\d\d-\d\d',date):
                      raise SystemExit('Published snapshot requires a valid archiveDate')
                  if not isinstance(values['published_run_id'],int) or values['published_run_id']<=0:
                      raise SystemExit('Published snapshot requires a positive applied-output run ID')
                  if any(not isinstance(values[k],int) or values[k]<=0 for k in ('expected_json_files','expected_jobg8_rows','expected_unique_ids')):
                      raise SystemExit('Published snapshot requires positive file and row counts')
                  if not isinstance(artifacts,list) or len(artifacts)!=2:
                      raise SystemExit('Published snapshot requires both applied output artifacts')
                  names={a.get('name') for a in artifacts if isinstance(a,dict)}
                  if names!={'applied-service-admin-output','applied-support-worker-output'}:
                      raise SystemExit('Published snapshot artifact names do not match Wednesday outputs')
                  if any(not isinstance(a.get('id'),int) or a['id']<=0 or not re.fullmatch(r'[a-f0-9]{64}',a.get('sha256','')) for a in artifacts):
                      raise SystemExit('Published snapshot artifact IDs or digests are invalid')
                  if len({a['id'] for a in artifacts})!=2:
                      raise SystemExit('Published snapshot artifact IDs must be distinct')
                  if not re.fullmatch(r'[a-f0-9]{40}',values['production_app_commit_sha'] or ''):
                      raise SystemExit('Published snapshot requires the exact final app commit SHA')
                  try:
                      from datetime import datetime
                      datetime.fromisoformat(values['production_app_snapshot_at'].replace('Z','+00:00'))
                  except (TypeError,ValueError):
                      raise SystemExit('Published snapshot requires a valid final app snapshot time')
                  primary=next(a for a in artifacts if a['name']=='applied-service-admin-output')
                  handle.write(f"published_run_id={values['published_run_id']}\n")
                  handle.write(f"published_artifact_id={primary['id']}\n")
                  handle.write(f"published_artifact_ids={','.join(str(a['id']) for a in artifacts)}\n")
                  handle.write(f"artifact_sha256={primary['sha256']}\n")
                  handle.write(f"source_artifacts_json={json.dumps(artifacts,separators=(',',':'))}\n")
                  handle.write(f"production_app_commit_sha={values['production_app_commit_sha']}\n")
                  handle.write(f"production_app_snapshot_at={values['production_app_snapshot_at']}\n")
                  handle.write(f"expected_json_files={values['expected_json_files']}\nexpected_jobg8_rows={values['expected_jobg8_rows']}\n")
                  handle.write(f"expected_unique_ids={values['expected_unique_ids']}\n")              if reuse_run is not None:
                  handle.write(f'reuse_run_id={reuse_run}\nreuse_artifact_id={reuse_artifact}\n')
          PYMODE
      - name: Restore exact selector evidence from prior run
        if: steps.request.outputs.reuse_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.request.outputs.reuse_artifact_id }}
          run-id: ${{ steps.request.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/selector-parity
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.request.outputs.mode == 'selection_parity' || steps.request.outputs.mode == 'fresh_selection_parity'
        with:
          python-version: '3.12'
      - name: Restore the original pinned snapshot
        if: steps.request.outputs.mode == 'selection_parity'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13168067903'
          run-id: '41500434597'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pinned-source
          merge-multiple: true
      - name: Fetch the owner-pinned dated saved source
        if: steps.request.outputs.mode == 'fresh_selection_parity' && steps.request.outputs.reuse_run_id == ''
        env:
          ONTAP_SAVED_FEED_URL: ${{ secrets.ONTAP_SAVED_FEED_URL }}
        run: |
          set -euo pipefail
          test -n "$ONTAP_SAVED_FEED_URL"
          saved_feed_url="$(printf '%s' "$ONTAP_SAVED_FEED_URL" | tr -d '[:space:]')"
          case "$saved_feed_url" in
            https://*) ;;
            *) echo "::error::ONTAP_SAVED_FEED_URL must be the complete HTTPS URL."; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/pinned-source"
          archive_date="${{ steps.request.outputs.archive_date }}"
          archive_path="$RUNNER_TEMP/pinned-source/jobg8-raw-${archive_date}.zip"
          response_path="$RUNNER_TEMP/pinned-source/download-response.xml"
          http_code="$(curl --silent --show-error --location --connect-timeout 30 --max-time 180 \
            --write-out '%{http_code}' "$saved_feed_url" --output "$response_path")"
          if [ "$http_code" != "200" ]; then
            python - "$response_path" "$http_code" <<'PYERROR'
          import sys
          import xml.etree.ElementTree as ET
          path, status = sys.argv[1:]
          try:
              root = ET.parse(path).getroot()
              fields = {node.tag.rsplit('}', 1)[-1]: (node.text or '') for node in root.iter()}
              code = fields.get('Code', 'unknown')
              message = fields.get('Message', 'no S3 error message returned')
          except (ET.ParseError, OSError):
              code, message = 'unavailable', 'response was not an S3 XML error'
          print(f'Saved source request failed: HTTP {status}; S3 code {code}; {message}')
          PYERROR
            exit 1
          fi
          mv "$response_path" "$archive_path"
          test -s "$archive_path"
      - name: Resolve same-date production output artifacts and report references
        id: production-reference
        if: steps.request.outputs.mode == 'fresh_selection_parity' && steps.request.outputs.reuse_run_id == ''
        run: |
          python - "${{ steps.request.outputs.archive_date }}" <<'PYREF'
          import json, os, sys
          from pathlib import Path
          day=sys.argv[1]
          path=Path(f'database/shadow/published-inventory-reconciliation-checkpoint-{day}.json')
          if not path.is_file(): raise SystemExit(f'Missing date-matched publication checkpoint: {path}')
          checkpoint=json.loads(path.read_text())
          parity=checkpoint.get('nov10SameFeedSelectorVsPostgresComparison',{})
          report=parity.get('dailyCategoryReport',{})
          if report.get('feedDate')!=day: raise SystemExit('Production category report date mismatch')
          admin=report.get('administration',{}).get('publishedCount')
          all_jobg8=report.get('allJobG8',{}).get('publishedCount')
          publication=checkpoint.get('tuesdayPublicationEvidence',{})
          runs=[r for r in publication.get('workflows',[]) if r.get('name')=='Run full JobG8 daily process' and r.get('conclusion')=='success']
          if len(runs)!=1 or publication.get('date')!=day: raise SystemExit('Missing or ambiguous same-date production JobG8 run')
          artifacts={a.get('name'):a.get('id') for a in runs[0].get('artifacts',[])}
          ids=[artifacts.get('service-admin-output'),artifacts.get('support-worker-output')]
          if not all(isinstance(x,int) for x in ids): raise SystemExit('Missing same-run per-ID production output artifacts')
          if not isinstance(admin,int) or not isinstance(all_jobg8,int): raise SystemExit('Missing date-matched category report references')
          out=Path(os.environ['RUNNER_TEMP'])/'production-reference.json'
          out.write_text(json.dumps({'feedDate':day,'productionWorkflowRunId':runs[0]['runId'],'artifactIds':ids,
            'administrationClassifiedPublishedIds':admin,'allJobG8PublishedIds':all_jobg8},indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write(f"run_id={runs[0]['runId']}\nartifact_ids={','.join(map(str,ids))}\n")
          PYREF
      - name: Download same-date production family outputs
        if: steps.request.outputs.mode == 'fresh_selection_parity' && steps.request.outputs.reuse_run_id == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.production-reference.outputs.artifact_ids }}
          run-id: ${{ steps.production-reference.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/production-output
          merge-multiple: true
      - name: Verify selection observer and attachment guards
        if: (steps.request.outputs.mode == 'selection_parity' || steps.request.outputs.mode == 'fresh_selection_parity') && steps.request.outputs.reuse_run_id == ''
        run: |
          python -m pip install pandas openpyxl
          python database/shadow/test_selector_capture.py
          python -m unittest discover -s database/shadow -p test_fresh_source_request.py
          python -m unittest discover -s database/shadow -p test_dependency_provenance.py
          npm ci --ignore-scripts --prefix database/shadow/harness
          node --test database/shadow/harness/selection-importer.test.mjs database/shadow/harness/dependency-provenance.test.mjs
      - name: Replay unchanged production selectors and record their decisions
        if: (steps.request.outputs.mode == 'selection_parity' || steps.request.outputs.mode == 'fresh_selection_parity') && steps.request.outputs.reuse_run_id == ''
        run: |
          if [ "${{ steps.request.outputs.mode }}" = "fresh_selection_parity" ]; then
            archive_date="${{ steps.request.outputs.archive_date }}"
            archive_path="$RUNNER_TEMP/pinned-source/jobg8-raw-${archive_date}.zip"
            source_request="database/shadow/fresh-integration-prep-checkpoint-${archive_date}.json"
            test -s "$archive_path"
            python -u database/shadow/run_selector_parity.py \
              --archive "$archive_path" \
              --source-request "$source_request" \
              --work "$RUNNER_TEMP/selector-parity"
          else
            python -u database/shadow/run_selector_parity.py \
              --archive "$RUNNER_TEMP/pinned-source/ontap-shadow-feed.zip" \
              --work "$RUNNER_TEMP/selector-parity"
          fi
      - name: Build dated per-ID selector manifest
        if: (steps.request.outputs.mode == 'selection_parity' || steps.request.outputs.mode == 'fresh_selection_parity') && steps.request.outputs.reuse_run_id == ''
        run: |
          python database/shadow/build_per_id_manifest.py \
            --work "$RUNNER_TEMP/selector-parity" \
            --output "$RUNNER_TEMP/selector-parity/per-id-manifest.json"
      - name: Prepare same-run full raw snapshot for Preview writeback
        if: steps.request.outputs.mode == 'fresh_selection_parity' && steps.request.outputs.reuse_run_id == ''
        run: |
          set -euo pipefail
          archive_date="${{ steps.request.outputs.archive_date }}"
          archive_path="$RUNNER_TEMP/pinned-source/jobg8-raw-${archive_date}.zip"
          python - "$RUNNER_TEMP/selector-parity/report.json" "$RUNNER_TEMP/selector-parity/raw-stage-request.json" <<'PYREQUEST'
          import json, sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text())
          request={
            'archiveDate': report['archiveDate'],
            'sourceRevision': report['rulesRevision'],
            'maximumDatabaseBytes': 838860800,
          }
          Path(sys.argv[2]).write_text(json.dumps(request, indent=2)+'\n')
          PYREQUEST
          python database/shadow/prepare_raw_stage.py \
            --archive "$archive_path" \
            --request "$RUNNER_TEMP/selector-parity/raw-stage-request.json" \
            --percentage 100 \
            --output "$RUNNER_TEMP/selector-parity/raw-stage.json.gz"
          python - "$RUNNER_TEMP/selector-parity" <<'PYEVIDENCE'
          import gzip, hashlib, json, sys
          from pathlib import Path
          work=Path(sys.argv[1])
          report=json.loads((work/'report.json').read_text())
          selection=json.loads(gzip.open(work/'selection.json.gz','rt',encoding='utf-8').read())
          outputs=json.loads((work/'plain/outputs.json').read_text())
          hash_file=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          admin_ids={str(row['job_id']) for key, rows in outputs.items() if key.startswith('admin_service:') for row in rows}
          bundle={
            'schemaVersion': 1,
            'mode': 'fresh_selection_neon',
            'feedDate': report['archiveDate'],
            'archiveSha256': report['archiveSha256'],
            'selectorRevision': report['rulesRevision'],
            'fixtureSha256': hash_file(work/'selection.json.gz'),
            'rawStageSha256': hash_file(work/'raw-stage.json.gz'),
            'outputsSha256': hash_file(work/'plain/outputs.json'),
            'feedCategoryMapSha256': hash_file(work/'feed-category-map.json'),
            'pythonOutputsContentSha256': report['outputsSha256'],
            'automatedDecisions': len(selection['decisions']),
            'adminServiceFamilyOutputUniqueIds': len(admin_ids),
            'neonReadback': 'pending_preview_run',
          }
          (work/'neon-writeback-request.json').write_text(json.dumps(bundle,indent=2)+'\n')
          PYEVIDENCE
          python - "$RUNNER_TEMP/production-output" "$RUNNER_TEMP/production-reference.json" "$RUNNER_TEMP/selector-parity/production-outputs.json" <<'PYOUTPUTS'
          import json, sys
          from pathlib import Path
          scripts=Path('pipeline/scripts').resolve()
          sys.path.insert(0,str(scripts))
          from slice_registry import live_slices
          from slice_catalog import output_filename
          source=Path(sys.argv[1]); reference=json.loads(Path(sys.argv[2]).read_text())
          outputs={}
          expected=set()
          for region,family in sorted(live_slices()):
              name=output_filename(region,family); expected.add(name)
              path=source/name
              if not path.is_file(): raise SystemExit(f'Missing date-matched production output: {name}')
              rows=json.loads(path.read_text(encoding='utf-8-sig'))
              if not isinstance(rows,list): raise SystemExit(f'Production output is not a list: {name}')
              outputs[f'{family}:{region}']=[str(row['job_id']) for row in rows if row.get('source')=='JobG8' and row.get('job_id')]
          actual={p.name for p in source.glob('*.json')}
          if actual!=expected: raise SystemExit(f'Production output scope/file set differs: expected {len(expected)}, got {len(actual)}')
          if reference['feedDate']!="${{ steps.request.outputs.archive_date }}": raise SystemExit('Production output feed date mismatch')
          Path(sys.argv[3]).write_text(json.dumps(outputs,separators=(',',':'))+'\n')
          PYOUTPUTS
          cp "$RUNNER_TEMP/production-reference.json" "$RUNNER_TEMP/selector-parity/production-reference.json"
          python - "$RUNNER_TEMP/selector-parity" <<'PYHASH'
          import hashlib, json, sys
          from pathlib import Path
          work=Path(sys.argv[1]); path=work/'neon-writeback-request.json'
          request=json.loads(path.read_text())
          for field, filename in [('productionOutputsSha256','production-outputs.json'),
                                  ('productionReferenceSha256','production-reference.json'),
                                  ('feedCategoryMapSha256','feed-category-map.json')]:
              request[field]=hashlib.sha256((work/filename).read_bytes()).hexdigest()
          path.write_text(json.dumps(request,indent=2)+'\n')
          PYHASH
      - name: Download both exact 11 November applied outputs
        if: steps.request.outputs.mode == 'published_snapshot'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.request.outputs.published_artifact_ids }}
          run-id: ${{ steps.request.outputs.published_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published-output
      - name: Build compact published-job projection
        if: steps.request.outputs.mode == 'published_snapshot'
        run: |
          python database/shadow/prepare_published_output_snapshot.py \
            --input "$RUNNER_TEMP/published-output" \
            --date "${{ steps.request.outputs.archive_date }}" \
            --production-run-id "${{ steps.request.outputs.published_run_id }}" \
            --artifact-id "${{ steps.request.outputs.published_artifact_id }}" \
            --source-artifacts-json '${{ steps.request.outputs.source_artifacts_json }}' \
            --production-app-commit-sha "${{ steps.request.outputs.production_app_commit_sha }}" \
            --production-app-snapshot-at "${{ steps.request.outputs.production_app_snapshot_at }}" \
            --expected-json-files "${{ steps.request.outputs.expected_json_files }}" \
            --expected-jobg8-rows "${{ steps.request.outputs.expected_jobg8_rows }}" \
            --expected-unique-jobg8-ids "${{ steps.request.outputs.expected_unique_ids }}" \
            --archive-sha256 "${{ steps.request.outputs.artifact_sha256 }}" \
            --output "$RUNNER_TEMP/published-snapshot.json"
      - name: Package compact snapshot for isolated Neon Preview
        if: steps.request.outputs.mode == 'published_snapshot'
        run: |
          python - "$RUNNER_TEMP/published-snapshot.json" "$RUNNER_TEMP/source-download.json" database/shadow/harness <<'PYPACK'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          snapshot_path,source_path,harness=map(Path,sys.argv[1:])
          snapshot_bytes=snapshot_path.read_bytes()
          snapshot=json.loads(snapshot_bytes)
          source={
            'mode':'published_snapshot',
            'feedDate':snapshot['feedDate'],
            'productionWorkflowRunId':snapshot['productionWorkflowRunId'],
            'productionArtifactId':snapshot['productionArtifactId'],
            'productionArtifactSha256':snapshot['productionArtifactSha256'],
            'productionArtifacts':snapshot['productionArtifacts'],
            'productionAppCommitSha':snapshot['productionAppCommitSha'],
            'productionAppSnapshotAt':snapshot['productionAppSnapshotAt'],
            'expectedJobG8Rows':snapshot['jobg8OutputRows'],
            'expectedUniqueJobG8Ids':snapshot['uniqueJobG8Ids'],
            'snapshotSha256':hashlib.sha256(snapshot_bytes).hexdigest(),
            'localArtifact':'source-artifact.zip',
          }
          source_path.write_text(json.dumps(source,indent=2)+'\n')
          with zipfile.ZipFile(harness/'source-artifact.zip','w',compression=zipfile.ZIP_DEFLATED) as archive:
              archive.writestr('published-snapshot.json',snapshot_bytes)
          (harness/'source-download.json').write_text(json.dumps(source,indent=2)+'\n')
      - name: Checkout final Wednesday published app JSON
        if: steps.request.outputs.mode == 'published_snapshot'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.request.outputs.production_app_commit_sha }}
          path: production-final
          persist-credentials: false
          sparse-checkout: |
            app
            pipeline/scripts/live_job_source_counter.py
          sparse-checkout-cone-mode: false
      - name: Compare snapshot IDs with final published app IDs
        if: steps.request.outputs.mode == 'published_snapshot'
        run: |
          python - "$RUNNER_TEMP/published-snapshot.json" "$RUNNER_TEMP/published-final-id-comparison.json" <<'PYCOMPARE'
          import importlib.util,json,sys
          from datetime import date,datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          snapshot_path,report_path=map(Path,sys.argv[1:])
          snapshot=json.loads(snapshot_path.read_text())
          counter_path=Path('production-final/pipeline/scripts/live_job_source_counter.py')
          spec=importlib.util.spec_from_file_location('live_job_source_counter',counter_path)
          counter=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(counter)
          snapshot_time=datetime.fromisoformat(snapshot['productionAppSnapshotAt'].replace('Z','+00:00')).astimezone(ZoneInfo('Europe/London'))
          inventory=counter.collect_live_inventory(
              Path('production-final/app'),
              as_of=date.fromisoformat(snapshot['feedDate']),
              now=snapshot_time,
          )
          final_ids=sorted(job.job_id for job in inventory.jobs if job.source=='JobG8')
          snapshot_ids=sorted(row['job_id'] for row in snapshot['records'])
          final_set=set(final_ids)
          snapshot_set=set(snapshot_ids)
          report={
            'status':'passed' if final_set==snapshot_set else 'failed',
            'feedDate':snapshot['feedDate'],
            'productionAppCommitSha':snapshot['productionAppCommitSha'],
            'productionAppSnapshotAt':snapshot['productionAppSnapshotAt'],
            'counterAppJsonFiles':inventory.job_json_files,
            'counterJobG8Ids':len(final_ids),
            'snapshotJobG8Ids':len(snapshot_ids),
            'onlyInSnapshot':sorted(snapshot_set-final_set),
            'onlyInFinalPublishedApp':sorted(final_set-snapshot_set),
            'finalPublishedJobG8Ids':final_ids,
          }
          report_path.write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k not in ('onlyInSnapshot','onlyInFinalPublishedApp','finalPublishedJobG8Ids')}))
          if final_set!=snapshot_set:
              raise SystemExit('Applied outputs do not match final published app JobG8 IDs')
          PYCOMPARE
      - name: Store and verify published jobs in isolated Neon Preview
        if: steps.request.outputs.mode == 'published_snapshot'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_sLI0SohbF03NrRFj6yZyuN8mOOZB
          VERCEL_ORG_ID: team_xjm8VOa1951ZXxawa7UFF2gd
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          harness="database/shadow/harness"
          npm ci --omit=dev --ignore-scripts --prefix "$harness"
          cli_dir="$RUNNER_TEMP/vercel-cli"
          npm install --prefix "$cli_dir" --no-save --ignore-scripts --no-audit --no-fund vercel@65.14.0
          cd "$harness"
          deploy_log="$RUNNER_TEMP/vercel-published-preview-deploy.log"
          "$cli_dir/node_modules/.bin/vercel" deploy --yes --token="$VERCEL_TOKEN" --scope ontap1 2>&1 | tee "$deploy_log"
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$deploy_log" | tail -n 1)"
          test -n "$deployment_url"
          "$cli_dir/node_modules/.bin/vercel" curl /published-readback-report.json --deployment "$deployment_url" --scope ontap1 > "$RUNNER_TEMP/published-readback-report.json"
