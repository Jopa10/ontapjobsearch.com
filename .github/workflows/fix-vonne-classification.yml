name: Correct VONNE hard-pass precedence

on:
  pull_request:
    paths:
      - ".github/workflows/fix-vonne-classification.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/vonne-review-only-poc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply classification-order correction
        env:
          INSERTION_B64: ""
          TEST_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          module = Path("pipeline/external_sources/vonne_poc.py")
          text = module.read_text(encoding="utf-8")
          needle = "    if vacancy.geography_status in {\n"
          insertion = base64.b64decode(
              os.environ["INSERTION_B64"]
          ).decode("utf-8")
          if needle not in text:
              raise SystemExit("classification insertion point not found")
          if "hard_title_hits = [" not in text:
              text = text.replace(needle, insertion + needle, 1)
          module.write_text(text, encoding="utf-8")

          tests = Path("pipeline/tests/test_vonne_poc.py")
          test_text = tests.read_text(encoding="utf-8")
          addition = base64.b64decode(
              os.environ["TEST_B64"]
          ).decode("utf-8")
          marker = "\ndef test_cli_has_no_publishing_option():\n"
          if marker not in test_text:
              raise SystemExit("test insertion point not found")
          if "test_hard_title_is_not_softened_by_derived_geography" not in test_text:
              test_text = test_text.replace(marker, addition + marker, 1)
          tests.write_text(test_text, encoding="utf-8")
          PY

      - name: Install and test
        run: |
          python -m pip install --upgrade pip pandas openpyxl pytest
          cd pipeline
          python -m py_compile external_sources/vonne_poc.py
          python -m pytest tests/test_vonne_poc.py -q

      - name: Remove one-off workflow and push correction
        run: |
          rm .github/workflows/fix-vonne-classification.yml
          git add pipeline/external_sources/vonne_poc.py pipeline/tests/test_vonne_poc.py .github/workflows/fix-vonne-classification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix VONNE hard-pass precedence"
          git push origin agent/vonne-review-only-poc
