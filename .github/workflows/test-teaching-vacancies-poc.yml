name: Test Teaching Vacancies proof of concept

on:
  pull_request:
    paths:
      - "pipeline/external_sources/regional_contracts.py"
      - "pipeline/external_sources/teaching_vacancies_discovery.py"
      - "pipeline/external_sources/teaching_vacancies_routing.py"
      - "pipeline/external_sources/teaching_vacancies_regional_review.py"
      - "pipeline/external_sources/teaching_vacancies_regional_approved.py"
      - "pipeline/external_sources/compose_teaching_vacancies_regional.py"
      - "pipeline/external_sources/TEACHING_VACANCIES_UK_WIDE_DECISIONS.md"
      - "pipeline/external_sources/teaching_vacancies_poc.py"
      - "pipeline/external_sources/teaching_vacancies_etl.py"
      - "pipeline/external_sources/teaching_vacancies_approved.py"
      - "pipeline/external_sources/normalise_teaching_vacancies_output.py"
      - "pipeline/external_sources/compose_west_yorkshire_admin.py"
      - "pipeline/external_sources/REVIEW_STANDARD.md"
      - "pipeline/registers/region_category_slice_register.csv"
      - "pipeline/tests/test_external_regional_contracts.py"
      - "pipeline/tests/test_teaching_vacancies_discovery.py"
      - "pipeline/tests/test_teaching_vacancies_routing.py"
      - "pipeline/tests/test_teaching_vacancies_regional_review.py"
      - "pipeline/tests/test_teaching_vacancies_regional_approved.py"
      - "pipeline/tests/test_compose_teaching_vacancies_regional.py"
      - "pipeline/tests/test_teaching_vacancies_poc.py"
      - "pipeline/tests/test_teaching_vacancies_pay_fallback.py"
      - "pipeline/tests/test_teaching_vacancies_approved_publish.py"
      - "pipeline/tests/test_teaching_vacancies_contract_format.py"
      - "pipeline/reviews/external/west-yorkshire-teaching-vacancies-review.csv"
      - "pipeline/reviews/external/west-yorkshire-teaching-vacancies-summary.md"
      - ".github/workflows/test-teaching-vacancies-poc.yml"
      - ".github/workflows/run-teaching-vacancies-review.yml"
      - ".github/workflows/build-approved-teaching-vacancies-output.yml"
      - ".github/workflows/run-service-admin-pipeline.yml"
      - ".github/workflows/run-full-jobg8-daily-process.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-teaching-vacancies-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test packages
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: Compile
        working-directory: pipeline
        run: |
          python -m py_compile external_sources/regional_contracts.py
          python -m py_compile external_sources/teaching_vacancies_discovery.py
          python -m py_compile external_sources/teaching_vacancies_routing.py
          python -m py_compile external_sources/teaching_vacancies_regional_review.py
          python -m py_compile external_sources/teaching_vacancies_regional_approved.py
          python -m py_compile external_sources/compose_teaching_vacancies_regional.py
          python -m py_compile external_sources/teaching_vacancies_poc.py
          python -m py_compile external_sources/teaching_vacancies_etl.py
          python -m py_compile external_sources/teaching_vacancies_approved.py
          python -m py_compile external_sources/normalise_teaching_vacancies_output.py
          python -m py_compile external_sources/compose_west_yorkshire_admin.py

      - name: Test discovery, routing, review, approval and retention
        working-directory: pipeline
        run: |
          python -m pytest \
            tests/test_external_regional_contracts.py \
            tests/test_teaching_vacancies_discovery.py \
            tests/test_teaching_vacancies_routing.py \
            tests/test_teaching_vacancies_regional_review.py \
            tests/test_teaching_vacancies_regional_approved.py \
            tests/test_compose_teaching_vacancies_regional.py \
            tests/test_teaching_vacancies_poc.py \
            tests/test_teaching_vacancies_pay_fallback.py \
            tests/test_teaching_vacancies_approved_publish.py \
            tests/test_teaching_vacancies_contract_format.py \
            -q

      - name: Verify real geographic lookup contract
        working-directory: pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          from external_sources.regional_contracts import load_geo_lookup

          lookup = load_geo_lookup(Path("geo/geo_lookup.xlsx"))
          regions = sorted(set(lookup.values()))
          assert lookup
          assert "Yorkshire - West" in regions
          print(f"geo_lookup.xlsx exposes {len(lookup)} exact factual mappings")
          print("Geo clusters: " + " | ".join(regions))
          PY

      - name: Verify live national discovery route contract
        working-directory: pipeline
        run: |
          python - <<'PY'
          from external_sources import teaching_vacancies_discovery as discovery
          from external_sources import teaching_vacancies_etl as etl
          from external_sources import teaching_vacancies_poc as poc

          etl.install_patches()
          route = discovery.default_routes()[0]
          assert "location=" not in route.url
          assert "radius=" not in route.url
          document = poc.request_text(route.url)
          listing = discovery.parse_listing_page(document, page=1)
          assert listing.total > 0
          assert listing.urls
          assert listing.end <= discovery.RESULTS_PER_PAGE
          print(
              f"National administration route reports {listing.total} jobs; "
              f"first page exposes {len(listing.urls)} stable detail URLs."
          )
          PY

      - name: Run live review-only preview
        working-directory: pipeline
        run: |
          python -m external_sources.teaching_vacancies_etl \
            --fetch-live \
            --max-pages 2 \
            --report-csv /tmp/west-yorkshire-teaching-vacancies-review.csv \
            --summary-md /tmp/west-yorkshire-teaching-vacancies-summary.md

      - name: Verify standard review format, field coverage and live-site isolation
        run: |
          test -s /tmp/west-yorkshire-teaching-vacancies-review.csv
          test -s /tmp/west-yorkshire-teaching-vacancies-summary.md
          python - <<'PY'
          import csv
          from pathlib import Path

          csv_path = "/tmp/west-yorkshire-teaching-vacancies-review.csv"
          with open(csv_path, newline="", encoding="utf-8-sig") as handle:
              reader = csv.DictReader(handle)
              assert reader.fieldnames[0] == "final_decision", reader.fieldnames
              rows = list(reader)

          decisions = [row["final_decision"] for row in rows]
          order = {
              "SELECTED": 0,
              "POSS": 1,
              "EXCLUDED": 2,
              "HARD_PASS": 3,
          }
          assert decisions == sorted(
              decisions,
              key=lambda value: order.get(value, 99),
          ), decisions

          in_scope = [row for row in rows if row["geography_status"] == "IN_SCOPE"]
          assert in_scope, "No West Yorkshire rows were retained"
          missing_pay = [
              row["source_job_id"]
              for row in in_scope
              if not row["salary_text"].strip()
          ]
          assert not missing_pay, (
              "In-scope Teaching Vacancies rows have blank salary/pay scale: "
              + ", ".join(missing_pay)
          )

          summary = Path(
              "/tmp/west-yorkshire-teaching-vacancies-summary.md"
          ).read_text(encoding="utf-8")
          assert "Edit only the `action:` line" in summary
          assert "## SELECTED" in summary
          assert "## POSS — choose SELECT or EXCLUDE" in summary
          assert "## EXCLUDED BY REVIEW" in summary
          assert "## HARD_PASS" in summary
          PY
          git diff --exit-code -- \
            pipeline/output-external \
            pipeline/output-admin-service \
            app

      - name: Upload West Yorkshire Teaching Vacancies review preview
        uses: actions/upload-artifact@v4
        with:
          name: west-yorkshire-teaching-vacancies-review-preview
          path: |
            /tmp/west-yorkshire-teaching-vacancies-review.csv
            /tmp/west-yorkshire-teaching-vacancies-summary.md
          if-no-files-found: error
          retention-days: 7
