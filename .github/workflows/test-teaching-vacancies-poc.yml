name: Test Teaching Vacancies proof of concept

on:
  pull_request:
    paths:
      - "pipeline/external_sources/teaching_vacancies_poc.py"
      - "pipeline/tests/test_teaching_vacancies_poc.py"
      - "pipeline/reviews/external/teaching-vacancies-review.csv"
      - "pipeline/reviews/external/teaching-vacancies-summary.md"
      - ".github/workflows/test-teaching-vacancies-poc.yml"
      - ".github/workflows/run-teaching-vacancies-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-teaching-vacancies-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test package
        run: python -m pip install --upgrade pip pytest

      - name: Compile
        working-directory: pipeline
        run: python -m py_compile external_sources/teaching_vacancies_poc.py

      - name: Test
        working-directory: pipeline
        run: python -m pytest tests/test_teaching_vacancies_poc.py -q

      - name: Run live review-only preview
        working-directory: pipeline
        run: |
          python -m external_sources.teaching_vacancies_poc \
            --fetch-live \
            --max-pages 2 \
            --report-csv /tmp/teaching-vacancies-review.csv \
            --summary-md /tmp/teaching-vacancies-summary.md

      - name: Verify standard review format and live-site isolation
        run: |
          test -s /tmp/teaching-vacancies-review.csv
          test -s /tmp/teaching-vacancies-summary.md
          python - <<'PY'
          import csv
          from pathlib import Path

          csv_path = "/tmp/teaching-vacancies-review.csv"
          with open(csv_path, newline="", encoding="utf-8-sig") as handle:
              reader = csv.DictReader(handle)
              assert reader.fieldnames[0] == "final_decision", reader.fieldnames
              decisions = [row["final_decision"] for row in reader]

          order = {
              "SELECTED": 0,
              "POSS": 1,
              "EXCLUDED": 2,
              "HARD_PASS": 3,
          }
          assert decisions == sorted(
              decisions,
              key=lambda value: order.get(value, 99),
          ), decisions

          summary = Path(
              "/tmp/teaching-vacancies-summary.md"
          ).read_text(encoding="utf-8")
          assert "Edit only the `action:` line" in summary
          assert "## SELECTED" in summary
          assert "## POSS — choose SELECT or EXCLUDE" in summary
          assert "## EXCLUDED BY REVIEW" in summary
          assert "## HARD_PASS" in summary
          PY
          git diff --exit-code -- \
            pipeline/output-external \
            pipeline/output-admin-service \
            app

      - name: Upload Teaching Vacancies review preview
        uses: actions/upload-artifact@v4
        with:
          name: teaching-vacancies-review-preview
          path: |
            /tmp/teaching-vacancies-review.csv
            /tmp/teaching-vacancies-summary.md
          if-no-files-found: error
          retention-days: 7
