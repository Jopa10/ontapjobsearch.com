name: Test Teaching Vacancies proof of concept

on:
  pull_request:
    paths:
      - "pipeline/external_sources/teaching_vacancies_poc.py"
      - "pipeline/external_sources/format_teaching_vacancies_review.py"
      - "pipeline/tests/test_teaching_vacancies_poc.py"
      - "pipeline/tests/test_teaching_vacancies_review_format.py"
      - ".github/workflows/test-teaching-vacancies-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-teaching-vacancies-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test package
        run: python -m pip install --upgrade pip pytest
      - name: Compile
        working-directory: pipeline
        run: |
          python -m py_compile external_sources/teaching_vacancies_poc.py
          python -m py_compile external_sources/format_teaching_vacancies_review.py
      - name: Test
        working-directory: pipeline
        run: |
          python -m pytest \
            tests/test_teaching_vacancies_poc.py \
            tests/test_teaching_vacancies_review_format.py \
            -q
      - name: Run live review-only preview
        working-directory: pipeline
        run: |
          python -m external_sources.teaching_vacancies_poc \
            --fetch-live \
            --max-pages 2 \
            --report-csv /tmp/west-yorkshire-teaching-vacancies-review.csv \
            --summary-md /tmp/west-yorkshire-teaching-vacancies-summary.md
          python -m external_sources.format_teaching_vacancies_review \
            /tmp/west-yorkshire-teaching-vacancies-review.csv
      - name: Verify preview order and live-site isolation
        run: |
          test -s /tmp/west-yorkshire-teaching-vacancies-review.csv
          test -s /tmp/west-yorkshire-teaching-vacancies-summary.md
          python - <<'PY'
          import csv
          path = "/tmp/west-yorkshire-teaching-vacancies-review.csv"
          with open(path, newline="", encoding="utf-8-sig") as handle:
              values = [row["classification"] for row in csv.DictReader(handle)]
          order = {"HC": 0, "POSS": 1, "DUPLICATE": 2, "HARD_PASS": 3}
          assert values == sorted(values, key=lambda value: order.get(value, 99)), values
          PY
          git diff --exit-code -- \
            pipeline/output-external \
            pipeline/output-admin-service \
            app
      - name: Upload West Yorkshire Teaching Vacancies review preview
        uses: actions/upload-artifact@v4
        with:
          name: west-yorkshire-teaching-vacancies-review-preview
          path: |
            /tmp/west-yorkshire-teaching-vacancies-review.csv
            /tmp/west-yorkshire-teaching-vacancies-summary.md
          if-no-files-found: error
          retention-days: 7
