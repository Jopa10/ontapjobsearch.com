name: Sync proof-region governance once

on:
  push:
    paths:
      - '.github/workflows/sync-proof-region-governance-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Document stage
        run: |
          python - <<'PY'
          from pathlib import Path
          additions = {
            'SYSTEM_MAP.md': '- 23 August 2026 — **Reusable family proof-region evidence:** the governed discovery workflow now runs `jobg8_family_proof_region_evidence.py` after national discovery and 78-market recurrence. It emits the five strongest current markets with LIKELY_IN/BORDERLINE/OUT counts, title mix and advert excerpts for human boundary inspection. This is diagnostic evidence only: it does not approve proof regions or activate public slices.\n',
            'SYSTEM_OVERVIEW.md': '- 23 August 2026 — New-family discovery now also prepares **proof-region evidence** automatically: the five strongest current markets are surfaced with title mix and remaining borderlines for review, without approving or publishing any region.\n',
          }
          for filename, bullet in additions.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              marker = '**Reusable family proof-region evidence:**' if filename == 'SYSTEM_MAP.md' else '**proof-region evidence**'
              if marker not in text:
                  text = text.replace('## Recent canonical changes\n\n', '## Recent canonical changes\n\n' + bullet, 1)
                  p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove helper
        run: |
          set -euo pipefail
          git add SYSTEM_MAP.md SYSTEM_OVERVIEW.md
          git rm .github/workflows/sync-proof-region-governance-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Document family proof-region evidence stage'
          git pull --rebase origin main
          git push origin HEAD:main
