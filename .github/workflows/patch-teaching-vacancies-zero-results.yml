name: Patch Teaching Vacancies zero-result listings

on:
  push:
    branches:
      - agent/teaching-vacancies-zero-results
    paths:
      - ".github/workflows/patch-teaching-vacancies-zero-results.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/teaching-vacancies-zero-results
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tests
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: Apply explicit zero-result handling
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("pipeline/external_sources/teaching_vacancies_discovery.py")
          text = source_path.read_text(encoding="utf-8")
          old = '''def parse_listing_page(document: str, *, page: int) -> ListingPage:\n    visible_text = poc.clean(document)\n    match = re.search(\n        r"Showing\\s+([\\d,]+)\\s+to\\s+([\\d,]+)\\s+of\\s+([\\d,]+)\\s+results",\n        visible_text,\n        flags=re.I,\n    )\n    if not match:\n        raise ValueError(f"listing page {page} has no result-range audit")\n    start, end, total = (\n        int(value.replace(",", "")) for value in match.groups()\n    )\n    if total < 0 or start < 0 or end < 0:\n        raise ValueError(f"listing page {page} has invalid result counts")\n    if total == 0:\n        if start or end:\n            raise ValueError(f"listing page {page} has inconsistent zero results")\n    elif not (1 <= start <= end <= total):\n        raise ValueError(f"listing page {page} has invalid result range")\n    urls = listing_job_urls(document)\n    if total and not urls:\n        raise ValueError(f"listing page {page} exposes no vacancy URLs")\n    return ListingPage(page=page, start=start, end=end, total=total, urls=urls)\n'''
          new = '''def parse_listing_page(document: str, *, page: int) -> ListingPage:\n    visible_text = poc.clean(document)\n    urls = listing_job_urls(document)\n    match = re.search(\n        r"Showing\\s+([\\d,]+)\\s+to\\s+([\\d,]+)\\s+of\\s+([\\d,]+)\\s+results",\n        visible_text,\n        flags=re.I,\n    )\n    if not match:\n        explicit_zero = re.search(r"\\bJobs\\s*\\(\\s*0\\s*\\)", visible_text, flags=re.I)\n        if explicit_zero and page == 1 and not urls:\n            return ListingPage(page=page, start=0, end=0, total=0, urls=())\n        raise ValueError(f"listing page {page} has no result-range audit")\n    start, end, total = (\n        int(value.replace(",", "")) for value in match.groups()\n    )\n    if total < 0 or start < 0 or end < 0:\n        raise ValueError(f"listing page {page} has invalid result counts")\n    if total == 0:\n        if start or end or urls:\n            raise ValueError(f"listing page {page} has inconsistent zero results")\n    elif not (1 <= start <= end <= total):\n        raise ValueError(f"listing page {page} has invalid result range")\n    if total and not urls:\n        raise ValueError(f"listing page {page} exposes no vacancy URLs")\n    return ListingPage(page=page, start=start, end=end, total=total, urls=urls)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"STOP: parser replacement count was {text.count(old)}")
          source_path.write_text(text.replace(old, new), encoding="utf-8")

          test_path = Path("pipeline/tests/test_teaching_vacancies_discovery.py")
          tests = test_path.read_text(encoding="utf-8")
          anchor = "\n\ndef test_discover_route_blocks_changed_total() -> None:\n"
          addition = '''\n\ndef test_explicit_zero_result_page_is_audited_without_range_text() -> None:\n    route = discovery.SearchRoute(\n        "keyword:business support",\n        "business support",\n        "https://teaching-vacancies.service.gov.uk/jobs?keyword=business+support",\n    )\n    document = (\n        "<html><head><title>Jobs (0) sorted by newest - Teaching Vacancies</title></head>"\n        "<body><h1>Jobs (0)</h1></body></html>"\n    )\n\n    listing = discovery.parse_listing_page(document, page=1)\n    sweep = discovery.discover_route(route, request_text=lambda _url: document)\n\n    assert listing == discovery.ListingPage(page=1, start=0, end=0, total=0, urls=())\n    assert sweep.total == 0\n    assert sweep.pages == 1\n    assert sweep.records == ()\n\n\ndef test_zero_result_heading_cannot_hide_a_vacancy_link() -> None:\n    document = (\n        "<html><head><title>Jobs (0) - Teaching Vacancies</title></head>"\n        "<body><h1>Jobs (0)</h1><a href=\"/jobs/unexpected\">Unexpected</a></body></html>"\n    )\n\n    with pytest.raises(ValueError, match="no result-range audit"):\n        discovery.parse_listing_page(document, page=1)\n'''
          if tests.count(anchor) != 1:
              raise SystemExit("STOP: test insertion anchor mismatch")
          test_path.write_text(tests.replace(anchor, addition + anchor), encoding="utf-8")
          PY

      - name: Run full Teaching Vacancies tests
        working-directory: pipeline
        run: |
          python -m py_compile external_sources/teaching_vacancies_discovery.py
          python -m pytest \
            tests/test_external_regional_contracts.py \
            tests/test_teaching_vacancies_discovery.py \
            tests/test_teaching_vacancies_routing.py \
            tests/test_teaching_vacancies_regional_review.py \
            tests/test_teaching_vacancies_regional_approved.py \
            tests/test_compose_teaching_vacancies_regional.py \
            tests/test_teaching_vacancies_regional_integration.py \
            tests/test_teaching_vacancies_workflow_switch.py \
            tests/test_teaching_vacancies_region_filter.py \
            tests/test_teaching_vacancies_operator_workflows.py \
            tests/test_teaching_vacancies_poc.py \
            tests/test_teaching_vacancies_pay_fallback.py \
            tests/test_teaching_vacancies_approved_publish.py \
            tests/test_teaching_vacancies_contract_format.py \
            -q

      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pipeline/external_sources/teaching_vacancies_discovery.py \
            pipeline/tests/test_teaching_vacancies_discovery.py
          git commit -m "Accept audited Teaching Vacancies zero-result pages"
          git push origin agent/teaching-vacancies-zero-results
