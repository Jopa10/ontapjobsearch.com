              rows = list(reader)

          expected = ["title","classification","review_status","reason","count_in_feed","west_south_regions_seen","example_towns"]
          if fieldnames != expected:
              raise SystemExit(f"Unexpected CSV columns: {fieldnames}")

          by_key = {row["title"].strip().lower(): row for row in rows if row["title"].strip()}
          new_count = 0
          updated_count = 0

          for item in additions:
              key = item["title"].strip().lower()
              if key in by_key:
                  row = by_key[key]
                  row["classification"] = item["classification"]
                  row["review_status"] = item["review_status"]
                  row["reason"] = item["reason"]
                  row["count_in_feed"] = item["count_in_feed"]
                  updated_count += 1
