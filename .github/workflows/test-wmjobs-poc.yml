name: Test WMJobs proof of concept

on:
  pull_request:
    paths:
      - "pipeline/external_sources/wmjobs_poc.py"
      - "pipeline/tests/test_wmjobs_poc.py"
      - ".github/workflows/test-wmjobs-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-wmjobs-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install --upgrade pip pandas openpyxl pytest
      - name: Compile
        working-directory: pipeline
        run: python -m py_compile external_sources/wmjobs_poc.py
      - name: Test
        working-directory: pipeline
        run: python -m pytest tests/test_wmjobs_poc.py -q
      - name: Run live review-only preview
        working-directory: pipeline
        run: |
          python -m external_sources.wmjobs_poc \
            --fetch-live \
            --report-csv /tmp/wmjobs-review.csv \
            --summary-md /tmp/wmjobs-summary.md
      - name: Verify preview and live-site isolation
        run: |
          test -s /tmp/wmjobs-review.csv
          test -s /tmp/wmjobs-summary.md
          git diff --exit-code -- \
            pipeline/output-external \
            pipeline/output-admin-service \
            app
      - name: Upload WMJobs review preview
        uses: actions/upload-artifact@v4
        with:
          name: wmjobs-review-preview
          path: |
            /tmp/wmjobs-review.csv
            /tmp/wmjobs-summary.md
          if-no-files-found: error
          retention-days: 7
