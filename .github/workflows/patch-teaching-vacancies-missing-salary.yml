name: Patch Teaching Vacancies missing salary handling

on:
  push:
    branches:
      - agent/teaching-vacancies-missing-salary-hard-pass
    paths:
      - ".github/workflows/patch-teaching-vacancies-missing-salary.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/teaching-vacancies-missing-salary-hard-pass
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tests
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: Apply missing-salary hard-pass behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("pipeline/external_sources/teaching_vacancies_regional_review.py")
          text = source_path.read_text(encoding="utf-8")
          old = '''        if vacancy.classification != "HARD_PASS" and not clean(vacancy.salary_text):\n            raise ValueError(\n                f"reviewable Teaching Vacancies ID {vacancy.source_job_id} "\n                "has no salary or pay scale"\n            )\n'''
          new = '''        if vacancy.classification != "HARD_PASS" and not clean(vacancy.salary_text):\n            vacancy.classification = "HARD_PASS"\n            vacancy.classification_reason = "Missing salary or pay scale"\n'''
          if text.count(old) != 1:
              raise SystemExit(f"STOP: production replacement count was {text.count(old)}")
          source_path.write_text(text.replace(old, new), encoding="utf-8")

          test_path = Path("pipeline/tests/test_teaching_vacancies_regional_review.py")
          tests = test_path.read_text(encoding="utf-8")
          old_test = '''def test_reviewable_missing_salary_blocks_region() -> None:\n    with pytest.raises(ValueError, match="no salary or pay scale"):\n        classify([routed_row("missing-pay", salary="")])\n'''
          new_test = '''def test_reviewable_missing_salary_hard_passes_only_that_vacancy() -> None:\n    records = classify(\n        [\n            routed_row("missing-pay", salary=""),\n            routed_row("normal-pay", salary="£25,000"),\n        ]\n    )\n    by_id = {row.vacancy.source_job_id: row for row in records}\n\n    assert len(records) == 2\n    assert review.decision_for(by_id["missing-pay"]) == "HARD_PASS"\n    assert (\n        by_id["missing-pay"].vacancy.classification_reason\n        == "Missing salary or pay scale"\n    )\n    assert review.decision_for(by_id["normal-pay"]) == "SELECTED"\n'''
          if tests.count(old_test) != 1:
              raise SystemExit(f"STOP: test replacement count was {tests.count(old_test)}")
          test_path.write_text(tests.replace(old_test, new_test), encoding="utf-8")
          PY

      - name: Run full Teaching Vacancies tests
        working-directory: pipeline
        run: |
          python -m py_compile external_sources/teaching_vacancies_regional_review.py
          python -m pytest \
            tests/test_external_regional_contracts.py \
            tests/test_teaching_vacancies_discovery.py \
            tests/test_teaching_vacancies_routing.py \
            tests/test_teaching_vacancies_regional_review.py \
            tests/test_teaching_vacancies_regional_approved.py \
            tests/test_compose_teaching_vacancies_regional.py \
            tests/test_teaching_vacancies_regional_integration.py \
            tests/test_teaching_vacancies_workflow_switch.py \
            tests/test_teaching_vacancies_region_filter.py \
            tests/test_teaching_vacancies_operator_workflows.py \
            tests/test_teaching_vacancies_poc.py \
            tests/test_teaching_vacancies_pay_fallback.py \
            tests/test_teaching_vacancies_approved_publish.py \
            tests/test_teaching_vacancies_contract_format.py \
            -q

      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pipeline/external_sources/teaching_vacancies_regional_review.py \
            pipeline/tests/test_teaching_vacancies_regional_review.py
          git commit -m "Hard-pass Teaching Vacancies rows with no salary"
          git push origin agent/teaching-vacancies-missing-salary-hard-pass
