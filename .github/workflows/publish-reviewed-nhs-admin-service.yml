name: Publish reviewed NHS admin/service

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type PUBLISH after completing the unified Ontap daily review
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-nhs-admin-service:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check explicit approval
        env:
          APPROVAL: ${{ inputs.approval }}
        run: |
          if [ "$APPROVAL" != "PUBLISH" ]; then
            echo "::error::Approval must be exactly PUBLISH."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: Run NHS publishing tests
        working-directory: pipeline
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_nhs_admin_service.py tests/test_nhs_admin_daily_compose.py

      - name: Refresh and compose NHS transactionally
        working-directory: pipeline
        env:
          PYTHONPATH: .
        run: python -m external_sources.compose_nhs_admin_daily --write

      - name: Publish verified service-admin pages
        working-directory: pipeline
        run: python -m scripts.publish_verified_service_admin_pages --write

      - name: Verify NHS publisher scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          unexpected="$({ printf '%s\n' "$changed" | awk '
            $0 !~ /^pipeline\/reviews\/external\/nhs-jobs-(review|decisions)\.csv$/ &&
            $0 != "pipeline/reviews/external/nhs-jobs-summary.md" &&
            $0 !~ /^pipeline\/output-admin-service\/.*-admin-service\.json$/ &&
            $0 !~ /^app\/[^/]+\/service-administrator-jobs\.json$/ &&
            $0 !~ /^app\/_city-pages\/configured-slices\/[^/]+\/service-administrator-jobs\.json$/'; } || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::NHS publisher changed unexpected paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit reviewed NHS state and verified pages
        run: |
          set -euo pipefail
          git add -- \
            pipeline/reviews/external/nhs-jobs-review.csv \
            pipeline/reviews/external/nhs-jobs-summary.md \
            pipeline/reviews/external/nhs-jobs-decisions.csv \
            pipeline/output-admin-service/*-admin-service.json \
            app/*/service-administrator-jobs.json \
            app/_city-pages/configured-slices/*/service-administrator-jobs.json

          if git diff --cached --quiet; then
            echo 'No NHS publishing changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish reviewed NHS admin service jobs'

          for attempt in 1 2 3; do
            echo "NHS push attempt $attempt of 3"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'NHS publishing changes pushed successfully.'
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo '::error::Could not safely push NHS publishing changes after 3 attempts.'
          exit 1

      - name: Summary
        run: |
          {
            echo '## NHS admin/service published'
            echo
            echo 'The publisher uses the same transactional NHS composer as the normal daily run.'
            echo 'Fresh NHS inventory is classified, manual decisions are preserved, accepted rows are enriched, and NHS share is capped at 20% before live pages are written.'
          } >> "$GITHUB_STEP_SUMMARY"
