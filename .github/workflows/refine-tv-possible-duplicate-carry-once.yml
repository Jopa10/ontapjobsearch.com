name: Refine Teaching Vacancies possible duplicate carry once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refine-tv-possible-duplicate-carry-once.yml"

permissions:
  contents: write

jobs:
  refine-possible-duplicate-carry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test packages
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: Apply narrow possible-duplicate carry guard
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"STOP: expected exactly one patch target in {path}; found {count}."
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          regional = Path("pipeline/external_sources/teaching_vacancies_regional_review.py")
          replace_once(
              regional,
              '''    for source_job_id, action in actions.items():
                  current_by_id[source_job_id].manual_action = action
                  if not current_by_id[source_job_id].migration_status:
                      current_by_id[source_job_id].migration_status = "SAME_DAY_ACTION"
          ''',
              '''    for source_job_id, action in actions.items():
                  record = current_by_id[source_job_id]
                  if (
                      action == "select"
                      and record.vacancy.jobg8_check == "POSSIBLE_DUPLICATE"
                  ):
                      if not record.migration_status:
                          record.migration_status = "REVIEW_REQUIRED_DUPLICATE"
                      continue
                  record.manual_action = action
                  if not record.migration_status:
                      record.migration_status = "SAME_DAY_ACTION"
          ''',
          )

          master_actions = Path("pipeline/external_sources/teaching_vacancies_master_actions.py")
          replace_once(
              master_actions,
              '''        if clean(current.get("final_decision")).upper() == "HARD_PASS":
                      continue
                  old_fingerprint = clean(old.get("factual_fingerprint"))
          ''',
              '''        if clean(current.get("final_decision")).upper() == "HARD_PASS":
                      continue
                  if (
                      action == "select"
                      and clean(current.get("jobg8_check")).upper()
                      == "POSSIBLE_DUPLICATE"
                  ):
                      current["manual_action"] = ""
                      current["final_decision"] = _final_decision(current, "")
                      continue
                  old_fingerprint = clean(old.get("factual_fingerprint"))
          ''',
          )

          regional_tests = Path("pipeline/tests/test_teaching_vacancies_regional_review.py")
          regional_text = regional_tests.read_text(encoding="utf-8")
          regional_test = r'''


def test_possible_jobg8_duplicate_requires_fresh_review_before_select_carries(
    tmp_path: Path,
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    monkeypatch.setattr(
        review.poc,
        "compare_jobg8",
        lambda vacancy, rows: (
            "POSSIBLE_DUPLICATE",
            "Admin Assistant",
            "Example Employer",
            "0.695",
        ),
    )
    records = classify([routed_row("possible-duplicate")])
    record = records[0]

    assert record.vacancy.classification == "POSS"
    assert record.vacancy.jobg8_check == "POSSIBLE_DUPLICATE"
    assert review.decision_for(record) == "POSS"

    summary_path = tmp_path / "summary.md"
    summary_path.write_text(
        """review_date: 2026-08-06
---
action: select
factual_fingerprint: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
source_job_id: possible-duplicate
---
""",
        encoding="utf-8",
    )

    review.apply_existing_actions(
        records,
        summary_path=summary_path,
        review_date="2026-08-06",
    )

    assert record.manual_action == ""
    assert record.migration_status == "REVIEW_REQUIRED_DUPLICATE"
    assert review.decision_for(record) == "POSS"
'''
          if "test_possible_jobg8_duplicate_requires_fresh_review_before_select_carries" not in regional_text:
              regional_tests.write_text(regional_text.rstrip() + regional_test + "\n", encoding="utf-8")

          master_tests = Path("pipeline/tests/test_teaching_vacancies_master_actions.py")
          master_text = master_tests.read_text(encoding="utf-8")
          master_test = r'''


def test_master_carry_does_not_reselect_possible_jobg8_duplicate(
    tmp_path: Path,
) -> None:
    old_dir = tmp_path / "old"
    old_dir.mkdir()
    old_record = make_record(
        "possible-duplicate",
        classification="POSS",
        title="Admin Assistant",
    )
    old_record.vacancy.jobg8_check = "POSSIBLE_DUPLICATE"
    old_record.manual_action = "select"
    write_region(old_dir, [old_record])
    old_rows = master.build_master_rows(old_dir)

    old_csv = tmp_path / "old-master.csv"
    old_md = tmp_path / "old-master.md"
    old_csv.write_bytes(master.master_csv_bytes(old_rows))
    old_md.write_text(master.master_summary_text(old_rows), encoding="utf-8")

    current_dir = tmp_path / "current"
    current_dir.mkdir()
    current_record = make_record(
        "possible-duplicate",
        classification="POSS",
        title="Admin Assistant",
    )
    current_record.vacancy.jobg8_check = "POSSIBLE_DUPLICATE"
    write_region(current_dir, [current_record])
    current_rows = master.build_master_rows(current_dir)

    carried = actions.carry_existing_actions(
        current_rows,
        old_master_csv=old_csv,
        old_master_summary=old_md,
    )

    assert carried == 0
    assert current_rows[0]["manual_action"] == ""
    assert current_rows[0]["final_decision"] == "POSS"
'''
          if "test_master_carry_does_not_reselect_possible_jobg8_duplicate" not in master_text:
              master_tests.write_text(master_text.rstrip() + master_test + "\n", encoding="utf-8")
          PY

      - name: Run focused Teaching Vacancies review tests
        working-directory: pipeline
        run: |
          python -m pytest \
            tests/test_teaching_vacancies_regional_review.py \
            tests/test_teaching_vacancies_master_actions.py \
            -q

      - name: Commit refinement and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refine-tv-possible-duplicate-carry-once.yml
          git add \
            pipeline/external_sources/teaching_vacancies_regional_review.py \
            pipeline/external_sources/teaching_vacancies_master_actions.py \
            pipeline/tests/test_teaching_vacancies_regional_review.py \
            pipeline/tests/test_teaching_vacancies_master_actions.py \
            .github/workflows/refine-tv-possible-duplicate-carry-once.yml
          git commit -m "Require fresh review for possible JobG8 duplicates"
          git push origin main
