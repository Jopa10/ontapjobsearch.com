name: One-off branch wiring patcher

on:
  push:
    paths:
      - '.github/workflows/apply-config-driven-slice-patch-main-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: config-driven-slices
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded wiring changes on feature branch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected patch anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('.github/workflows/run-full-jobg8-daily-process.yml', 'run: python -m scripts.service_admin_pipeline_north_yorkshire', 'run: python -m scripts.service_admin_pipeline_live_config')
          replace('.github/workflows/run-full-jobg8-daily-process.yml', 'run: python -m scripts.support_worker_pipeline', 'run: python -m scripts.support_worker_pipeline_live_config')

          replace('.github/workflows/publish-verified-pages.yml', 'python -m scripts.publish_verified_pages_north_yorkshire --write', 'python -m scripts.publish_verified_pages_live_config --write')
          replace('.github/workflows/publish-verified-pages.yml', '            "app/west-yorkshire/support-worker.json"\n          )', '            "app/west-yorkshire/support-worker.json"\n            "app/_slice-data"\n          )')
          replace('.github/workflows/publish-verified-pages.yml', '               $0 != "app/west-yorkshire/support-worker.json" &&\n               $0 != daily &&', '               $0 != "app/west-yorkshire/support-worker.json" &&\n               $0 !~ /^app\\/_slice-data\\/.*\\.json$/ &&\n               $0 != daily &&')

          replace('app/sitemap.ts', "import { getJobPath, getPublishedJobs } from '@/lib/published-jobs'", "import { getJobPath, getPublishedJobs } from '@/lib/published-jobs'\nimport { getPublishedDynamicSlices } from '@/lib/configured-job-slices'")
          replace('app/sitemap.ts', "  const cityRoutes = activeCities.map(({ definition }) => definition.route)\n  const routes = [...baseRoutes, ...cityRoutes.filter((route) => !baseRoutes.includes(route))]", "  const cityRoutes = activeCities.map(({ definition }) => definition.route)\n  const configuredRoutes = getPublishedDynamicSlices().map((slice) => slice.route)\n  const routes = [\n    ...baseRoutes,\n    ...cityRoutes.filter((route) => !baseRoutes.includes(route)),\n    ...configuredRoutes.filter(\n      (route) => !baseRoutes.includes(route) && !cityRoutes.includes(route)\n    ),\n  ]")

          replace('lib/published-jobs.ts', 'import { getLondonJobArea } from "@/lib/london-job-area";', 'import { getLondonJobArea } from "@/lib/london-job-area";\nimport {\n  getConfiguredSliceBySlugs,\n  getPublishedDynamicSlices,\n} from "@/lib/configured-job-slices";')
          replace('lib/published-jobs.ts', '  const candidates = [jsonRoute];\n\n  if (jsonRoute === "london/service-administrator-jobs") {', '  const candidates = [jsonRoute];\n\n  if (jsonRoute.startsWith("_slice-data/")) {\n    const [, regionSlug, categorySlug] = jsonRoute.split("/");\n    const configured = getConfiguredSliceBySlugs(regionSlug, categorySlug);\n    if (configured) {\n      return { path: configured.route, label: configured.title };\n    }\n  }\n\n  if (jsonRoute === "london/service-administrator-jobs") {')
          replace('lib/published-jobs.ts', '  const byId = new Map<string, PublishedJob>();\n\n  for (const filePath of jsonFiles(APP_DIRECTORY).sort()) {', '  const byId = new Map<string, PublishedJob>();\n  const liveConfiguredDataPaths = new Set(\n    getPublishedDynamicSlices().map((slice) => path.resolve(slice.dataFilePath))\n  );\n\n  for (const filePath of jsonFiles(APP_DIRECTORY).sort()) {\n    if (\n      filePath.includes(`${path.sep}_slice-data${path.sep}`) &&\n      !liveConfiguredDataPaths.has(path.resolve(filePath))\n    ) {\n      continue;\n    }')

          replace('app/browse-jobs/page.tsx', "import {\n  cityPageDefinitions,\n  getCityPageJobs,\n  isCityPageActive,\n} from '@/lib/city-page-data';", "import {\n  cityPageDefinitions,\n  getCityPageJobs,\n  isCityPageActive,\n} from '@/lib/city-page-data';\nimport { getPublishedDynamicSlices } from '@/lib/configured-job-slices';")
          replace('app/browse-jobs/page.tsx', "const pausedStatusClassName = 'border-amber-200 bg-amber-50 text-amber-700';\n\nconst activeCityCards", "const pausedStatusClassName = 'border-amber-200 bg-amber-50 text-amber-700';\n\nconst configuredSliceCards: BrowseCard[] = getPublishedDynamicSlices().map((slice) => ({\n  title: slice.title,\n  href: slice.route,\n  description: `Current ${slice.displayLabel.toLowerCase()} roles across ${slice.region}, with employer-site application links.`,\n  status: 'Active current supply',\n  statusClassName: activeStatusClassName,\n}));\n\nconst activeCityCards")
          replace('app/browse-jobs/page.tsx', "  },\n  {\n    heading: 'Support worker jobs',", "  },\n  ...(configuredSliceCards.length\n    ? [\n        {\n          heading: 'More live job pages',\n          intro:\n            'Additional region and role pages activated from current JobG8 supply and the Ontap slice register.',\n          cards: configuredSliceCards,\n        },\n      ]\n    : []),\n  {\n    heading: 'Support worker jobs',")

          replace('.github/workflows/test-slice-register.yml', '            pipeline/scripts/slice_registry.py \\\n            pipeline/scripts/publish_verified_pages.py \\', '            pipeline/scripts/slice_catalog.py \\\n            pipeline/scripts/slice_registry.py \\\n            pipeline/scripts/service_admin_pipeline_live_config.py \\\n            pipeline/scripts/support_worker_pipeline_live_config.py \\\n            pipeline/scripts/registered_category_pipeline.py \\\n            pipeline/scripts/publish_verified_pages_live_config.py \\\n            pipeline/scripts/publish_verified_pages.py \\')
          replace('.github/workflows/test-slice-register.yml', 'run: python -m scripts.publish_verified_pages_north_yorkshire --dry-run', 'run: python -m scripts.publish_verified_pages_live_config --dry-run')
          PY

      - name: Commit feature branch wiring changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/run-full-jobg8-daily-process.yml \
            .github/workflows/publish-verified-pages.yml \
            .github/workflows/test-slice-register.yml \
            app/sitemap.ts \
            app/browse-jobs/page.tsx \
            lib/published-jobs.ts
          if git diff --cached --quiet; then
            echo "No wiring changes required"
          else
            git commit -m "Wire config-driven slices into daily publish and discovery"
            git push origin config-driven-slices
          fi
