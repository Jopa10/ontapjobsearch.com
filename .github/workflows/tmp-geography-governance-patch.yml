name: Temporary geography governance patch

on:
  push:
    branches:
      - agent/geography-reconciliation-20260822

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geography-reconciliation-20260822
          fetch-depth: 0

      - name: Patch canonical geography wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('SYSTEM_MAP.md'), Path('SYSTEM_OVERVIEW.md')]
          replacements = [
              ('all 33 canonical regions', 'all 55 assessable England markets'),
              ('33 canonical regions', '55 assessable England markets'),
              ('33-region diagnostic assessment', '55-market diagnostic assessment'),
              ('33-region diagnostic coverage', '55-market diagnostic coverage'),
              ('33-region daily family coverage', '55-market daily family coverage'),
              ('same-feed 33-region', 'same-feed 55-market'),
              ('national/33-region', 'national/55-market'),
              ('33-region overview', '55-market overview'),
              ('33-region × 3-family', '55-market × 3-family'),
              ('3 / 33 LIVE Sales Advisor regions', '3 / 55 LIVE Sales Advisor markets'),
              ('3 / 33 LIVE regions', '3 / 55 LIVE markets'),
              ('all 99 region/family counts', 'all 165 region/family counts'),
              ('99 region/family counts', '165 region/family counts'),
              ('99 region/family rows', '165 region/family rows'),
              ('99 diagnostic counts', '165 diagnostic counts'),
              ('99 daily counts', '165 daily counts'),
              ('99-row snapshot', '165-row snapshot'),
              ('all 99 counts', 'all 165 counts'),
              ('99 counts', '165 counts'),
              ('99 rows (33 × 3)', '165 rows (55 × 3)'),
              ('**66 rows (33 × 2)** to **165 rows (55 × 3)**', '**165 rows (55 × 3)**'),
              ('66 rows (33 × 2) to 165 rows (55 × 3)', '165 rows (55 × 3)'),
              ('33-region family coverage', '55-market family coverage'),
              ('33-region evidence', '55-market evidence'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          map_path = Path('SYSTEM_MAP.md')
          text = map_path.read_text(encoding='utf-8')
          marker = '## Recent canonical changes\n\n'
          bullet = (
              '- 22 August 2026 — Geography reconciliation established that the former **33-region England footprint was a configured operational subset, not exhaustive geography**. '
              '`pipeline/config/england_assessable_regions.json` now governs the complete **55-market England diagnostic universe**: the previous 33 plus the exact 22 omitted non-North-East lookup markets. '
              '`geo_lookup.xlsx` remains the factual area-to-region authority; `job_slice_catalog.json` remains configured/public market metadata rather than the geography authority; and `region_category_slice_register.csv` remains the explicit LIVE activation gate. '
              'The three family diagnostics therefore produce **165 region/family rows (55 × 3)**. `North East` remains the deliberate roll-up of all three underlying lookup regions, including Tees Valley. '
              'This reconciliation changes diagnostic completeness only: it does not create LIVE slices, remove/rename public URLs or auto-publish any of the 22 additional markets.\n'
          )
          if bullet not in text:
              if marker not in text:
                  raise SystemExit('SYSTEM_MAP recent-changes marker not found')
              text = text.replace(marker, marker + bullet, 1)

          pipeline_marker = '`pipeline/input/jobg8.xlsx` is transient workflow input and is not committed. The validated raw feed is retained durably in S3 under `jobg8/raw`.\n'
          governance = (
              '\nGeography governance is layered deliberately:\n\n'
              '- `pipeline/geo/geo_lookup.xlsx` maps factual source locations to Ontap lookup regions;\n'
              '- `pipeline/config/england_assessable_regions.json` defines the complete 55-market England universe used by recurring family diagnostics and the regional overview;\n'
              '- `pipeline/config/job_slice_catalog.json` supplies configured market/category route metadata and must not be treated as exhaustive geography;\n'
              '- `pipeline/registers/region_category_slice_register.csv` is the explicit LIVE/CANDIDATE/other slice-state gate.\n\n'
              'Absence from the configured/LIVE layer must never turn a successfully geo-mapped job into `unknown`. The diagnostic order is **resolve full geography → count every assessable market → apply explicit aggregate mappings → overlay configured/LIVE state**. '
              'The public/assessment `North East` market rolls up Tyneside/Wearside/Northumberland, County Durham/Darlington/Hartlepool and Tees Valley.\n'
          )
          if governance not in text:
              if pipeline_marker not in text:
                  raise SystemExit('SYSTEM_MAP pipeline marker not found')
              text = text.replace(pipeline_marker, pipeline_marker + governance, 1)
          map_path.write_text(text, encoding='utf-8')

          overview_path = Path('SYSTEM_OVERVIEW.md')
          text = overview_path.read_text(encoding='utf-8')
          marker = '## Recent canonical changes\n\n'
          bullet = (
              '- 22 August 2026 — The regional geography audit found that the old **33 regions were the configured operational footprint, not complete England coverage**. '
              'Ontap now separates that configured layer from a complete **55-market England diagnostic universe**: the old 33 plus 22 legitimate markets already present in the underlying geography, including Liverpool/Merseyside, Leicestershire, Derbyshire, Suffolk, Cheshire and other previously omitted areas. '
              'Daily Service Admin, Support Worker and Sales Advisor diagnostics/overview therefore cover 55 markets (165 market/family rows). LIVE pages remain controlled separately by explicit approval: this change does **not** make the 22 additional markets live or change existing public URLs.\n'
          )
          if bullet not in text:
              if marker not in text:
                  raise SystemExit('SYSTEM_OVERVIEW recent-changes marker not found')
              text = text.replace(marker, marker + bullet, 1)

          overview_marker = 'Service Admin includes the six additional LIVE regional slices approved on 19 August. They use the same central register, production selector and verified-page publishing mechanism as the other LIVE dynamic slices.\n'
          governance = (
              '\nRegional geography now has two deliberately separate layers. `pipeline/config/england_assessable_regions.json` defines the **55 assessable England markets** used for daily diagnostics and coverage reporting. '
              '`pipeline/config/job_slice_catalog.json` is the configured/public market layer and is not the national geography authority; `region_category_slice_register.csv` still decides what is LIVE. '
              'A mapped job can therefore be assessed even when its market has no LIVE slice. `North East` remains the deliberate roll-up of all three underlying North East lookup areas, including Tees Valley.\n'
          )
          if governance not in text:
              if overview_marker not in text:
                  raise SystemExit('SYSTEM_OVERVIEW pipeline marker not found')
              text = text.replace(overview_marker, overview_marker + governance, 1)
          overview_path.write_text(text, encoding='utf-8')
          PY

      - name: Commit governance docs
        shell: bash
        run: |
          if git diff --quiet -- SYSTEM_MAP.md SYSTEM_OVERVIEW.md; then
            echo 'No doc changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SYSTEM_MAP.md SYSTEM_OVERVIEW.md
          git commit -m 'Document 55-market diagnostic geography'
          git push origin HEAD:agent/geography-reconciliation-20260822
