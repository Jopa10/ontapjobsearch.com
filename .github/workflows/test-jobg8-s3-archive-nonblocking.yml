name: Verify JobG8 S3 archive failure is non-blocking

on:
  pull_request:
    paths:
      - ".github/workflows/run-full-jobg8-daily-process.yml"
      - ".github/workflows/test-jobg8-s3-archive-nonblocking.yml"

permissions:
  contents: read

jobs:
  verify-nonblocking-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Confirm production workflow marks both AWS steps non-blocking
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/run-full-jobg8-daily-process.yml").read_text()

          def step_block(name, next_name):
              return workflow.split(f"- name: {name}", 1)[1].split(f"- name: {next_name}", 1)[0]

          auth = step_block(
              "Configure AWS credentials for JobG8 archive",
              "Archive validated JobG8 raw feed",
          )
          archive = step_block(
              "Archive validated JobG8 raw feed",
              "Warn if JobG8 S3 archive failed",
          )

          for label, block in (("AWS credential setup", auth), ("S3 archive", archive)):
              assert re.search(r"^\\s+continue-on-error: true$", block, re.MULTILINE), (
                  f"{label} is not configured as non-blocking"
              )
          print("Both AWS-only steps are configured as non-blocking.")
          PY

      - name: Simulate AWS credential setup failure
        id: aws_auth
        continue-on-error: true
        run: exit 1

      - name: Simulate S3 archive failure
        id: s3_archive
        continue-on-error: true
        run: exit 1

      - name: Simulate selector and publish continuing
        id: publish
        run: echo "downstream processing ran"

      - name: Assert failures did not stop downstream processing
        env:
          AWS_OUTCOME: ${{ steps.aws_auth.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.s3_archive.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          test "$AWS_OUTCOME" = "failure"
          test "$ARCHIVE_OUTCOME" = "failure"
          test "$PUBLISH_OUTCOME" = "success"
          echo "Passed: publishing can continue after AWS/S3 archive failures."
