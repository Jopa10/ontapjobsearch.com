name: Temporary validate 55-market geography

on:
  push:
    branches:
      - agent/geography-reconciliation-20260822
    paths:
      - .github/workflows/tmp-validate-55-market-geography.yml

permissions:
  contents: write

jobs:
  validate-55-market-geography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geography-reconciliation-20260822
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Download current JobG8 feed
        env:
          JOBG8_FEED_URL: ${{ secrets.JOBG8_FEED_URL }}
        run: |
          set -euo pipefail
          : "${JOBG8_FEED_URL:?JOBG8_FEED_URL secret is not configured}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            --connect-timeout 30 --max-time 180 \
            "$JOBG8_FEED_URL" \
            --output "$RUNNER_TEMP/jobg8.zip"
          test -s "$RUNNER_TEMP/jobg8.zip"

      - name: Materialize current JobG8 workbook
        run: |
          set -euo pipefail
          rm -f pipeline/input/*.xlsx pipeline/input/*.xls pipeline/input/*.xlsm pipeline/input/*.csv
          python pipeline/scripts/jobg8_xml_adapter.py \
            --zip "$RUNNER_TEMP/jobg8.zip" \
            --output pipeline/input/jobg8.xlsx \
            --expected-min 5000 \
            --expected-max 20000
          python pipeline/scripts/validate_jobg8_feed_health.py --input pipeline/input/jobg8.xlsx

      - name: Run governed three-family 55-market diagnostic
        working-directory: pipeline
        run: python -m scripts.assess_daily_family_coverage

      - name: Verify and write audit evidence
        run: |
          python - <<'PY'
          import csv
          import json
          import shutil
          from pathlib import Path

          coverage = Path('pipeline/reports-daily/daily-family-coverage.csv')
          with coverage.open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 165, f'expected 165 rows, found {len(rows)}'
          regions = sorted({row['region'] for row in rows}, key=str.casefold)
          assert len(regions) == 55, f'expected 55 markets, found {len(regions)}'
          families = {'service_admin', 'support_worker', 'customer_sales'}
          assert {row['family'] for row in rows} == families
          assert len({(row['region'], row['family']) for row in rows}) == 165

          old_catalog = json.loads(Path('pipeline/config/job_slice_catalog.json').read_text(encoding='utf-8-sig'))
          old_33 = {name for name in old_catalog['regions'] if name != 'Northern Ireland - East'}
          recovered = sorted(set(regions) - old_33, key=str.casefold)
          assert len(recovered) == 22, f'expected exact 22 recovered markets, found {len(recovered)}: {recovered}'

          by_key = {(row['region'], row['family']): int(row['selected_count']) for row in rows}
          feed_date = rows[0]['feed_date']
          out_dir = Path('pipeline/reports-discovery-audit')
          out_dir.mkdir(parents=True, exist_ok=True)
          audit_csv = out_dir / 'geography-55-market-current-feed-coverage.csv'
          shutil.copyfile(coverage, audit_csv)

          lines = [
              '# Ontap 55-market current-feed validation',
              '',
              f'Feed date: **{feed_date}**',
              '',
              '- Assessable England markets: **55**',
              '- Families: **3** (Service Admin, Support Worker, Customer Sales)',
              '- Region/family rows: **165**',
              '- Markets recovered beyond the old configured 33: **22**',
              '- This is diagnostic evidence only; no LIVE slice or public route is activated by this run.',
              '',
              '## Recovered-market counts',
              '',
              '| Market | Service Admin | Support Worker | Customer Sales |',
              '|---|---:|---:|---:|',
          ]
          for region in recovered:
              lines.append(
                  f"| {region} | {by_key[(region, 'service_admin')]} | {by_key[(region, 'support_worker')]} | {by_key[(region, 'customer_sales')]} |"
              )
          lines.extend([
              '',
              '## Mechanical checks',
              '',
              '- Exactly 55 unique markets were present.',
              '- Exactly 165 unique market/family pairs were present.',
              '- The recovered set was exactly the 22 markets absent from the former 33-market England footprint.',
              '- Full CSV evidence is retained alongside this report.',
              '',
          ])
          (out_dir / 'geography-55-market-current-feed-validation.md').write_text('\n'.join(lines), encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Commit audit evidence to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            pipeline/reports-discovery-audit/geography-55-market-current-feed-validation.md \
            pipeline/reports-discovery-audit/geography-55-market-current-feed-coverage.csv
          git commit -m 'Record current-feed 55-market geography validation'
          git push origin HEAD:agent/geography-reconciliation-20260822

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: geography-55-market-validation
          path: |
            pipeline/reports-discovery-audit/geography-55-market-current-feed-validation.md
            pipeline/reports-discovery-audit/geography-55-market-current-feed-coverage.csv
            pipeline/reports-daily/daily-family-coverage-history.json
          if-no-files-found: error
          retention-days: 7
