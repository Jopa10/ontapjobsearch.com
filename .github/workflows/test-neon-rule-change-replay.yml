name: Neon Tuesday rule-change replay (Preview only)
on:
  push:
    branches: [feat/neon-shadow-database]
    paths: [database/shadow/rule-replay-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: ontap-neon-rule-change-replay
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6e001e11000854fd211f984c7d4db9f8b40e51e1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pandas openpyxl==3.1.5
      - name: Restore exact Tuesday archive and verify checksum
        env:
          SAVED_URL: ${{ secrets.ONTAP_SAVED_FEED_URL }}
        run: |
          set -euo pipefail
          mkdir -p replay-input
          archive_url="$(printf '%s' "$SAVED_URL" | tr -d '[:space:]')"
          curl --fail --silent --show-error --location --max-time 180 "$archive_url" -o replay-input/feed.zip
          python - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('replay-input/feed.zip').read_bytes()).hexdigest()=='8638a31e4baca46665fed119fc2ddb227e48959a5da3b055189ae41d6ed55486'
          PY
          python pipeline/scripts/jobg8_xml_adapter.py --zip replay-input/feed.zip --output replay-input/jobg8.xlsx --expected-min 5000 --expected-max 60000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rule-replay-input
          path: replay-input
          retention-days: 1
  selector:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: [before, after]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6e001e11000854fd211f984c7d4db9f8b40e51e1
          persist-credentials: false
          fetch-depth: 1
      - name: Restore only the two approved rule files for before comparison
        if: matrix.version == 'before'
        run: |
          git fetch --depth=1 origin eac8997cc3a48cc1ce3cbee16c77faffc3e4ec8f
          git restore --source=eac8997cc3a48cc1ce3cbee16c77faffc3e4ec8f -- pipeline/scripts/pipeline_refinement.py pipeline/scripts/service_admin_pipeline_core.py
          git diff --stat
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pandas openpyxl==3.1.5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rule-replay-input
          path: replay-input
      - name: Replay full feed in original order
        run: |
          rm -f pipeline/input/*.xlsx pipeline/input/*.xls pipeline/input/*.csv
          cp replay-input/jobg8.xlsx pipeline/input/jobg8.xlsx
          (cd pipeline && python -m scripts.service_admin_pipeline_north_yorkshire)
          python pipeline/scripts/enrich_job_metadata.py --category admin-service
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rule-replay-${{ matrix.version }}
          path: |
            pipeline/output-admin-service/*.json
            pipeline/reports-daily/*decision*.csv
            pipeline/reviews/jobg8/*.csv
          retention-days: 30
  compare:
    needs: selector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/neon-shadow-database
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rule-replay-*
          path: replay-results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14311541647
          run-id: 44039319889
          github-token: ${{ github.token }}
          path: production-reference
      - run: python database/shadow/compare-rule-replay.py
      - name: Verify changed selector decisions and payloads in Neon Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_sLI0SohbF03NrRFj6yZyuN8mOOZB
          VERCEL_ORG_ID: team_xjm8VOa1951ZXxawa7UFF2gd
        run: |
          set -euo pipefail
          cp rule-change-report.json rule-change-jobs.json database/shadow/harness/
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('database/shadow/harness/vercel.json')
          x=json.loads(p.read_text());x['buildCommand']='node verify-rule-replay-neon.mjs';p.write_text(json.dumps(x))
          PY
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/cli" vercel@65.14.0
          cli="$RUNNER_TEMP/cli/node_modules/.bin/vercel"
          cd database/shadow/harness
          "$cli" deploy --yes --target=preview --token="$VERCEL_TOKEN" --scope ontap1 > "$RUNNER_TEMP/rule-neon-deploy.log" 2>&1 || { cat "$RUNNER_TEMP/rule-neon-deploy.log"; exit 1; }
          url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$RUNNER_TEMP/rule-neon-deploy.log" | tail -1)"
          "$cli" curl /rule-replay-neon-report.json --deployment "$url" --scope ontap1 > "$RUNNER_TEMP/rule-replay-neon-report.json"
          python -c "import json,os; r=json.load(open(os.environ['RUNNER_TEMP']+'/rule-replay-neon-report.json')); assert r['status']=='passed'; print(r['changedDecisionRows'])"
      - name: Preserve exact rule-change decisions and production parity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rule-change-comparison
          path: |
            rule-change-report.json
            rule-change-jobs.json
            ${{ runner.temp }}/rule-replay-neon-report.json
            ${{ runner.temp }}/rule-neon-deploy.log
          retention-days: 90
