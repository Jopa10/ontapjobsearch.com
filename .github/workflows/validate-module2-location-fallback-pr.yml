name: Validate Module 2 Location Fallback PR

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/patch_module2_location_fallback.py
      - .github/workflows/validate-module2-location-fallback-pr.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.head_ref == 'agent/module2-location-fallback'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/module2-location-fallback

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: python -m pip install --upgrade pip pandas openpyxl pytest

      - name: Apply guarded patch
        run: python tools/patch_module2_location_fallback.py

      - name: Validate code and regression tests
        run: |
          python -m py_compile pipeline/scripts/jobg8_module_2_monthly_category_profiler.py
          PYTHONPATH=. pytest -q tests/test_module2_location_fallback.py

      - name: Run July Module 2
        working-directory: pipeline
        run: |
          python -m scripts.jobg8_module_2_live_slices \
            --month 2026-07 \
            --input-dir input-jobg8-archive/2026-07 \
            --output-dir /tmp/module2-location-fallback \
            --geo-lookup geo/geo_lookup.xlsx \
            --registers-dir registers
          python - <<'PY'
          import pandas as pd
          summary = pd.read_csv('/tmp/module2-location-fallback/2026-07-module2-category-validation.csv')
          rows = summary[(summary['region'] == 'West Midlands - Birmingham & Solihull') & (summary['category'] == 'admin_service')]
          print(rows.to_string(index=False))
          print(open('/tmp/module2-location-fallback/2026-07-module2-run-log.txt', encoding='utf-8').read())
          PY

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/scripts/jobg8_module_2_monthly_category_profiler.py \
                  tests/test_module2_location_fallback.py
          git commit -m "Align Module 2 geography with live pipeline"
          git push
