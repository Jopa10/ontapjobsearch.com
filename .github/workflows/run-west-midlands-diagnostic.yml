name: Run West Midlands Diagnostic

on:
  workflow_dispatch:
    inputs:
      month:
        description: Month to diagnose in YYYY-MM format
        required: true
        default: '2026-07'
        type: string
  pull_request:
    paths:
      - pipeline/scripts/jobg8_west_midlands_diagnostic.py
      - .github/workflows/run-west-midlands-diagnostic.yml
  push:
    branches:
      - agent/west-midlands-diagnostic
    paths:
      - pipeline/scripts/jobg8_west_midlands_diagnostic.py
      - .github/workflows/run-west-midlands-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Resolve and validate month
        id: month
        shell: bash
        run: |
          set -euo pipefail
          month='${{ github.event.inputs.month }}'
          if [ -z "$month" ]; then
            month='2026-07'
          fi
          if [[ ! "$month" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error::Invalid month '$month'. Expected YYYY-MM."
            exit 1
          fi
          echo "value=$month" >> "$GITHUB_OUTPUT"

      - name: Check diagnostic syntax
        run: |
          python -m py_compile pipeline/scripts/jobg8_west_midlands_diagnostic.py
          python -m py_compile pipeline/scripts/jobg8_module_2_monthly_category_profiler.py

      - name: Run review-only diagnostic
        working-directory: pipeline
        run: |
          set -euo pipefail
          month='${{ steps.month.outputs.value }}'
          python -m scripts.jobg8_west_midlands_diagnostic \
            --month "$month" \
            --input-dir "input-jobg8-archive/$month" \
            --output-dir 'reports-module2' \
            --geo-lookup 'geo/geo_lookup.xlsx' \
            --registers-dir 'registers'

      - name: Verify outputs
        run: |
          set -euo pipefail
          month='${{ steps.month.outputs.value }}'
          for output in \
            "pipeline/reports-module2/$month-west-midlands-diagnostic-summary.csv" \
            "pipeline/reports-module2/$month-west-midlands-diagnostic-detail.csv" \
            "pipeline/reports-module2/$month-west-midlands-diagnostic-log.txt"; do
            test -s "$output" || { echo "::error::Missing output $output"; exit 1; }
          done

      - name: Upload diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: west-midlands-diagnostic-${{ steps.month.outputs.value }}
          path: |
            pipeline/reports-module2/${{ steps.month.outputs.value }}-west-midlands-diagnostic-summary.csv
            pipeline/reports-module2/${{ steps.month.outputs.value }}-west-midlands-diagnostic-detail.csv
            pipeline/reports-module2/${{ steps.month.outputs.value }}-west-midlands-diagnostic-log.txt

      - name: Commit diagnostic outputs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          month='${{ steps.month.outputs.value }}'
          outputs=(
            "pipeline/reports-module2/$month-west-midlands-diagnostic-summary.csv"
            "pipeline/reports-module2/$month-west-midlands-diagnostic-detail.csv"
            "pipeline/reports-module2/$month-west-midlands-diagnostic-log.txt"
          )
          if [ -z "$(git status --porcelain -- "${outputs[@]}")" ]; then
            echo "No diagnostic changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${outputs[@]}"
          git commit -m "Run West Midlands diagnostic for $month"
          git push
