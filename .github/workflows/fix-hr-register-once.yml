name: One-off HR register repair

on:
  push:
    paths:
      - '.github/workflows/fix-hr-register-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild HR register safely
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('pipeline/registers/hr_recruitment_title_classification_register.csv')
          with path.open('r', encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              rows = list(reader)

          additions = [
              ('HR Assistant','HIGH_CONFIDENCE','Clear entry/intermediate HR support title','18'),
              ('Recruitment Coordinator','HIGH_CONFIDENCE','Clear recruitment coordination/support title','6'),
              ('Recruitment Administrator','HIGH_CONFIDENCE','Clear recruitment administration title','6'),
              ('Recruitment Resourcer','HIGH_CONFIDENCE','Clear recruitment resourcing/support title','4'),
              ('HR Coordinator','HIGH_CONFIDENCE','Clear entry/intermediate HR coordination title','4'),
              ('HR Officer','HIGH_CONFIDENCE','Clear operational HR support title','3'),
              ('HR Recruitment Assistant','HIGH_CONFIDENCE','Clear HR/recruitment assistant title','3'),
              ('Training Administrator','ELASTIC_FIT','Credible people-development/training administration crossover','3'),
              ('Learning & Development Coordinator','ELASTIC_FIT','Credible learning-and-development coordination role','2'),
              ('Learning and Development Coordinator','ELASTIC_FIT','Credible learning-and-development coordination role','2'),
              ('Recruitment Operations Coordinator','HIGH_CONFIDENCE','Clear recruitment operations/support title','2'),
              ('Temporary HR Administrator','HIGH_CONFIDENCE','Clear HR administration title','2'),
          ]

          existing = {r['title'].strip().lower() for r in rows}
          for title, classification, reason, count in additions:
              if title.lower() not in existing:
                  rows.append({
                      'title': title,
                      'classification': classification,
                      'review_status': 'REGISTER_EXPANSION_2026-08-11',
                      'reason': reason,
                      'count_in_feed': count,
                      'west_south_regions_seen': '',
                      'example_towns': '',
                  })

          with path.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          with path.open('r', encoding='utf-8-sig', newline='') as f:
              check = list(csv.DictReader(f))
          if len(check) != len(rows):
              raise SystemExit('CSV validation failed after rewrite')
          print(f'Validated {len(check)} HR register rows')
          PY

      - name: Commit repaired register
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline/registers/hr_recruitment_title_classification_register.csv
          if git diff --cached --quiet; then
            echo 'No register changes needed'
            exit 0
          fi
          git commit -m 'Repair HR register CSV and apply 10k expansion'
          git push
