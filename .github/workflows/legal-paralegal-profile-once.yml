name: Profile current Legal paralegal seam once

on:
  push:
    paths:
      - '.github/workflows/legal-paralegal-profile-once.yml'

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact paralegal profile
        run: |
          python - <<'PY'
          import csv, re
          from collections import Counter
          from pathlib import Path

          src = Path('pipeline/reports-discovery-audit/jobg8-legal-assistant-paralegal-discovery-current.csv')
          rows = list(csv.DictReader(src.open(encoding='utf-8-sig', newline='')))

          def truth(v): return str(v).strip().casefold() == 'true'
          unique = [r for r in rows if not truth(r.get('is_content_duplicate')) and not truth(r.get('is_duplicate'))]
          active = [r for r in unique if r.get('provisional_decision') in {'LIKELY_IN','BORDERLINE'}]
          para = [r for r in active if re.search(r'\bparalegal\b', r.get('title',''), re.I)]
          definite = [r for r in para if r.get('provisional_decision') == 'LIKELY_IN']
          borderline = [r for r in para if r.get('provisional_decision') == 'BORDERLINE']
          mixed_fee = [r for r in para if re.search(r'\bfee\s+earner\b', r.get('title',''), re.I)]
          convey = [r for r in para if re.search(r'\bconveyanc', r.get('title',''), re.I)]
          senior_title = [r for r in para if re.search(r'\b(senior|team\s+leader|litigation\s+executive|lead)\b', r.get('title',''), re.I)]
          own_work = [r for r in para if re.search(r'\b(manag(?:e|ing)\s+(?:your|own|a)\s+(?:own\s+)?(?:case[- ]?load|files?)|run(?:ning)?\s+(?:matters|files?)\s+from\s+start\s+to\s+finish|greater\s+autonomy|minimal\s+supervision)\b', r.get('description_excerpt',''), re.I)]

          salary = Counter(r.get('salary_bucket') or 'missing/unknown' for r in para)
          markets = Counter(r.get('assessable_market') or 'Other / Unknown' for r in para)
          titles = Counter(r.get('title') or '(blank)' for r in para)

          lines = [
            '# Legal Assistant / Paralegal — paralegal seam profile', '',
            'Current source: `jobg8-legal-assistant-paralegal-discovery-current.csv`.',
            'Counts are content-unique and include only current LIKELY_IN/BORDERLINE jobs.', '',
            f'- Paralegal-titled active jobs: **{len(para)}**',
            f'- LIKELY_IN: **{len(definite)}**',
            f'- BORDERLINE: **{len(borderline)}**',
            f'- Conveyancing-titled paralegals: **{len(convey)}**',
            f'- Mixed Paralegal/Fee Earner titles: **{len(mixed_fee)}**',
            f'- Explicit senior/team-lead/executive/lead paralegal titles: **{len(senior_title)}**',
            f'- Advert text explicitly signalling own caseload/files, minimal supervision or greater autonomy: **{len(own_work)}**', '',
            '## Salary buckets', '', '| Jobs | Salary bucket |', '|---:|---|'
          ]
          for bucket,count in salary.most_common(): lines.append(f'| {count} | {bucket} |')
          lines += ['', '## Most common titles', '', '| Jobs | Title |', '|---:|---|']
          for title,count in titles.most_common(40): lines.append(f'| {count} | {title.replace("|","/")} |')
          lines += ['', '## Strongest markets', '', '| Jobs | Market |', '|---:|---|']
          for market,count in markets.most_common(30): lines.append(f'| {count} | {market.replace("|","/")} |')
          lines += ['', '## Senior / autonomous edge rows', '', '| Title | Salary | Market | Why flagged |', '|---|---|---|---|']
          edge=[]
          seen=set()
          for r in senior_title + own_work + mixed_fee:
            key=r.get('content_dedupe_key') or r.get('display_reference')
            if key in seen: continue
            seen.add(key); edge.append(r)
          for r in edge:
            reasons=[]
            if r in senior_title: reasons.append('senior/team-lead title')
            if r in own_work: reasons.append('own caseload/files or autonomy text')
            if r in mixed_fee: reasons.append('mixed Paralegal/Fee Earner title')
            sal=r.get('salary_bucket') or 'missing/unknown'
            lines.append(f'| {r.get("title","").replace("|","/")} | {sal} | {r.get("assessable_market","").replace("|","/")} | {"; ".join(reasons)} |')

          out=Path('pipeline/reports-discovery-audit/jobg8-legal-assistant-paralegal-paralegal-profile-current.md')
          out.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY
      - name: Commit profile and remove helper
        run: |
          set -euo pipefail
          git add pipeline/reports-discovery-audit/jobg8-legal-assistant-paralegal-paralegal-profile-current.md
          git rm .github/workflows/legal-paralegal-profile-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Legal paralegal seam profile'
          git pull --rebase origin main
          git push origin HEAD:main
