name: List unresolved geo once

on:
  push:
    paths:
      - '.github/workflows/list-unresolved-geo-once.yml'

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: List current unresolved factual locations
        working-directory: pipeline
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('manifests/external/teaching-vacancies/teaching-vacancies-unresolved-2026-08-07.csv')
          with path.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          print(f'COUNT={len(rows)}')
          for i, row in enumerate(rows, 1):
              print(f"{i:02d}|{row['title']}|{row['location']}|{row['postcode']}")
          PY
      - name: Remove one-time listing workflow
        run: |
          git rm .github/workflows/list-unresolved-geo-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time unresolved geography listing"
          git push origin main
