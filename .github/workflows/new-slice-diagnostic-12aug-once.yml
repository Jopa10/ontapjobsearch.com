name: One-off 12 Aug new slice diagnostic

on:
  push:
    paths:
      - '.github/workflows/new-slice-diagnostic-12aug-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl
      - name: Rank new regional category slices
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          import re
          from pathlib import Path

          DAYS=['2026-08-11','2026-08-12']; BASE=Path('pipeline'); REGS=BASE/'registers'; GEO=BASE/'geo'/'geo_lookup.xlsx'
          selected={'HIGH_CONFIDENCE','ELASTIC_FIT'}
          specs={
            'support_worker':'support_worker_title_classification_register.csv',
            'admin_service':'admin_service_title_classification_register.csv',
            'finance_accounts':'finance_accounts_title_classification_register.csv',
            'customer_service_contact_centre':'customer_service_contact_centre_title_classification_register.csv',
            'warehouse_logistics':'warehouse_logistics_title_classification_register.csv',
            'hr_recruitment':'hr_recruitment_title_classification_register.csv',
          }
          live={
            ('Yorkshire - West','support_worker'),('Yorkshire - West','admin_service'),('Yorkshire - South','support_worker'),('Yorkshire - South','admin_service'),
            ('North East','support_worker'),('North East','admin_service'),('London','admin_service'),('Hampshire','admin_service'),('Hampshire','support_worker'),
            ('Surrey','admin_service'),('Kent','admin_service'),('Sussex','admin_service'),('Sussex','support_worker'),('Cumbria - South','support_worker'),
          }
          ne_parts={'North East - Tyneside, Wearside & Northumberland','North East - County Durham & Darlington/Hartlepool','North East - Tees Valley'}
          def norm(v):
            if v is None or pd.isna(v): return ''
            return re.sub(r'\s+',' ',str(v).strip()).lower()
          registers={}
          for cat,fn in specs.items():
            rr=pd.read_csv(REGS/fn,dtype=str).fillna('')
            registers[cat]={norm(x.title) for _,x in rr.iterrows() if x.classification.strip().upper() in selected and norm(x.title)}
          area_df=pd.read_excel(GEO,dtype=str).fillna('')
          area_map={norm(x.Area):str(x.Cluster).strip() for _,x in area_df.iterrows() if norm(x.Area) and str(x.Cluster).strip()}
          fb=pd.read_excel(GEO,sheet_name='LocationFallback',dtype=str).fillna('')
          fallback={norm(x.Location):str(x.Cluster).strip() for _,x in fb.iterrows() if norm(x.Status)=='auto' and norm(x.Location) and str(x.Cluster).strip()}

          rows=[]
          for day in DAYS:
            df=pd.read_excel(BASE/'input-jobg8-archive'/'2026-08'/f'{day}.xlsx',dtype=str).fillna('')
            for i,row in df.iterrows():
              jid=str(row.get('/Job/DisplayReference','')).strip() or f'{day}-row-{i+2}'
              title=str(row.get('/Job/Position','')).strip(); tk=norm(title)
              cats=[c for c,s in registers.items() if tk in s]
              if not cats: continue
              area=norm(row.get('/Job/Area','')); loc=norm(row.get('/Job/Location',''))
              region=area_map.get(area,'Other / Unknown') if area and area not in {'not specified','unknown'} else fallback.get(loc,'Other / Unknown')
              company=str(row.get('/Job/AdvertiserName','')).strip() or 'Unknown company'
              place=str(row.get('/Job/Location','')).strip() or str(row.get('/Job/Area','')).strip() or 'Unknown'
              for c in cats:
                rows.append((day,jid,region,c,title,company,place))
                if region in ne_parts: rows.append((day,jid,'North East',c,title,company,place))
          data=pd.DataFrame(rows,columns=['day','jid','region','cat','title','company','place']).drop_duplicates(['day','jid','region','cat'])

          metrics=[]
          for (region,cat),g in data.groupby(['region','cat']):
            if region=='Other / Unknown': continue
            g11=g[g.day==DAYS[0]]; g12=g[g.day==DAYS[1]]; n11=g11.jid.nunique(); n12=g12.jid.nunique()
            if n12<4: continue
            cc=g12.groupby('company').jid.nunique().sort_values(ascending=False)
            metrics.append(dict(region=region,cat=cat,day11=n11,day12=n12,titles=g12.title.nunique(),companies=g12.company.nunique(),places=g12.place.nunique(),top1=(cc.iloc[0]/n12 if len(cc) else 0),top2=(cc.iloc[:2].sum()/n12 if len(cc) else 0),live=((region,cat) in live)))
          m=pd.DataFrame(metrics)

          # Practical launch assessment: two expanded-feed days only, so use current volume + breadth + concentration.
          # Location count is printed but not used as a hard gate because JobG8 often supplies only a broad regional Location value.
          def tier(r):
            if r['live']: return 'EXISTING'
            if r['region'] in ne_parts: return 'OVERLAPS_NE_AGGREGATE'
            breadth=r['titles']>=5 and r['companies']>=4
            concentration=r['top1']<0.50 and r['top2']<0.70
            if r['day12']>=8 and r['day11']>=6 and breadth and concentration: return 'PUBLISH_NOW'
            if r['day12']>=6 and r['day11']>=4 and breadth and concentration: return 'CLOSE'
            return 'WAIT'
          m['tier']=m.apply(tier,axis=1)

          print('PUBLISH_NOW')
          now=m[m.tier=='PUBLISH_NOW'].sort_values(['day12','companies'],ascending=False)
          for _,r in now.iterrows():
            print(f"{r['region']}|{r['cat']}|d11={r['day11']}|d12={r['day12']}|titles={r['titles']}|companies={r['companies']}|locations={r['places']}|top1={r['top1']:.1%}|top2={r['top2']:.1%}")
          print('\nCLOSE')
          close=m[m.tier=='CLOSE'].sort_values(['day12','companies'],ascending=False)
          for _,r in close.iterrows():
            print(f"{r['region']}|{r['cat']}|d11={r['day11']}|d12={r['day12']}|titles={r['titles']}|companies={r['companies']}|locations={r['places']}|top1={r['top1']:.1%}|top2={r['top2']:.1%}")

          def ids_for_pairs(pairs):
            out=set()
            for region,cat in pairs:
              out |= set(data[(data.day==DAYS[1])&(data.region==region)&(data['cat']==cat)].jid)
            return out
          existing_ids=ids_for_pairs(live)
          now_pairs=list(zip(now.region,now['cat'])); close_pairs=list(zip(close.region,close['cat']))
          now_ids=ids_for_pairs(now_pairs); close_ids=ids_for_pairs(close_pairs)
          print('\nUNION_SUMMARY')
          print('EXISTING_SLICE_SELECTED_UNION',len(existing_ids))
          print('PUBLISH_NOW_SLICE_COUNT',len(now_pairs))
          print('PUBLISH_NOW_SELECTED_UNION',len(now_ids))
          print('PUBLISH_NOW_INCREMENTAL_OVER_EXISTING',len(now_ids-existing_ids))
          print('EXISTING_PLUS_PUBLISH_NOW_UNION',len(existing_ids|now_ids))
          print('CLOSE_SLICE_COUNT',len(close_pairs))
          print('CLOSE_SELECTED_UNION',len(close_ids))
          print('CLOSE_INCREMENTAL_OVER_EXISTING_PLUS_NOW',len(close_ids-(existing_ids|now_ids)))
          print('EXISTING_PLUS_NOW_PLUS_CLOSE_UNION',len(existing_ids|now_ids|close_ids))
          PY
