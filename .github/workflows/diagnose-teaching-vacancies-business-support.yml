name: Diagnose Teaching Vacancies business support

on:
  push:
    branches:
      - agent/teaching-vacancies-business-support-diagnostic
    paths:
      - ".github/workflows/diagnose-teaching-vacancies-business-support.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and describe search responses
        working-directory: pipeline
        run: |
          python - <<'PY'
          import html
          import re
          import ssl
          import urllib.request

          urls = [
              "https://teaching-vacancies.service.gov.uk/jobs?keyword=business+support",
              "https://teaching-vacancies.service.gov.uk/jobs?keyword=business%20support",
              "https://teaching-vacancies.service.gov.uk/jobs?keyword=administrator",
          ]
          for url in urls:
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Ontap external-jobs review POC/1.0 (+https://www.ontapjobsearch.com/contact)",
                      "Accept": "text/html,application/xhtml+xml",
                  },
              )
              with urllib.request.urlopen(
                  request,
                  timeout=30,
                  context=ssl.create_default_context(),
              ) as response:
                  document = response.read().decode(
                      response.headers.get_content_charset() or "utf-8",
                      "replace",
                  )
                  final_url = response.geturl()
                  status = response.status
              title = re.search(r"<title[^>]*>(.*?)</title>", document, flags=re.I | re.S)
              title_text = html.unescape(re.sub(r"\s+", " ", title.group(1))).strip() if title else ""
              visible = html.unescape(re.sub(r"<[^>]+>", " ", document))
              visible = re.sub(r"\s+", " ", visible).strip()
              job_links = sorted(set(re.findall(r'href=["\']([^"\']*/jobs/[^"\']*)["\']', document, flags=re.I)))
              audit = re.search(r"Showing\s+[\d,]+\s+to\s+[\d,]+\s+of\s+[\d,]+\s+results", visible, flags=re.I)
              print("URL:", url)
              print("STATUS:", status)
              print("FINAL_URL:", final_url)
              print("TITLE:", title_text)
              print("AUDIT:", audit.group(0) if audit else "NONE")
              print("JOB_LINKS:", len(job_links))
              print("VISIBLE_START:", visible[:1500])
              print("---")
          PY
