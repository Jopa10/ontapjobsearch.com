name: One-off update Sales governance reporting

on:
  push:
    branches:
      - agent/update-sales-governance-reporting
    paths:
      - .github/workflows/one-off-update-sales-governance-reporting.yml

permissions:
  contents: write

jobs:
  update-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-sales-governance-reporting
          fetch-depth: 0

      - name: Update governance docs
        run: |
          python - <<'PY'
          from pathlib import Path

          recent_bullet = (
              "- 21 August 2026 — The daily regional overview now treats **Customer Sales / Sales Advisor as a first-class LIVE family** rather than test-only. "
              "The current verified snapshot is **3 / 33 LIVE regions and 33 LIVE jobs**: **London 20, Greater Manchester - Manchester & Salford 6, Yorkshire - West 7**. "
              "LIVE Sales counts are read from the current published Customer Sales configured-slice JSON, and the overview refreshes when relevant Sales register/report/page inputs change. "
              "NOT LIVE Sales Advisor remains `—` until the governed 33-region daily Sales assessment is wired into this overview; `—` means not assessed, not zero.\n"
          )

          overview_path = Path("SYSTEM_OVERVIEW.md")
          overview = overview_path.read_text(encoding="utf-8")
          overview = overview.replace(
              "**Status:** Canonical production state after architecture cleanup, regional/city expansion, deployment-path verification, NHS Administrative & Clerical integration, search/UX hardening and initial Customer Sales production launch.",
              "**Status:** Canonical production state after architecture cleanup, regional/city expansion, deployment-path verification, NHS Administrative & Clerical integration, search/UX hardening, Customer Sales production launch and live regional reporting.",
          )
          if "daily regional overview now treats **Customer Sales / Sales Advisor as a first-class LIVE family**" not in overview:
              marker = "## Recent canonical changes\n\n"
              if marker not in overview:
                  raise SystemExit("SYSTEM_OVERVIEW recent-changes marker missing")
              overview = overview.replace(marker, marker + recent_bullet, 1)

          overview_reports_old = (
              "The daily regional overview is backed by same-feed Service Admin and Support Worker assessments across all 33 canonical regions. "
              "A zero in those assessed families is a real current zero rather than “not assessed”."
          )
          overview_reports_new = overview_reports_old + (
              "\n\nCustomer Sales / Sales Advisor is now represented in that overview as a LIVE production family wherever `region_category_slice_register.csv` says `customer_sales,LIVE`. "
              "Its LIVE counts come directly from the current published configured-slice JSON rather than the old proof/test outputs. "
              "The 21 August snapshot is **3 / 33 LIVE regions and 33 LIVE jobs (London 20, Manchester & Salford 6, Yorkshire - West 7)**. "
              "NOT LIVE Sales Advisor cells remain `—` for now because the governed 33-region daily Sales diagnostic has not yet been integrated into the overview; this is explicitly ‘not assessed’, not zero."
          )
          if "Customer Sales / Sales Advisor is now represented in that overview as a LIVE production family" not in overview:
              if overview_reports_old not in overview:
                  raise SystemExit("SYSTEM_OVERVIEW reports paragraph missing")
              overview = overview.replace(overview_reports_old, overview_reports_new, 1)

          overview_path.write_text(overview, encoding="utf-8")

          map_path = Path("SYSTEM_MAP.md")
          system_map = map_path.read_text(encoding="utf-8")
          system_map = system_map.replace(
              "**Status:** Canonical production architecture after cleanup, regional/city expansion, deployment-path verification, NHS Administrative & Clerical integration, search/UX hardening and initial Customer Sales production launch.",
              "**Status:** Canonical production architecture after cleanup, regional/city expansion, deployment-path verification, NHS Administrative & Clerical integration, search/UX hardening, Customer Sales production launch and live regional reporting.",
          )
          if "daily regional overview now treats **Customer Sales / Sales Advisor as a first-class LIVE family**" not in system_map:
              marker = "## Recent canonical changes\n\n"
              if marker not in system_map:
                  raise SystemExit("SYSTEM_MAP recent-changes marker missing")
              system_map = system_map.replace(marker, marker + recent_bullet, 1)

          map_reports_old = (
              "Customer Sales national/33-region assessment remains diagnostic evidence for non-LIVE regions. A positive count does not activate a region; only the three explicitly approved Customer Sales slices are in production. "
              "The 21 August **20 / 6 / 7** first-live counts are therefore a verification snapshot, not a standing publish threshold."
          )
          map_reports_new = map_reports_old + (
              "\n\n`pipeline/reports-daily/daily-region-overview.md` now treats Sales Advisor as a production family for LIVE reporting. "
              "Its current snapshot is **3 / 33 LIVE regions and 33 LIVE jobs**: London 20, Greater Manchester - Manchester & Salford 6, Yorkshire - West 7. "
              "For these LIVE rows the overview reads the current published `app/_city-pages/configured-slices/**/customer-sales-jobs.json` data directly. "
              "NOT LIVE Sales Advisor remains `—` until a governed 33-region daily Sales assessment is integrated; `—` is deliberately ‘not assessed’, not zero."
          )
          if "daily-region-overview.md` now treats Sales Advisor as a production family for LIVE reporting" not in system_map:
              if map_reports_old not in system_map:
                  raise SystemExit("SYSTEM_MAP Customer Sales reports paragraph missing")
              system_map = system_map.replace(map_reports_old, map_reports_new, 1)

          operations_anchor = "- `ontap-daily-review.yml` — 08:45 Europe/London;\n"
          operations_line = (
              "- `build-daily-region-overview.yml` — rebuilds the 33-region overview after verified publication and when relevant Sales register, live-count, published Sales-slice or overview-code inputs change; LIVE Sales counts are sourced from published configured-slice JSON;\n"
          )
          if "`build-daily-region-overview.yml` — rebuilds the 33-region overview" not in system_map:
              if operations_anchor not in system_map:
                  raise SystemExit("SYSTEM_MAP operations anchor missing")
              system_map = system_map.replace(operations_anchor, operations_anchor + operations_line, 1)

          map_path.write_text(system_map, encoding="utf-8")
          PY

      - name: Commit governance update and remove one-off workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-off-update-sales-governance-reporting.yml
          git add -- SYSTEM_OVERVIEW.md SYSTEM_MAP.md
          git commit -m "Document live Sales Advisor regional reporting"
          git push origin HEAD:agent/update-sales-governance-reporting
