name: Run VONNE review

on:
  workflow_dispatch:
  schedule:
    - cron: "35 6 * * *"

permissions:
  contents: write

jobs:
  run-vonne-review:
    name: Refresh VONNE review only
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install --upgrade pip pandas openpyxl pytest

      - name: Test persistent review decisions
        working-directory: pipeline
        run: python -m unittest tests.test_persistent_external_review_actions -v

      - name: Capture committed VONNE decisions
        working-directory: pipeline
        run: |
          set -euo pipefail
          if test -s reviews/external/vonne-summary.md && test -s reviews/external/vonne-review.csv; then
            python -m external_sources.persistent_external_review_actions capture \
              --summary reviews/external/vonne-summary.md \
              --csv reviews/external/vonne-review.csv \
              --ledger reviews/external/decisions/vonne.csv
          fi

      - name: Download current JobG8 feed for dedupe
        env:
          JOBG8_FEED_URL: ${{ secrets.JOBG8_FEED_URL }}
        run: |
          set -euo pipefail
          : "${JOBG8_FEED_URL:?JOBG8_FEED_URL secret is not configured}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            --connect-timeout 30 --max-time 180 \
            "$JOBG8_FEED_URL" \
            --output "$RUNNER_TEMP/jobg8.zip"
          test -s "$RUNNER_TEMP/jobg8.zip"

      - name: Build temporary JobG8 workbook for dedupe
        run: |
          set -euo pipefail
          rm -f pipeline/input/*.xlsx pipeline/input/*.xls pipeline/input/*.xlsm pipeline/input/*.csv
          python pipeline/scripts/jobg8_xml_adapter.py \
            --zip "$RUNNER_TEMP/jobg8.zip" \
            --output pipeline/input/jobg8.xlsx \
            --expected-min 5000 \
            --expected-max 20000
          test -s pipeline/input/jobg8.xlsx

      - name: Test VONNE proof of concept
        working-directory: pipeline
        run: python -m pytest tests/test_vonne_poc.py -q

      - name: Refresh VONNE review
        working-directory: pipeline
        run: |
          python -m external_sources.vonne_poc \
            --fetch-live \
            --acknowledge-source-terms

      - name: Reapply unchanged remembered VONNE decisions
        working-directory: pipeline
        run: |
          python -m external_sources.persistent_external_review_actions apply \
            --summary reviews/external/vonne-summary.md \
            --csv reviews/external/vonne-review.csv \
            --ledger reviews/external/decisions/vonne.csv \
            --source vonne

      - name: Verify review outputs and live-site isolation
        run: |
          test -s pipeline/reviews/external/vonne-review.csv
          test -s pipeline/reviews/external/vonne-summary.md
          test -s pipeline/reviews/external/decisions/vonne.csv
          git diff --exit-code -- \
            pipeline/output-external \
            pipeline/output-admin-service \
            app

      - name: Commit review only
        run: |
          set -euo pipefail
          review_paths=(
            "pipeline/reviews/external/vonne-review.csv"
            "pipeline/reviews/external/vonne-summary.md"
            "pipeline/reviews/external/decisions/vonne.csv"
          )

          git add -- "${review_paths[@]}"
          staged_files="$(git diff --cached --name-only)"
          if [ -z "$staged_files" ]; then
            echo "No VONNE review changes to commit"
            exit 0
          fi

          unexpected_files="$({ printf '%s\n' "$staged_files" | awk '$0 != "pipeline/reviews/external/vonne-review.csv" && $0 != "pipeline/reviews/external/vonne-summary.md" && $0 != "pipeline/reviews/external/decisions/vonne.csv"'; } || true)"
          if [ -n "$unexpected_files" ]; then
            echo "::error::Refusing to commit files outside the VONNE review:"
            printf '%s\n' "$unexpected_files"
            git reset --mixed
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh VONNE review"
          git push origin main
