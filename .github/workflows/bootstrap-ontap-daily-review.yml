name: Bootstrap Ontap daily review

on:
  push:
    branches:
      - main
    paths:
      - ".github/bootstrap-ontap-daily-review.trigger"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current Ontap daily review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ontap-daily-review.yml --ref main
