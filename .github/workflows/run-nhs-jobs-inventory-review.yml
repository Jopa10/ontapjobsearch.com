name: Run NHS Jobs inventory review

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nhs-inventory-poc
      - agent/nhs-external-api-integration
    paths:
      - .github/workflows/run-nhs-jobs-inventory-review.yml
      - pipeline/external_sources/nhs_jobs_poc.py
      - pipeline/external_sources/nhs_jobs_etl.py
      - pipeline/external_sources/nhs_external_job_board.py
      - pipeline/external_sources/source_mix_policy.py
      - pipeline/tests/test_nhs_jobs_poc.py
      - pipeline/tests/test_nhs_external_job_board.py
      - pipeline/tests/test_source_mix_policy.py

permissions:
  contents: write

jobs:
  nhs-inventory-review:
    name: Test and measure NHS admin inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out triggering branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run NHS integration tests
        working-directory: pipeline
        run: |
          python -m pytest \
            tests/test_nhs_jobs_poc.py \
            tests/test_nhs_external_job_board.py \
            tests/test_source_mix_policy.py \
            -q

      - name: Fetch full NHS Administrative and Clerical inventory
        working-directory: pipeline
        run: |
          python -m external_sources.nhs_jobs_etl \
            --fetch-live \
            --acknowledge-source-terms \
            --max-pages 30

      - name: Print HC title composition
        run: |
          python - <<'PY'
          import csv
          import re
          from collections import Counter
          from pathlib import Path

          path = Path("pipeline/reviews/external/nhs-jobs-admin-clerical-review.csv")
          with path.open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          hc = [row for row in rows if row.get("final_decision") == "HC"]

          def norm(value):
              return re.sub(r"[^a-z0-9]+", " ", (value or "").casefold()).strip()

          medsec = [row for row in hc if "medical secretary" in norm(row.get("title", ""))]
          print(f"Medical Secretary family HC total: {len(medsec)}")
          salary_counts = Counter(row.get("salary_text", "").strip() or "(blank)" for row in medsec)
          print("\nTop salary strings:")
          for salary, count in salary_counts.most_common(20):
              print(f"{count}\t{salary}")

          print("\nCurrent Medical Secretary family rows:")
          for row in medsec:
              print("\t".join([
                  row.get("title", "").replace("\t", " "),
                  row.get("salary_text", "").replace("\t", " "),
                  row.get("employer", "").replace("\t", " "),
                  row.get("locations", "").replace("\t", " "),
                  row.get("source_url", ""),
              ]))
          PY

      - name: Verify review-only boundary
        run: |
          test -s pipeline/reviews/external/nhs-jobs-admin-clerical-review.csv
          test -s pipeline/reviews/external/nhs-jobs-admin-clerical-summary.md
          git diff --exit-code -- \
            pipeline/output-external \
            pipeline/output-admin-service \
            app

      - name: Commit review outputs only
        run: |
          set -euo pipefail
          review_paths=(
            "pipeline/reviews/external/nhs-jobs-admin-clerical-review.csv"
            "pipeline/reviews/external/nhs-jobs-admin-clerical-summary.md"
          )
          git add -- "${review_paths[@]}"
          staged_files="$(git diff --cached --name-only)"
          if [ -z "$staged_files" ]; then
            echo "No NHS review changes to commit"
            exit 0
          fi
          unexpected_files="$({ printf '%s\n' "$staged_files" | awk '$0 != "pipeline/reviews/external/nhs-jobs-admin-clerical-review.csv" && $0 != "pipeline/reviews/external/nhs-jobs-admin-clerical-summary.md"'; } || true)"
          if [ -n "$unexpected_files" ]; then
            echo "::error::Refusing to commit files outside the NHS review:"
            printf '%s\n' "$unexpected_files"
            git reset --mixed
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh NHS Jobs inventory review"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
