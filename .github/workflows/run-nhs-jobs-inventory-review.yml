name: Run NHS Jobs inventory review

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nhs-inventory-poc
    paths:
      - .github/workflows/run-nhs-jobs-inventory-review.yml
      - pipeline/external_sources/nhs_jobs_poc.py
      - pipeline/external_sources/nhs_jobs_etl.py
      - pipeline/tests/test_nhs_jobs_poc.py

permissions:
  contents: write

jobs:
  nhs-inventory-review:
    name: Test and measure NHS admin inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out triggering branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run NHS adapter tests
        working-directory: pipeline
        run: python -m pytest tests/test_nhs_jobs_poc.py -q

      - name: Fetch full NHS Administrative and Clerical inventory
        working-directory: pipeline
        run: |
          python -m external_sources.nhs_jobs_etl \
            --fetch-live \
            --acknowledge-source-terms \
            --max-pages 30

      - name: Print HC title composition
        run: |
          python - <<'PY'
          import csv
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          path = Path("pipeline/reviews/external/nhs-jobs-admin-clerical-review.csv")
          with path.open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          hc = [row for row in rows if row.get("final_decision") == "HC"]

          exact = Counter(row.get("title", "").strip() for row in hc)

          def norm(value):
              return re.sub(r"[^a-z0-9]+", " ", (value or "").casefold()).strip()

          def family(title):
              t = norm(title)
              # Specific NHS-flavoured families first so generic words such as
              # administrator/secretary do not swallow them.
              rules = [
                  ("Medical Secretary", ("medical secretary",)),
                  ("Ward Clerk", ("ward clerk",)),
                  ("Patient Pathway", ("patient pathway",)),
                  ("Booking / Appointments", ("booking clerk", "appointments clerk", "appointment clerk")),
                  ("Medical Records", ("medical records", "records clerk")),
                  ("Reception", ("receptionist", "reception assistant")),
                  ("Business Support", ("business support",)),
                  ("Team Secretary", ("team secretary",)),
                  ("Personal Assistant / PA", ("personal assistant",)),
                  ("Clerical", ("clerical officer", "clerical assistant")),
                  ("Support Officer", ("support officer",)),
                  ("Data Administration", ("data administrator",)),
                  ("Office Administration", ("office administrator", "office assistant")),
                  ("Admin Assistant", ("administrative assistant", "admin assistant", "administration assistant")),
                  ("Generic Administrator", ("administrator",)),
                  ("Secretary - other", ("secretary",)),
              ]
              for label, terms in rules:
                  if any(term in t for term in terms):
                      return label
              return "Other HC"

          fam = Counter()
          samples = defaultdict(list)
          for row in hc:
              f = family(row.get("title", ""))
              fam[f] += 1
              title = row.get("title", "").strip()
              if title not in samples[f] and len(samples[f]) < 8:
                  samples[f].append(title)

          print(f"HC total: {len(hc)}")
          print(f"Distinct exact HC titles: {len(exact)}")
          print("\nHC title families:")
          for label, count in fam.most_common():
              print(f"{count}\t{count/len(hc):.1%}\t{label}")
              print("  examples: " + " | ".join(samples[label]))

          print("\nTop 10 exact HC titles:")
          running = 0
          for title, count in exact.most_common(10):
              running += count
              print(f"{count}\t{title}")
          print(f"Top 10 exact titles account for: {running}/{len(hc)} ({running / len(hc):.1%})")
          PY

      - name: Verify review-only boundary
        run: |
          test -s pipeline/reviews/external/nhs-jobs-admin-clerical-review.csv
          test -s pipeline/reviews/external/nhs-jobs-admin-clerical-summary.md
          git diff --exit-code -- \
            pipeline/output-external \
            pipeline/output-admin-service \
            app

      - name: Commit review outputs only
        run: |
          set -euo pipefail
          review_paths=(
            "pipeline/reviews/external/nhs-jobs-admin-clerical-review.csv"
            "pipeline/reviews/external/nhs-jobs-admin-clerical-summary.md"
          )
          git add -- "${review_paths[@]}"
          staged_files="$(git diff --cached --name-only)"
          if [ -z "$staged_files" ]; then
            echo "No NHS review changes to commit"
            exit 0
          fi
          unexpected_files="$({ printf '%s\n' "$staged_files" | awk '$0 != "pipeline/reviews/external/nhs-jobs-admin-clerical-review.csv" && $0 != "pipeline/reviews/external/nhs-jobs-admin-clerical-summary.md"'; } || true)"
          if [ -n "$unexpected_files" ]; then
            echo "::error::Refusing to commit files outside the NHS review:"
            printf '%s\n' "$unexpected_files"
            git reset --mixed
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh NHS Jobs inventory review"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
