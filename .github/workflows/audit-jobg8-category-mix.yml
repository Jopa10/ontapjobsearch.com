name: Audit JobG8 category mix

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  compare-archived-feeds:
    name: Compare archived 24 and 27 August feeds
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pandas openpyxl boto3

      - name: Configure archive access
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::179402568934:role/OntapJobG8ArchiveGitHubRole
          aws-region: eu-west-2

      - name: Compare JobG8 classifications
        env:
          JOBG8_ARCHIVE_BUCKET: ontap-jobg8-archive-179402568934-eu-west-2-an
          JOBG8_ARCHIVE_REGION: eu-west-2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jobg8-category-mix"
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          import boto3
          import pandas as pd

          bucket = os.environ['JOBG8_ARCHIVE_BUCKET']
          region = os.environ['JOBG8_ARCHIVE_REGION']
          work = Path(os.environ['RUNNER_TEMP']) / 'jobg8-category-mix'
          client = boto3.client('s3', region_name=region)
          dates = ['2026-08-24', '2026-08-27']
          category_column = '/Job/Classification'
          totals = {}

          for day in dates:
              archive = work / f'{day}.zip'
              workbook = work / f'{day}.xlsx'
              client.download_file(bucket, f'jobg8/raw/{day}.zip', str(archive))
              subprocess.run([
                  sys.executable,
                  'pipeline/scripts/jobg8_xml_adapter.py',
                  '--zip', str(archive),
                  '--output', str(workbook),
                  '--expected-min', '5000',
                  '--expected-max', '20000',
              ], check=True)
              frame = pd.read_excel(workbook)
              if category_column not in frame.columns:
                  raise SystemExit(f'{day}: expected JobG8 classification field is missing')
              counts = frame[category_column].fillna('Unclassified').astype(str).str.strip().replace('', 'Unclassified').value_counts()
              totals[day] = counts
              print(f'{day}: {len(frame):,} total raw jobs; {len(counts):,} classifications')

          comparison = pd.concat(totals, axis=1).fillna(0).astype(int)
          comparison.columns = ['2026-08-24', '2026-08-27']
          comparison['change'] = comparison['2026-08-27'] - comparison['2026-08-24']
          comparison['abs_change'] = comparison['change'].abs()
          comparison = comparison.sort_values(['abs_change', '2026-08-24'], ascending=False).drop(columns='abs_change')
          comparison.index.name = 'JobG8 classification'
          report = comparison.to_markdown()
          print('\n' + report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('# JobG8 raw-feed classification comparison\n\n')
              summary.write('Comparison of the archived 10,000-job feeds for 24 and 27 August 2026. No selection or publishing was run.\n\n')
              summary.write(report + '\n')
          PY
