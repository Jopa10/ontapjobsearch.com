name: One-off JobG8 persistence migration

on:
  push:
    branches:
      - main
    paths:
      - pipeline/scripts/persistent_jobg8_review.py

permissions:
  actions: write
  contents: read

jobs:
  dispatch-current-jobg8-run:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full JobG8 daily workflow on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run-full-jobg8-daily-process.yml --repo "${{ github.repository }}" --ref main
