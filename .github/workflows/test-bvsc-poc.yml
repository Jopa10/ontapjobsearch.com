name: Test BVSC proof of concept

on:
  pull_request:
    paths:
      - "pipeline/external_sources/bvsc_poc.py"
      - "pipeline/tests/test_bvsc_poc.py"
      - ".github/workflows/test-bvsc-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bvsc-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install --upgrade pip pandas openpyxl pytest
      - name: Compile
        working-directory: pipeline
        run: python -m py_compile external_sources/bvsc_poc.py
      - name: Test
        working-directory: pipeline
        run: python -m pytest tests/test_bvsc_poc.py -q
      - name: Run live review-only preview
        working-directory: pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          from external_sources import bvsc_poc
          from external_sources.northeast_jobs_poc import (
              load_geo_lookup,
              load_jobg8_candidates as shared_load_jobg8_candidates,
          )

          area_map, fallback_map = load_geo_lookup(Path("geo/geo_lookup.xlsx"))
          bvsc_poc.load_jobg8_candidates = lambda path: shared_load_jobg8_candidates(
              path,
              area_map,
              fallback_map,
          )
          args = bvsc_poc.build_parser().parse_args([
              "--fetch-live",
              "--report-csv", "/tmp/bvsc-review.csv",
              "--summary-md", "/tmp/bvsc-summary.md",
          ])
          bvsc_poc.run(args)
          PY
      - name: Verify preview and no publishing files changed
        run: |
          test -s /tmp/bvsc-review.csv
          test -s /tmp/bvsc-summary.md
          git diff --exit-code -- \
            pipeline/output-external \
            pipeline/output-admin-service \
            app
      - name: Upload BVSC review preview
        uses: actions/upload-artifact@v4
        with:
          name: bvsc-review-preview
          path: |
            /tmp/bvsc-review.csv
            /tmp/bvsc-summary.md
          if-no-files-found: error
          retention-days: 7
