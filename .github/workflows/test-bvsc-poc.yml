name: Test BVSC proof of concept

on:
  pull_request:
    paths:
      - "pipeline/external_sources/bvsc_poc.py"
      - "pipeline/tests/test_bvsc_poc.py"
      - ".github/workflows/test-bvsc-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bvsc-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install --upgrade pip pandas openpyxl pytest
      - name: Compile
        working-directory: pipeline
        run: python -m py_compile external_sources/bvsc_poc.py
      - name: Test
        working-directory: pipeline
        run: python -m pytest tests/test_bvsc_poc.py -q
      - name: Verify no publishing files changed
        run: |
          git diff --exit-code -- \
            pipeline/output-external \
            pipeline/output-admin-service \
            app
