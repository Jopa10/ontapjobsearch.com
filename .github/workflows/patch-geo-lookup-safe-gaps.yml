name: Patch safe geo lookup gaps

on:
  push:
    paths:
      - '.github/workflows/patch-geo-lookup-safe-gaps.yml'

permissions:
  contents: write

concurrency:
  group: patch-safe-geo-lookup-gaps
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook dependency
        run: python -m pip install openpyxl

      - name: Add safe factual geo mappings
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook

          path = Path('pipeline/geo/geo_lookup.xlsx')
          wb = load_workbook(path)
          area_ws = wb[wb.sheetnames[0]]
          headers = {str(c.value).strip(): i for i, c in enumerate(area_ws[1], start=1) if c.value is not None}
          if not {'Area', 'Cluster'} <= set(headers):
              raise SystemExit(f'Area sheet missing required columns: {headers}')

          area_mappings = {
              'Hook Norton': 'Oxfordshire',
              'Woolston': 'Cheshire - Warrington & Halton',
              'Filey': 'Yorkshire - North',
              'Ware': 'Hertfordshire',
              'Longfield': 'Kent',
              'Milford Haven': 'Wales - West',
              'Otley': 'Yorkshire - West',
              'Birmingham': 'West Midlands - Birmingham & Solihull',
          }

          area_col = headers['Area']
          cluster_col = headers['Cluster']
          existing = {}
          for row in range(2, area_ws.max_row + 1):
              area = area_ws.cell(row, area_col).value
              cluster = area_ws.cell(row, cluster_col).value
              if area:
                  existing[str(area).strip().casefold()] = (row, str(cluster).strip() if cluster else '')

          added = []
          for area, cluster in area_mappings.items():
              key = area.casefold()
              if key in existing:
                  row, current = existing[key]
                  if current != cluster:
                      raise SystemExit(f'Conflict for {area}: existing={current!r}, proposed={cluster!r}')
                  continue
              area_ws.append([area, cluster])
              added.append((area, cluster))

          if 'LocationFallback' not in wb.sheetnames:
              raise SystemExit('LocationFallback sheet missing')
          fb = wb['LocationFallback']
          fb_headers = {str(c.value).strip(): i for i, c in enumerate(fb[1], start=1) if c.value is not None}
          if not {'Location', 'Cluster', 'Status'} <= set(fb_headers):
              raise SystemExit(f'LocationFallback missing required columns: {fb_headers}')

          fallback_mappings = {
              'Hertfordshire': 'Hertfordshire',
              'Warrington': 'Cheshire - Warrington & Halton',
              'Staffordshire': 'Staffordshire',
              'Kent': 'Kent',
              'Oxfordshire': 'Oxfordshire',
          }
          loc_col = fb_headers['Location']
          fb_cluster_col = fb_headers['Cluster']
          status_col = fb_headers['Status']
          fb_existing = {}
          for row in range(2, fb.max_row + 1):
              loc = fb.cell(row, loc_col).value
              cluster = fb.cell(row, fb_cluster_col).value
              status = fb.cell(row, status_col).value
              if loc:
                  fb_existing[str(loc).strip().casefold()] = (row, str(cluster).strip() if cluster else '', str(status).strip() if status else '')

          fb_added = []
          for loc, cluster in fallback_mappings.items():
              key = loc.casefold()
              if key in fb_existing:
                  row, current, status = fb_existing[key]
                  if current != cluster:
                      raise SystemExit(f'Fallback conflict for {loc}: existing={current!r}, proposed={cluster!r}')
                  if status.casefold() != 'auto':
                      fb.cell(row, status_col).value = 'AUTO'
                  continue
              row = fb.max_row + 1
              fb.cell(row, loc_col).value = loc
              fb.cell(row, fb_cluster_col).value = cluster
              fb.cell(row, status_col).value = 'AUTO'
              fb_added.append((loc, cluster))

          wb.save(path)
          print('Area mappings added:', added)
          print('Fallback mappings added:', fb_added)
          PY

      - name: Verify mappings
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          wb = load_workbook('pipeline/geo/geo_lookup.xlsx', read_only=True, data_only=True)
          ws = wb[wb.sheetnames[0]]
          rows = {str(r[0]).strip(): str(r[1]).strip() for r in ws.iter_rows(min_row=2, values_only=True) if r[0] and r[1]}
          expected = {
              'Hook Norton': 'Oxfordshire',
              'Woolston': 'Cheshire - Warrington & Halton',
              'Filey': 'Yorkshire - North',
              'Ware': 'Hertfordshire',
              'Longfield': 'Kent',
              'Milford Haven': 'Wales - West',
              'Otley': 'Yorkshire - West',
              'Birmingham': 'West Midlands - Birmingham & Solihull',
          }
          for key, value in expected.items():
              assert rows.get(key) == value, (key, rows.get(key), value)
          print('Verified', len(expected), 'safe area mappings')
          PY

      - name: Document geo lookup correction
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = '23 August 2026 — **safe geo lookup gap correction:**'
          text = (
              '\n23 August 2026 — **safe geo lookup gap correction:** `pipeline/geo/geo_lookup.xlsx` remains the factual location-routing authority. '
              'Specific missing place mappings found during Legal Assistant / Paralegal discovery were added for Hook Norton, Woolston, Filey, Ware, Longfield, Milford Haven, Otley and Birmingham, plus safe county/location fallbacks where unambiguous. '
              'Broad ambiguous values such as `East of England` and bare `Merseyside` remain deliberately unresolved rather than being forced into a canonical market.\n'
          )
          for name in ('SYSTEM_MAP.md', 'SYSTEM_OVERVIEW.md'):
              p = Path(name)
              body = p.read_text(encoding='utf-8')
              if marker not in body:
                  p.write_text(body.rstrip() + '\n' + text, encoding='utf-8')
          PY

      - name: Commit canonical geo correction
        run: |
          set -euo pipefail
          git add pipeline/geo/geo_lookup.xlsx SYSTEM_MAP.md SYSTEM_OVERVIEW.md
          if git diff --cached --quiet; then
            echo 'No geo changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix safe canonical geo lookup gaps'
          git pull --rebase origin main
          git push origin HEAD:main
