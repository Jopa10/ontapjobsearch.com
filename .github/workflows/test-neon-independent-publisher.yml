name: Neon independent publisher input test (Preview only)
on:
  push:
    branches: [feat/neon-shadow-database]
    paths: [database/shadow/independent-test-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: ontap-neon-independent-publisher
  cancel-in-progress: false
jobs:
  replay-existing-python-selector:
    if: github.ref == 'refs/heads/feat/neon-shadow-database'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/neon-shadow-database
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original selector dependencies
        run: python -m pip install --disable-pip-version-check pandas openpyxl==3.1.5 boto3
      - name: Validate pinned completed reference and feed date
        id: req
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          x=json.loads(Path('database/shadow/independent-test-request.json').read_text())
          assert x['mode']=='independent_selector_replay'
          assert re.fullmatch(r'20\d\d-\d\d-\d\d',x['archiveDate'])
          assert x['productionOutputRunId']>0
          a=x['publishedOutputArtifacts']
          assert len(a)==2 and {v['name'] for v in a}=={'service-admin-output','support-worker-output'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('day='+x['archiveDate']+'\n')
            f.write('run_id='+str(x['productionOutputRunId'])+'\n')
            f.write('artifact_ids='+','.join(str(v['id']) for v in a)+'\n')
          PY
      - name: Read archived Monday raw feed only — no current supplier fetch
        env:
          ONTAP_SAVED_FEED_URL: ${{ secrets.ONTAP_SAVED_FEED_URL }}
        run: |
          set -euo pipefail
          test -n "$ONTAP_SAVED_FEED_URL"
          url="$(printf '%s' "$ONTAP_SAVED_FEED_URL" | tr -d '[:space:]')"
          python - "$url" "${{ steps.req.outputs.day }}" <<'PY'
          import sys
          from urllib.parse import urlparse,unquote
          u=urlparse(sys.argv[1]);assert u.scheme=='https'
          assert unquote(u.path).endswith('/'+sys.argv[2]+'.zip'), 'Saved raw feed date differs from selected reference'
          PY
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 180 "$url" -o "$RUNNER_TEMP/replay-jobg8.zip"
          test -s "$RUNNER_TEMP/replay-jobg8.zip"
          sha256sum "$RUNNER_TEMP/replay-jobg8.zip" > "$RUNNER_TEMP/replay-feed-sha256.txt"
      - name: Convert dated feed with existing JobG8 XML adapter
        run: |
          mkdir -p pipeline/input
          rm -f pipeline/input/*.xlsx pipeline/input/*.xls pipeline/input/*.csv
          python pipeline/scripts/jobg8_xml_adapter.py --zip "$RUNNER_TEMP/replay-jobg8.zip" --output pipeline/input/jobg8.xlsx --expected-min 5000 --expected-max 60000
      - name: Generate JobG8 scopes independently using existing Python selector
        working-directory: pipeline
        run: python -m scripts.service_admin_pipeline_north_yorkshire
      - name: Independently enrich selected admin and support-worker JobG8 payloads
        run: |
          python pipeline/scripts/enrich_job_metadata.py --category admin-service
          python -m pipeline.scripts.support_worker_pipeline_live_config
          python pipeline/scripts/enrich_job_metadata.py --category support-worker
      - name: Load the Monday production files strictly as an independent reference
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.req.outputs.artifact_ids }}
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reference
          merge-multiple: true
      - name: Compare every regional/family JobG8 ID and its exact placement order
        run: |
          python database/shadow/verify-independent-selector-replay.py --production-output "$RUNNER_TEMP/reference" --report "$RUNNER_TEMP/independent-publisher-report.json"
      - name: Save independent replay results and generated scopes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-neon-publisher-replay
          path: |
            ${{ runner.temp }}/replay-feed-sha256.txt
            ${{ runner.temp }}/independent-publisher-report.json
            pipeline/output-admin-service/*.json
            pipeline/output-support-worker/*.json
            database/shadow/independent-test-request.json
          if-no-files-found: ignore
          retention-days: 30
