name: Neon independent publisher input test (Preview only)
on:
  push:
    branches: [feat/neon-shadow-database]
    paths: [database/shadow/independent-test-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: ontap-neon-independent-publisher
  cancel-in-progress: false
jobs:
  replay-production-python-selector:
    if: github.ref == 'refs/heads/feat/neon-shadow-database'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/neon-shadow-database
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate Tuesday source and production artifacts
        id: req
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          x=json.loads(Path('database/shadow/independent-test-request.json').read_text())
          assert x['mode']=='independent_selector_replay'
          assert re.fullmatch(r'20\d\d-\d\d-\d\d',x['archiveDate'])
          assert isinstance(x['productionOutputRunId'],int) and x['productionOutputRunId']>0
          sha=x['productionRunCommitSha']
          assert re.fullmatch(r'[a-f0-9]{40}',sha)
          artifacts=x['publishedOutputArtifacts']
          assert len(artifacts)==2 and {a['name'] for a in artifacts}=={'service-admin-output','support-worker-output'}
          assert all(isinstance(a['id'],int) and re.fullmatch(r'[a-f0-9]{64}',a['sha256']) for a in artifacts)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('day='+x['archiveDate']+'\n')
            f.write('run_id='+str(x['productionOutputRunId'])+'\n')
            f.write('artifact_ids='+','.join(str(a['id']) for a in artifacts)+'\n')
            f.write('source_sha='+sha+'\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Jopa10/ontapjobsearch.com
          ref: ${{ steps.req.outputs.source_sha }}
          path: production-source
          persist-credentials: false
      - name: Install production selector dependencies
        run: python -m pip install --disable-pip-version-check pandas openpyxl==3.1.5
      - name: Fetch exact dated saved feed through refreshed URL
        env:
          ONTAP_SAVED_FEED_URL: ${{ secrets.ONTAP_SAVED_FEED_URL }}
          ARCHIVE_DATE: ${{ steps.req.outputs.day }}
        run: |
          set -euo pipefail
          test -n "$ONTAP_SAVED_FEED_URL"
          archive_url="$(printf '%s' "$ONTAP_SAVED_FEED_URL" | tr -d '[:space:]')"
          case "$archive_url" in https://*) ;; *) echo "::error::Saved feed URL must use HTTPS"; exit 1 ;; esac
          python - "$archive_url" "$ARCHIVE_DATE" <<'PY'
          import sys
          from urllib.parse import urlparse,unquote
          if not unquote(urlparse(sys.argv[1]).path).endswith('/'+sys.argv[2]+'.zip'):
              raise SystemExit('Saved feed URL does not identify the exact dated raw archive')
          PY
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 180 "$archive_url" --output "$RUNNER_TEMP/replay-jobg8.zip"
          test -s "$RUNNER_TEMP/replay-jobg8.zip"
          sha256sum "$RUNNER_TEMP/replay-jobg8.zip" | tee "$RUNNER_TEMP/replay-feed-sha256.txt"
      - name: Convert the saved feed using the production XML adapter
        run: |
          mkdir -p production-source/pipeline/input
          rm -f production-source/pipeline/input/*.xlsx production-source/pipeline/input/*.xls production-source/pipeline/input/*.csv
          python production-source/pipeline/scripts/jobg8_xml_adapter.py \
            --zip "$RUNNER_TEMP/replay-jobg8.zip" \
            --output production-source/pipeline/input/jobg8.xlsx \
            --expected-min 5000 --expected-max 60000
      - name: Run the exact production Python selectors
        run: |
          (cd production-source/pipeline && python -m scripts.service_admin_pipeline_north_yorkshire)
          python production-source/pipeline/scripts/enrich_job_metadata.py --category admin-service
          (cd production-source/pipeline && python -m scripts.support_worker_pipeline_live_config)
          python production-source/pipeline/scripts/enrich_job_metadata.py --category support-worker
      - name: Download matching Tuesday production output artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.req.outputs.artifact_ids }}
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reference
          merge-multiple: true
      - name: Compare every live scope and JobG8 ordering
        run: |
          python database/shadow/verify-independent-selector-replay.py \
            --selector-root production-source \
            --production-output "$RUNNER_TEMP/reference" \
            --report "$RUNNER_TEMP/independent-publisher-report.json"
      - name: Preserve full-feed selector replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-production-selector-replay-${{ steps.req.outputs.day }}
          path: |
            ${{ runner.temp }}/replay-feed-sha256.txt
            ${{ runner.temp }}/independent-publisher-report.json
            production-source/pipeline/output-admin-service/*.json
            production-source/pipeline/output-support-worker/*.json
            database/shadow/independent-test-request.json
          if-no-files-found: ignore
          retention-days: 30
