name: Private CPC daily matching test

on:
  push:
    branches: [feat/cpc-job-alerts-brevo]
    paths:
      - pipeline/scripts/send_cpc_job_alerts.py
      - pipeline/tests/test_send_cpc_job_alerts.py
      - .github/workflows/private-cpc-daily-test.yml
      - lib/job-alert-signup.ts
      - app/api/job-alerts/route.ts
      - tests/job-alert-signup.test.ts

concurrency:
  group: ontap-private-cpc-daily-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/feat/cpc-job-alerts-brevo'
    runs-on: ubuntu-latest
    environment: ontap-brevo-private-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test matching and private daily delivery safeguards
        working-directory: pipeline
        run: python -m unittest discover -s tests -p 'test_send_cpc_job_alerts.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Test signup confirmations and existing Preview safeguards
        run: npx tsx --test tests/job-alert-signup.test.ts tests/private-job-alert-test.test.ts tests/cpc-job-alerts.test.ts
      - name: Ensure the private signup confirmation tracking attribute exists
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pipeline.scripts.send_cpc_job_alerts import _brevo_request
          key = os.environ["BREVO_API_KEY"]
          attrs = _brevo_request("GET", "/contacts/attributes", key).get("attributes", [])
          for name in ("ALERT_CONFIRMATION_STATE", "ALERT_PREFERENCES"):
              found = [attr for attr in attrs if attr.get("name") == name]
              if found and (found[0].get("category") != "normal" or found[0].get("type") != "text"):
                  raise SystemExit("The private alert attribute has an unexpected type")
              if not found:
                  _brevo_request("POST", "/contacts/attributes/normal/" + name, key, {"type": "text"})
          print("Private signup confirmation tracking attribute ready; no email sent.")
          PY

      - name: Tidy owner private test alerts once
        if: github.event.head_commit.message == 'Tidy owner private test alert preferences'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse
          from pipeline.scripts.send_cpc_job_alerts import _brevo_request, PRIVATE_TEST_EMAIL
          key = os.environ["BREVO_API_KEY"]
          endpoint = "/contacts/" + urllib.parse.quote(PRIVATE_TEST_EMAIL, safe="")
          contact = _brevo_request("GET", endpoint, key)
          attrs = contact.get("attributes") or {}
          if (contact.get("email", "").lower() != PRIVATE_TEST_EMAIL or
                  3 not in contact.get("listIds", []) or 3 in contact.get("listUnsubscribed", []) or
                  contact.get("emailBlacklisted") or not attrs.get("ALERT_CONSENT_AT")):
              raise SystemExit("Private contact is not active; no changes made")
          before = json.loads(attrs.get("ALERT_PREFERENCES") or "null")
          if not isinstance(before, list) or not 1 <= len(before) <= 10:
              raise SystemExit("Unexpected alert collection; no changes made")
          original = [p for p in before if p.get("role") == "Accounts Assistant" and
                      p.get("location") == "London" and p.get("salary") == "£27000 - £30000 per year"]
          if len(original) != 1:
              raise SystemExit("Original London alert cannot be identified; no changes made")
          after = []
          seen = set()
          for p in before:
              if not isinstance(p, dict) or not all(isinstance(p.get(k), str) for k in ("role", "location", "salary")):
                  raise SystemExit("Invalid stored preference; no changes made")
              value = dict(p)
              if p != original[0]:
                  value["salary"] = ""
                  if value["role"].casefold() == "ad hoc corporate receptionist":
                      value["role"] = "Receptionist"
              identity = tuple(value[k].strip().casefold() for k in ("role", "location", "salary"))
              if identity not in seen:
                  after.append(value)
                  seen.add(identity)
          print("Before:", json.dumps(before, ensure_ascii=True))
          print("After:", json.dumps(after, ensure_ascii=True))
          updates = {"ALERT_PREFERENCES": json.dumps(after, ensure_ascii=False, separators=(",", ":"))}
          # Keep the legacy last-signup display in step with the collection.
          if attrs.get("ALERT_ROLE") == "Ad Hoc Corporate Receptionist":
              updates["ALERT_ROLE"] = "Receptionist"
          if not (attrs.get("ALERT_ROLE") == "Accounts Assistant" and attrs.get("ALERT_LOCATION") == "London"
                  and attrs.get("ALERT_SALARY") == original[0]["salary"]):
              updates["ALERT_SALARY"] = ""
          if after != before:
              _brevo_request("PUT", endpoint, key, {"attributes": updates})
          verified = _brevo_request("GET", endpoint, key).get("attributes", {})
          if json.loads(verified.get("ALERT_PREFERENCES") or "null") != after:
              raise SystemExit("Saved alert readback did not match")
          for field in ("ALERT_LAST_SENT_DATE", "ALERT_CONSENT_AT", "ALERT_CONSENT_VERSION"):
              if verified.get(field) != attrs.get(field):
                  raise SystemExit("Protected contact state unexpectedly changed")
          print(f"Verified {len(after)} saved alerts; original retained; no email sent; daily delivery state unchanged.")
          PY

      - name: Read current published job data (no scripts run from main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: published-inputs
          persist-credentials: false
      - name: Match only the private test contact without sending
        env:
          CPC_JOB_ALERTS_ENABLED: 'true'
          BREVO_JOB_ALERTS_LIST_ID: '3'
          BREVO_SENDER_EMAIL: jobs@ontapjobsearch.com
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          JOB_ALERTS_UNSUBSCRIBE_SECRET: ${{ secrets.JOB_ALERTS_UNSUBSCRIBE_SECRET }}
        run: |
          python - <<'PY'
          import datetime
          import os
          import pathlib
          import subprocess
          import sys
          required = ("BREVO_API_KEY", "JOB_ALERTS_UNSUBSCRIBE_SECRET")
          if any(not os.environ.get(key) for key in required):
              print("Private matching not run: add the existing Brevo API key and unsubscribe secret to the ontap-brevo-private-test GitHub environment. No email sent.")
              sys.exit(1)
          dates = sorted(pathlib.Path("published-inputs/pipeline/reports-daily").glob("newly-published-jobs-????-??-??.csv"))
          if not dates:
              sys.exit("No daily new-jobs report in the feature checkout; no email sent.")
          date = dates[-1].stem.removeprefix("newly-published-jobs-")
          print("Matching report date:", date, flush=True)
          subprocess.run([sys.executable, "pipeline/scripts/send_cpc_job_alerts.py", "--private-daily-test", "--dry-run", "--date", date, "--app-dir", "published-inputs/app", "--reports-dir", "published-inputs/pipeline/reports-daily"], check=True)
          PY

      - name: Private daily delivery runner (starts 23 October)
        if: github.event.head_commit.message == 'Enable private daily test runner'
        env:
          CPC_JOB_ALERTS_ENABLED: 'true'
          BREVO_JOB_ALERTS_LIST_ID: '3'
          BREVO_SENDER_EMAIL: jobs@ontapjobsearch.com
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          JOB_ALERTS_UNSUBSCRIBE_SECRET: ${{ secrets.JOB_ALERTS_UNSUBSCRIBE_SECRET }}
        run: |
          python - <<'PY'
          import datetime
          import pathlib
          import subprocess
          import sys
          date = datetime.datetime.now(datetime.timezone.utc).date()
          if date < datetime.date(2026, 10, 23):
              print("Private daily runner is prepared; no delivery before 23 October.")
              sys.exit(0)
          report = pathlib.Path(f"published-inputs/pipeline/reports-daily/newly-published-jobs-{date.isoformat()}.csv")
          if not report.is_file():
              sys.exit("Today's new-jobs report is not ready; no old report will be sent.")
          subprocess.run([sys.executable, "pipeline/scripts/send_cpc_job_alerts.py",
                          "--private-daily-test", "--date", date.isoformat(),
                          "--app-dir", "published-inputs/app",
                          "--reports-dir", "published-inputs/pipeline/reports-daily"], check=True)
          PY


      - name: Send one explicitly requested private matched sample
        if: github.event.head_commit.message == 'Send one private matched-alert test'
        env:
          CPC_JOB_ALERTS_ENABLED: 'true'
          BREVO_JOB_ALERTS_LIST_ID: '3'
          BREVO_SENDER_EMAIL: jobs@ontapjobsearch.com
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          JOB_ALERTS_UNSUBSCRIBE_SECRET: ${{ secrets.JOB_ALERTS_UNSUBSCRIBE_SECRET }}
        run: |
          python - <<'PY'
          import datetime
          import subprocess
          import sys
          date = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          subprocess.run([sys.executable, "pipeline/scripts/send_cpc_job_alerts.py",
                          "--private-daily-test", "--private-matching-sample", "--date", date,
                          "--app-dir", "published-inputs/app",
                          "--reports-dir", "published-inputs/pipeline/reports-daily"], check=True)
          PY

# Owner-requested matched sample: 24 October 2026.
