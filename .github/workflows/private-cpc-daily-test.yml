name: Private CPC daily matching test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check, stage jobs during the live hour, or start the one-hour private send.
        required: true
        type: choice
        default: check_only
        options:
          - check_only
          - start_one_hour_window
          - add_manual_jobs
      manual_job_ids:
        description: Paste up to 20 Ontap job IDs or direct job URLs, separated by commas or new lines.
        required: false
        type: string
  push:
    branches: [feat/cpc-alert-neon-signup]
    paths:
      - pipeline/scripts/send_cpc_job_alerts.py
      - pipeline/scripts/read_neon_alert_preferences.mjs
      - pipeline/scripts/record_neon_alert_sample.mjs
      - pipeline/scripts/stage_private_manual_jobs.py
      - pipeline/private_email_manual_job_ids.json
      - database/shadow/007_private_email_selection_window.sql
      - pipeline/tests/test_send_cpc_job_alerts.py
      - .github/workflows/private-cpc-daily-test.yml
      - lib/job-alert-signup.ts
      - lib/neon-email-alerts.ts
      - app/api/job-alerts/route.ts
      - app/api/job-alerts/unsubscribe/route.ts
      - tests/job-alert-signup.test.ts
      - tests/neon-email-alerts.test.ts
      - tests/private-job-alert-test.test.ts

concurrency:
  group: ontap-private-cpc-daily-test-${{ (github.event.inputs.mode == 'add_manual_jobs' || (github.event_name == 'push' && github.event.head_commit.message == 'Stage private Preview manual job choices')) && 'stage' || 'delivery' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/feat/cpc-alert-neon-signup'
    runs-on: ubuntu-latest
    environment: ontap-brevo-private-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test matching and private daily delivery safeguards
        working-directory: pipeline
        run: python -m unittest discover -s tests -p 'test_send_cpc_job_alerts.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Test Neon signup, Brevo delivery and Preview safeguards
        run: |
          node --check pipeline/scripts/read_neon_alert_preferences.mjs
          node --check pipeline/scripts/record_neon_alert_sample.mjs
          python -m py_compile pipeline/scripts/stage_private_manual_jobs.py
          npx tsx --test tests/job-alert-signup.test.ts tests/neon-email-alerts.test.ts tests/private-job-alert-test.test.ts tests/cpc-job-alerts.test.ts
      - name: Read the private recipient's saved preferences from Preview Neon
        id: preview_neon_read
        env:
          ONTAP_EMAIL_PREVIEW_DATABASE_URL: ${{ secrets.ONTAP_EMAIL_PREVIEW_DATABASE_URL }}
          ONTAP_EMAIL_PREVIEW_NEON_PROJECT_ID: withered-bread-65990253
          NEON_ALERT_PREFERENCES_OUTPUT: ${{ runner.temp }}/neon-alert-preferences.json
        run: |
          set -euo pipefail
          if [[ -z "$ONTAP_EMAIL_PREVIEW_DATABASE_URL" ]]; then
            echo "Preview Neon read skipped: add ONTAP_EMAIL_PREVIEW_DATABASE_URL to the ontap-brevo-private-test GitHub environment."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node pipeline/scripts/read_neon_alert_preferences.mjs jpbt801@gmail.com
          test -s "$NEON_ALERT_PREFERENCES_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Read only the approved recipient's active, consented preferences from the separate Preview Neon project."

      - name: Ensure required Brevo alert attributes exist (no emails sent)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pipeline.scripts.send_cpc_job_alerts import _brevo_request
          key = os.environ["BREVO_API_KEY"]
          attrs = _brevo_request("GET", "/contacts/attributes", key).get("attributes", [])
          expected = {
              "ALERT_CONFIRMATION_STATE": {"text"},
              "ALERT_LAST_SENT_DATE": {"text", "date"},
          }
          for name, allowed_types in expected.items():
              found = [attr for attr in attrs if attr.get("name") == name]
              if found:
                  attribute = found[0]
                  if (attribute.get("category") != "normal"
                          or attribute.get("type") not in allowed_types):
                      raise SystemExit(
                          f"{name} exists as {attribute.get('category')}/{attribute.get('type')}; "
                          f"expected normal/{' or '.join(sorted(allowed_types))}"
                      )
                  print(f"{name}: existing normal/{attribute.get('type')}")
              else:
                  create_type = "date" if name == "ALERT_LAST_SENT_DATE" else "text"
                  _brevo_request("POST", "/contacts/attributes/normal/" + name, key, {"type": create_type})
                  print(f"{name}: created normal/{create_type}")
          verified = _brevo_request("GET", "/contacts/attributes", key).get("attributes", [])
          for name, allowed_types in expected.items():
              match = next((attr for attr in verified if attr.get("name") == name), None)
              if not match or match.get("category") != "normal" or match.get("type") not in allowed_types:
                  raise SystemExit(f"Brevo attribute verification failed for {name}")
          print("Required Brevo alert attributes confirmed; no email sent.")
          PY
      - name: Read current published job data (no scripts run from main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: published-inputs
          persist-credentials: false
      - name: Verify today's published report is ready
        id: current_report
        if: (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'start_one_hour_window' || github.event.inputs.mode == 'add_manual_jobs')) || (github.event_name == 'push' && (github.event.head_commit.message == 'Start private one-hour Preview alert' || github.event.head_commit.message == 'Stage private Preview manual job choices'))
        run: |
          set -euo pipefail
          date="$(date -u +%F)"
          report="published-inputs/pipeline/reports-daily/newly-published-jobs-$date.csv"
          test -s "$report" || { echo "Today's report is not ready; no window opened and no email sent."; exit 1; }
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "Using today's published CPC report: $date"

      - name: Add chosen jobs to the open one-hour Preview window
        if: steps.preview_neon_read.outputs.available == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'add_manual_jobs') || (github.event_name == 'push' && github.event.head_commit.message == 'Stage private Preview manual job choices'))
        env:
          ONTAP_EMAIL_PREVIEW_DATABASE_URL: ${{ secrets.ONTAP_EMAIL_PREVIEW_DATABASE_URL }}
          ONTAP_EMAIL_PREVIEW_NEON_PROJECT_ID: withered-bread-65990253
          NEON_ALERT_PREFERENCES_OUTPUT: ${{ runner.temp }}/neon-alert-preferences.json
          ONTAP_PRIVATE_MANUAL_JOB_IDS: ${{ github.event.inputs.manual_job_ids }}
          ONTAP_PRIVATE_REPORT_DATE: ${{ steps.current_report.outputs.date }}
          ONTAP_PUBLISHED_APP_DIR: published-inputs/app
        run: python pipeline/scripts/stage_private_manual_jobs.py

      - name: Open the one-hour Preview selection window
        if: steps.preview_neon_read.outputs.available == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'start_one_hour_window') || (github.event_name == 'push' && github.event.head_commit.message == 'Start private one-hour Preview alert'))
        env:
          ONTAP_EMAIL_PREVIEW_DATABASE_URL: ${{ secrets.ONTAP_EMAIL_PREVIEW_DATABASE_URL }}
          ONTAP_EMAIL_PREVIEW_NEON_PROJECT_ID: withered-bread-65990253
          NEON_ALERT_PREFERENCES_OUTPUT: ${{ runner.temp }}/neon-alert-preferences.json
          ONTAP_PRIVATE_REPORT_DATE: ${{ steps.current_report.outputs.date }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          payload = {"action": "openWindow", "reportDate": os.environ["ONTAP_PRIVATE_REPORT_DATE"]}
          subprocess.run(["node", "pipeline/scripts/record_neon_alert_sample.mjs"],
                         input=json.dumps(payload), text=True, check=True)
          PY

      - name: Wait one hour, close the window and read selected jobs
        if: steps.preview_neon_read.outputs.available == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'start_one_hour_window') || (github.event_name == 'push' && github.event.head_commit.message == 'Start private one-hour Preview alert'))
        env:
          ONTAP_EMAIL_PREVIEW_DATABASE_URL: ${{ secrets.ONTAP_EMAIL_PREVIEW_DATABASE_URL }}
          ONTAP_EMAIL_PREVIEW_NEON_PROJECT_ID: withered-bread-65990253
          NEON_ALERT_PREFERENCES_OUTPUT: ${{ runner.temp }}/neon-alert-preferences.json
          NEON_ALERT_MANUAL_SELECTION_OUTPUT: ${{ runner.temp }}/manual-job-ids.json
          ONTAP_PRIVATE_REPORT_DATE: ${{ steps.current_report.outputs.date }}
        run: |
          sleep 3600
          python - <<'PY'
          import json, os, subprocess
          payload = {"action": "closeWindow", "reportDate": os.environ["ONTAP_PRIVATE_REPORT_DATE"]}
          subprocess.run(["node", "pipeline/scripts/record_neon_alert_sample.mjs"],
                         input=json.dumps(payload), text=True, check=True)
          PY
          test -s "$NEON_ALERT_MANUAL_SELECTION_OUTPUT"

      - name: Match automatically without sending
        if: steps.preview_neon_read.outputs.available == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'check_only')
        env:
          CPC_JOB_ALERTS_ENABLED: 'true'
          BREVO_JOB_ALERTS_LIST_ID: '3'
          BREVO_SENDER_EMAIL: jobs@ontapjobsearch.com
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          JOB_ALERTS_UNSUBSCRIBE_SECRET: ${{ secrets.JOB_ALERTS_UNSUBSCRIBE_SECRET }}
        run: |
          python - <<'PY'
          import datetime, os, pathlib, subprocess, sys
          date = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          report = pathlib.Path(f"published-inputs/pipeline/reports-daily/newly-published-jobs-{date}.csv")
          if not report.is_file():
              sys.exit("Today's new-jobs report is not ready; no email sent.")
          prefs = pathlib.Path(os.environ["RUNNER_TEMP"]) / "neon-alert-preferences.json"
          subprocess.run([sys.executable, "pipeline/scripts/send_cpc_job_alerts.py",
                          "--private-daily-test", "--private-recipient", "jpbt801@gmail.com",
                          "--neon-preferences-file", str(prefs), "--dry-run", "--date", date,
                          "--app-dir", "published-inputs/app",
                          "--reports-dir", "published-inputs/pipeline/reports-daily"], check=True)
          PY

      - name: Send after the one-hour Preview window
        if: steps.preview_neon_read.outputs.available == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'start_one_hour_window') || (github.event_name == 'push' && github.event.head_commit.message == 'Start private one-hour Preview alert'))
        env:
          ONTAP_EMAIL_PREVIEW_DATABASE_URL: ${{ secrets.ONTAP_EMAIL_PREVIEW_DATABASE_URL }}
          ONTAP_EMAIL_PREVIEW_NEON_PROJECT_ID: withered-bread-65990253
          NEON_ALERT_PREFERENCES_OUTPUT: ${{ runner.temp }}/neon-alert-preferences.json
          NEON_ALERT_MANUAL_SELECTION_OUTPUT: ${{ runner.temp }}/manual-job-ids.json
          CPC_JOB_ALERTS_ENABLED: 'true'
          BREVO_JOB_ALERTS_LIST_ID: '3'
          BREVO_SENDER_EMAIL: jobs@ontapjobsearch.com
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          JOB_ALERTS_UNSUBSCRIBE_SECRET: ${{ secrets.JOB_ALERTS_UNSUBSCRIBE_SECRET }}
          CURRENT_REPORT_DATE: ${{ steps.current_report.outputs.date }}
        run: |
          python pipeline/scripts/send_cpc_job_alerts.py \
            --private-daily-test --private-recipient jpbt801@gmail.com \
            --neon-preferences-file "$NEON_ALERT_PREFERENCES_OUTPUT" \
            --manual-job-ids-file "$NEON_ALERT_MANUAL_SELECTION_OUTPUT" \
            --date "$CURRENT_REPORT_DATE" \
            --app-dir published-inputs/app \
            --reports-dir published-inputs/pipeline/reports-daily

      - name: Send one private daily Preview alert
        if: github.event.head_commit.message == 'Enable private daily test runner'
        env:
          ONTAP_EMAIL_PREVIEW_DATABASE_URL: ${{ secrets.ONTAP_EMAIL_PREVIEW_DATABASE_URL }}
          ONTAP_EMAIL_PREVIEW_NEON_PROJECT_ID: withered-bread-65990253
          NEON_ALERT_PREFERENCES_OUTPUT: ${{ runner.temp }}/neon-alert-preferences.json
          CPC_JOB_ALERTS_ENABLED: 'true'
          BREVO_JOB_ALERTS_LIST_ID: '3'
          BREVO_SENDER_EMAIL: jobs@ontapjobsearch.com
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          JOB_ALERTS_UNSUBSCRIBE_SECRET: ${{ secrets.JOB_ALERTS_UNSUBSCRIBE_SECRET }}
        run: |
          python - <<'PY'
          import datetime
          import os
          import pathlib
          import subprocess
          import sys
          date = datetime.datetime.now(datetime.timezone.utc).date()
          if date != datetime.date(2026, 11, 25):
              sys.exit("This authorised private daily send is limited to the 25 November report.")
          report = pathlib.Path(f"published-inputs/pipeline/reports-daily/newly-published-jobs-{date.isoformat()}.csv")
          if not report.is_file():
              sys.exit("Today's new-jobs report is not ready; no old report will be sent.")
          for recipient in ("jpbt801@gmail.com",):
              preferences_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "neon-alert-preferences.json"
              subprocess.run([sys.executable, "pipeline/scripts/send_cpc_job_alerts.py",
                              "--private-daily-test", "--private-recipient", recipient,
                              "--neon-preferences-file", str(preferences_path),
                              "--date", date.isoformat(),
                              "--app-dir", "published-inputs/app",
                              "--reports-dir", "published-inputs/pipeline/reports-daily"], check=True)
          PY


      - name: Send one explicitly requested private matched sample
        if: github.event.head_commit.message == 'Send one private matched-alert test'
        env:
          ONTAP_EMAIL_PREVIEW_DATABASE_URL: ${{ secrets.ONTAP_EMAIL_PREVIEW_DATABASE_URL }}
          ONTAP_EMAIL_PREVIEW_NEON_PROJECT_ID: withered-bread-65990253
          NEON_ALERT_PREFERENCES_OUTPUT: ${{ runner.temp }}/neon-alert-preferences.json
          CPC_JOB_ALERTS_ENABLED: 'true'
          BREVO_JOB_ALERTS_LIST_ID: '3'
          BREVO_SENDER_EMAIL: jobs@ontapjobsearch.com
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          JOB_ALERTS_UNSUBSCRIBE_SECRET: ${{ secrets.JOB_ALERTS_UNSUBSCRIBE_SECRET }}
        run: |
          python - <<'PY'
          import datetime
          import os
          import pathlib
          import subprocess
          import sys
          date = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          recipient = "jpbt801@gmail.com"
          preferences_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "neon-alert-preferences.json"
          subprocess.run([sys.executable, "pipeline/scripts/send_cpc_job_alerts.py",
                          "--private-daily-test", "--private-matching-sample",
                          "--neon-preferences-file", str(preferences_path), "--date", date,
                          "--app-dir", "published-inputs/app",
                          "--reports-dir", "published-inputs/pipeline/reports-daily"], check=True)
          PY

# Owner-requested matched sample: 24 October 2026.
# Private daily delivery runs only on the explicit approved commit-message trigger.
