name: One-off Finance register expansion

on:
  push:
    paths:
      - '.github/workflows/finance-register-expansion-once.yml'

permissions:
  contents: write

jobs:
  expand-finance-register:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Safely add audited Finance titles
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('pipeline/registers/finance_accounts_title_classification_register.csv')
          status = 'REGISTER_EXPANSION_2026-08-12'
          high_reason = 'clear entry/intermediate finance or accounts support title'
          elastic_reason = 'credible finance/accounts support crossover'

          additions = [
              ('Account Assistant', 'HIGH_CONFIDENCE', 1),
              ('Accounting Assistant', 'HIGH_CONFIDENCE', 1),
              ('Accounts & Payroll Administrator', 'HIGH_CONFIDENCE', 1),
              ('Accounts & Payroll Assistant', 'HIGH_CONFIDENCE', 1),
              ('Accounts Administrator - Redcar - Temp Ongoing', 'HIGH_CONFIDENCE', 1),
              ('Accounts and Finance Administrator', 'HIGH_CONFIDENCE', 1),
              ('Accounts Clerk', 'HIGH_CONFIDENCE', 1),
              ('Accounts Payable // Dover, Kent', 'HIGH_CONFIDENCE', 1),
              ('Accounts Payable Coordinator', 'HIGH_CONFIDENCE', 1),
              ('Accounts Payable Executive (Engineering)', 'HIGH_CONFIDENCE', 1),
              ('Accounts Receivable Assistant', 'HIGH_CONFIDENCE', 1),
              ('Accounts Receivable Executive (Engineering)', 'HIGH_CONFIDENCE', 1),
              ('Accounts Receivable Specialist', 'HIGH_CONFIDENCE', 1),
              ('Administration & Bookkeeping Assistant', 'HIGH_CONFIDENCE', 1),
              ('Billing & Data Administrator', 'HIGH_CONFIDENCE', 1),
              ('Bookkeeper (Part-Time)', 'HIGH_CONFIDENCE', 1),
              ('Bookkeeper (Practice)', 'HIGH_CONFIDENCE', 1),
              ('Bookkeeper - Part time', 'HIGH_CONFIDENCE', 1),
              ('Bookkeeper Wanted - Join a Friendly, Established Practice', 'HIGH_CONFIDENCE', 1),
              ('Bookkeeping & Administration Assistant', 'HIGH_CONFIDENCE', 1),
              ('Clerical Officer (finance)', 'HIGH_CONFIDENCE', 1),
              ('Collections Administrator', 'HIGH_CONFIDENCE', 1),
              ('Credit Controller (Temp to Perm)', 'HIGH_CONFIDENCE', 1),
              ('Finance & Administration Assistant', 'HIGH_CONFIDENCE', 1),
              ('Finance & Management Assistant', 'HIGH_CONFIDENCE', 1),
              ('Finance & Management Assistant - Recruitment Consultancy', 'HIGH_CONFIDENCE', 1),
              ('Finance Accountancy Officer (Hybrid)', 'HIGH_CONFIDENCE', 1),
              ('Finance and Administration Assistant', 'HIGH_CONFIDENCE', 1),
              ('Finance Assistant (Temp To Perm)', 'HIGH_CONFIDENCE', 1),
              ('Finance Assistant- Xero experience', 'HIGH_CONFIDENCE', 1),
              ('Finance Coordinator', 'HIGH_CONFIDENCE', 1),
              ('Graduate Accounts Administrator', 'HIGH_CONFIDENCE', 1),
              ('Graduate Finance Assistant', 'HIGH_CONFIDENCE', 1),
              ('Group Accounts Assistant (Purchase Ledger)', 'HIGH_CONFIDENCE', 1),
              ('Invoicing Administrator', 'HIGH_CONFIDENCE', 2),
              ('Invoice Administrator', 'HIGH_CONFIDENCE', 1),
              ('Interim Accounts Assistant', 'HIGH_CONFIDENCE', 1),
              ('Land Rover Accounts Assistant', 'HIGH_CONFIDENCE', 1),
              ('Office & Finance Assistant', 'HIGH_CONFIDENCE', 1),
              ('Operations & Finance Coordinator (Hybrid)', 'HIGH_CONFIDENCE', 1),
              ('Part Time Accounts Assistant', 'HIGH_CONFIDENCE', 1),
              ('Part-Time Accounts Assistant', 'HIGH_CONFIDENCE', 1),
              ('Part Time Payroll Administrator', 'HIGH_CONFIDENCE', 1),
              ('Part-time Payroll Administrator', 'HIGH_CONFIDENCE', 1),
              ('Payments Assistant', 'HIGH_CONFIDENCE', 1),
              ('Payroll & Business Support Administrator', 'HIGH_CONFIDENCE', 2),
              ('Payroll & Compliance Administrator', 'HIGH_CONFIDENCE', 1),
              ('Payroll & Reward Administrator', 'HIGH_CONFIDENCE', 1),
              ('Payroll and Benefits Assistant', 'HIGH_CONFIDENCE', 1),
              ('Payroll and Pensions Assistant', 'HIGH_CONFIDENCE', 1),
              ('Payroll Assistant', 'HIGH_CONFIDENCE', 1),
              ('Payroll Officer Immediate Start Temp to Perm', 'HIGH_CONFIDENCE', 1),
              ('Payroll, Finance & Compliance Coordinator', 'HIGH_CONFIDENCE', 1),
              ('Pension Fund Payroll Officer', 'HIGH_CONFIDENCE', 1),
              ('Purchase Ledger', 'HIGH_CONFIDENCE', 1),
              ('Purchase Ledger Administrator', 'HIGH_CONFIDENCE', 1),
              ('Purchase Ledger Assistant - 4 Week Temp - Office Based', 'HIGH_CONFIDENCE', 1),
              ('Sales Ledger Administrator', 'HIGH_CONFIDENCE', 1),
              ('Sales Ledger Clerk', 'HIGH_CONFIDENCE', 1),
              ('Temporary Accounts Assistant', 'HIGH_CONFIDENCE', 1),
              ('Temporary Finance Administrator', 'HIGH_CONFIDENCE', 1),
              ('Temporary Finance Administrator - Education', 'HIGH_CONFIDENCE', 1),
              ('Trainee Accounts Assistant/Administrator/Bookkeeper', 'HIGH_CONFIDENCE', 1),
              ('Trainee Payroll Administrator', 'HIGH_CONFIDENCE', 1),
              ('Accounts & Business Coordinator', 'ELASTIC_FIT', 2),
              ('Assistant Finance Accountant', 'ELASTIC_FIT', 1),
              ('Assistant Management Accountant', 'ELASTIC_FIT', 1),
              ('Loan Administrator', 'ELASTIC_FIT', 1),
              ('Loan Administrator - 12 Month FTC (Maternity Cover)', 'ELASTIC_FIT', 1),
              ('Payroll & Tax Assistant', 'ELASTIC_FIT', 1),
              ('Property Accounts Assistant - Temp to perm', 'ELASTIC_FIT', 1),
              ('Sales and Accounts Administrator', 'ELASTIC_FIT', 1),
          ]

          with path.open('r', encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              rows = list(reader)

          expected = ['title', 'classification', 'review_status', 'reason', 'count_in_feed', 'west_south_regions_seen', 'example_towns']
          if fieldnames != expected:
              raise SystemExit(f'Unexpected Finance register columns: {fieldnames!r}')

          existing = {row['title'].strip().lower() for row in rows}
          added = 0
          for title, classification, count in additions:
              key = title.strip().lower()
              if key in existing:
                  continue
              rows.append({
                  'title': title,
                  'classification': classification,
                  'review_status': status,
                  'reason': high_reason if classification == 'HIGH_CONFIDENCE' else elastic_reason,
                  'count_in_feed': str(count),
                  'west_south_regions_seen': '',
                  'example_towns': '',
              })
              existing.add(key)
              added += 1

          with path.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=expected, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          with path.open('r', encoding='utf-8-sig', newline='') as f:
              check = list(csv.DictReader(f))
          if len(check) != len(rows):
              raise SystemExit('Finance register validation failed: row count mismatch')
          if any(set(row) != set(expected) for row in check):
              raise SystemExit('Finance register validation failed: malformed CSV row')

          print(f'Finance register rows before: {len(rows) - added}')
          print(f'Finance titles added: {added}')
          print(f'Finance register rows after: {len(rows)}')
          PY

      - name: Commit register and remove one-off workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline/registers/finance_accounts_title_classification_register.csv
          git rm .github/workflows/finance-register-expansion-once.yml
          git commit -m 'Expand Finance register from 12 Aug 10k audit'
          git push
