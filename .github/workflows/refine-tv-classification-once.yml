name: Refine Teaching Vacancies classification once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refine-tv-classification-once.yml"

permissions:
  contents: write

jobs:
  refine-tv-classification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test packages
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: Apply bounded classification refinements
        run: python pipeline/scripts/refine_tv_classification_once.py

      - name: Run controlled Teaching Vacancies tests
        working-directory: pipeline
        run: |
          python -m pytest \
            tests/test_external_regional_contracts.py \
            tests/test_teaching_vacancies_discovery.py \
            tests/test_teaching_vacancies_routing.py \
            tests/test_teaching_vacancies_regional_review.py \
            tests/test_teaching_vacancies_master_review.py \
            tests/test_teaching_vacancies_master_actions.py \
            -q

      - name: Commit refinement and remove one-time files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm pipeline/scripts/refine_tv_classification_once.py
          rm .github/workflows/refine-tv-classification-once.yml
          git add \
            pipeline/external_sources/teaching_vacancies_poc.py \
            pipeline/tests/test_teaching_vacancies_regional_review.py \
            pipeline/scripts/refine_tv_classification_once.py \
            .github/workflows/refine-tv-classification-once.yml
          git commit -m "Refine Teaching Vacancies admin and manager rules"
          git push origin main
