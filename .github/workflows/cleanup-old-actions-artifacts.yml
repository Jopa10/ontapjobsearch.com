name: Cleanup old Actions artifacts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-old-actions-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete vetted old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const rules = [
              { match: name => name === 'service-admin-output', days: 7 },
              { match: name => name === 'support-worker-output', days: 7 },
              { match: name => name.startsWith('compiler-module-1-reports-'), days: 14 },
              { match: name => name.startsWith('compiler-module-2-reports-'), days: 14 },
              { match: name => name.startsWith('compiler-module-3-wfh-results-'), days: 14 },
              { match: name => name === 'hybrid-working-real-feed-audit', days: 7 },
              { match: name => name === 'city-opportunity-report', days: 30 },
            ];

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const now = Date.now();
            let deleted = 0;
            let deletedBytes = 0;

            for (const artifact of artifacts) {
              if (artifact.expired) continue;

              const rule = rules.find(r => r.match(artifact.name));
              if (!rule) continue;

              const cutoff = now - rule.days * 24 * 60 * 60 * 1000;
              const created = Date.parse(artifact.created_at);
              if (!Number.isFinite(created) || created >= cutoff) continue;

              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });

              deleted += 1;
              deletedBytes += artifact.size_in_bytes || 0;
              core.info(`Deleted ${artifact.name} (${artifact.id}), created ${artifact.created_at}`);
            }

            core.summary
              .addHeading('Actions artifact cleanup')
              .addRaw(`Deleted ${deleted} vetted artifact(s), approximately ${(deletedBytes / 1024 / 1024).toFixed(1)} MB.`)
              .write();
