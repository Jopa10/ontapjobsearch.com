name: One-off JobG8 exclusion validation

on:
  push:
    paths:
      - .github/workflows/one-off-jobg8-exclusion-validation.yml

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full JobG8 workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'run-full-jobg8-daily-process.yml',
              ref: 'main'
            })
