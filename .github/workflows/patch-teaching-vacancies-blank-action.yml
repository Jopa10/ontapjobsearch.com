name: Patch Teaching Vacancies blank action parser

on:
  push:
    branches:
      - agent/teaching-vacancies-uk-wide
    paths:
      - ".github/workflows/patch-teaching-vacancies-blank-action.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test packages
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: Apply exact parser fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pipeline/external_sources/teaching_vacancies_regional_review.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _block_value(block: str, key: str) -> str:
              match = re.search(rf"(?mi)^{re.escape(key)}:\\s*(.*?)\\s*$", block)
              return clean(match.group(1)) if match else ""
          '''
          new = '''def _block_value(block: str, key: str) -> str:
              # Horizontal whitespace only: a blank value must never absorb the next line.
              match = re.search(rf"(?mi)^{re.escape(key)}:[ \\t]*(.*?)[ \\t]*$", block)
              return clean(match.group(1)) if match else ""
          '''
          if old not in text:
              raise SystemExit("Expected parser block was not found; refusing to patch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify parser and regional review suite
        working-directory: pipeline
        run: |
          python -m py_compile external_sources/teaching_vacancies_regional_review.py
          python -m pytest \
            tests/test_external_regional_contracts.py \
            tests/test_teaching_vacancies_discovery.py \
            tests/test_teaching_vacancies_routing.py \
            tests/test_teaching_vacancies_regional_review.py \
            tests/test_teaching_vacancies_poc.py \
            tests/test_teaching_vacancies_pay_fallback.py \
            tests/test_teaching_vacancies_approved_publish.py \
            tests/test_teaching_vacancies_contract_format.py \
            -q

      - name: Commit verified fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/external_sources/teaching_vacancies_regional_review.py
          git commit -m "Fix blank Teaching Vacancies review actions"
          git push origin HEAD:${{ github.ref_name }}
