name: Patch Teaching Vacancies master review

on:
  push:
    branches:
      - agent/teaching-vacancies-master-review
    paths:
      - ".github/workflows/patch-teaching-vacancies-master-review.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/teaching-vacancies-master-review
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tests
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: Apply combined review output
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pipeline/external_sources/teaching_vacancies_regional_review.py")
          text = path.read_text(encoding="utf-8")

          old = '''REVIEW_FIELDS = (\n    "final_decision",\n    "title",\n    "salary_text",\n    "employer",\n    "location",\n    "posted_date",\n    "closing_date",\n    "classification",\n    "classification_reason",\n'''
          new = '''REVIEW_FIELDS = (\n    "final_decision",\n    "title",\n    "salary_text",\n    "regional_slice",\n    "classification_reason",\n    "employer",\n    "location",\n    "posted_date",\n    "closing_date",\n    "classification",\n'''
          if text.count(old) != 1:
              raise SystemExit("STOP: REVIEW_FIELDS replacement mismatch")
          text = text.replace(old, new)

          old = '''        "salary_text": vacancy.salary_text,\n        "employer": vacancy.employer,\n'''
          new = '''        "salary_text": vacancy.salary_text,\n        "regional_slice": f"{record.ontap_region} / admin_service",\n        "employer": vacancy.employer,\n'''
          if text.count(old) != 1:
              raise SystemExit("STOP: review row replacement mismatch")
          text = text.replace(old, new)

          old = '''def review_csv_bytes(records: Iterable[ReviewRecord]) -> bytes:\n    rows = sorted(\n        (review_row(row) for row in records),\n        key=lambda row: (\n            {"SELECTED": 0, "POSS": 1, "EXCLUDED": 2, "HARD_PASS": 3}.get(\n                row["final_decision"], 9\n            ),\n            row["title"].casefold(),\n            row["source_job_id"],\n        ),\n    )\n'''
          new = '''def review_csv_bytes(\n    records: Iterable[ReviewRecord],\n    *,\n    regional_order: bool = False,\n) -> bytes:\n    def sort_key(row: dict[str, str]) -> tuple[object, ...]:\n        decision_rank = {\n            "SELECTED": 0,\n            "POSS": 1,\n            "EXCLUDED": 2,\n            "HARD_PASS": 3,\n        }.get(row["final_decision"], 9)\n        common = (decision_rank, row["title"].casefold(), row["source_job_id"])\n        if regional_order:\n            return (row["regional_slice"].casefold(),) + common\n        return common\n\n    rows = sorted((review_row(row) for row in records), key=sort_key)\n'''
          if text.count(old) != 1:
              raise SystemExit("STOP: CSV function replacement mismatch")
          text = text.replace(old, new)

          old = '''    parser.add_argument(\n        "--migration-report",\n        type=Path,\n        default=Path("reviews/external/teaching-vacancies/west-yorkshire-migration.csv"),\n    )\n'''
          new = '''    parser.add_argument(\n        "--migration-report",\n        type=Path,\n        default=Path("reviews/external/teaching-vacancies/west-yorkshire-migration.csv"),\n    )\n    parser.add_argument(\n        "--master-review-csv",\n        type=Path,\n        default=Path(\n            "reviews/external/teaching-vacancies/england-admin-service-review.csv"\n        ),\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit("STOP: argument insertion mismatch")
          text = text.replace(old, new)

          old = '''    if migration_rows:\n        discovery.write_bytes_atomic(\n            args.migration_report,\n            migration_csv_bytes(migration_rows),\n        )\n    print(\n        f"Teaching Vacancies regional review wrote {len(grouped)} regional "\n        f"review sets for {len(records)} routed records; no jobs were published."\n    )\n'''
          new = '''    discovery.write_bytes_atomic(\n        args.master_review_csv,\n        review_csv_bytes(records, regional_order=True),\n    )\n    if migration_rows:\n        discovery.write_bytes_atomic(\n            args.migration_report,\n            migration_csv_bytes(migration_rows),\n        )\n    print(\n        f"Teaching Vacancies regional review wrote one England-wide master review "\n        f"and {len(grouped)} regional review sets for {len(records)} routed records; "\n        "no jobs were published."\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit("STOP: master write insertion mismatch")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

          test_path = Path("pipeline/tests/test_teaching_vacancies_regional_review.py")
          tests = test_path.read_text(encoding="utf-8")
          addition = '''\n\ndef test_master_review_columns_and_regional_order() -> None:\n    records = classify(\n        [\n            routed_row("west", region="Yorkshire - West"),\n            routed_row(\n                "east",\n                region="Yorkshire - East",\n                status="CANDIDATE",\n                location="Hull, East Riding of Yorkshire, HU1 1AA",\n            ),\n        ]\n    )\n\n    content = review.review_csv_bytes(records, regional_order=True).decode("utf-8")\n    rows = list(__import__("csv").DictReader(__import__("io").StringIO(content)))\n\n    assert tuple(rows[0])[:5] == (\n        "final_decision",\n        "title",\n        "salary_text",\n        "regional_slice",\n        "classification_reason",\n    )\n    assert [row["regional_slice"] for row in rows] == [\n        "Yorkshire - East / admin_service",\n        "Yorkshire - West / admin_service",\n    ]\n    assert {row["ontap_region"] for row in rows} == {\n        "Yorkshire - East",\n        "Yorkshire - West",\n    }\n'''
          if "def test_master_review_columns_and_regional_order" in tests:
              raise SystemExit("STOP: master review test already exists")
          test_path.write_text(tests + addition, encoding="utf-8")

          workflow_path = Path(".github/workflows/run-teaching-vacancies-regional-review.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          anchor = '''          test -d pipeline/reviews/external/teaching-vacancies\n          find pipeline/reviews/external/teaching-vacancies -name '*-summary.md' -type f -size +0c | grep -q .\n'''
          replacement = '''          test -d pipeline/reviews/external/teaching-vacancies\n          test -s pipeline/reviews/external/teaching-vacancies/england-admin-service-review.csv\n          find pipeline/reviews/external/teaching-vacancies -name '*-summary.md' -type f -size +0c | grep -q .\n'''
          if workflow.count(anchor) != 1:
              raise SystemExit("STOP: workflow verification anchor mismatch")
          workflow_path.write_text(workflow.replace(anchor, replacement), encoding="utf-8")
          PY

      - name: Run Teaching Vacancies tests
        working-directory: pipeline
        run: |
          python -m py_compile external_sources/teaching_vacancies_regional_review.py
          python -m pytest \
            tests/test_external_regional_contracts.py \
            tests/test_teaching_vacancies_routing.py \
            tests/test_teaching_vacancies_regional_review.py \
            tests/test_teaching_vacancies_regional_approved.py \
            tests/test_teaching_vacancies_regional_integration.py \
            tests/test_teaching_vacancies_operator_workflows.py \
            -q

      - name: Regenerate current review evidence
        working-directory: pipeline
        run: |
          python -m external_sources.teaching_vacancies_regional_review \
            --routed-csv manifests/external/teaching-vacancies/teaching-vacancies-routed-2026-08-06.csv \
            --routing-summary-json manifests/external/teaching-vacancies/teaching-vacancies-routing-2026-08-06-summary.json \
            --write-reviews
          test -s reviews/external/teaching-vacancies/england-admin-service-review.csv

      - name: Commit verified change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pipeline/external_sources/teaching_vacancies_regional_review.py \
            pipeline/tests/test_teaching_vacancies_regional_review.py \
            .github/workflows/run-teaching-vacancies-regional-review.yml \
            pipeline/reviews/external/teaching-vacancies
          git commit -m "Add England-wide Teaching Vacancies master review"
          git push origin agent/teaching-vacancies-master-review
