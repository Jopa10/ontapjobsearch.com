name: Run city opportunity scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pipeline/reports/.city-opportunity-trigger"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanner lifecycle tests
        working-directory: pipeline
        run: |
          python -m unittest discover -s tests -p 'test_scan_city_opportunities.py' -v
          python -m unittest discover -s tests -p 'test_scan_city_live_count.py' -v
          python -m unittest discover -s tests -p 'test_city_opportunity_history.py' -v

      - name: Scan all published slices
        working-directory: pipeline
        run: |
          set -euo pipefail
          python -m scripts.scan_city_opportunities \
            --threshold 6 \
            --near-threshold 4 \
            --output-json pipeline/reports/city-opportunities-current.json \
            > /tmp/city-opportunity-base.md
          python -m scripts.update_city_opportunity_history \
            --current-json pipeline/reports/city-opportunities-current.json \
            --history-json pipeline/reports/city-opportunity-history.json \
            --output-md pipeline/reports/city-opportunities-current.md

      - name: Publish current report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/reports/city-opportunities-current.md pipeline/reports/city-opportunities-current.json
          if git diff --cached --quiet; then
            echo "City opportunity report unchanged"
          else
            git commit -m "Update city opportunity report"
            git push
          fi

      - name: Upload city opportunity report
        uses: actions/upload-artifact@v4
        with:
          name: city-opportunity-report
          path: |
            pipeline/reports/city-opportunities-current.json
            pipeline/reports/city-opportunities-current.md
            pipeline/reports/city-opportunity-history.json
          if-no-files-found: warn
