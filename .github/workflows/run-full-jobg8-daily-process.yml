name: Run full JobG8 daily process

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6,14 * * *'

concurrency:
  group: jobg8-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-full-jobg8-daily-process:
    name: Run full JobG8 daily process
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: python -m pip install --upgrade pip pandas openpyxl boto3

      - name: Download JobG8 feed
        env:
          JOBG8_FEED_URL: ${{ secrets.JOBG8_FEED_URL }}
        run: |
          set -euo pipefail
          : "${JOBG8_FEED_URL:?JOBG8_FEED_URL secret is not configured}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            --connect-timeout 30 --max-time 180 \
            "$JOBG8_FEED_URL" \
            --output "$RUNNER_TEMP/jobg8.zip"
          test -s "$RUNNER_TEMP/jobg8.zip"
          echo "Downloaded JobG8 feed: $(stat -c%s "$RUNNER_TEMP/jobg8.zip") bytes"

      - name: Convert JobG8 XML into pipeline input
        run: |
          set -euo pipefail
          rm -f pipeline/input/*.xlsx pipeline/input/*.xls pipeline/input/*.xlsm pipeline/input/*.csv
          python pipeline/scripts/jobg8_xml_adapter.py \
            --zip "$RUNNER_TEMP/jobg8.zip" \
            --output pipeline/input/jobg8.xlsx \
            --expected-min 5000 \
            --expected-max 20000
          test -s pipeline/input/jobg8.xlsx

      - name: Test JobG8 raw archive rules
        working-directory: pipeline
        run: python -m unittest discover -s tests -p 'test_jobg8_s3_archive.py' -v

      - name: Archive validated JobG8 raw feed
        env:
          JOBG8_ARCHIVE_BUCKET: ${{ secrets.JOBG8_ARCHIVE_BUCKET }}
          JOBG8_ARCHIVE_REGION: ${{ secrets.JOBG8_ARCHIVE_REGION }}
          JOBG8_ARCHIVE_ENDPOINT_URL: ${{ secrets.JOBG8_ARCHIVE_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.JOBG8_ARCHIVE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.JOBG8_ARCHIVE_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${JOBG8_ARCHIVE_BUCKET:-}" ]; then
            echo "JobG8 private archive is not configured yet; skipping archive upload"
            exit 0
          fi

          : "${JOBG8_ARCHIVE_REGION:?JOBG8_ARCHIVE_REGION secret is not configured}"
          : "${AWS_ACCESS_KEY_ID:?JOBG8_ARCHIVE_AWS_ACCESS_KEY_ID secret is not configured}"
          : "${AWS_SECRET_ACCESS_KEY:?JOBG8_ARCHIVE_AWS_SECRET_ACCESS_KEY secret is not configured}"

          archive_args=(
            --zip "$RUNNER_TEMP/jobg8.zip"
            --bucket "$JOBG8_ARCHIVE_BUCKET"
            --region "$JOBG8_ARCHIVE_REGION"
            --prefix "jobg8/raw"
            --keep-days 90
          )
          if [ -n "${JOBG8_ARCHIVE_ENDPOINT_URL:-}" ]; then
            archive_args+=(--endpoint-url "$JOBG8_ARCHIVE_ENDPOINT_URL")
          fi

          python pipeline/scripts/jobg8_s3_archive.py "${archive_args[@]}"

      - name: Read LIVE slices from register
        id: slice-register
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          scripts = Path("pipeline/scripts").resolve()
          sys.path.insert(0, str(scripts))
          from slice_registry import live_slices

          active = sorted(live_slices())
          print("LIVE slices:")
          for region, category in active:
              print(f"- {region} / {category}")

          categories = {category for _, category in active}
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"admin_service={'true' if 'admin_service' in categories else 'false'}\n")
              handle.write(f"support_worker={'true' if 'support_worker' in categories else 'false'}\n")
          PY

      - name: Resolve current JobG8 month
        id: jobg8-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Run service-admin pipeline
        if: steps.slice-register.outputs.admin_service == 'true'
        working-directory: pipeline
        run: python -m scripts.service_admin_pipeline_north_yorkshire

      - name: Reattach approved external-source vacancies
        if: steps.slice-register.outputs.admin_service == 'true'
        working-directory: pipeline
        run: |
          python -m external_sources.compose_northeast_admin --write
          python -m external_sources.compose_west_yorkshire_admin --write
          python -m external_sources.compose_teaching_vacancies_regional --write

      - name: Enrich service-admin job metadata
        if: steps.slice-register.outputs.admin_service == 'true'
        working-directory: pipeline
        run: python -m scripts.enrich_job_metadata --category admin-service

      - name: Verify service-admin outputs
        if: steps.slice-register.outputs.admin_service == 'true'
        run: |
          test -s pipeline/output-admin-service/west-yorkshire-admin-service.json
          test -s pipeline/output-admin-service/south-yorkshire-admin-service.json
          test -s pipeline/output-admin-service/north-yorkshire-admin-service.json
          test -s pipeline/output-admin-service/north-east-admin-service.json
          test -s pipeline/output-admin-service/london-admin-service.json
          test -s pipeline/output-admin-service/hampshire-admin-service.json
          test -s pipeline/output-admin-service/sussex-admin-service.json
          test -s pipeline/output-admin-service/coventry-warwickshire-admin-service.json

      - name: Run support-worker pipeline
        if: steps.slice-register.outputs.support_worker == 'true'
        working-directory: pipeline
        run: python -m scripts.support_worker_pipeline

      - name: Enrich support-worker job metadata
        if: steps.slice-register.outputs.support_worker == 'true'
        working-directory: pipeline
        run: python -m scripts.enrich_job_metadata --category support-worker

      - name: Verify support-worker outputs
        if: steps.slice-register.outputs.support_worker == 'true'
        run: |
          test -s pipeline/output-support-worker/west-yorkshire-support-worker.json
          test -s pipeline/output-support-worker/south-yorkshire-support-worker.json
          test -s pipeline/output-support-worker/north-east-support-worker.json
          test -s pipeline/output-support-worker/sussex-support-worker.json
          test -s pipeline/output-support-worker/cumbria-south-support-worker.json

      - name: Commit JobG8 daily output
        run: |
          set -euo pipefail
          output_paths=(
            "pipeline/output-admin-service/*.json"
            "pipeline/output-support-worker/*.json"
            "pipeline/reports-daily"
          )

          if [ -z "$(git status --porcelain -- "${output_paths[@]}")" ]; then
            echo "No JobG8 daily output changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${output_paths[@]}"

          staged_files="$(git diff --cached --name-only)"
          if [ -z "$staged_files" ]; then
            echo "No JobG8 daily output changes to commit"
            exit 0
          fi

          unexpected_files="$({ printf '%s\n' "$staged_files" | awk '$0 !~ /^pipeline\/output-admin-service\/.*\.json$/ && $0 !~ /^pipeline\/output-support-worker\/.*\.json$/ && $0 !~ /^pipeline\/reports-daily\/(decision-report|validation-report|selection-summary-report)-(admin-service|support-worker)\.csv$/'; } || true)"
          if [ -n "$unexpected_files" ]; then
            echo "::error::Refusing to commit files outside JobG8 daily output folders. Staged files:"
            printf '%s\n' "$unexpected_files"
            git reset --mixed
            exit 1
          fi

          git commit -m "Run full JobG8 daily process"
          git push

      - name: Commit JobG8 manual review files
        run: |
          set -euo pipefail
          manual_review_paths=(
            "pipeline/reviews/jobg8/service-admin-review.csv"
            "pipeline/reviews/jobg8/service-admin-review.md"
            "pipeline/reviews/jobg8/support-worker-review.csv"
            "pipeline/reviews/jobg8/support-worker-review.md"
          )

          if [ -z "$(git status --porcelain -- "${manual_review_paths[@]}")" ]; then
            echo "No JobG8 manual review changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${manual_review_paths[@]}"

          staged_files="$(git diff --cached --name-only)"
          if [ -z "$staged_files" ]; then
            echo "No JobG8 manual review changes to commit"
            exit 0
          fi

          unexpected_files="$({ printf '%s\n' "$staged_files" | awk '$0 != "pipeline/reviews/jobg8/service-admin-review.csv" && $0 != "pipeline/reviews/jobg8/service-admin-review.md" && $0 != "pipeline/reviews/jobg8/support-worker-review.csv" && $0 != "pipeline/reviews/jobg8/support-worker-review.md"'; } || true)"
          if [ -n "$unexpected_files" ]; then
            echo "::error::Refusing to commit files outside JobG8 manual review files. Staged files:"
            printf '%s\n' "$unexpected_files"
            git reset --mixed
            exit 1
          fi

          git commit -m "Refresh JobG8 manual review files"
          git push

      - name: Upload service-admin output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-admin-output
          path: pipeline/output-admin-service/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload support-worker output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-worker-output
          path: pipeline/output-support-worker/
          if-no-files-found: warn
          retention-days: 7
