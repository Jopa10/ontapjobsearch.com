name: Recover Teaching Vacancies review artifact

on:
  push:
    branches:
      - main
    paths:
      - ".github/recover-tv-review.trigger"

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download fresh review artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf /tmp/tv-review
          mkdir -p /tmp/tv-review
          gh run download 32025480121 \
            --name teaching-vacancies-regional-review \
            --dir /tmp/tv-review
          find /tmp/tv-review -maxdepth 4 -type f -print >/tmp/tv-review-files.txt
          sed -n '1,40p' /tmp/tv-review-files.txt
          test -d /tmp/tv-review/manifests/external/teaching-vacancies
          test -d /tmp/tv-review/reviews/external/teaching-vacancies

      - name: Restore fresh review evidence
        run: |
          set -euo pipefail
          cp -a /tmp/tv-review/manifests/external/teaching-vacancies/. \
            pipeline/manifests/external/teaching-vacancies/
          cp -a /tmp/tv-review/reviews/external/teaching-vacancies/. \
            pipeline/reviews/external/teaching-vacancies/
          test -s pipeline/manifests/external/teaching-vacancies/teaching-vacancies-routing-2026-08-17-summary.json
          test -s pipeline/reviews/external/teaching-vacancies/england-wide-admin-service-review.csv

      - name: Commit recovered review evidence safely
        run: |
          set -euo pipefail
          git add -- \
            pipeline/manifests/external/teaching-vacancies \
            pipeline/reviews/external/teaching-vacancies
          staged="$(git diff --cached --name-only)"
          unexpected="$({ printf '%s\n' "$staged" | awk '$0 !~ /^pipeline\/manifests\/external\/teaching-vacancies\// && $0 !~ /^pipeline\/reviews\/external\/teaching-vacancies\//'; } || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected recovered paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if [ -z "$staged" ]; then
            echo "No recovered TV review changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Teaching Vacancies regional and master reviews"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Could not push recovered TV review evidence"
          exit 1
