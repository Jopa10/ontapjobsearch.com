name: Run JobG8 operational 33-region density

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-jobg8-operational-33-region-density.yml'
      - 'pipeline/scripts/jobg8_operational_33_region_density.py'

permissions:
  contents: write
  id-token: write

concurrency:
  group: jobg8-operational-33-region-density
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl boto3

      - name: Configure AWS credentials for JobG8 archive
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::179402568934:role/OntapJobG8ArchiveGitHubRole
          aws-region: eu-west-2

      - name: Materialize current August JobG8 archive
        env:
          JOBG8_ARCHIVE_BUCKET: ontap-jobg8-archive-179402568934-eu-west-2-an
          JOBG8_ARCHIVE_REGION: eu-west-2
        run: |
          set -euo pipefail
          staging_dir="$RUNNER_TEMP/jobg8-operational-33/2026-08"
          python pipeline/scripts/materialize_jobg8_archive_month.py \
            --month '2026-08' \
            --bucket "$JOBG8_ARCHIVE_BUCKET" \
            --region "$JOBG8_ARCHIVE_REGION" \
            --prefix 'jobg8/raw' \
            --s3-start-date '2026-08-14' \
            --legacy-dir 'pipeline/input-jobg8-archive/2026-08' \
            --output-dir "$staging_dir"
          echo "JOBG8_AUDIT_INPUT_DIR=$staging_dir" >> "$GITHUB_ENV"

      - name: Rebuild reconciliation against same feed
        run: |
          set -euo pipefail
          python pipeline/scripts/jobg8_discovery_coverage_audit.py \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --registers-dir pipeline/registers \
            --refinements pipeline/registers/pipeline_refinement_rules.csv \
            --output-dir "$RUNNER_TEMP/jobg8-reconciliation"
          python pipeline/scripts/jobg8_refine_other_families.py \
            --input-csv "$RUNNER_TEMP/jobg8-reconciliation/jobg8-discovery-coverage-current.csv" \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --output-dir "$RUNNER_TEMP/jobg8-reconciliation"

      - name: Run exact 33-region density audit
        run: |
          set -euo pipefail
          python pipeline/scripts/jobg8_operational_33_region_density.py \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --reconciliation-csv "$RUNNER_TEMP/jobg8-reconciliation/jobg8-broad-family-reconciliation-current.csv" \
            --geo-lookup pipeline/geo/geo_lookup.xlsx \
            --slice-catalog pipeline/config/job_slice_catalog.json \
            --output-dir pipeline/reports-discovery-audit
          cat pipeline/reports-discovery-audit/jobg8-operational-33-region-density-current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit diagnostic output only
        run: |
          set -euo pipefail
          files=(
            pipeline/reports-discovery-audit/jobg8-operational-33-region-density-current.csv
            pipeline/reports-discovery-audit/jobg8-operational-33-region-density-current.md
          )
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo '33-region density audit unchanged'
            exit 0
          fi
          staged="$(git diff --cached --name-only)"
          unexpected="$(printf '%s\n' "$staged" | grep -Ev '^pipeline/reports-discovery-audit/jobg8-operational-33-region-density-current\.(csv|md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo '::error::Unexpected staged path(s):'
            printf '%s\n' "$unexpected"
            git reset --mixed
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Run exact JobG8 33-region density audit'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobg8-operational-33-region-density
          path: pipeline/reports-discovery-audit/jobg8-operational-33-region-density-current.*
          if-no-files-found: warn
          retention-days: 30
