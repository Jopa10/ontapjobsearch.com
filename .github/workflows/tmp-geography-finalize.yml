name: Temporary geography finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-geography-finalize.yml
  push:
    branches:
      - agent/geography-reconciliation-20260822
    paths:
      - .github/workflows/tmp-geography-finalize.yml

permissions:
  contents: write

jobs:
  finalize-geography-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geography-reconciliation-20260822
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch stale 33-region operational wording and guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/run-full-jobg8-daily-process.yml')
          text = workflow.read_text(encoding='utf-8')
          replacements = [
              ('Assess Service Admin, Support Worker and Customer Sales across all 33 regions',
               'Assess Service Admin, Support Worker and Customer Sales across all 55 assessable England markets'),
              ('Verify 33-region family coverage and history',
               'Verify 55-market family coverage and history'),
              ("assert len(rows) == 99, f'expected 99 family coverage rows, found {len(rows)}'",
               "assert len(rows) == 165, f'expected 165 family coverage rows, found {len(rows)}'"),
              ("assert len(pairs) == 99, f'expected 99 unique region/family pairs, found {len(pairs)}'",
               "assert len(pairs) == 165, f'expected 165 unique region/family pairs, found {len(pairs)}'"),
              ("assert len(counts) == 33, f'expected 33 regions in latest history snapshot, found {len(counts)}'",
               "assert len(counts) == 55, f'expected 55 markets in latest history snapshot, found {len(counts)}'"),
              ("print('Verified 33 regions x 3 families plus rolling 14-day history')",
               "print('Verified 55 assessable England markets x 3 families plus rolling 14-day history')"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected workflow text: {old}')
              text = text.replace(old, new, 1)
          workflow.write_text(text, encoding='utf-8')

          readme = Path('pipeline/README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('assess 33-region family coverage', 'assess 55-market family coverage', 1)
          start = text.index('## Daily 33-region family coverage')
          end = text.index('\n## External sources', start)
          replacement = '''## Daily 55-market family coverage

The Service Admin / Support Worker / Customer Sales diagnostic assessment is part of `.github/workflows/run-full-jobg8-daily-process.yml`, so it uses the exact same materialized JobG8 workbook as the production family run rather than downloading a later copy of the feed.

`scripts/assess_daily_family_coverage.py` imports the config-driven production family wrappers, reuses persistent JobG8 review decisions and governed family rules, resolves factual locations through `geo/geo_lookup.xlsx`, and assesses the complete set in `config/england_assessable_regions.json`. That file contains **55 assessable England markets**: the former configured 33-market footprint plus the exact 22 omitted non-North-East lookup markets. `North East` is the deliberate diagnostic roll-up of all three underlying North East lookup regions, including Tees Valley.

The diagnostic writes `reports-daily/daily-family-coverage.csv` and updates rolling diagnostic history only. It does **not** change the slice register, production family JSON, LIVE status or public routes. A market may therefore be assessed even when no public slice exists for it.

`.github/workflows/build-daily-region-overview.yml` remains the recurring owner of `reports-daily/daily-region-overview.md`. It builds LIVE state from published/configured data and applies the already committed same-feed 55-market family coverage to NOT LIVE cells. Service Admin, Support Worker and Customer Sales / Sales Advisor all use this recurring diagnostic evidence. A numeric zero means assessed zero, not unassessed.
'''
          text = text[:start] + replacement + text[end:]
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Install diagnostic packages
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Download current JobG8 feed
        env:
          JOBG8_FEED_URL: ${{ secrets.JOBG8_FEED_URL }}
        run: |
          set -euo pipefail
          : "${JOBG8_FEED_URL:?JOBG8_FEED_URL secret is not configured}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            --connect-timeout 30 --max-time 180 \
            "$JOBG8_FEED_URL" \
            --output "$RUNNER_TEMP/jobg8.zip"
          test -s "$RUNNER_TEMP/jobg8.zip"

      - name: Materialize and validate current feed
        shell: bash
        run: |
          set -euo pipefail
          rm -f pipeline/input/*.xlsx pipeline/input/*.xls pipeline/input/*.xlsm pipeline/input/*.csv
          python pipeline/scripts/jobg8_xml_adapter.py \
            --zip "$RUNNER_TEMP/jobg8.zip" \
            --output pipeline/input/jobg8.xlsx \
            --expected-min 5000 \
            --expected-max 20000
          python pipeline/scripts/validate_jobg8_feed_health.py --input pipeline/input/jobg8.xlsx

      - name: Run real same-feed 55 x 3 diagnostic and record audit evidence
        shell: bash
        run: |
          set -euo pipefail
          (cd pipeline && python -m scripts.assess_daily_family_coverage)
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          coverage_path = Path('pipeline/reports-daily/daily-family-coverage.csv')
          with coverage_path.open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))

          families = ['service_admin', 'support_worker', 'customer_sales']
          assert len(rows) == 165, f'expected 165 rows, found {len(rows)}'
          regions = sorted({row['region'] for row in rows}, key=str.casefold)
          assert len(regions) == 55, f'expected 55 markets, found {len(regions)}'
          assert {row['family'] for row in rows} == set(families)
          assert len({(row['region'], row['family']) for row in rows}) == 165
          feed_dates = {row['feed_date'] for row in rows}
          assert len(feed_dates) == 1, feed_dates
          feed_date = next(iter(feed_dates))

          catalog = json.loads(Path('pipeline/config/job_slice_catalog.json').read_text(encoding='utf-8-sig'))
          old_33 = {name for name in catalog['regions'] if name != 'Northern Ireland - East'}
          recovered = sorted(set(regions) - old_33, key=str.casefold)
          assert len(old_33) == 33, len(old_33)
          assert len(recovered) == 22, recovered

          by_key = {(row['region'], row['family']): int(row['selected_count']) for row in rows}
          family_totals = {family: sum(by_key[(region, family)] for region in regions) for family in families}
          recovered_totals = {family: sum(by_key[(region, family)] for region in recovered) for family in families}

          out = Path('pipeline/reports-discovery-audit/geography-current-feed-55-validation-2026-08-22.md')
          lines = [
              '# Current-feed 55-market geography validation — 22 August 2026',
              '',
              f'- JobG8 feed date: **{feed_date}**',
              '- Governed diagnostic universe: **55 assessable England markets**',
              '- Families: **3** — Service Admin, Support Worker, Customer Sales / Sales Advisor',
              '- Verified region/family rows: **165**',
              '- Former configured footprint: **33 markets**',
              '- Recovered legitimate markets outside that footprint: **22**',
              '',
              'This is diagnostic evidence only. It did not alter LIVE slice status, public routes, production JSON or publishing state.',
              '',
              '## Selected counts across all 55 markets',
              '',
              f"- Service Admin: **{family_totals['service_admin']}**",
              f"- Support Worker: **{family_totals['support_worker']}**",
              f"- Customer Sales / Sales Advisor: **{family_totals['customer_sales']}**",
              '',
              '## Selected counts in the 22 recovered markets',
              '',
              f"- Service Admin: **{recovered_totals['service_admin']}**",
              f"- Support Worker: **{recovered_totals['support_worker']}**",
              f"- Customer Sales / Sales Advisor: **{recovered_totals['customer_sales']}**",
              '',
              '| Recovered market | Service Admin | Support Worker | Customer Sales |',
              '|---|---:|---:|---:|',
          ]
          for region in recovered:
              lines.append(f"| {region} | {by_key[(region, 'service_admin')]} | {by_key[(region, 'support_worker')]} | {by_key[(region, 'customer_sales')]} |")
          lines += [
              '',
              'Validation result: **PASS — 55 markets × 3 families = 165 unique diagnostic rows, including the exact 22 markets omitted by the old configured 33-market footprint.**',
              '',
          ]
          out.write_text('\n'.join(lines), encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Restore transient diagnostic outputs and commit audit fixes
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- pipeline/reports-daily/daily-family-coverage.csv pipeline/reports-daily/daily-family-coverage-history.json || true
          rm -f pipeline/input/jobg8.xlsx
          rm -f .github/workflows/tmp-validate-55-market-geography.yml
          rm -f .github/workflows/tmp-geography-finalize.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/run-full-jobg8-daily-process.yml pipeline/README.md pipeline/reports-discovery-audit/geography-current-feed-55-validation-2026-08-22.md .github/workflows
          git commit -m 'Finalize 55-market geography validation'
          git pull --rebase origin agent/geography-reconciliation-20260822
          git push origin HEAD:agent/geography-reconciliation-20260822
