name: Bootstrap published job ledger

on:
  push:
    branches:
      - daily-published-job-ledger
    paths:
      - '.github/workflows/bootstrap-published-job-ledger.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ledger branch
        uses: actions/checkout@v4
        with:
          ref: daily-published-job-ledger

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test ledger
        working-directory: pipeline
        run: python -m unittest discover -s tests -p 'test_published_job_daily_ledger.py' -v

      - name: Establish 17 Aug baseline
        working-directory: pipeline
        run: |
          python -m scripts.published_job_daily_ledger \
            --app-dir ../app \
            --reports-dir reports-daily \
            --date 2026-08-17

      - name: Commit baseline
        run: |
          set -euo pipefail
          git add -- \
            pipeline/reports-daily/published-job-first-seen-history.csv \
            pipeline/reports-daily/newly-published-jobs-2026-08-17.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Establish published job ledger baseline"
          git push origin daily-published-job-ledger
