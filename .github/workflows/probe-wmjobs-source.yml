name: Probe WMJobs source access

on:
  pull_request:
    paths:
      - "pipeline/external_sources/wmjobs_source_probe.py"
      - "pipeline/tests/test_wmjobs_source_probe.py"
      - ".github/workflows/probe-wmjobs-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-wmjobs-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test package
        run: python -m pip install --upgrade pip pytest
      - name: Compile probe
        working-directory: pipeline
        run: python -m py_compile external_sources/wmjobs_source_probe.py
      - name: Test bounded behaviour
        working-directory: pipeline
        run: python -m pytest tests/test_wmjobs_source_probe.py -q
      - name: Probe official public endpoints
        working-directory: pipeline
        run: |
          python -m external_sources.wmjobs_source_probe \
            --output /tmp/wmjobs-source-probe.json
      - name: Verify Ontap live-site isolation
        run: |
          test -s /tmp/wmjobs-source-probe.json
          git diff --exit-code -- \
            pipeline/output-external \
            pipeline/output-admin-service \
            app
      - name: Upload source diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: wmjobs-source-probe
          path: /tmp/wmjobs-source-probe.json
          if-no-files-found: error
          retention-days: 7
