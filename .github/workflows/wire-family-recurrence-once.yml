name: Wire reusable family recurrence once

on:
  push:
    paths:
      - '.github/workflows/wire-family-recurrence-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire recurrence stage
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/run-jobg8-discovery-coverage-audit.yml')
          text = p.read_text(encoding='utf-8')

          trigger = "      - 'pipeline/scripts/jobg8_family_discovery.py'\n"
          if "      - 'pipeline/scripts/jobg8_family_recurrence.py'\n" not in text:
              if trigger not in text:
                  raise SystemExit('Discovery script trigger not found')
              text = text.replace(trigger, trigger + "      - 'pipeline/scripts/jobg8_family_recurrence.py'\n", 1)

          marker = "      - name: Commit diagnostic outputs only\n"
          recurrence_step = """      - name: Build governed family regional recurrence\n        run: |\n          set -euo pipefail\n          for config in pipeline/config/family_discovery/*.json; do\n            family_key=\"$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))[\"family_key\"])' \"$config\")\"\n            stem=\"${family_key//_/-}\"\n            discovery=\"pipeline/reports-discovery-audit/jobg8-${stem}-discovery-current.csv\"\n            if [ -f \"$discovery\" ]; then\n              python -m pipeline.scripts.jobg8_family_recurrence \\\n                --discovery-csv \"$discovery\" \\\n                --config \"$config\" \\\n                --assessable-regions pipeline/config/uk_assessable_regions.json \\\n                --output-dir pipeline/reports-discovery-audit\n              cat \"pipeline/reports-discovery-audit/jobg8-${stem}-recurrence-current.md\" >> \"$GITHUB_STEP_SUMMARY\"\n            fi\n          done\n\n"""
          if '      - name: Build governed family regional recurrence\n' not in text:
              if marker not in text:
                  raise SystemExit('Commit step marker not found')
              text = text.replace(marker, recurrence_step + marker, 1)

          old_find = "-name 'jobg8-*-discovery-current.csv' -o -name 'jobg8-*-discovery-current.md'"
          new_find = "-name 'jobg8-*-discovery-current.csv' -o -name 'jobg8-*-discovery-current.md' -o -name 'jobg8-*-recurrence-current.csv' -o -name 'jobg8-*-recurrence-current.md'"
          if old_find in text:
              text = text.replace(old_find, new_find, 1)

          old_allow = "^pipeline/reports-discovery-audit/jobg8-[a-z0-9-]+-discovery-current\\.(csv|md)$"
          new_allow = "^pipeline/reports-discovery-audit/jobg8-[a-z0-9-]+-(discovery|recurrence)-current\\.(csv|md)$"
          if old_allow in text:
              text = text.replace(old_allow, new_allow, 1)

          p.write_text(text, encoding='utf-8')

          map_path = Path('SYSTEM_MAP.md')
          map_text = map_path.read_text(encoding='utf-8')
          bullet = (
              '- 23 August 2026 — **Reusable new-family regional recurrence:** after each governed family discovery, '
              '`pipeline/scripts/jobg8_family_recurrence.py` now emits a complete 78-market current-feed diagnostic for that family, '
              'showing LIKELY_IN, BORDERLINE and descriptive 3+/6+/9+ spread without activating any slice. '
              'The shared discovery workflow owns this stage and commits the recurrence CSV/Markdown beside the discovery outputs.\n'
          )
          if '**Reusable new-family regional recurrence:**' not in map_text:
              map_text = map_text.replace('## Recent canonical changes\n\n', '## Recent canonical changes\n\n' + bullet, 1)
              map_path.write_text(map_text, encoding='utf-8')

          ov_path = Path('SYSTEM_OVERVIEW.md')
          ov_text = ov_path.read_text(encoding='utf-8')
          ov_bullet = (
              '- 23 August 2026 — New-family discovery now automatically follows national scale evidence with a **78-market regional spread report**. '
              'It shows where likely and borderline jobs sit and how many markets currently reach descriptive 3+/6+/9+ levels; these are evidence only and do not make a family or region live.\n'
          )
          if '**78-market regional spread report**' not in ov_text:
              ov_text = ov_text.replace('## Recent canonical changes\n\n', '## Recent canonical changes\n\n' + ov_bullet, 1)
              ov_path.write_text(ov_text, encoding='utf-8')
          PY

      - name: Commit wiring and remove one-time workflow
        run: |
          set -euo pipefail
          git add .github/workflows/run-jobg8-discovery-coverage-audit.yml \
                  pipeline/scripts/jobg8_family_recurrence.py \
                  SYSTEM_MAP.md SYSTEM_OVERVIEW.md
          git rm .github/workflows/wire-family-recurrence-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add reusable family regional recurrence stage'
          git pull --rebase origin main
          git push origin HEAD:main
