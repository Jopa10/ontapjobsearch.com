name: Fix all-caps job titles once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-all-caps-job-titles-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Add safe all-caps title normalisation
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = Path('lib/job-title.ts')
          helper.write_text('''const ACRONYMS = new Set([\n  "AAT", "ACCA", "AI", "AML", "B2B", "B2C", "CAD", "CEO", "CFO", "CIMA",\n  "CIO", "CIPD", "CNC", "COO", "CQC", "CRM", "CTO", "DBS", "EA", "ERP",\n  "EU", "FCA", "FM", "FTC", "GDPR", "HGV", "HR", "IT", "KYC", "LGV",\n  "NHS", "NVQ", "OTE", "PA", "PAYE", "PMO", "PPE", "QA", "QC", "SAP",\n  "SEN", "SEND", "UK", "VAT",\n]);\n\nconst SMALL_WORDS = new Set([\n  "a", "an", "and", "at", "for", "in", "of", "on", "or", "the", "to", "with",\n]);\n\n/**\n * Tidy titles supplied entirely in capitals while leaving normal/mixed-case titles alone.\n * Common job acronyms remain uppercase. No wording is changed.\n */\nexport function normaliseJobTitle(value: string): string {\n  const title = value.trim();\n  if (!/[A-Za-z]/.test(title) || title !== title.toUpperCase()) return title;\n\n  let wordIndex = 0;\n  return title.replace(/[A-Z0-9]+(?:['’][A-Z0-9]+)?/g, (token) => {\n    const upper = token.toUpperCase();\n    const lower = token.toLowerCase();\n    const isFirstWord = wordIndex === 0;\n    wordIndex += 1;\n\n    if (ACRONYMS.has(upper)) return upper;\n    if (!isFirstWord && SMALL_WORDS.has(lower)) return lower;\n    if (/^\\d/.test(token)) return lower;\n    return lower.charAt(0).toUpperCase() + lower.slice(1);\n  });\n}\n''', encoding='utf-8')

          published = Path('lib/published-jobs.ts')
          text = published.read_text(encoding='utf-8')
          import_needle = 'import { getLondonJobArea } from "@/lib/london-job-area";\n'
          import_line = 'import { normaliseJobTitle } from "@/lib/job-title";\n'
          if import_line not in text:
              if import_needle not in text:
                  raise SystemExit('published-jobs import anchor not found')
              text = text.replace(import_needle, import_needle + import_line, 1)
          old = '    title: text(row.title),\n'
          new = '    title: normaliseJobTitle(text(row.title)),\n'
          if old not in text and new not in text:
              raise SystemExit('published-jobs title assignment not found')
          text = text.replace(old, new, 1)
          published.write_text(text, encoding='utf-8')

          slice_page = Path('components/JobSlicePage.tsx')
          text = slice_page.read_text(encoding='utf-8')
          import_needle = 'import QuickJobList from "@/components/QuickJobList";\n'
          import_line = 'import { normaliseJobTitle } from "@/lib/job-title";\n'
          if import_line not in text:
              if import_needle not in text:
                  raise SystemExit('JobSlicePage import anchor not found')
              text = text.replace(import_needle, import_needle + import_line, 1)
          old = '      title: String(row.title || row["/Job/Position"] || ""),\n'
          new = '      title: normaliseJobTitle(String(row.title || row["/Job/Position"] || "")),\n'
          if old not in text and new not in text:
              raise SystemExit('JobSlicePage title assignment not found')
          text = text.replace(old, new, 1)
          slice_page.write_text(text, encoding='utf-8')

          test = Path('scripts/test-job-title-case.ts')
          test.write_text('''import { normaliseJobTitle } from "../lib/job-title";\n\nconst cases: Array<[string, string]> = [\n  ["PURCHASING COORDINATOR", "Purchasing Coordinator"],\n  ["HR ADMINISTRATOR", "HR Administrator"],\n  ["SENIOR HR & PAYROLL ADMINISTRATOR", "Senior HR & Payroll Administrator"],\n  ["IT SUPPORT - FTC", "IT Support - FTC"],\n  ["PA TO CEO", "PA to CEO"],\n  ["Office Coordinator", "Office Coordinator"],\n];\n\nfor (const [input, expected] of cases) {\n  const actual = normaliseJobTitle(input);\n  if (actual !== expected) {\n    throw new Error(`${input} -> ${actual}; expected ${expected}`);\n  }\n}\nconsole.log("All job-title normalisation checks passed");\n''', encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run title normalisation checks
        run: npx --yes tsx scripts/test-job-title-case.ts

      - name: Build site
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ontap_ci
        run: npm run build

      - name: Commit tested fix and remove one-off workflow
        run: |
          set -euo pipefail
          rm scripts/test-job-title-case.ts
          rm .github/workflows/fix-all-caps-job-titles-once.yml
          git add -- \
            lib/job-title.ts \
            lib/published-jobs.ts \
            components/JobSlicePage.tsx \
            .github/workflows/fix-all-caps-job-titles-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalise all-caps job titles for display"
          git push origin main
