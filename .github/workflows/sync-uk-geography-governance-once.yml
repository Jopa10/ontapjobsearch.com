name: Sync UK geography governance once

on:
  push:
    paths:
      - '.github/uk-geography-governance-trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct UK geography governance
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:100]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # SYSTEM_MAP: make the correction the newest canonical fact; retain the earlier England audit as history.
          p = Path('SYSTEM_MAP.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('55-market geography governance and three-family live/diagnostic regional reporting with rolling history.', '73-market UK geography governance and three-family live/diagnostic regional reporting with rolling history.', 1)
          marker = '## Recent canonical changes\n\n'
          bullet = ('- 22 August 2026 — **UK geography scope correction:** the 55-market reconciliation completed earlier on 22 August was an England-only audit, not the complete Ontap national geography. '
                    '`pipeline/config/uk_assessable_regions.json` is now the canonical diagnostic geography authority with **73 UK markets: 55 England + 9 Scotland + 7 Wales + 2 Northern Ireland**. '
                    '`pipeline/config/england_assessable_regions.json` is retained as the verified England subset/reference, not the national authority. `geo_lookup.xlsx` remains factual source-location authority; explicit safe aliases roll into canonical UK markets; ambiguous generic geo labels remain unresolved rather than being forced into a market. '
                    'The daily Service Admin, Support Worker and Customer Sales diagnostics now target **219 market/family rows (73 × 3)**. This is diagnostic completeness only and does not auto-create LIVE/public slices; `job_slice_catalog.json` remains public/configured metadata and `region_category_slice_register.csv` remains the LIVE gate.\n')
          if bullet not in text:
              text = text.replace(marker, marker + bullet, 1)
          p.write_text(text, encoding='utf-8')

          # SYSTEM_OVERVIEW.
          p = Path('SYSTEM_OVERVIEW.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('55-market geography governance, three-family regional diagnostics/history', '73-market UK geography governance, three-family regional diagnostics/history', 1)
          marker = '## Recent canonical changes\n\n'
          bullet = ('- 22 August 2026 — **Corrected the regional diagnostic scope from England-only to UK-wide.** The earlier 55-market result remains the complete England subset, but it is no longer the national assessment authority. '
                    'Ontap now uses `pipeline/config/uk_assessable_regions.json` for **73 assessable UK markets: 55 England, 9 Scotland, 7 Wales and 2 Northern Ireland**. Daily Service Admin, Support Worker and Sales Advisor diagnostics therefore target **219 rows (73 × 3)**, while LIVE/public pages remain separately controlled by the existing catalogue/register approval mechanism.\n')
          if bullet not in text:
              text = text.replace(marker, marker + bullet, 1)
          p.write_text(text, encoding='utf-8')

          # SYSTEM_AUDIT: correct the current-state statements while leaving the historic 55-market audit narrative intelligible.
          p = Path('SYSTEM_AUDIT.md')
          text = p.read_text(encoding='utf-8')
          old = ('## Geography / regional expansion follow-up — 22 August 2026\n\n'
                 'The geography audit proved that the former **33-region England footprint was a configured operational subset, not complete national coverage**. The recurring assessable England universe is now explicitly stored in `pipeline/config/england_assessable_regions.json` as **55 markets**. `pipeline/geo/geo_lookup.xlsx` remains the factual location-routing authority; `pipeline/config/job_slice_catalog.json` is configured/public market metadata; and `pipeline/registers/region_category_slice_register.csv` remains the LIVE-state gate.\n\n'
                 'The full JobG8 daily process now assesses Service Admin, Support Worker and Customer Sales / Sales Advisor across all 55 markets and stores **165 market/family rows** plus rolling 14-feed history. The North East remains one public/assessment roll-up over its three underlying lookup regions, including Tees Valley.\n')
          new = ('## Geography / regional expansion follow-up — 22 August 2026\n\n'
                 'The first geography reconciliation proved that the former **33-region England footprint was a configured operational subset** and expanded England to **55 assessable markets**. A same-day scope correction then established that England alone is not the complete Ontap national geography. `pipeline/config/uk_assessable_regions.json` is now the recurring diagnostic authority with **73 UK markets: 55 England + 9 Scotland + 7 Wales + 2 Northern Ireland**. `pipeline/config/england_assessable_regions.json` remains the verified England subset/reference. `pipeline/geo/geo_lookup.xlsx` remains the factual location-routing authority; `pipeline/config/job_slice_catalog.json` remains configured/public market metadata; and `pipeline/registers/region_category_slice_register.csv` remains the LIVE-state gate.\n\n'
                 'The full JobG8 daily process now assesses Service Admin, Support Worker and Customer Sales / Sales Advisor across all 73 UK markets and targets **219 market/family rows** plus rolling 14-feed history. Exact safe lookup aliases are rolled into their canonical assessment markets; ambiguous generic geography is left unresolved rather than force-assigned. The North East remains one public/assessment roll-up over its three underlying lookup regions, including Tees Valley.\n')
          if old not in text:
              raise SystemExit('SYSTEM_AUDIT geography block did not match expected current text')
          text = text.replace(old, new, 1)
          text = text.replace('complete 55-market England diagnostic geography and the 11 additional Service Admin LIVE markets', 'complete 73-market UK diagnostic geography and the 11 additional Service Admin LIVE markets', 1)
          p.write_text(text, encoding='utf-8')

          # Pipeline README: current operating path and authority.
          p = Path('pipeline/README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('assess 55-market family coverage', 'assess 73-market UK family coverage', 1)
          old = ('## Daily 55-market family coverage\n\n'
                 'The Service Admin / Support Worker / Customer Sales diagnostic assessment is part of `.github/workflows/run-full-jobg8-daily-process.yml`, so it uses the exact same materialized JobG8 workbook as the production family run rather than downloading a later copy of the feed.\n\n'
                 '`scripts/assess_daily_family_coverage.py` imports the config-driven production family wrappers, reuses persistent JobG8 review decisions and governed family rules, resolves factual locations through `geo/geo_lookup.xlsx`, and assesses the complete set in `config/england_assessable_regions.json`. That file contains **55 assessable England markets**: the former configured 33-market footprint plus the exact 22 omitted non-North-East lookup markets. `North East` is the deliberate diagnostic roll-up of all three underlying North East lookup regions, including Tees Valley.\n')
          new = ('## Daily 73-market UK family coverage\n\n'
                 'The Service Admin / Support Worker / Customer Sales diagnostic assessment is part of `.github/workflows/run-full-jobg8-daily-process.yml`, so it uses the exact same materialized JobG8 workbook as the production family run rather than downloading a later copy of the feed.\n\n'
                 '`scripts/assess_daily_family_coverage.py` imports the config-driven production family wrappers, reuses persistent JobG8 review decisions and governed family rules, resolves factual locations through `geo/geo_lookup.xlsx`, and assesses the complete set in `config/uk_assessable_regions.json`. That file contains **73 assessable UK markets**: **55 England + 9 Scotland + 7 Wales + 2 Northern Ireland**. `config/england_assessable_regions.json` remains the verified England subset/reference. `North East` is the deliberate roll-up of all three underlying North East lookup regions, including Tees Valley; other exact safe aliases are also rolled up, while ambiguous generic geography is not force-assigned.\n')
          if old not in text:
              raise SystemExit('pipeline README geography block did not match expected current text')
          text = text.replace(old, new, 1)
          text = text.replace('same-feed 55-market family coverage', 'same-feed 73-market UK family coverage', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit governance and remove one-time mechanism
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-uk-geography-governance-once.yml .github/uk-geography-governance-trigger
          git add SYSTEM_MAP.md SYSTEM_OVERVIEW.md SYSTEM_AUDIT.md pipeline/README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct geography governance to 73 UK markets'
          git pull --rebase origin main
          git push origin HEAD:main
