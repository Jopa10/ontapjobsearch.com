name: Bootstrap Teaching Vacancies review

on:
  push:
    branches:
      - main
    paths:
      - ".github/bootstrap-tv-review.trigger"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current Teaching Vacancies review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run run-teaching-vacancies-regional-review.yml --ref main
