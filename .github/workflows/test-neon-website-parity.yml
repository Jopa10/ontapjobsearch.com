name: Neon full-site publisher parity (Preview only)
on:
  push:
    branches: [feat/neon-shadow-database]
    paths: [database/shadow/website-test-request.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ontap-neon-website-parity
  cancel-in-progress: false
jobs:
  preview-site-parity:
    if: github.ref == 'refs/heads/feat/neon-shadow-database'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/neon-shadow-database
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate same-day completed publication reference
        id: source
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          x=json.loads(Path('database/shadow/website-test-request.json').read_text())
          assert x['mode']=='website_parity'
          assert re.fullmatch(r'20\d\d-\d\d-\d\d',x['archiveDate'])
          assert isinstance(x['productionOutputRunId'],int) and x['productionOutputRunId']>0
          a=x['publishedOutputArtifacts']
          assert len(a)==2 and {z['name'] for z in a}=={'service-admin-output','support-worker-output'}
          assert all(isinstance(z['id'],int) and re.fullmatch(r'[a-f0-9]{64}',z['sha256']) for z in a)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('date='+x['archiveDate']+'\n')
            f.write('run_id='+str(x['productionOutputRunId'])+'\n')
            f.write('artifact_ids='+','.join(str(z['id']) for z in a)+'\n')
          PY
      - name: Download exact completed publication outputs (no selector rerun)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_ids }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published
          merge-multiple: true
      - name: Checkout Tuesday production website and publishing code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c3073794abc4b3246a4504434b2366fee2bfaba1
          path: production-site
          persist-credentials: false
      - name: Install existing publisher Python dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Build immutable per-scope publisher reference
        run: |
          python - "$RUNNER_TEMP/published" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);request=json.loads(Path('database/shadow/website-test-request.json').read_text())
          sys.path.insert(0,str(Path('production-site/pipeline').resolve()))
          from scripts import publish_verified_pages_live_config as configured
          mappings=configured.core.MAPPINGS
          outputs={};used=set()
          for m in mappings:
            path=root/m.source.name
            if not path.is_file():raise SystemExit('Missing completed production scope: '+m.source.name)
            data=json.loads(path.read_text(encoding='utf-8-sig'))
            if not isinstance(data,list):raise SystemExit('Invalid production output scope: '+m.source.name)
            scope=m.category+':'+m.region
            if scope in outputs:raise SystemExit('Duplicate publisher scope: '+scope)
            ids=[str(r['job_id']) for r in data]
            if len(set(ids))!=len(ids):raise SystemExit('Duplicate publication IDs in '+scope)
            outputs[scope]=data;used.add(m.source.name)
          remaining={p.name for p in root.glob('*.json')}-used
          extra={}
          for filename in sorted(remaining):
            data=json.loads((root/filename).read_text(encoding='utf-8-sig'))
            if not isinstance(data,list):raise SystemExit('Unexpected extra scope data: '+filename)
            extra[filename]=data
          if len(outputs)<200:raise SystemExit('Incomplete LIVE scope coverage')
          all_jobg8=[r for rows in list(outputs.values())+list(extra.values()) for r in rows if r.get('source')=='JobG8']
          if len({str(r['job_id']) for r in all_jobg8})<4500:raise SystemExit('Unexpectedly small JobG8 selected reference')
          snapshot={'feedDate':request['archiveDate'],'productionRunId':request['productionOutputRunId'],'outputs':outputs,'additionalOutputs':extra}
          Path('database/shadow/website-source.json').write_text(json.dumps(snapshot,ensure_ascii=False,separators=(',',':'))+'\n')
          print('ONTAP_WEBSITE_REFERENCE_READY LIVE scopes',len(outputs),'extra artifacts',len(extra),'JobG8 occurrences',len(all_jobg8),
                'unique selected',len({str(r['job_id']) for r in all_jobg8}))
          PY
      - name: Configure isolated Preview site build
        run: |
          mkdir -p production-site/database/shadow/harness
          cp database/shadow/harness/build-latest-preview.mjs database/shadow/harness/prepare-full-preview.py production-site/database/shadow/harness/
          cp database/shadow/website-source.json production-site/database/shadow/
          cd production-site
          python - <<'PY'
          import json
          from pathlib import Path
          Path('vercel.json').write_text(json.dumps({
            'framework':'nextjs',
            'buildCommand':'node database/shadow/harness/build-latest-preview.mjs',
            'headers':[{'source':'/(.*)','headers':[{'key':'X-Robots-Tag','value':'noindex, nofollow'}]}],
          },indent=2)+'\n')
          PY
      - name: Deploy Neon-powered publisher using Vercel Preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_sLI0SohbF03NrRFj6yZyuN8mOOZB
          VERCEL_ORG_ID: team_xjm8VOa1951ZXxawa7UFF2gd
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npm install --no-save --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/vercel-cli" vercel@65.14.0
          cli="$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel"
          cd production-site
          "$cli" deploy --yes --target=preview --token="$VERCEL_TOKEN" --scope ontap1 > "$RUNNER_TEMP/website-preview-deploy.log" 2>&1 || {
            cat "$RUNNER_TEMP/website-preview-deploy.log"; exit 1;
          }
          cat "$RUNNER_TEMP/website-preview-deploy.log"
          url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$RUNNER_TEMP/website-preview-deploy.log" | tail -1)"
          test -n "$url"
          printf '%s\n' "$url" > "$RUNNER_TEMP/website-preview-url.txt"
          "$cli" curl /shadow-verification/publisher-readback.json --deployment "$url" --scope ontap1 > "$RUNNER_TEMP/website-publisher-readback.json"
          "$cli" curl /shadow-verification/city-report.json --deployment "$url" --scope ontap1 > "$RUNNER_TEMP/website-city-report.json"
          python - "$RUNNER_TEMP/website-publisher-readback.json" "$RUNNER_TEMP/website-city-report.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]));c=json.load(open(sys.argv[2]))
          assert p['readbackStatus']=='passed' and p['exactSelectedIdsMatch'] and p['exactApplyUrlsMatch']
          assert p['neonSelectedIds']>0
          assert c['snapshotDate']==p['feedDate']
          assert c['regionalOutputs']==p['scopeCount']
          print('ONTAP_NEON_FULL_SITE_PARITY_PREVIEW_BUILT',p['feedDate'],p['neonSelectedIds'],c['regionalOutputs'])
          PY
      - name: Keep full-site parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neon-website-parity-preview
          path: |
            ${{ runner.temp }}/website-preview-deploy.log
            ${{ runner.temp }}/website-preview-url.txt
            ${{ runner.temp }}/website-publisher-readback.json
            ${{ runner.temp }}/website-city-report.json
            database/shadow/website-test-request.json
          if-no-files-found: ignore
          retention-days: 90
