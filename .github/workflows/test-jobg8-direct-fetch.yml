name: Test JobG8 direct fetch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-jobg8-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: python -m pip install pandas openpyxl

      - name: Download JobG8 feed
        env:
          JOBG8_FEED_URL: ${{ secrets.JOBG8_FEED_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            "$JOBG8_FEED_URL" \
            --output "$RUNNER_TEMP/jobg8.zip"

          echo "Downloaded: $(stat -c%s "$RUNNER_TEMP/jobg8.zip") bytes"

      - name: Convert native JobG8 XML to Ontap workbook
        run: |
          python pipeline/scripts/jobg8_xml_adapter.py \
            --zip "$RUNNER_TEMP/jobg8.zip" \
            --output "$RUNNER_TEMP/jobg8.xlsx" \
            --expected-min 5000 \
            --expected-max 20000

      - name: Validate generated workbook
        run: |
          python - <<'PY'
          import os
          import pandas as pd

          path = os.path.join(os.environ["RUNNER_TEMP"], "jobg8.xlsx")
          df = pd.read_excel(path)

          print("Generated rows:", len(df))
          print("Generated columns:", len(df.columns))
          print("Columns:")
          for col in df.columns:
              print(" -", col)

          required = [
              "/Job/DisplayReference",
              "/Job/Position",
              "/Job/AdvertiserName",
              "/Job/AdvertiserType",
              "/Job/EmploymentType",
              "/Job/Area",
              "/Job/Location",
              "/Job/ApplicationURL",
              "/Job/Description",
          ]

          missing = [c for c in required if c not in df.columns]
          if missing:
              raise SystemExit("STOP - missing required columns: " + ", ".join(missing))

          print("PASS: direct JobG8 feed matches Ontap's required input structure.")
          PY
