name: Test live job source counter

on:
  pull_request:
    branches:
      - main
    paths:
      - "pipeline/scripts/live_job_source_counter.py"
      - "tests/test_live_job_source_counter.py"
      - ".github/workflows/publish-verified-pages.yml"
      - ".github/workflows/test-live-job-source-counter.yml"
      - "app/**/*.json"

permissions:
  contents: read

jobs:
  live-job-source-counter:
    name: Test final published job counter
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run counter tests
        run: python -m unittest tests.test_live_job_source_counter -v

      - name: Smoke-test current published app JSON
        run: |
          set -euo pipefail
          reports_dir="$(mktemp -d)"
          python pipeline/scripts/live_job_source_counter.py \
            --app-dir app \
            --reports-dir "$reports_dir" \
            --date 2026-08-01
          test -s "$reports_dir/live-job-source-count-2026-08-01.csv"
          test -s "$reports_dir/live-job-source-history.csv"
