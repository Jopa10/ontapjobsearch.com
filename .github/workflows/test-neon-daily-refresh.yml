name: Neon automatic daily refresh (Preview only)
on:
  push:
    branches: [feat/neon-shadow-database]
    paths: [database/shadow/daily-refresh-request.json, database/shadow/daily-failure-test-request.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ontap-neon-selected-review-payloads
  cancel-in-progress: false
jobs:
  refresh-latest-publication:
    if: github.ref == 'refs/heads/feat/neon-shadow-database'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_DAILY_FAILURE_TEST: 'false'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select one-off failure mode from the triggering commit
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Fxq 'database/shadow/daily-failure-test-request.json'; then
            echo 'RUN_DAILY_FAILURE_TEST=true' >> "$GITHUB_ENV"
          else
            echo 'RUN_DAILY_FAILURE_TEST=false' >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check automatic date discovery and fail-closed behavior
        run: python -m unittest discover -s database/shadow -p test_resolve_daily_source.py -v
      - name: Discover today's completed publication and restore matching saved feed
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
          ONTAP_SAVED_FEED_URL: ${{ secrets.ONTAP_SAVED_FEED_URL }}
        run: python database/shadow/resolve-daily-source.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.daily.outputs.artifact_ids }}
          run-id: ${{ steps.daily.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/production-output
          merge-multiple: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.daily.outputs.app_sha }}
          path: production-final
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Verify exact published JobG8 scope inputs and capture ordering
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('production-final/pipeline').resolve()))
          from scripts import publish_verified_pages_live_config as p
          scopes=[]
          for mapping in p.core.MAPPINGS:
              original=json.loads((Path(os.environ['RUNNER_TEMP'])/'production-output'/mapping.source.name).read_text(encoding='utf-8-sig'))
              final=json.loads((Path('production-final')/mapping.source).read_text(encoding='utf-8-sig'))
              def ids(rows):return [str(r['job_id']) for r in rows if r.get('source')=='JobG8']
              assert ids(original)==ids(final),'Published JobG8 scope differs from completed selector output: '+mapping.source.name
              scopes.append({'scope':mapping.category+':'+mapping.region,'jobg8Ids':ids(final)})
          Path('daily-scopes.json').write_text(json.dumps(scopes,separators=(',',':'))+'\n')
          print('Verified automatic-day published JobG8 scope order:',len(scopes))
          PY
      - name: Prepare current selected and review payloads without rerunning selector
        run: |
          python database/shadow/prepare_selected_review_payloads.py \
            --archive "$RUNNER_TEMP/daily-input/feed.zip" \
            --outputs "$RUNNER_TEMP/production-output" \
            --reviews production-final/pipeline/reviews/jobg8 \
            --date "${{ steps.daily.outputs.day }}" \
            --production-run-id "${{ steps.daily.outputs.run_id }}" \
            --production-run-commit "${{ steps.daily.outputs.run_sha }}" \
            --app-commit "${{ steps.daily.outputs.app_sha }}" \
            --output "$RUNNER_TEMP/selected-review-payloads.json"
      - name: Package isolated daily refresh verifier
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          harness=Path('database/shadow/harness')
          raw=Path(os.environ['RUNNER_TEMP']+'/selected-review-payloads.json').read_bytes()
          source=json.loads(Path('daily-source.json').read_text());source['payloadPackageSha256']=hashlib.sha256(raw).hexdigest()
          (harness/'selected-review-payloads.json').write_bytes(raw)
          (harness/'daily-source.json').write_text(json.dumps(source))
          (harness/'daily-scopes.json').write_bytes(Path('daily-scopes.json').read_bytes())
          if os.environ.get('RUN_DAILY_FAILURE_TEST')=='true':
              (harness/'failure-recovery-request.json').write_text(json.dumps({'mode':'failure_recovery','runToken':'daily-'+os.environ['GITHUB_RUN_ID']}))
          config=json.loads((harness/'vercel.json').read_text());config['buildCommand']='node verify-daily-refresh-neon.mjs'
          (harness/'vercel.json').write_text(json.dumps(config))
          PY
      - name: Refresh Neon Preview and verify active date IDs payloads and scope order
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_sLI0SohbF03NrRFj6yZyuN8mOOZB
          VERCEL_ORG_ID: team_xjm8VOa1951ZXxawa7UFF2gd
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/cli" vercel@65.14.0
          cli="$RUNNER_TEMP/cli/node_modules/.bin/vercel"
          cd database/shadow/harness
          if [ "$RUN_DAILY_FAILURE_TEST" = "true" ]; then
            python "$GITHUB_WORKSPACE/database/shadow/run-daily-failure-recovery.py" "$cli"
          else
            "$cli" deploy --yes --target=preview --token="$VERCEL_TOKEN" --scope ontap1 > "$RUNNER_TEMP/daily-deploy.log" 2>&1 || { cat "$RUNNER_TEMP/daily-deploy.log"; exit 1; }
            url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$RUNNER_TEMP/daily-deploy.log" | tail -1)"
            "$cli" curl /daily-refresh-report.json --deployment "$url" --scope ontap1 > "$RUNNER_TEMP/daily-refresh-report.json"
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(os.environ['RUNNER_TEMP']+'/daily-refresh-report.json').read_text())
          assert r['status']=='passed' and r['dateProvidedByRequest'] is False
          assert r['identicalReplayRowsToWrite']==0 and r['duplicates']==0
          print('ONTAP_DAILY_REFRESH_READBACK',json.dumps(r))
          PY
      - name: Preserve automatic-day discovery and refresh receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neon-automatic-daily-refresh
          path: |
            daily-source.json
            daily-scopes.json
            ${{ runner.temp }}/daily-refresh-report.json
            ${{ runner.temp }}/daily-deploy.log
            ${{ runner.temp }}/daily-failure-*.log
            ${{ runner.temp }}/daily-failure-recovery-report.json
            database/shadow/daily-refresh-request.json
          if-no-files-found: ignore
          retention-days: 90
