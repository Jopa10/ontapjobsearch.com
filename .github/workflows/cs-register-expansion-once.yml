          with path.open("r", encoding="utf-8-sig", newline="") as f:
              check = list(csv.DictReader(f))
          keys = [r["title"].strip().lower() for r in check if r["title"].strip()]
          if len(keys) != len(set(keys)):
              raise SystemExit("Duplicate normalized title detected after update")
          selected = {"HIGH_CONFIDENCE", "ELASTIC_FIT"}
          check_map = {r["title"].strip().lower(): r for r in check}
          for item in additions:
              row = check_map.get(item["title"].strip().lower())
              if not row or row["classification"] not in selected:
                  raise SystemExit(f"Target title not selected after update: {item['title']}")

          print(f"Rows after update: {len(check)}")
          print(f"New rows: {new_count}")
          print(f"Existing rows promoted/updated: {updated_count}")
          print(f"Audited current-feed jobs represented: {sum(int(x['count_in_feed']) for x in additions)}")
          PY

      - name: Commit register expansion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/registers/customer_service_contact_centre_title_classification_register.csv
          if git diff --cached --quiet; then
            echo "No register changes to commit."
          else
            git commit -m "Expand Customer Service register from 12 Aug 10k audit"
            git push
          fi
