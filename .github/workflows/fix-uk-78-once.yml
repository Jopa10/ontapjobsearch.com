name: Fix UK 78 consistency once

on:
  push:
    paths:
      - '.github/uk-78-final-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix remaining 73 references and ambiguous rollups
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('pipeline/config/uk_assessable_regions.json')
          d=json.loads(p.read_text())
          for k in ('South West','West Midlands'):
              d['detail_rollups'].pop(k,None)
              if k not in d['excluded_non_market_clusters']:
                  d['excluded_non_market_clusters'].append(k)
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')

          changes={
            'pipeline/scripts/build_daily_region_overview.py': [('EXPECTED_REGION_COUNT = 73','EXPECTED_REGION_COUNT = 78'),('same-feed 73-market coverage','same-feed 78-market coverage')],
            'pipeline/scripts/jobg8_family_discovery.py': [('73-market UK recurrence/slice assessment','78-market UK recurrence/slice assessment')],
            '.github/workflows/run-full-jobg8-daily-process.yml': [('all 73 assessable UK markets','all 78 assessable UK markets'),('Verify 73-market UK family coverage and history','Verify 78-market UK family coverage and history'),('len(rows) == 219','len(rows) == 234'),('expected 219 family coverage rows','expected 234 family coverage rows'),('len(pairs) == 219','len(pairs) == 234'),('expected 219 unique region/family pairs','expected 234 unique region/family pairs'),('len(counts) == 73','len(counts) == 78'),('expected 73 assessable UK markets','expected 78 assessable UK markets'),('Verified 73 assessable UK markets x 3 families','Verified 78 assessable UK markets x 3 families')],
          }
          for path,pairs in changes.items():
              p=Path(path); t=p.read_text()
              for a,b in pairs:
                  if a not in t: raise SystemExit(f'missing {a} in {path}')
                  t=t.replace(a,b)
              p.write_text(t)
          PY
      - name: Validate and commit
        run: |
          set -euo pipefail
          python -m py_compile pipeline/scripts/assess_daily_family_coverage.py pipeline/scripts/build_daily_region_overview.py pipeline/scripts/jobg8_family_discovery.py
          PYTHONPATH=pipeline python -m unittest discover -s pipeline/tests -p 'test_uk_assessable_regions.py' -v
          git rm .github/workflows/fix-uk-78-once.yml .github/uk-78-final-trigger
          git add pipeline/config/uk_assessable_regions.json pipeline/scripts/build_daily_region_overview.py pipeline/scripts/jobg8_family_discovery.py .github/workflows/run-full-jobg8-daily-process.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finish 78-market UK geography wiring'
          git pull --rebase origin main
          git push origin HEAD:main
