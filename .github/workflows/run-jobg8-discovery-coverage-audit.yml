name: TEST salary-band discovery coverage audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-jobg8-discovery-coverage-audit.yml'
      - 'pipeline/scripts/jobg8_discovery_coverage_audit.py'
      - 'pipeline/scripts/jobg8_refine_other_families.py'
      - 'pipeline/scripts/jobg8_insurance_claims_discovery.py'
      - 'pipeline/scripts/jobg8_family_boundary_review.py'
      - 'pipeline/scripts/jobg8_claims_family_validate.py'
      - 'pipeline/scripts/jobg8_claims_slice_viability.py'
      - 'pipeline/scripts/jobg8_family_discovery.py'
      - 'pipeline/scripts/jobg8_family_recurrence.py'
      - 'pipeline/scripts/jobg8_family_proof_region_evidence.py'
      - 'pipeline/config/family_discovery/*.json'
      - 'pipeline/config/uk_assessable_regions.json'
      - 'pipeline/geo/geo_lookup.xlsx'

permissions:
  contents: write
  id-token: write

concurrency:
  group: jobg8-discovery-coverage-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl boto3

      - name: Configure AWS credentials for JobG8 archive
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::179402568934:role/OntapJobG8ArchiveGitHubRole
          aws-region: eu-west-2

      - name: Materialize current August JobG8 archive
        env:
          JOBG8_ARCHIVE_BUCKET: ontap-jobg8-archive-179402568934-eu-west-2-an
          JOBG8_ARCHIVE_REGION: eu-west-2
        run: |
          set -euo pipefail
          staging_dir="$RUNNER_TEMP/jobg8-discovery-audit/2026-08"
          python pipeline/scripts/materialize_jobg8_archive_month.py \
            --month '2026-08' \
            --bucket "$JOBG8_ARCHIVE_BUCKET" \
            --region "$JOBG8_ARCHIVE_REGION" \
            --prefix 'jobg8/raw' \
            --s3-start-date '2026-08-14' \
            --legacy-dir 'pipeline/input-jobg8-archive/2026-08' \
            --output-dir "$staging_dir"
          echo "JOBG8_AUDIT_INPUT_DIR=$staging_dir" >> "$GITHUB_ENV"

      - name: Run discovery coverage audit
        run: |
          set -euo pipefail
          python pipeline/scripts/jobg8_discovery_coverage_audit.py \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --registers-dir pipeline/registers \
            --refinements pipeline/registers/pipeline_refinement_rules.csv \
            --output-dir pipeline/reports-discovery-audit

      - name: Refine unresolved families using registers, titles and descriptions
        run: |
          set -euo pipefail
          python pipeline/scripts/jobg8_refine_other_families.py \
            --input-csv pipeline/reports-discovery-audit/jobg8-discovery-coverage-current.csv \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --output-dir pipeline/reports-discovery-audit
          cat pipeline/reports-discovery-audit/jobg8-broad-family-reconciliation-current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Audit Insurance and Claims Support opportunity
        run: |
          set -euo pipefail
          python -m pipeline.scripts.jobg8_insurance_claims_discovery \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --output-dir pipeline/reports-discovery-audit
          cat pipeline/reports-discovery-audit/jobg8-insurance-claims-discovery-current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build Claims boundary-review evidence file
        run: |
          set -euo pipefail
          python pipeline/scripts/jobg8_family_boundary_review.py \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --diagnostic-csv pipeline/reports-discovery-audit/jobg8-insurance-claims-discovery-current.csv \
            --output-csv pipeline/reports-discovery-audit/jobg8-insurance-claims-boundary-review-current.csv \
            --keywords 'claim,insurance,policyholder,fnol,broker,underwriter,adjuster' \
            --exclude-decision EXCLUDE_SPECIALIST \
            --hard-salary-max 50000

      - name: Validate Claims Support family boundary
        run: |
          set -euo pipefail
          python -m pipeline.scripts.jobg8_claims_family_validate \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --output-dir pipeline/reports-discovery-audit
          cat pipeline/reports-discovery-audit/jobg8-claims-family-validation-current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Assess Claims Support regional recurrence
        run: |
          set -euo pipefail
          python -m pipeline.scripts.jobg8_claims_slice_viability \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --output-dir pipeline/reports-discovery-audit \
            --max-dates 7
          cat pipeline/reports-discovery-audit/jobg8-claims-slice-viability-current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run governed reusable family discoveries
        run: |
          set -euo pipefail
          for config in pipeline/config/family_discovery/*.json; do
            echo "Running family discovery: $config"
            python -m pipeline.scripts.jobg8_family_discovery \
              --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
              --config "$config" \
              --output-dir pipeline/reports-discovery-audit
          done
          for report in pipeline/reports-discovery-audit/jobg8-*-discovery-current.md; do
            [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Build governed family regional recurrence and proof evidence
        run: |
          set -euo pipefail
          for config in pipeline/config/family_discovery/*.json; do
            family_key="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["family_key"])' "$config")"
            stem="${family_key//_/-}"
            discovery="pipeline/reports-discovery-audit/jobg8-${stem}-discovery-current.csv"
            if [ -f "$discovery" ]; then
              python -m pipeline.scripts.jobg8_family_recurrence \
                --discovery-csv "$discovery" \
                --config "$config" \
                --assessable-regions pipeline/config/uk_assessable_regions.json \
                --output-dir pipeline/reports-discovery-audit
              python -m pipeline.scripts.jobg8_family_proof_region_evidence \
                --discovery-csv "$discovery" \
                --config "$config" \
                --output-dir pipeline/reports-discovery-audit \
                --markets 5
              cat "pipeline/reports-discovery-audit/jobg8-${stem}-recurrence-current.md" >> "$GITHUB_STEP_SUMMARY"
              cat "pipeline/reports-discovery-audit/jobg8-${stem}-proof-region-evidence-current.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Confirm test remains artifact-only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "test/salary-band-family-audit"
          echo 'Test run only: reports will be uploaded as an artifact and will not be committed or pushed.'

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobg8-discovery-coverage-audit
          path: pipeline/reports-discovery-audit/
          if-no-files-found: warn
          retention-days: 30
