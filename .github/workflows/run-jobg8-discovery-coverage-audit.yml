name: Run JobG8 discovery coverage audit

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Code revision to audit
        required: true
        default: main
        type: choice
        options:
          - main
          - test/salary-band-family-audit
      artifact_only:
        description: Upload results without committing them
        required: true
        default: false
        type: boolean
  push:
    paths:
      - '.github/workflows/run-jobg8-discovery-coverage-audit.yml'
      - 'pipeline/scripts/jobg8_discovery_coverage_audit.py'
      - 'pipeline/scripts/jobg8_refine_other_families.py'
      - 'pipeline/scripts/jobg8_insurance_claims_discovery.py'
      - 'pipeline/scripts/jobg8_family_boundary_review.py'
      - 'pipeline/scripts/jobg8_claims_family_validate.py'
      - 'pipeline/scripts/jobg8_claims_slice_viability.py'
      - 'pipeline/scripts/jobg8_family_discovery.py'
      - 'pipeline/scripts/jobg8_family_recurrence.py'
      - 'pipeline/scripts/jobg8_family_proof_region_evidence.py'
      - 'pipeline/config/family_discovery/*.json'
      - 'pipeline/config/uk_assessable_regions.json'
      - 'pipeline/geo/geo_lookup.xlsx'

permissions:
  contents: write
  id-token: write

concurrency:
  group: jobg8-discovery-coverage-audit-${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'main' }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested audit mode
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          ARTIFACT_ONLY: ${{ inputs.artifact_only }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_REF" != 'main' ] && [ "$ARTIFACT_ONLY" != 'true' ]; then
            echo '::error::A non-main audit must be artifact-only.'
            exit 1
          fi

      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl boto3

      - name: Test selection-audit exporter
        run: python -m unittest pipeline.tests.test_jobg8_selection_audit_export

      - name: Configure AWS credentials for JobG8 archive
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::179402568934:role/OntapJobG8ArchiveGitHubRole
          aws-region: eu-west-2

      - name: Materialize current August JobG8 archive
        env:
          JOBG8_ARCHIVE_BUCKET: ontap-jobg8-archive-179402568934-eu-west-2-an
          JOBG8_ARCHIVE_REGION: eu-west-2
        run: |
          set -euo pipefail
          staging_dir="$RUNNER_TEMP/jobg8-discovery-audit/2026-08"
          python pipeline/scripts/materialize_jobg8_archive_month.py \
            --month '2026-08' \
            --bucket "$JOBG8_ARCHIVE_BUCKET" \
            --region "$JOBG8_ARCHIVE_REGION" \
            --prefix 'jobg8/raw' \
            --s3-start-date '2026-08-14' \
            --legacy-dir 'pipeline/input-jobg8-archive/2026-08' \
            --output-dir "$staging_dir"
          echo "JOBG8_AUDIT_INPUT_DIR=$staging_dir" >> "$GITHUB_ENV"

      - name: Run discovery coverage audit
        run: |
          set -euo pipefail
          python pipeline/scripts/jobg8_discovery_coverage_audit.py \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --registers-dir pipeline/registers \
            --refinements pipeline/registers/pipeline_refinement_rules.csv \
            --output-dir pipeline/reports-discovery-audit

      - name: Refine unresolved families using registers, titles and descriptions
        run: |
          set -euo pipefail
          python pipeline/scripts/jobg8_refine_other_families.py \
            --input-csv pipeline/reports-discovery-audit/jobg8-discovery-coverage-current.csv \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --output-dir pipeline/reports-discovery-audit
          cat pipeline/reports-discovery-audit/jobg8-broad-family-reconciliation-current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build complete JobG8 selection audit workbook
        run: |
          set -euo pipefail
          audit_output="$RUNNER_TEMP/jobg8-selection-audit"
          python -m pipeline.scripts.jobg8_selection_audit_export \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --reconciliation-csv pipeline/reports-discovery-audit/jobg8-broad-family-reconciliation-current.csv \
            --output-dir "$audit_output"
          echo "JOBG8_SELECTION_AUDIT_OUTPUT=$audit_output" >> "$GITHUB_ENV"

      - name: Audit Insurance and Claims Support opportunity
        run: |
          set -euo pipefail
          python -m pipeline.scripts.jobg8_insurance_claims_discovery \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --output-dir pipeline/reports-discovery-audit
          cat pipeline/reports-discovery-audit/jobg8-insurance-claims-discovery-current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build Claims boundary-review evidence file
        run: |
          set -euo pipefail
          python pipeline/scripts/jobg8_family_boundary_review.py \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --diagnostic-csv pipeline/reports-discovery-audit/jobg8-insurance-claims-discovery-current.csv \
            --output-csv pipeline/reports-discovery-audit/jobg8-insurance-claims-boundary-review-current.csv \
            --keywords 'claim,insurance,policyholder,fnol,broker,underwriter,adjuster' \
            --exclude-decision EXCLUDE_SPECIALIST \
            --hard-salary-max 50000

      - name: Validate Claims Support family boundary
        run: |
          set -euo pipefail
          python -m pipeline.scripts.jobg8_claims_family_validate \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --output-dir pipeline/reports-discovery-audit
          cat pipeline/reports-discovery-audit/jobg8-claims-family-validation-current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Assess Claims Support regional recurrence
        run: |
          set -euo pipefail
          python -m pipeline.scripts.jobg8_claims_slice_viability \
            --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
            --output-dir pipeline/reports-discovery-audit \
            --max-dates 7
          cat pipeline/reports-discovery-audit/jobg8-claims-slice-viability-current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run governed reusable family discoveries
        run: |
          set -euo pipefail
          for config in pipeline/config/family_discovery/*.json; do
            echo "Running family discovery: $config"
            python -m pipeline.scripts.jobg8_family_discovery \
              --input-dir "$JOBG8_AUDIT_INPUT_DIR" \
              --config "$config" \
              --output-dir pipeline/reports-discovery-audit
          done
          for report in pipeline/reports-discovery-audit/jobg8-*-discovery-current.md; do
            [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Build governed family regional recurrence and proof evidence
        run: |
          set -euo pipefail
          for config in pipeline/config/family_discovery/*.json; do
            family_key="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["family_key"])' "$config")"
            stem="${family_key//_/-}"
            discovery="pipeline/reports-discovery-audit/jobg8-${stem}-discovery-current.csv"
            if [ -f "$discovery" ]; then
              python -m pipeline.scripts.jobg8_family_recurrence \
                --discovery-csv "$discovery" \
                --config "$config" \
                --assessable-regions pipeline/config/uk_assessable_regions.json \
                --output-dir pipeline/reports-discovery-audit
              python -m pipeline.scripts.jobg8_family_proof_region_evidence \
                --discovery-csv "$discovery" \
                --config "$config" \
                --output-dir pipeline/reports-discovery-audit \
                --markets 5
              cat "pipeline/reports-discovery-audit/jobg8-${stem}-recurrence-current.md" >> "$GITHUB_STEP_SUMMARY"
              cat "pipeline/reports-discovery-audit/jobg8-${stem}-proof-region-evidence-current.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Commit diagnostic outputs only
        if: github.event_name != 'workflow_dispatch' || !inputs.artifact_only
        run: |
          set -euo pipefail
          files=(
            pipeline/reports-discovery-audit/jobg8-discovery-coverage-current.csv
            pipeline/reports-discovery-audit/jobg8-discovery-coverage-current.md
            pipeline/reports-discovery-audit/jobg8-broad-family-reconciliation-current.csv
            pipeline/reports-discovery-audit/jobg8-broad-family-reconciliation-current.md
            pipeline/reports-discovery-audit/jobg8-insurance-claims-discovery-current.csv
            pipeline/reports-discovery-audit/jobg8-insurance-claims-discovery-current.md
            pipeline/reports-discovery-audit/jobg8-insurance-claims-boundary-review-current.csv
            pipeline/reports-discovery-audit/jobg8-claims-family-validation-current.csv
            pipeline/reports-discovery-audit/jobg8-claims-family-validation-current.md
            pipeline/reports-discovery-audit/jobg8-claims-slice-viability-current.csv
            pipeline/reports-discovery-audit/jobg8-claims-slice-viability-current.md
          )
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find pipeline/reports-discovery-audit -maxdepth 1 -type f \( -name 'jobg8-*-discovery-current.csv' -o -name 'jobg8-*-discovery-current.md' -o -name 'jobg8-*-recurrence-current.csv' -o -name 'jobg8-*-recurrence-current.md' -o -name 'jobg8-*-proof-region-evidence-current.csv' -o -name 'jobg8-*-proof-region-evidence-current.md' \) -print0)
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo 'Discovery audit unchanged'
            exit 0
          fi
          staged="$(git diff --cached --name-only)"
          unexpected="$(printf '%s\n' "$staged" | grep -Ev '^pipeline/reports-discovery-audit/(jobg8-discovery-coverage-current|jobg8-broad-family-reconciliation-current|jobg8-insurance-claims-discovery-current|jobg8-claims-family-validation-current|jobg8-claims-slice-viability-current)\.(csv|md)$|^pipeline/reports-discovery-audit/jobg8-insurance-claims-boundary-review-current\.csv$|^pipeline/reports-discovery-audit/jobg8-[a-z0-9-]+-(discovery|recurrence|proof-region-evidence)-current\.(csv|md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo '::error::Unexpected staged path(s):'
            printf '%s\n' "$unexpected"
            git reset --mixed
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Run JobG8 discovery diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirm artifact-only test
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_only
        run: |
          echo 'Test audit complete: reports are uploaded below and nothing is committed or pushed.'

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobg8-discovery-coverage-audit
          path: pipeline/reports-discovery-audit/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload complete JobG8 selection audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobg8-selection-audit
          path: |
            ${{ env.JOBG8_SELECTION_AUDIT_OUTPUT }}/jobg8-selection-audit.xlsx
            ${{ env.JOBG8_SELECTION_AUDIT_OUTPUT }}/jobg8-selection-audit.csv
          if-no-files-found: warn
          retention-days: 30
