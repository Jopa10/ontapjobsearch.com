name: Build Customer Sales Test Slices

on:
  workflow_dispatch:
  push:
    branches:
      - agent/customer-sales-family
    paths:
      - '.github/workflows/build-customer-sales-test-slices.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: agent/customer-sales-family
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Download current JobG8 feed
        env:
          JOBG8_FEED_URL: ${{ secrets.JOBG8_FEED_URL }}
        run: |
          set -euo pipefail
          : "${JOBG8_FEED_URL:?JOBG8_FEED_URL secret is not configured}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            --connect-timeout 30 --max-time 180 \
            "$JOBG8_FEED_URL" \
            --output "$RUNNER_TEMP/jobg8.zip"
          test -s "$RUNNER_TEMP/jobg8.zip"

      - name: Convert current JobG8 feed
        run: |
          set -euo pipefail
          rm -f pipeline/input/*.xlsx pipeline/input/*.xls pipeline/input/*.xlsm pipeline/input/*.csv
          python pipeline/scripts/jobg8_xml_adapter.py \
            --zip "$RUNNER_TEMP/jobg8.zip" \
            --output pipeline/input/jobg8.xlsx \
            --expected-min 5000 \
            --expected-max 20000
          test -s pipeline/input/jobg8.xlsx

      - name: Refresh geo lookup from main
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git show origin/main:pipeline/geo/geo_lookup.xlsx > pipeline/geo/geo_lookup.xlsx
          test -s pipeline/geo/geo_lookup.xlsx

      - name: Build Customer Sales test slices
        working-directory: pipeline
        run: python scripts/customer_sales_test_pipeline.py

      - name: Commit refreshed test outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/output-customer-sales-test/*.json
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Refresh Customer Sales test slices"
            git push origin HEAD:agent/customer-sales-family
          fi
