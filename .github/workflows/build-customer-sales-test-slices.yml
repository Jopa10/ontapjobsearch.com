name: Build Customer Sales Test Slices

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: agent/customer-sales-family
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Refresh JobG8 and geo from main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:pipeline/input/jobg8.xlsx > pipeline/input/jobg8.xlsx
          git show origin/main:pipeline/geo/geo_lookup.xlsx > pipeline/geo/geo_lookup.xlsx

      - name: Build Customer Sales test slices
        working-directory: pipeline
        run: python scripts/customer_sales_test_pipeline.py

      - name: Commit refreshed test outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/output-customer-sales-test/*.json
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Refresh Customer Sales test slices"
            git push origin HEAD:agent/customer-sales-family
          fi
