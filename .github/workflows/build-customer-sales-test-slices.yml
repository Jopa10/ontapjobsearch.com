name: Build Customer Sales Proof Slices

on:
  workflow_dispatch:
  push:
    branches:
      - agent/customer-sales-family
    paths:
      - '.github/workflows/build-customer-sales-test-slices.yml'
      - 'pipeline/scripts/customer_sales_test_pipeline.py'
      - 'pipeline/scripts/customer_sales_test_expand.py'
      - 'pipeline/scripts/customer_sales_test_refine.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: agent/customer-sales-family
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Build three governed Customer Sales proof slices
        id: sales-build
        continue-on-error: true
        env:
          JOBG8_FEED_URL: ${{ secrets.JOBG8_FEED_URL }}
        run: |
          set -u
          STATUS="pipeline/output-customer-sales-test/run-status.txt"
          LOG="pipeline/output-customer-sales-test/run-log.txt"
          DOWNLOAD="$RUNNER_TEMP/jobg8_download"
          ZIP="$RUNNER_TEMP/jobg8.zip"
          mkdir -p pipeline/output-customer-sales-test
          : > "$STATUS"
          : > "$LOG"
          echo "Customer Sales proof run: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$STATUS"
          echo "Scope: Hampshire; Greater Manchester - Manchester & Salford; Yorkshire - West" >> "$STATUS"
          echo "Governance: branch-only proof slices; no LIVE activation; Sales/Service Admin overlap allowed" >> "$STATUS"

          if [ -z "${JOBG8_FEED_URL:-}" ]; then
            echo "FAILED: JOBG8_FEED_URL secret is not configured" >> "$STATUS"
            exit 1
          fi
          echo "OK: JobG8 feed secret available" >> "$STATUS"

          VALID_DOWNLOAD="false"
          for attempt in 1 2 3 4 5 6; do
            echo "JobG8 download attempt ${attempt}/6" >> "$LOG"
            rm -f "$DOWNLOAD" "$ZIP"
            if curl --fail --silent --show-error --location \
              --retry 2 --retry-delay 5 \
              --connect-timeout 30 --max-time 180 \
              "$JOBG8_FEED_URL" \
              --output "$DOWNLOAD" >> "$LOG" 2>&1; then
              if python - "$DOWNLOAD" >> "$LOG" 2>&1 <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          if not source.exists() or source.stat().st_size == 0:
              raise SystemExit(2)
          if zipfile.is_zipfile(source):
              raise SystemExit(0)
          data = source.read_bytes()
          stripped = data.lstrip()
          looks_xml = stripped.startswith(b"<?xml") or stripped.startswith(b"<")
          has_job = b"<Job" in data[:200000] or b":Job" in data[:200000]
          raise SystemExit(0 if looks_xml and has_job else 2)
          PY
              then
                VALID_DOWNLOAD="true"
                break
              fi
            fi
            BYTES="$(stat -c%s "$DOWNLOAD" 2>/dev/null || echo 0)"
            echo "Attempt ${attempt} returned unusable feed (${BYTES} bytes); waiting before retry" >> "$LOG"
            if [ "$attempt" -lt 6 ]; then
              sleep 60
            fi
          done

          if [ "$VALID_DOWNLOAD" != "true" ]; then
            echo "FAILED: could not obtain a valid current JobG8 feed after 6 attempts" >> "$STATUS"
            tail -100 "$LOG" >> "$STATUS"
            exit 1
          fi
          echo "OK: downloaded valid current JobG8 feed ($(stat -c%s "$DOWNLOAD") bytes)" >> "$STATUS"

          if ! python - "$DOWNLOAD" "$ZIP" >> "$LOG" 2>&1 <<'PY'
          import shutil
          import sys
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          data = source.read_bytes()
          if zipfile.is_zipfile(source):
              shutil.copyfile(source, target)
              print("Download is a ZIP archive")
          else:
              stripped = data.lstrip()
              looks_xml = stripped.startswith(b"<?xml") or stripped.startswith(b"<")
              has_job = b"<Job" in data[:200000] or b":Job" in data[:200000]
              if not (looks_xml and has_job):
                  raise SystemExit(2)
              with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_DEFLATED) as archive:
                  archive.writestr("Jobs.xml", data)
              print("Wrapped raw XML download as Jobs.xml ZIP")
          PY
          then
            echo "FAILED: normalise downloaded JobG8 feed" >> "$STATUS"
            tail -100 "$LOG" >> "$STATUS"
            exit 1
          fi
          echo "OK: normalised JobG8 feed" >> "$STATUS"

          rm -f pipeline/input/*.xlsx pipeline/input/*.xls pipeline/input/*.xlsm pipeline/input/*.csv
          if ! python pipeline/scripts/jobg8_xml_adapter.py \
            --zip "$ZIP" \
            --output pipeline/input/jobg8.xlsx \
            --expected-min 5000 \
            --expected-max 20000 >> "$LOG" 2>&1; then
            echo "FAILED: convert current JobG8 feed" >> "$STATUS"
            tail -100 "$LOG" >> "$STATUS"
            exit 1
          fi
          echo "OK: converted current JobG8 feed" >> "$STATUS"

          if ! git fetch origin +refs/heads/main:refs/remotes/origin/main >> "$LOG" 2>&1; then
            echo "FAILED: fetch main for current geography" >> "$STATUS"
            tail -100 "$LOG" >> "$STATUS"
            exit 1
          fi
          if ! git show origin/main:pipeline/geo/geo_lookup.xlsx > pipeline/geo/geo_lookup.xlsx 2>> "$LOG"; then
            echo "FAILED: refresh geo lookup from main" >> "$STATUS"
            tail -100 "$LOG" >> "$STATUS"
            exit 1
          fi
          echo "OK: refreshed geo lookup from main" >> "$STATUS"

          rm -f pipeline/output-customer-sales-test/*.json

          if ! (cd pipeline && python -m scripts.customer_sales_test_pipeline) >> "$LOG" 2>&1; then
            echo "FAILED: Customer Sales proof selector" >> "$STATUS"
            tail -100 "$LOG" >> "$STATUS"
            exit 1
          fi
          echo "OK: Customer Sales proof selector completed" >> "$STATUS"

          if ! (cd pipeline && python -m scripts.customer_sales_test_expand) >> "$LOG" 2>&1; then
            echo "FAILED: Customer Sales guarded account-role expansion" >> "$STATUS"
            tail -100 "$LOG" >> "$STATUS"
            exit 1
          fi
          echo "OK: Customer Sales guarded account-role expansion completed" >> "$STATUS"

          if ! (cd pipeline && python -m scripts.customer_sales_test_refine) >> "$LOG" 2>&1; then
            echo "FAILED: Customer Sales QA refinement" >> "$STATUS"
            tail -100 "$LOG" >> "$STATUS"
            exit 1
          fi
          echo "OK: Customer Sales QA refinement completed" >> "$STATUS"
          tail -60 "$LOG" >> "$STATUS"

      - name: Commit proof outputs and diagnostic status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f --ignore-unmatch \
            pipeline/output-customer-sales-test/northern-ireland-east.json \
            pipeline/output-customer-sales-test/warrington-halton.json \
            pipeline/output-customer-sales-test/cornwall.json \
            pipeline/output-customer-sales-test/south-yorkshire.json

          git add -- \
            pipeline/output-customer-sales-test/run-status.txt \
            pipeline/output-customer-sales-test/run-log.txt

          for path in \
            pipeline/output-customer-sales-test/hampshire.json \
            pipeline/output-customer-sales-test/manchester-salford.json \
            pipeline/output-customer-sales-test/west-yorkshire.json \
            pipeline/output-customer-sales-test/refinement-report.json; do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No Customer Sales proof changes to commit"
          else
            git commit -m "Refresh Customer Sales proof slices"
            git push origin HEAD:agent/customer-sales-family
          fi

      - name: Fail if Customer Sales build failed
        if: steps.sales-build.outcome == 'failure'
        run: exit 1
