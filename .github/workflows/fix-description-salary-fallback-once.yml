name: Fix description salary fallback once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-description-salary-fallback-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message == 'Run one-off salary fallback fixer' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Apply patch
        run: python pipeline/scripts/_salary_fallback_fix_once.py

      - name: Run salary regression tests
        working-directory: pipeline
        run: python -m unittest discover -s tests -p 'test_salary_description_fallback.py' -v

      - name: Regenerate current live slice outputs
        working-directory: pipeline
        run: python -m scripts.service_admin_pipeline_north_yorkshire

      - name: Verify Bristol target output
        run: python -c "import json; from pathlib import Path; rows=json.loads(Path('pipeline/output-admin-service/bristol-bath-admin-service.json').read_text(encoding='utf-8')); target=next(r for r in rows if str(r.get('job_id'))=='23643_225466068'); assert target.get('salary_text')=='Up to £28,000 per year', target; print(target.get('salary_text'))"

      - name: Publish verified pages
        working-directory: pipeline
        run: python -m scripts.publish_verified_pages_north_yorkshire --write

      - name: Verify Bristol published JSON
        run: python -c "import json; from pathlib import Path; rows=json.loads(Path('app/_city-pages/configured-slices/bristol-bath/service-administrator-jobs.json').read_text(encoding='utf-8')); target=next(r for r in rows if str(r.get('job_id'))=='23643_225466068'); assert target.get('salary_text')=='Up to £28,000 per year', target; print(target.get('salary_text'))"

      - name: Commit fix and refreshed Bristol output
        run: |
          set -euo pipefail
          rm .github/workflows/fix-description-salary-fallback-once.yml
          rm pipeline/scripts/_salary_fallback_fix_once.py
          git add -- pipeline/scripts/service_admin_pipeline_core.py pipeline/tests/test_salary_description_fallback.py pipeline/output-admin-service/bristol-bath-admin-service.json app/_city-pages/configured-slices/bristol-bath/service-administrator-jobs.json .github/workflows/fix-description-salary-fallback-once.yml pipeline/scripts/_salary_fallback_fix_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix safe description salary fallback and refresh Bristol"
          git push origin main
