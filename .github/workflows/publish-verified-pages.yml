name: Publish verified pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-verified-pages:
    name: Publish verified pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish verified pages
        id: publish
        working-directory: pipeline
        run: |
          set -euo pipefail
          report_file="$(mktemp)"
          python -m scripts.publish_verified_pages_sussex --write | tee "$report_file"
          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Build private live-job source report
        id: live-count
        run: |
          set -euo pipefail
          report_date="$(date -u +%F)"
          report_file="$(mktemp)"
          python pipeline/scripts/live_job_source_counter.py \
            --app-dir app \
            --reports-dir pipeline/reports-daily \
            --date "$report_date" | tee "$report_file"
          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"
          echo "report_date=$report_date" >> "$GITHUB_OUTPUT"

      - name: Commit approved live JSON changes and private count reports
        id: commit
        run: |
          set -euo pipefail
          approved_paths=(
            "app/hampshire/service-administrator-jobs.json"
            "app/kent/service-administrator-jobs.json"
            "app/london/service-administrator-jobs.json"
            "app/north-east/service-administrator-jobs.json"
            "app/south-yorkshire/service-administrator-jobs.json"
            "app/surrey/service-administrator-jobs.json"
            "app/sussex/service-administrator-jobs.json"
            "app/west-yorkshire/service-administrator-jobs.json"
            "app/cumbria-south/support-worker.json"
            "app/hampshire/support-worker.json"
            "app/north-east/support-worker-jobs.json"
            "app/south-yorkshire/support-worker.json"
            "app/sussex/support-worker.json"
            "app/west-yorkshire/support-worker.json"
          )
          daily_report="pipeline/reports-daily/live-job-source-count-${{ steps.live-count.outputs.report_date }}.csv"
          history_report="pipeline/reports-daily/live-job-source-history.csv"

          git add -- "${approved_paths[@]}" "$daily_report" "$history_report"
          staged_files="$(git diff --cached --name-only)"
          if [ -z "$staged_files" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No approved live JSON or live-job count changes to commit" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          unexpected_files="$({ printf '%s\n' "$staged_files" | awk \
            -v daily="$daily_report" \
            -v history="$history_report" \
            '$0 != "app/hampshire/service-administrator-jobs.json" &&
             $0 != "app/kent/service-administrator-jobs.json" &&
             $0 != "app/london/service-administrator-jobs.json" &&
             $0 != "app/north-east/service-administrator-jobs.json" &&
             $0 != "app/south-yorkshire/service-administrator-jobs.json" &&
             $0 != "app/surrey/service-administrator-jobs.json" &&
             $0 != "app/sussex/service-administrator-jobs.json" &&
             $0 != "app/west-yorkshire/service-administrator-jobs.json" &&
             $0 != "app/cumbria-south/support-worker.json" &&
             $0 != "app/hampshire/support-worker.json" &&
             $0 != "app/north-east/support-worker-jobs.json" &&
             $0 != "app/south-yorkshire/support-worker.json" &&
             $0 != "app/sussex/support-worker.json" &&
             $0 != "app/west-yorkshire/support-worker.json" &&
             $0 != daily &&
             $0 != history'; } || true)"
          if [ -n "$unexpected_files" ]; then
            echo "::error::Refusing to commit unexpected staged paths:"
            printf '%s\n' "$unexpected_files"
            git reset --mixed
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish verified job pages"
          git push origin main
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Published verified pages commit: $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test city-page derivation
        working-directory: pipeline
        run: python -m unittest discover -s tests -p 'test_derive_city_pages.py' -v

      - name: Derive city-page review candidates
        id: city-review
        working-directory: pipeline
        run: |
          set -euo pipefail
          report_file="$(mktemp)"
          python -m scripts.derive_city_pages --write-review | tee "$report_file"
          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit city-page review outputs
        run: |
          set -euo pipefail
          city_review_paths=(
            "pipeline/reviews/city-pages/newcastle-service-administrator-review.csv"
            "pipeline/reviews/city-pages/newcastle-service-administrator-summary.md"
          )

          if [ -z "$(git status --porcelain -- "${city_review_paths[@]}")" ]; then
            echo "No city-page review changes to commit" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add -- "${city_review_paths[@]}"
          staged_files="$(git diff --cached --name-only)"
          unexpected_files="$({ printf '%s\n' "$staged_files" | awk \
            '$0 != "pipeline/reviews/city-pages/newcastle-service-administrator-review.csv" &&
             $0 != "pipeline/reviews/city-pages/newcastle-service-administrator-summary.md"'; } || true)"
          if [ -n "$unexpected_files" ]; then
            echo "::error::Refusing to commit unexpected city-page paths:"
            printf '%s\n' "$unexpected_files"
            git reset --mixed
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh city-page review outputs"
          git push origin main
          echo "City-page review commit: $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload downloadable live-job source report
        if: steps.live-count.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: live-job-source-report-${{ steps.live-count.outputs.report_date }}
          path: |
            pipeline/reports-daily/live-job-source-count-${{ steps.live-count.outputs.report_date }}.csv
            pipeline/reports-daily/live-job-source-history.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload Newcastle city-page review
        if: steps.city-review.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: newcastle-city-page-review
          path: |
            pipeline/reviews/city-pages/newcastle-service-administrator-review.csv
            pipeline/reviews/city-pages/newcastle-service-administrator-summary.md
          if-no-files-found: error
          retention-days: 30
