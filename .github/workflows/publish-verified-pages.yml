name: Publish verified pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-verified-pages:
    name: Publish verified pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish verified pages
        id: publish
        working-directory: pipeline
        run: |
          set -euo pipefail
          report_file="$(mktemp)"
          python -m scripts.publish_verified_pages_north_yorkshire --write | tee "$report_file"
          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Build private live-job source report
        id: live-count
        run: |
          set -euo pipefail
          report_date="$(date -u +%F)"
          report_file="$(mktemp)"
          python pipeline/scripts/live_job_source_counter.py \
            --app-dir app \
            --reports-dir pipeline/reports-daily \
            --date "$report_date" | tee "$report_file"
          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"
          echo "report_date=$report_date" >> "$GITHUB_OUTPUT"

      - name: Test daily published job ledger
        working-directory: pipeline
        run: |
          python -m unittest discover -s tests -p 'test_published_job_daily_ledger.py' -v

      - name: Build daily newly-published job ledger
        id: new-jobs
        working-directory: pipeline
        run: |
          set -euo pipefail
          report_file="$(mktemp)"
          python -m scripts.published_job_daily_ledger \
            --app-dir ../app \
            --reports-dir reports-daily \
            --date "${{ steps.live-count.outputs.report_date }}" | tee "$report_file"
          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Update displayed publish date
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import re
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/London"))
          day = now.day
          suffix = "th" if 10 <= day % 100 <= 20 else {1: "st", 2: "nd", 3: "rd"}.get(day % 10, "th")
          period = "AM" if now.hour < 12 else "PM"
          label = f"{now:%a} {day}{suffix} {now:%b}, {period}"

          path = Path("config/job-page-status.ts")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'defaultDate: "[^"]+",',
              f'defaultDate: "{label}",',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update exactly one defaultDate in config/job-page-status.ts")
          path.write_text(updated, encoding="utf-8")
          print(f"Displayed publish date: {label}")
          PY

      - name: Commit approved live JSON changes and private count reports
        id: commit
        run: |
          set -euo pipefail
          approved_paths=(
            "app/_city-pages/configured-slices"
            "app/coventry-warwickshire/service-administrator-jobs.json"
            "app/hampshire/service-administrator-jobs.json"
            "app/kent/service-administrator-jobs.json"
            "app/london/service-administrator-jobs.json"
            "app/north-east/service-administrator-jobs.json"
            "app/north-yorkshire/service-administrator-jobs.json"
            "app/south-yorkshire/service-administrator-jobs.json"
            "app/surrey/service-administrator-jobs.json"
            "app/sussex/service-administrator-jobs.json"
            "app/west-yorkshire/service-administrator-jobs.json"
            "app/cumbria-south/support-worker.json"
            "app/hampshire/support-worker.json"
            "app/north-east/support-worker-jobs.json"
            "app/south-yorkshire/support-worker.json"
            "app/sussex/support-worker.json"
            "app/west-yorkshire/support-worker.json"
          )
          status_file="config/job-page-status.ts"
          daily_report="pipeline/reports-daily/live-job-source-count-${{ steps.live-count.outputs.report_date }}.csv"
          history_report="pipeline/reports-daily/live-job-source-history.csv"
          new_jobs_report="pipeline/reports-daily/newly-published-jobs-${{ steps.live-count.outputs.report_date }}.csv"
          first_seen_report="pipeline/reports-daily/published-job-first-seen-history.csv"

          git add -- \
            "${approved_paths[@]}" \
            "$status_file" \
            "$daily_report" \
            "$history_report" \
            "$new_jobs_report" \
            "$first_seen_report"
          staged_files="$(git diff --cached --name-only)"
          if [ -z "$staged_files" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No approved live JSON, display-date or live-job report changes to commit" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            unexpected_files="$({ printf '%s\n' "$staged_files" | awk \
              -v status="$status_file" \
              -v daily="$daily_report" \
              -v history="$history_report" \
              -v newjobs="$new_jobs_report" \
              -v firstseen="$first_seen_report" \
              '$0 !~ /^app\/_city-pages\/configured-slices\// &&
               $0 != "app/coventry-warwickshire/service-administrator-jobs.json" &&
               $0 != "app/hampshire/service-administrator-jobs.json" &&
               $0 != "app/kent/service-administrator-jobs.json" &&
               $0 != "app/london/service-administrator-jobs.json" &&
               $0 != "app/north-east/service-administrator-jobs.json" &&
               $0 != "app/north-yorkshire/service-administrator-jobs.json" &&
               $0 != "app/south-yorkshire/service-administrator-jobs.json" &&
               $0 != "app/surrey/service-administrator-jobs.json" &&
               $0 != "app/sussex/service-administrator-jobs.json" &&
               $0 != "app/west-yorkshire/service-administrator-jobs.json" &&
               $0 != "app/cumbria-south/support-worker.json" &&
               $0 != "app/hampshire/support-worker.json" &&
               $0 != "app/north-east/support-worker-jobs.json" &&
               $0 != "app/south-yorkshire/support-worker.json" &&
               $0 != "app/sussex/support-worker.json" &&
               $0 != "app/west-yorkshire/support-worker.json" &&
               $0 != status &&
               $0 != daily &&
               $0 != history &&
               $0 != newjobs &&
               $0 != firstseen'; } || true)"
            if [ -n "$unexpected_files" ]; then
              echo "::error::Refusing to commit unexpected staged paths:"
              printf '%s\n' "$unexpected_files"
              git reset --mixed
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish verified job pages"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Could not push verified pages after 5 safe retries"
                exit 1
              fi
              sleep $((attempt * 2))
            done
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Published verified pages commit: $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test city opportunity lifecycle
        working-directory: pipeline
        run: |
          python -m unittest discover -s tests -p 'test_scan_city_opportunities.py' -v
          python -m unittest discover -s tests -p 'test_city_opportunity_history.py' -v

      - name: Record city opportunity pipeline history
        working-directory: pipeline
        run: |
          set -euo pipefail
          python -m scripts.scan_city_opportunities \
            --threshold 6 \
            --near-threshold 4 \
            --output-json pipeline/reports/city-opportunities-current.json \
            > /tmp/city-opportunity-base.md
          python -m scripts.update_city_opportunity_history \
            --current-json pipeline/reports/city-opportunities-current.json \
            --history-json pipeline/reports/city-opportunity-history.json \
            --output-md pipeline/reports/city-opportunities-current.md \
            --record-snapshot \
            --run-id "${GITHUB_RUN_ID}" \
            --run-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat ../pipeline/reports/city-opportunities-current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit city opportunity history
        run: |
          set -euo pipefail
          git add -- \
            pipeline/reports/city-opportunities-current.md \
            pipeline/reports/city-opportunities-current.json \
            pipeline/reports/city-opportunity-history.json
          if git diff --cached --quiet; then
            echo "City opportunity history unchanged" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record city opportunity history"
            git push origin main
            echo "City opportunity history commit: $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test city-page derivation and persistence
        working-directory: pipeline
        run: |
          python -m unittest discover -s tests -p 'test_derive_city_pages.py' -v
          python -m unittest discover -s tests -p 'test_active_city_page_persistence.py' -v

      - name: Derive and publish city pages
        id: city-publish
        working-directory: pipeline
        run: |
          set -euo pipefail
          report_file="$(mktemp)"
          python -m scripts.derive_city_pages --publish | tee "$report_file"
          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce permanent active city pages
        working-directory: pipeline
        run: |
          set -euo pipefail
          report_file="$(mktemp)"
          python -m scripts.maintain_active_city_pages | tee "$report_file"
          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit city-page outputs
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- pipeline/reviews/city-pages app/_city-pages)" ]; then
            echo "No city-page changes to commit" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add -A -- pipeline/reviews/city-pages app/_city-pages
          staged_files="$(git diff --cached --name-only)"
          unexpected_files="$({ printf '%s\n' "$staged_files" | awk \
            '$0 !~ /^pipeline\/reviews\/city-pages\// && $0 !~ /^app\/_city-pages\//'; } || true)"
          if [ -n "$unexpected_files" ]; then
            echo "::error::Refusing to commit unexpected city-page paths:"
            printf '%s\n' "$unexpected_files"
            git reset --mixed
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh active city-page outputs"
          git push origin main
          echo "City-page output commit: $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload downloadable live-job source report
        if: steps.live-count.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: live-job-source-report-${{ steps.live-count.outputs.report_date }}
          path: |
            pipeline/reports-daily/live-job-source-count-${{ steps.live-count.outputs.report_date }}.csv
            pipeline/reports-daily/live-job-source-history.csv
            pipeline/reports-daily/newly-published-jobs-${{ steps.live-count.outputs.report_date }}.csv
            pipeline/reports-daily/published-job-first-seen-history.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload city opportunity report
        uses: actions/upload-artifact@v4
        with:
          name: city-opportunity-report
          path: |
            pipeline/reports/city-opportunities-current.json
            pipeline/reports/city-opportunities-current.md
            pipeline/reports/city-opportunity-history.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload active city-page outputs
        if: steps.city-publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: active-city-page-output
          path: |
            pipeline/reviews/city-pages/
            app/_city-pages/
          if-no-files-found: warn
          retention-days: 30
