name: Build at-a-glance review

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-region-overview-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard test branch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "agent/customer-sales-family" ]; then
            echo "::error::Run this test only on agent/customer-sales-family"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build daily regional overview
        run: python pipeline/scripts/build_daily_region_overview.py

      - name: Verify overview isolation
        run: |
          set -euo pipefail
          test -s pipeline/reports-daily/daily-region-overview.md
          unexpected="$(git diff --name-only | awk '$0 != "pipeline/reports-daily/daily-region-overview.md"')"
          if [ -n "$unexpected" ]; then
            echo "::error::Overview builder changed unexpected files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit overview to test branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/reports-daily/daily-region-overview.md
          if git diff --cached --quiet; then
            echo "No overview change to commit"
            exit 0
          fi
          git commit -m "Refresh daily regional overview"
          git push origin HEAD:agent/customer-sales-family

      - name: Workflow summary
        run: |
          {
            echo "## Daily regional overview"
            echo
            sed -n '1,160p' pipeline/reports-daily/daily-region-overview.md
          } >> "$GITHUB_STEP_SUMMARY"
