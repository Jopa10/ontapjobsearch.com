name: Run Compiler Module 1

on:
  workflow_dispatch:
    inputs:
      month:
        description: Month to compile in YYYY-MM format
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  run-compiler-module-1:
    name: Run Compiler Module 1
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: python -m pip install --upgrade pip pandas openpyxl boto3

      - name: Validate month input
        run: |
          set -euo pipefail
          month='${{ inputs.month }}'
          if [[ ! "$month" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error::Invalid month '$month'. Expected YYYY-MM with month 01 through 12."
            exit 1
          fi

      - name: Test monthly JobG8 archive staging rules
        working-directory: pipeline
        run: python -m unittest discover -s tests -p 'test_materialize_jobg8_archive_month.py' -v

      - name: Configure AWS credentials for JobG8 archive
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::179402568934:role/OntapJobG8ArchiveGitHubRole
          aws-region: eu-west-2

      - name: Materialize Compiler Module 1 input from private archive
        env:
          JOBG8_ARCHIVE_BUCKET: ontap-jobg8-archive-179402568934-eu-west-2-an
          JOBG8_ARCHIVE_REGION: eu-west-2
        run: |
          set -euo pipefail
          month='${{ inputs.month }}'
          staging_dir="$RUNNER_TEMP/jobg8-compiler-input/${month}"
          python pipeline/scripts/materialize_jobg8_archive_month.py \
            --month "$month" \
            --bucket "$JOBG8_ARCHIVE_BUCKET" \
            --region "$JOBG8_ARCHIVE_REGION" \
            --prefix "jobg8/raw" \
            --s3-start-date "2026-08-14" \
            --legacy-dir "pipeline/input-jobg8-archive/${month}" \
            --output-dir "$staging_dir"
          echo "JOBG8_COMPILER_INPUT_DIR=$staging_dir" >> "$GITHUB_ENV"

      - name: Run Compiler Module 1
        run: |
          set -euo pipefail
          python -m py_compile pipeline/scripts/jobg8_module_1_monthly_advertiser_report.py
          python pipeline/scripts/jobg8_module_1_monthly_advertiser_report.py \
            --month '${{ inputs.month }}' \
            --input-dir "$JOBG8_COMPILER_INPUT_DIR" \
            --output-dir 'pipeline/reports-module1' \
            --geo-lookup 'pipeline/geo/geo_lookup.xlsx' \
            --registers-dir 'pipeline/registers'

      - name: Verify Compiler Module 1 outputs
        run: |
          set -euo pipefail
          for output_file in \
            "pipeline/reports-module1/${{ inputs.month }}-module1-advertiser-campaigns.csv" \
            "pipeline/reports-module1/${{ inputs.month }}-module1-role-trends.csv" \
            "pipeline/reports-module1/${{ inputs.month }}-module1-advertiser-type-summary.csv"; do
            if [ ! -s "$output_file" ]; then
              echo "::error::Required Compiler Module 1 output '$output_file' is missing or empty."
              exit 1
            fi
          done

      - name: Upload Compiler Module 1 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-module-1-reports-${{ inputs.month }}
          path: pipeline/reports-module1/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit Compiler Module 1 outputs
        run: |
          set -euo pipefail
          output_files=(
            "pipeline/reports-module1/${{ inputs.month }}-module1-advertiser-campaigns.csv"
            "pipeline/reports-module1/${{ inputs.month }}-module1-role-trends.csv"
            "pipeline/reports-module1/${{ inputs.month }}-module1-advertiser-type-summary.csv"
          )
          if [ -z "$(git status --porcelain -- "${output_files[@]}")" ]; then
            echo "No Compiler Module 1 output changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${output_files[@]}"
          git commit -m "Run Compiler Module 1 for ${{ inputs.month }}"
          git push
