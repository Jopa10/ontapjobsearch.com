name: One-off selected union diagnostic

on:
  push:
    paths:
      - '.github/workflows/selected-union-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl
      - name: Calculate 12 Aug selected-job union
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          import re
          from pathlib import Path
          from collections import Counter

          FEED = Path('pipeline/input-jobg8-archive/2026-08/2026-08-12.xlsx')
          REGS = Path('pipeline/registers')
          GEO = Path('pipeline/geo/geo_lookup.xlsx')
          selected = {'HIGH_CONFIDENCE','ELASTIC_FIT'}
          specs = {
            'support_worker':'support_worker_title_classification_register.csv',
            'admin_service':'admin_service_title_classification_register.csv',
            'finance_accounts':'finance_accounts_title_classification_register.csv',
            'customer_service_contact_centre':'customer_service_contact_centre_title_classification_register.csv',
            'warehouse_logistics':'warehouse_logistics_title_classification_register.csv',
            'hr_recruitment':'hr_recruitment_title_classification_register.csv',
          }
          def norm(v):
            if v is None or pd.isna(v): return ''
            return re.sub(r'\s+',' ',str(v).strip()).lower()

          registers = {}
          for cat, fn in specs.items():
            r = pd.read_csv(REGS/fn, dtype=str).fillna('')
            registers[cat] = {norm(x.title) for _,x in r.iterrows() if x.classification.strip().upper() in selected and norm(x.title)}

          df = pd.read_excel(FEED, dtype=str).fillna('')
          title_col='/Job/Position'; id_col='/Job/DisplayReference'; area_col='/Job/Area'; loc_col='/Job/Location'
          area_df = pd.read_excel(GEO, dtype=str).fillna('')
          area_map = {norm(r.Area): str(r.Cluster).strip() for _,r in area_df.iterrows() if norm(r.Area) and str(r.Cluster).strip()}
          try:
            fb = pd.read_excel(GEO, sheet_name='LocationFallback', dtype=str).fillna('')
            fallback = {norm(r.Location): str(r.Cluster).strip() for _,r in fb.iterrows() if norm(r.Status)=='auto' and norm(r.Location) and str(r.Cluster).strip()}
          except Exception:
            fallback = {}

          cat_ids={c:set() for c in specs}
          union=set(); white=set(); new3=set(); other_unknown=set(); multi=set(); regions=Counter()
          for i,row in df.iterrows():
            jid=str(row.get(id_col,'')).strip() or f'row-{i+2}'
            tk=norm(row.get(title_col,''))
            cats=[c for c,s in registers.items() if tk in s]
            if not cats: continue
            union.add(jid)
            if len(cats)>1: multi.add(jid)
            for c in cats: cat_ids[c].add(jid)
            if set(cats)&{'admin_service','finance_accounts','customer_service_contact_centre','hr_recruitment'}: white.add(jid)
            if set(cats)&{'finance_accounts','customer_service_contact_centre','hr_recruitment'}: new3.add(jid)
            area=norm(row.get(area_col,'')); loc=norm(row.get(loc_col,''))
            if area and area not in {'not specified','unknown'}:
              region=area_map.get(area,'Other / Unknown')
            else:
              region=fallback.get(loc,'Other / Unknown')
            regions[region]+=1
            if region=='Other / Unknown': other_unknown.add(jid)

          print('FEED_ROWS',len(df))
          for c in specs:
            print('CATEGORY',c,len(cat_ids[c]))
          print('UNIQUE_ALL_SELECTED',len(union))
          print('UNIQUE_WHITE_COLLAR_4',len(white))
          print('UNIQUE_NEW3_FIN_CS_HR',len(new3))
          print('MULTI_CATEGORY_UNIQUE',len(multi))
          print('OTHER_UNKNOWN_UNIQUE',len(other_unknown))
          print('USABLE_GEO_UNIQUE',len(union-other_unknown))
          print('TOP_REGIONS_SELECTED_UNION')
          for r,n in regions.most_common(20): print(r,n)
          PY
