name: Sync UK 78 governance once

on:
  push:
    paths:
      - '.github/uk-78-governance-trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync current geography statements
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('SYSTEM_MAP.md'); t=p.read_text()
          t=t.replace('73-market UK geography governance','78-market UK geography governance',1)
          a='- 22 August 2026 — **UK geography scope correction:** the 55-market reconciliation completed earlier on 22 August was an England-only audit, not the complete Ontap national geography. `pipeline/config/uk_assessable_regions.json` is now the canonical diagnostic geography authority with **73 UK markets: 55 England + 9 Scotland + 7 Wales + 2 Northern Ireland**. `pipeline/config/england_assessable_regions.json` is retained as the verified England subset/reference, not the national authority. `geo_lookup.xlsx` remains factual source-location authority; explicit safe aliases roll into canonical UK markets; ambiguous generic geo labels remain unresolved rather than being forced into a market. The daily Service Admin, Support Worker and Customer Sales diagnostics now target **219 market/family rows (73 × 3)**. This is diagnostic completeness only and does not auto-create LIVE/public slices; `job_slice_catalog.json` remains public/configured metadata and `region_category_slice_register.csv` remains the LIVE gate.'
          b='- 22 August 2026 — **UK geography scope correction, reconciled against the full 104-label geo lookup inventory:** the earlier 55-market result was England-only and the interim 73-market UK pass still missed five legitimate lookup markets. `pipeline/config/uk_assessable_regions.json` is now the canonical diagnostic geography authority with **78 UK markets: 58 England + 10 Scotland + 8 Wales + 2 Northern Ireland**. The five recovered markets are **Lancashire - West, Merseyside - Sefton, Merseyside - St Helens & Knowsley, Scotland - Borders and Wales - Mid**. The 55-market England file is retained as historical subset evidence, not the current national authority. `geo_lookup.xlsx` remains factual location authority; exact aliases roll up, while Channel Islands, unknown and ambiguous generic labels stay outside the governed market universe. Daily three-family diagnostics target **234 rows (78 × 3)**. LIVE/public approval remains separately controlled by the catalogue/register.'
          if a not in t: raise SystemExit('SYSTEM_MAP current bullet missing')
          p.write_text(t.replace(a,b,1))

          p=Path('SYSTEM_OVERVIEW.md'); t=p.read_text()
          t=t.replace('73-market UK geography governance','78-market UK geography governance',1)
          a='- 22 August 2026 — **Corrected the regional diagnostic scope from England-only to UK-wide.** The earlier 55-market result remains the complete England subset, but it is no longer the national assessment authority. Ontap now uses `pipeline/config/uk_assessable_regions.json` for **73 assessable UK markets: 55 England, 9 Scotland, 7 Wales and 2 Northern Ireland**. Daily Service Admin, Support Worker and Sales Advisor diagnostics therefore target **219 rows (73 × 3)**, while LIVE/public pages remain separately controlled by the existing catalogue/register approval mechanism.'
          b='- 22 August 2026 — **Corrected regional diagnostics against the full UK lookup inventory.** The 104 raw `geo_lookup.xlsx` cluster labels reconcile to **78 assessable UK markets: 58 England, 10 Scotland, 8 Wales and 2 Northern Ireland** after exact aliases are rolled up and non-UK/unknown/ambiguous generic labels are excluded. The final pass recovered **Lancashire - West, Merseyside - Sefton, Merseyside - St Helens & Knowsley, Scotland - Borders and Wales - Mid** beyond the interim 73. Daily three-family diagnostics target **234 rows (78 × 3)**; LIVE/public pages remain separately controlled by explicit catalogue/register approval.'
          if a not in t: raise SystemExit('SYSTEM_OVERVIEW current bullet missing')
          p.write_text(t.replace(a,b,1))

          for f in ('SYSTEM_AUDIT.md','pipeline/README.md'):
              p=Path(f); t=p.read_text()
              t=t.replace('73 UK markets: 55 England + 9 Scotland + 7 Wales + 2 Northern Ireland','78 UK markets: 58 England + 10 Scotland + 8 Wales + 2 Northern Ireland')
              t=t.replace('73 assessable UK markets**: **55 England + 9 Scotland + 7 Wales + 2 Northern Ireland','78 assessable UK markets**: **58 England + 10 Scotland + 8 Wales + 2 Northern Ireland')
              t=t.replace('all 73 UK markets and targets **219 market/family rows**','all 78 UK markets and targets **234 market/family rows**')
              t=t.replace('complete 73-market UK diagnostic geography','complete 78-market UK diagnostic geography')
              t=t.replace('assess 73-market UK family coverage','assess 78-market UK family coverage')
              t=t.replace('## Daily 73-market UK family coverage','## Daily 78-market UK family coverage')
              t=t.replace('same-feed 73-market UK family coverage','same-feed 78-market UK family coverage')
              p.write_text(t)
          PY
      - name: Commit and self-remove
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-uk-78-governance-once.yml .github/uk-78-governance-trigger
          git add SYSTEM_MAP.md SYSTEM_OVERVIEW.md SYSTEM_AUDIT.md pipeline/README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync governance to full 78-market UK geography'
          git pull --rebase origin main
          git push origin HEAD:main
