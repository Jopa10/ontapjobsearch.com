      - 'pipeline/scripts/scan_city_opportunities.py'
      - 'pipeline/scripts/update_city_opportunity_history.py'
      - 'pipeline/scripts/maintain_active_city_pages.py'
      - 'pipeline/city_pages/**'
      - 'pipeline/reviews/city-pages/**'
      - 'pipeline/tests/test_england_assessable_regions.py'
      - 'pipeline/tests/test_uk_assessable_regions.py'
      - 'pipeline/tests/test_daily_family_coverage_sales.py'
      - 'pipeline/tests/test_report_jobg8_potential_duplicates.py'
      - 'pipeline/tests/test_derive_city_pages.py'
      - 'pipeline/tests/test_scan_city_opportunities.py'
      - 'pipeline/tests/test_city_opportunity_history.py'
      - 'pipeline/tests/test_active_city_page_persistence.py'
      - 'app/_city-pages/**'
      - 'app/job-search/**'
      - 'app/newcastle/**'
      - 'app/north-east/service-administrator-jobs/page.tsx'
      - 'app/north-yorkshire/**'
      - 'app/browse-jobs/page.tsx'
      - 'app/sitemap.ts'
