      - 'lib/city-page-data.ts'
      - 'lib/published-jobs.ts'
      - '.github/workflows/run-full-jobg8-daily-process.yml'
      - '.github/workflows/run-service-admin-pipeline.yml'
      - '.github/workflows/run-compiler-module-2.yml'
      - '.github/workflows/run-city-opportunity-scan.yml'
      - '.github/workflows/publish-verified-pages.yml'
      - '.github/workflows/test-slice-register.yml'
      - 'tests/test_slice_registry.py'
      - 'tests/test_customer_sales_pipeline.py'
      - 'tests/test_publish_verified_pages.py'
      - 'tests/test_sussex_admin_launch.py'
      - 'tests/test_newcastle_city_launch.py'
      - 'tests/test_service_admin_sussex_wrapper.py'
      - 'tests/test_module2_live_slices.py'
      - 'tests/test_north_yorkshire_slice.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python packages
        run: python -m pip install --upgrade pip pandas openpyxl
      - name: Validate Python and register tests
        run: |
          python -m py_compile \
            pipeline/scripts/slice_catalog.py \
            pipeline/scripts/slice_registry.py \
            pipeline/scripts/registered_category_pipeline.py \
            pipeline/scripts/customer_sales_pipeline.py \
            pipeline/scripts/assess_daily_family_coverage.py \
            pipeline/scripts/daily_family_coverage_history.py \
            pipeline/scripts/publish_verified_pages.py \
            pipeline/scripts/publish_verified_pages_sussex.py \
            pipeline/scripts/publish_verified_pages_coventry.py \
            pipeline/scripts/publish_verified_pages_live_config.py \
            pipeline/scripts/publish_verified_pages_north_yorkshire.py \
            pipeline/scripts/service_admin_pipeline_sussex.py \
            pipeline/scripts/service_admin_pipeline_coventry.py \
            pipeline/scripts/service_admin_pipeline_live_config.py \
            pipeline/scripts/service_admin_pipeline_north_yorkshire.py \
            pipeline/scripts/jobg8_module_2_live_slices.py \
            pipeline/scripts/report_jobg8_potential_duplicates.py \
            pipeline/scripts/derive_city_pages.py \
            pipeline/scripts/scan_city_opportunities.py \
            pipeline/scripts/update_city_opportunity_history.py \
            pipeline/scripts/maintain_active_city_pages.py \
            pipeline/scripts/jobg8_family_discovery.py
            pipeline/scripts/jobg8_family_boundary_review.py
          python -m unittest \
            tests.test_slice_registry \
            tests.test_customer_sales_pipeline \
            tests.test_publish_verified_pages \
            tests.test_sussex_admin_launch \
            tests.test_newcastle_city_launch \
            tests.test_service_admin_sussex_wrapper \
            tests.test_module2_live_slices \
            tests.test_north_yorkshire_slice \
            -v
          PYTHONPATH=pipeline python -m unittest discover -s pipeline/tests -p 'test_england_assessable_regions.py' -v
          PYTHONPATH=pipeline python -m unittest discover -s pipeline/tests -p 'test_uk_assessable_regions.py' -v
          PYTHONPATH=pipeline python -m unittest discover -s pipeline/tests -p 'test_daily_family_coverage_sales.py' -v
          PYTHONPATH=pipeline python -m unittest discover -s pipeline/tests -p 'test_report_jobg8_potential_duplicates.py' -v
          python -m unittest discover -s pipeline/tests -p 'test_jobg8_family_discovery.py' -v
          python -m unittest discover -s pipeline/tests -p 'test_derive_city_pages.py' -v
          python -m unittest discover -s pipeline/tests -p 'test_scan_city_opportunities.py' -v
          python -m unittest discover -s pipeline/tests -p 'test_city_opportunity_history.py' -v
          python -m unittest discover -s pipeline/tests -p 'test_active_city_page_persistence.py' -v
      - name: Detect optional repository JobG8 fixture
        id: jobg8-fixture
        run: |
          if find pipeline/input -maxdepth 1 -type f \( -iname '*jobg8*.xlsx' -o -iname '*jobg8*.xls' -o -iname '*jobg8*.csv' \) -print -quit | grep -q .; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Repository JobG8 fixture found; running optional feed-backed integration checks.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No repository JobG8 fixture by design; feed-backed integration checks will be skipped.'
          fi
      - name: Generate current config-driven outputs for verification
        if: steps.jobg8-fixture.outputs.available == 'true'
        working-directory: pipeline
        run: python -m scripts.service_admin_pipeline_north_yorkshire
      - name: Confirm current LIVE slices are publishable
        if: steps.jobg8-fixture.outputs.available == 'true'
        working-directory: pipeline
        run: python -m scripts.publish_verified_pages_north_yorkshire --dry-run
      - name: Regenerate and persist active city output
        if: steps.jobg8-fixture.outputs.available == 'true'
        working-directory: pipeline
        run: |
          python -m scripts.derive_city_pages --publish
          python -m scripts.maintain_active_city_pages
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Build Next.js site
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ontap_ci
        run: |
          npm ci
          npm run build
