name: Prepare Sussex admin launch data

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'pipeline/scripts/service_admin_pipeline_sussex.py'
      - 'pipeline/registers/region_category_slice_register.csv'
      - '.github/workflows/prepare-sussex-admin-launch.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Build current Sussex service-admin output
        working-directory: pipeline
        run: python -m scripts.service_admin_pipeline_sussex

      - name: Publish Sussex output into the app data file
        working-directory: pipeline
        run: python -m scripts.publish_verified_pages_sussex --write

      - name: Verify Sussex launch data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          output_path = Path('pipeline/output-admin-service/sussex-admin-service.json')
          app_path = Path('app/sussex/service-administrator-jobs.json')
          output = json.loads(output_path.read_text(encoding='utf-8'))
          published = json.loads(app_path.read_text(encoding='utf-8'))
          if not output:
              raise SystemExit('Sussex service-admin output is empty')
          if len(output) != len(published):
              raise SystemExit('Sussex output and published app JSON counts differ')
          print(f'Prepared {len(output)} Sussex service-admin jobs')
          PY

      - name: Commit generated Sussex launch data
        run: |
          set -euo pipefail
          paths=(
            'pipeline/output-admin-service/sussex-admin-service.json'
            'app/sussex/service-administrator-jobs.json'
            'pipeline/reports-daily/decision-report-admin-service.csv'
            'pipeline/reports-daily/selection-summary-report-admin-service.csv'
            'pipeline/reports-daily/validation-report-admin-service.csv'
            'pipeline/reviews/jobg8/service-admin-review.csv'
            'pipeline/reviews/jobg8/service-admin-review.md'
          )
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo 'No generated launch-data changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate Sussex admin launch data'
          git push origin HEAD:${{ github.head_ref }}
