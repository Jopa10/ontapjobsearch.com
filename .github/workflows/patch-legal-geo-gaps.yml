name: Patch Legal geo gaps

on:
  push:
    paths:
      - '.github/workflows/patch-legal-geo-gaps.yml'
      - 'pipeline/scripts/patch_legal_geo_gaps.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl
      - name: Patch canonical geo workbook
        run: python pipeline/scripts/patch_legal_geo_gaps.py
      - name: Commit canonical workbook
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline/geo/geo_lookup.xlsx
          if git diff --cached --quiet; then
            echo 'Geo workbook already current'
            exit 0
          fi
          git commit -m 'Fix canonical Legal geo gaps'
          git pull --rebase origin main
          git push origin HEAD:main
