name: Audit complete UK geo cluster inventory

on:
  push:
    paths:
      - '.github/workflows/audit-uk-geo-clusters-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas openpyxl
      - name: Enumerate geo lookup clusters
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path('pipeline/geo/geo_lookup.xlsx')
          df = pd.read_excel(path, dtype=str).fillna('')
          if not {'Area','Cluster'}.issubset(df.columns):
              raise SystemExit('geo lookup missing Area/Cluster')
          grouped = (df[df['Cluster'].str.strip() != '']
                     .assign(Cluster=lambda x: x['Cluster'].str.strip(), Area=lambda x: x['Area'].str.strip())
                     .groupby('Cluster')['Area'].agg(['count', lambda s: '; '.join(sorted({x for x in s if x})[:8])])
                     .reset_index())
          grouped.columns = ['cluster','area_rows','example_areas']
          try:
              fb = pd.read_excel(path, sheet_name='LocationFallback', dtype=str).fillna('')
              fb_clusters = sorted({str(x).strip() for x in fb.get('Cluster', []) if str(x).strip()})
          except Exception:
              fb_clusters = []
          all_clusters = sorted(set(grouped['cluster']) | set(fb_clusters), key=str.casefold)
          out = Path('pipeline/reports-discovery-audit/uk-geo-cluster-inventory-current.md')
          out.parent.mkdir(parents=True, exist_ok=True)
          count_map = dict(zip(grouped['cluster'], grouped['area_rows']))
          ex_map = dict(zip(grouped['cluster'], grouped['example_areas']))
          lines = ['# UK geo lookup cluster inventory','',f'Unique clusters across Area mapping + LocationFallback: **{len(all_clusters)}**.','', '| Cluster | Area rows | Example areas |','|---|---:|---|']
          for c in all_clusters:
              lines.append(f"| {c.replace('|','/')} | {int(count_map.get(c,0))} | {str(ex_map.get(c,'')).replace('|','/')} |")
          out.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY
      - name: Commit inventory
        run: |
          set -euo pipefail
          git add pipeline/reports-discovery-audit/uk-geo-cluster-inventory-current.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record complete UK geo cluster inventory'
          git pull --rebase origin main
          git push origin HEAD:main
