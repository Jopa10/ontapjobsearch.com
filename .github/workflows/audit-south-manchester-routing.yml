name: Audit South Manchester routing

on:
  push:
    branches:
      - audit/south-manchester-routing
    paths:
      - pipeline/scripts/audit_south_manchester_routing.py
      - .github/workflows/audit-south-manchester-routing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run audit
        run: python pipeline/scripts/audit_south_manchester_routing.py

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/reports-audit/south-manchester-routing-audit.csv pipeline/reports-audit/south-manchester-routing-audit.md
          if git diff --cached --quiet; then
            echo "No audit report changes to commit"
          else
            git commit -m "Add South Manchester routing audit"
            git push
          fi
