name: Audit South Manchester routing

on:
  push:
    branches:
      - main
    paths:
      - pipeline/scripts/audit_south_manchester_routing.py
      - .github/workflows/audit-south-manchester-routing.yml
  pull_request:
    branches:
      - main
    paths:
      - pipeline/scripts/audit_south_manchester_routing.py
      - .github/workflows/audit-south-manchester-routing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run audit and capture diagnostics
        shell: bash
        run: |
          mkdir -p pipeline/reports-audit
          set +e
          python pipeline/scripts/audit_south_manchester_routing.py > pipeline/reports-audit/south-manchester-routing-workflow.log 2>&1
          status=$?
          echo "exit_code=$status" >> pipeline/reports-audit/south-manchester-routing-workflow.log
          cat pipeline/reports-audit/south-manchester-routing-workflow.log
          exit 0

      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: south-manchester-routing-audit
          path: pipeline/reports-audit/
          if-no-files-found: error

      - name: Commit audit outputs on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pipeline/reports-audit/south-manchester-routing-workflow.log
          if [ -f pipeline/reports-audit/south-manchester-routing-audit.csv ]; then git add -f pipeline/reports-audit/south-manchester-routing-audit.csv; fi
          if [ -f pipeline/reports-audit/south-manchester-routing-audit.md ]; then git add -f pipeline/reports-audit/south-manchester-routing-audit.md; fi
          if git diff --cached --quiet; then
            echo "No audit output changes to commit"
          else
            git commit -m "Add South Manchester routing audit diagnostics"
            git push
          fi

# PR trigger for the one-off August routing audit.
